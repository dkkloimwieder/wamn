# Pod access to the selected Docker registry. Deployment supplies the endpoint.
apiVersion: v1
kind: Service
metadata:
  name: wamn-registry
  namespace: platform
spec:
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: wamn-registry
  namespace: platform
  labels:
    kubernetes.io/service-name: wamn-registry
    endpointslice.kubernetes.io/managed-by: wamn
addressType: IPv4
ports:
  - name: registry
    protocol: TCP
    port: 5000
endpoints: []
