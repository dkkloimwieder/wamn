kind: Service
apiVersion: v1
metadata:
  name: flow-http
  namespace: hosts
  labels:
    app: flow-http
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
kind: WorkloadDeployment
apiVersion: runtime.wasmcloud.dev/v1alpha1
metadata:
  name: flow-http
  namespace: hosts
spec:
  replicas: 1
  template:
    spec:
      environment: hosts
      hostInterfaces:
      - namespace: wasi
        package: http
        version: 0.3.0
        interfaces:
        - handler
        config:
          host: receiving.wamn.dev
      - namespace: wamn
        package: flow-http-routing
        version: 0.1.0
        interfaces:
        - routing
      - namespace: wamn
        package: router-delivery
        version: 0.3.0
        interfaces:
        - delivery
      components:
      - image: us-central1-docker.pkg.dev/wamn-dev/wamn/components@sha256:7ac3316eb660a630efe7fae991bc7931013c0bcadbb3e3b1a1234c1f7f621105
        localResources:
          config:
            wamn.tenant: dev
            wamn.catalog: default
            wamn.environment: hosts
            wamn.project: receiving
            wamn.schema: receiving
          allowedIpNameLookups: []
        imagePullPolicy: Always
        name: flow-http
      hostSelector:
        hostgroup: default
      kubernetes:
        service:
          name: flow-http
