runtime:
  image:
    tag: src-bba6fe15a456083e@sha256:d6abaac5b196afe72a576619efa4194f15287835d3994757ae41c923fb54dbfa
    pull_policy: IfNotPresent
    registry: ''
    repository: us-central1-docker.pkg.dev/wamn-dev/wamn/wamn-host
  hostGroups:
  - namespace: hosts
    replicas: 1
    env:
    - name: WAMN_PG_URL
      valueFrom:
        secretKeyRef:
          name: wamn-host-db
          key: url
    - name: WAMN_PG_GUEST_POOL_MAX
      value: '14'
    - name: WAMN_PG_PLATFORM_POOL_MAX
      value: '2'
    - name: WAMN_HTTP_ROUTE_IN_FLIGHT_LIMIT
      value: '64'
    - name: WAMN_WASMTIME_CACHE_DIR
      value: /tmp/wamn-wasmtime-cache
    - name: DOCKER_CONFIG
      value: /etc/wamn/registry
    - name: WAMN_COMPONENT_ARTIFACT_BASE
      value: registry.wamn-system.svc.cluster.local:5000/wamn/components
    - name: WAMN_REGISTRY_TOKEN_METADATA
      value: 'true'
    volumes:
    - name: registry-pull
      configMap:
        name: wamn-registry-helper
    http:
      enabled: true
      port: 80
    name: default
    ociCaPaths:
    - /runtime-cert/ca.crt
    resources:
      requests:
        memory: 256Mi
        cpu: '2'
      limits:
        memory: 4Gi
        cpu: '6'
      defaultHeapMemory: 256MiB
      coreInstances: 512
      guestMemoryMode: count
      maxConcurrentStarts: 4
    service:
      type: ClusterIP
    volumeMounts:
    - name: registry-pull
      mountPath: /etc/wamn/registry
      readOnly: true
  drainDelaySeconds: 5
  natsConnectTimeoutSeconds: 60
  probes:
    endpoint:
      enabled: true
      port: 8081
      startupFailureThreshold: 60
  terminationGracePeriodSeconds: 70
gateway:
  enabled: false
global:
  certificates:
    generate: false
  nats:
    schedulerUrl: nats://wamn-nats.platform.svc.cluster.local:4222
    dataUrl: nats://wamn-nats.platform.svc.cluster.local:4222
nats:
  enabled: false
operator:
  enabled: false
