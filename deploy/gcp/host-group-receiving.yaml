# The platform part of the host group of dkk/receiving/dev: WAMN_RELEASE_HOST_GROUP of
# `wamn-ctl env apply` (docs/operations/gcp.md section 11.10). It is hand-written
# from the group `default` of values-host.yaml. The release chart derives the name,
# namespace, service, release arguments, WAMN_ORG, WAMN_PROJECT and the drain
# bound, and `apply` adds the six credential variables, so this file sets none
# of them. WAMN_SESSION_INSTANCE_SUFFIX is the instance suffix that the first
# apply recorded; write it again after a new first apply.
replicas: 1
# The operator release and its control NATS run in namespace platform, not in
# the release namespace hosts, so the host group names the scheduler and data
# NATS (the subchart's default is nats.<release namespace>).
schedulerNatsUrl: nats://nats.platform.svc.cluster.local:4222
dataNatsUrl: nats://nats.platform.svc.cluster.local:4222
env:
- name: WAMN_PG_GUEST_POOL_MAX
  value: '14'
- name: WAMN_PG_PLATFORM_POOL_MAX
  value: '2'
- name: WAMN_HTTP_ROUTE_IN_FLIGHT_LIMIT
  value: '64'
- name: WAMN_WASMTIME_CACHE_DIR
  value: /tmp/wamn-wasmtime-cache
- name: DOCKER_CONFIG
  value: /etc/wamn/registry
- name: WAMN_COMPONENT_ARTIFACT_BASE
  value: us-central1-docker.pkg.dev/wamn-dev/wamn/components
- name: WAMN_EVT_NATS_URL
  value: nats://evt-nats.platform.svc.cluster.local:4222
- name: WAMN_EVT_NATS_USERNAME
  valueFrom:
    secretKeyRef:
      name: wamn-event-nats
      key: username
      optional: false
- name: WAMN_EVT_NATS_PASSWORD_FILE
  value: /etc/wamn/event-nats/password
- name: WAMN_MAT_NATS_BINDING_FILE
  value: /etc/wamn/materializer-nats/binding.json
- name: WAMN_EVT_ORG
  value: dkk
- name: WAMN_EVT_PROJECT
  value: receiving
- name: WAMN_EVT_ENV
  value: dev
- name: WAMN_EVT_STREAM_REPLICAS
  value: '1'
- name: WAMN_EVT_DUP_WINDOW_SECS
  value: '120'
- name: WAMN_SCHEMA
  value: receiving
- name: WAMN_REGISTRY_TOKEN_METADATA
  value: 'true'
- name: WAMN_SESSION_ISSUER
  value: https://identity.identity.svc.cluster.local
- name: WAMN_SESSION_INSTANCE_SUFFIX
  value: pv6vxrkc
- name: WAMN_SESSION_JWKS_CA
  value: /etc/identity-ca/ca.crt
volumes:
- name: event-nats
  secret:
    secretName: wamn-event-nats
    optional: false
    items:
    - key: password
      path: password
- name: materializer-nats
  secret:
    secretName: wamn-materializer-nats
    optional: false
    items:
    - key: binding.json
      path: binding.json
- name: registry-pull
  configMap:
    name: wamn-registry-helper
- name: identity-ca
  configMap:
    name: identity-ca
http:
  enabled: true
  port: 80
ociCaPaths:
- /runtime-cert/ca.crt
resources:
  requests:
    memory: 256Mi
    cpu: 500m
  limits:
    memory: 4Gi
    cpu: '2'
  defaultHeapMemory: 256MiB
  coreInstances: 512
  guestMemoryMode: count
  maxConcurrentStarts: 4
volumeMounts:
- name: event-nats
  mountPath: /etc/wamn/event-nats
  readOnly: true
- name: materializer-nats
  mountPath: /etc/wamn/materializer-nats
  readOnly: true
- name: registry-pull
  mountPath: /etc/wamn/registry
  readOnly: true
- name: identity-ca
  mountPath: /etc/identity-ca
  readOnly: true
