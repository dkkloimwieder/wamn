# The invitation Job of docs/plan/operator-image.md section 4.2 (wamn-n5d1).
# It runs `wamn-ctl invite` inside the cluster, so the owner's machine needs no
# /etc/hosts line and no identity port-forward. The operator certificate
# reaches the Job only as the mounted Secret operator-dkk. The image is the
# runner of build-platform, which carries wamn-ctl; build-platform builds no
# ctl image (wamn-rk9l2, 2026-10-13).
#
# Fill __EMAIL__, __DISPLAY_NAME__, __ORG__ and __GRANT_FLAGS__ in a private
# copy of this file in the scratchpad, at mode 0600, apply the copy and remove
# it (docs/history/gcp-install-history.md section 4.5). __GRANT_FLAGS__ holds --org-admin,
# --project-admin <project> and --membership <project>/<env> as needed, or
# nothing. Then make the Secret wamn-system-admin with an owner reference to
# this Job (docs/history/gcp-install-history.md section 3.16). The pod waits for that
# Secret before it starts.
#
# The verb prints the identity answer and writes no credential. Save the log to
# the scratchpad before you delete the Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: invite
  namespace: identity
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      # The Job does not call the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: invite
          image: us-central1-docker.pkg.dev/wamn-dev/wamn/wamn-runner:0.1.3@sha256:b0f17aafb305cc9f41020fe46d793c46adef6b1cfdef658121715ca6c7ab43cd
          command: ["/bin/sh", "-ec"]
          args:
            - |
              /usr/local/bin/wamn-ctl invite \
                --email '__EMAIL__' --display-name '__DISPLAY_NAME__' --org __ORG__ \
                __GRANT_FLAGS__
          env:
            - name: WAMN_SYSTEM_ADMIN_URL
              valueFrom: { secretKeyRef: { name: wamn-system-admin, key: url } }
            - { name: WAMN_PAT_ISSUER, value: "https://identity.identity.svc.cluster.local" }
            - { name: WAMN_PAT_CLIENT_CERT, value: /etc/wamn/operator/tls.crt }
            - { name: WAMN_PAT_CLIENT_KEY, value: /etc/wamn/operator/tls.key }
            - { name: WAMN_PAT_SERVER_CA, value: /etc/wamn/identity-ca/ca.crt }
          volumeMounts:
            - { name: operator, mountPath: /etc/wamn/operator, readOnly: true }
            - { name: identity-ca, mountPath: /etc/wamn/identity-ca, readOnly: true }
      volumes:
        - name: operator
          secret:
            secretName: operator-dkk
            defaultMode: 0400
            items: [{ key: tls.crt, path: tls.crt }, { key: tls.key, path: tls.key }]
        - name: identity-ca
          secret:
            secretName: identity-tls
            defaultMode: 0400
            items: [{ key: ca.crt, path: ca.crt }]
