# The one platform-owned Kubernetes service account of every environment's
# hosts (owner ruling 2026-10-13 on wamn-rk9l2, wamn-okr8y). The release chart
# sets runtime.serviceAccount.create=false and name=wamn-host, so each
# environment's host pods run as this account in the operator release's
# namespace. Through Workload Identity it acts as the Google service account
# wamn-blob, which reads the registry `wamn` and writes the label bucket.
# docs/operations/gcp.md section 3.13.1 applies it and makes the one
# roles/iam.workloadIdentityUser binding. Isolation between environments stays
# hostSelector (R6); `env apply` touches no IAM.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wamn-host
  namespace: hosts
  annotations:
    iam.gke.io/gcp-service-account: wamn-blob@wamn-dev.iam.gserviceaccount.com
