# Identity values of docs/history/gcp-deployment.md step 3. The chart writes the
# image as repository:tag, so the digest is split at its colon: the image is
# us-central1-docker.pkg.dev/wamn-dev/wamn/wamn-identity@sha256:<hex>. It is
# the identity image wamn-identity:0.1.1 that build-platform pushed and
# stamped into the release chart (wamn-rk9l2, 2026-10-13).
image:
  repository: us-central1-docker.pkg.dev/wamn-dev/wamn/wamn-identity@sha256
  tag: bcab666c711c5f2e420af6578880f2c6bb3195df1f043ea3c36f5af2cbb03711
  pullPolicy: IfNotPresent
issuer: https://identity.identity.svc.cluster.local
databaseSecret: wamn-identity-db
tlsSecret: identity-tls
operatorCaSecret: identity-operator-ca
resendSecret: identity-resend
resendFrom: noreply@wamn.dev
inviteUrl: https://control.wamn.dev
authNats:
  url: nats://nats.platform.svc.cluster.local:4222
  tlsSecret: wasmcloud-runtime-tls
sessionTargetSecrets:
  - wamn-session-role-reader-dkk--receiving--dev
  - wamn-session-role-reader-dkk--wms--dev
