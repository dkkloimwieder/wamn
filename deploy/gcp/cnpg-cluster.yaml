# The one PostgreSQL of the GKE test deployment (docs/history/gcp-deployment.md
# step 3). It is deploy/infra/cnpg-cluster.yaml in namespace platform on
# pd-standard: one instance holds the system database and every tenant
# database. Backups are not configured. enablePDB is false: with one instance
# the primary PodDisruptionBudget can never allow an eviction, so a scale of
# pool main to 0 waited up to one hour for GKE (wamn-7huhc).
# pg_stat_statements serves the benchmark samples (wamn-smtdg). CNPG manages
# it from the pg_stat_statements.* parameters: it preloads the library and
# creates the extension in every database. Without such a parameter, CNPG
# drops the extension from every database.
# The instance runs alone on the node pool pg (gcp.md section 4.2): the node
# selector puts it there, and the taint keeps every other pod off. A shared
# 2-vCPU node made each SQL span about 4 times slower (wamn-48d4d). CNPG
# applies the affinity only when it creates the pod, so a change needs a
# restart of the pod.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wamn-pg
  namespace: platform
  labels:
    app.kubernetes.io/managed-by: wamn
spec:
  instances: 1
  enablePDB: false
  affinity:
    nodeSelector:
      role: postgres
    tolerations:
      - key: role
        operator: Equal
        value: postgres
        effect: NoSchedule
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  enableSuperuserAccess: true
  primaryUpdateStrategy: unsupervised
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
  storage:
    # pd-balanced. It counts against SSD_TOTAL_GB (gcp.md section 1).
    storageClass: premium-rwo
    size: 10Gi
  postgresql:
    pg_hba:
      - host all all all scram-sha-256
    parameters:
      max_slot_wal_keep_size: "4GB"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: "top"
  bootstrap:
    initdb:
      database: wamn_system
      owner: wamn_system
