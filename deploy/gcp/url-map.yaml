# The URL map wamn-edge of docs/plan/gcp-deployment.md steps 4 and 5, one
# host rule and path matcher for each application. It copies the
# rules of the removed Config Connector template of deploy/platform/edge:
# /api/ and /password/ go to the edge, /assets/ to the release path in the
# bucket, and every other path to its index.html, which the client routes.
# Import it with: gcloud compute url-maps import wamn-edge --global --source <this file>
name: wamn-edge
defaultService: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
hostRules:
  - hosts:
      - receiving.wamn.dev
    pathMatcher: edge
  - hosts:
      - wms.wamn.dev
    pathMatcher: wms
pathMatchers:
  - name: edge
    defaultService: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
    routeRules:
      - priority: 1
        matchRules:
          - prefixMatch: /api/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 2
        matchRules:
          - prefixMatch: /password/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 3
        matchRules:
          - prefixMatch: /assets/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_receiving/900d35fbd2da116aac3d76abcf3895da7810cedeaf75fd5fdc4f9858f578fdfc/assets/
      - priority: 4
        matchRules:
          - fullPathMatch: /
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_receiving/900d35fbd2da116aac3d76abcf3895da7810cedeaf75fd5fdc4f9858f578fdfc/index.html
      - priority: 5
        matchRules:
          - pathTemplateMatch: /{page=**}
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathTemplateRewrite: /clients/wamn_receiving/900d35fbd2da116aac3d76abcf3895da7810cedeaf75fd5fdc4f9858f578fdfc/index.html
  - name: wms
    defaultService: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
    routeRules:
      - priority: 1
        matchRules:
          - prefixMatch: /api/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 2
        matchRules:
          - prefixMatch: /password/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 3
        matchRules:
          - prefixMatch: /assets/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_wms/3d6b13f9c7864e2b34317b6822d85b6d6a5542c36f9b5ae5d2ae049c1fcab2f6/assets/
      - priority: 4
        matchRules:
          - fullPathMatch: /
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_wms/3d6b13f9c7864e2b34317b6822d85b6d6a5542c36f9b5ae5d2ae049c1fcab2f6/index.html
      - priority: 5
        matchRules:
          - pathTemplateMatch: /{page=**}
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathTemplateRewrite: /clients/wamn_wms/3d6b13f9c7864e2b34317b6822d85b6d6a5542c36f9b5ae5d2ae049c1fcab2f6/index.html
