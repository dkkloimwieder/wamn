# The URL map wamn-edge of docs/history/gcp-deployment.md steps 4 and 5, one
# host rule and path matcher for each application. It copies the
# rules of the removed Config Connector template of deploy/platform/edge:
# /api/ and /password/ go to the edge, /assets/ and /config.json to the
# release path in the bucket, and every other path to its index.html, which
# the client routes.
# Import it with: gcloud compute url-maps import wamn-edge --global --source <this file>
#
# An unknown host and the bare address get the load balancer's own 404: the
# default route aborts every request before it reaches the named service, so
# nothing outside the declared host rules reaches the bucket, whose root answers
# with a listing (finding wamn-uo2p). A backend service with no endpoints
# answers 503, not 404.
name: wamn-edge
defaultRouteAction:
  weightedBackendServices:
    - backendService: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      weight: 100
  faultInjectionPolicy:
    abort:
      httpStatus: 404
      percentage: 100
hostRules:
  - hosts:
      - receiving.wamn.dev
    pathMatcher: edge
  - hosts:
      - wms.wamn.dev
    pathMatcher: wms
  - hosts:
      - control.wamn.dev
    pathMatcher: control
pathMatchers:
  - name: edge
    defaultService: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
    routeRules:
      - priority: 1
        matchRules:
          - prefixMatch: /api/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 2
        matchRules:
          - prefixMatch: /password/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 3
        matchRules:
          - prefixMatch: /assets/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_receiving/e2cb18182ed0ddac311718ce0f587be1c296ae535d1822b057b01fde8bd1bc48/assets/
      - priority: 4
        matchRules:
          - fullPathMatch: /config.json
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_receiving/e2cb18182ed0ddac311718ce0f587be1c296ae535d1822b057b01fde8bd1bc48/config.json
      - priority: 5
        matchRules:
          - fullPathMatch: /
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_receiving/e2cb18182ed0ddac311718ce0f587be1c296ae535d1822b057b01fde8bd1bc48/index.html
      - priority: 6
        matchRules:
          - pathTemplateMatch: /{page=**}
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathTemplateRewrite: /clients/wamn_receiving/e2cb18182ed0ddac311718ce0f587be1c296ae535d1822b057b01fde8bd1bc48/index.html
  - name: wms
    defaultService: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
    routeRules:
      - priority: 1
        matchRules:
          - prefixMatch: /api/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 2
        matchRules:
          - prefixMatch: /password/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 3
        matchRules:
          - prefixMatch: /assets/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_wms/d31830b104ace4a09180b63e7dcfe5152a3a59db093553e5bbf67cda65adeec9/assets/
      - priority: 4
        matchRules:
          - fullPathMatch: /config.json
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_wms/d31830b104ace4a09180b63e7dcfe5152a3a59db093553e5bbf67cda65adeec9/config.json
      - priority: 5
        matchRules:
          - fullPathMatch: /
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_wms/d31830b104ace4a09180b63e7dcfe5152a3a59db093553e5bbf67cda65adeec9/index.html
      - priority: 6
        matchRules:
          - pathTemplateMatch: /{page=**}
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathTemplateRewrite: /clients/wamn_wms/d31830b104ace4a09180b63e7dcfe5152a3a59db093553e5bbf67cda65adeec9/index.html
  - name: control
    defaultService: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
    routeRules:
      - priority: 1
        matchRules:
          - prefixMatch: /api/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 2
        matchRules:
          - prefixMatch: /password/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 3
        matchRules:
          - prefixMatch: /assets/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /platform-ui/0.1.35/assets/
      - priority: 4
        matchRules:
          - fullPathMatch: /config.json
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /platform-ui/0.1.35/config.json
      - priority: 5
        matchRules:
          - fullPathMatch: /
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /platform-ui/0.1.35/index.html
      - priority: 6
        matchRules:
          - pathTemplateMatch: /{page=**}
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathTemplateRewrite: /platform-ui/0.1.35/index.html
