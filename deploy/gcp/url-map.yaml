# The URL map wamn-edge of docs/plan/gcp-deployment.md steps 4 and 5, one
# host rule and path matcher for each application. It copies the
# rules of the removed Config Connector template of deploy/platform/edge:
# /api/ and /password/ go to the edge, /assets/ to the release path in the
# bucket, and every other path to its index.html, which the client routes.
# Import it with: gcloud compute url-maps import wamn-edge --global --source <this file>
#
# An unknown host and the bare address get the load balancer's own 404: the
# default route aborts every request before it reaches the named service, so
# nothing outside the two host rules reaches the bucket, whose root answers
# with a listing (finding wamn-uo2p). A backend service with no endpoints
# answers 503, not 404.
name: wamn-edge
defaultRouteAction:
  weightedBackendServices:
    - backendService: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      weight: 100
  faultInjectionPolicy:
    abort:
      httpStatus: 404
      percentage: 100
hostRules:
  - hosts:
      - receiving.wamn.dev
    pathMatcher: edge
  - hosts:
      - wms.wamn.dev
    pathMatcher: wms
pathMatchers:
  - name: edge
    defaultService: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
    routeRules:
      - priority: 1
        matchRules:
          - prefixMatch: /api/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 2
        matchRules:
          - prefixMatch: /password/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 3
        matchRules:
          - prefixMatch: /assets/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_receiving/28e0b694e45b2410e5a087691641e075a0726e1e7eed508360ef50ceff542be7/assets/
      - priority: 4
        matchRules:
          - fullPathMatch: /
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_receiving/28e0b694e45b2410e5a087691641e075a0726e1e7eed508360ef50ceff542be7/index.html
      - priority: 5
        matchRules:
          - pathTemplateMatch: /{page=**}
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathTemplateRewrite: /clients/wamn_receiving/28e0b694e45b2410e5a087691641e075a0726e1e7eed508360ef50ceff542be7/index.html
  - name: wms
    defaultService: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
    routeRules:
      - priority: 1
        matchRules:
          - prefixMatch: /api/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 2
        matchRules:
          - prefixMatch: /password/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendServices/wamn-edge-platform
      - priority: 3
        matchRules:
          - prefixMatch: /assets/
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_wms/8f4c8241b50210d9c366ed8372e0832793e66b1bc92067686ce317050085eac4/assets/
      - priority: 4
        matchRules:
          - fullPathMatch: /
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathPrefixRewrite: /clients/wamn_wms/8f4c8241b50210d9c366ed8372e0832793e66b1bc92067686ce317050085eac4/index.html
      - priority: 5
        matchRules:
          - pathTemplateMatch: /{page=**}
        service: https://www.googleapis.com/compute/v1/projects/wamn-dev/global/backendBuckets/wamn-edge-files
        routeAction:
          urlRewrite:
            pathTemplateRewrite: /clients/wamn_wms/8f4c8241b50210d9c366ed8372e0832793e66b1bc92067686ce317050085eac4/index.html
