# The edge of docs/plan/gcp-deployment.md step 4, release wamn-edge in namespace
# edge. The wildcard certificate *.wamn.dev of step 2 is already in
# wamn-edge-tls, so no issuer is set. The load balancer of
# docs/operations/gcp.md section 4 serves the bucket path.
tlsSecret: wamn-edge-tls
identity: https://identity.identity.svc.cluster.local
identityCaConfigMap: identity-ca
# bucketPath is <bucket>/<prefix>/<package>/<release digest hex>, as wamn web
# upload writes it.
applications:
  - host: receiving.wamn.dev
    api: http://flow-http.hosts.svc.cluster.local
    bucketPath: wamn-dev-web/clients/wamn_receiving/aeb74968dfe09b113a115863ec8be5475923d9577914332081923052a41c16c4
neg: true
