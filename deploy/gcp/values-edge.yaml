# The edge of docs/plan/gcp-deployment.md steps 4 and 5, release wamn-edge in namespace
# edge. The wildcard certificate *.wamn.dev of step 2 is already in
# wamn-edge-tls, so no issuer is set. The load balancer of
# docs/operations/gcp.md section 4 serves the bucket path.
tlsSecret: wamn-edge-tls
identity: https://identity.identity.svc.cluster.local
identityCaConfigMap: identity-ca
# Each application's api is the http Service of the environment's release
# chart, named by release_chart::release_name of the coordinate, so it does not
# change with the release. `env apply` writes no edge values, so this file
# names it (wamn-rk9l2).
# bucketPath is <bucket>/<prefix>/<package>/<release digest hex>, as wamn web
# upload writes it.
applications:
  - host: receiving.wamn.dev
    api: http://r-dev-ee95c37ee965257ff856-http.hosts.svc.cluster.local
    bucketPath: wamn-dev-web/clients/wamn_receiving/7de4138caad4009d235333e1685cb5c537de40791deb1f1078a6e65116f5109f
  - host: wms.wamn.dev
    api: http://r-dev-8f6b3ee8ac75e40affb1-http.hosts.svc.cluster.local
    bucketPath: wamn-dev-web/clients/wamn_wms/47171ec08678806e5722b782070a7fc3221191fb71433136664879c0d02d38c7
neg: true
