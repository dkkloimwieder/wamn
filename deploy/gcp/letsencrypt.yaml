# Ingress uses hosts/wamn-edge-tls. cert-manager owns the certificate.
# cert-manager answers the Let's Encrypt DNS-01 challenge in the Cloud DNS zone wamn-dev.
# Its service account has roles/dns.admin on that zone only, through Workload
# Identity, so the solver names the zone and never lists zones.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: dkkloimwieder@gmail.com
    privateKeySecretRef:
      name: letsencrypt
    solvers:
      - dns01:
          cloudDNS:
            project: wamn-dev
            hostedZoneName: wamn-dev
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wamn-edge-tls
  namespace: hosts
spec:
  secretName: wamn-edge-tls
  dnsNames:
    - "*.wamn.dev"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
