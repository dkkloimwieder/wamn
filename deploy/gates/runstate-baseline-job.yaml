# PLAN-3 pre-checkpoint persistence baseline (wamn-vshi.5). This is a
# measurement campaign, not a regression gate: it applies the production
# run-state DDL in an ephemeral schema, records F1 capture-on curves, emits CSV,
# and drops the schema. Only provenance and exact-row sanity assertions gate.
#
# Recreate the Job for each record run:
#   kubectl -n wamn-system delete job runstate-baseline --ignore-not-found
#   kubectl -n wamn-system apply -f deploy/gates/runstate-baseline-job.yaml
#   kubectl -n wamn-system logs -f job/runstate-baseline
apiVersion: batch/v1
kind: Job
metadata:
  name: runstate-baseline
  namespace: wamn-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: runstate-baseline }
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: postgres }
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres.wamn-system.svc.cluster.local 5432; do sleep 1; done"]
      containers:
        - name: runstate-baseline
          image: wamn-gates:dev
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 768Mi
          env:
            - name: WAMN_PG_URL
              value: postgres://wamn_app:wamn_app@postgres.wamn-system.svc.cluster.local:5432/wamn
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: postgres-fixture-superuser, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-fixture-superuser, key: password }
            - name: PGHOST
              valueFrom:
                secretKeyRef: { name: postgres-fixture-superuser, key: host }
            - name: PGPORT
              valueFrom:
                secretKeyRef: { name: postgres-fixture-superuser, key: port }
            - name: WAMN_PG_ADMIN_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/wamn
          args:
            - --log-level
            - error
            - runstate-baseline
            - --line-counts
            - 1,10,100
            - --runs-per-size
            - "5000"
            - --concurrency
            - "4"
