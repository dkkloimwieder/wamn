# E13a publish-time egress-guard refusal gate in-cluster job (wamn-2jkm.56).
# Runs the socket-test subcommand of the wamn-gates image (SR1). The gate is
# HERMETIC — it synthesizes P2 and P3 wasi:sockets importers that must be REFUSED
# at publish, plus a standard world that must still publish, so it needs no
# registry, no external fixtures, no DB, and no NATS. The in-cluster sweep still
# carries it so publish-time refusal is proven independently of the arm-specific
# runtime denial in egressbench-job.yaml. The suite exits non-zero if the guard
# does not hold, so job completion IS the verdict.
#
#   kubectl -n wamn-system apply -f deploy/gates/socket-test-job.yaml
#   kubectl -n wamn-system wait --for=condition=complete job/socket-test --timeout=120s
#   kubectl -n wamn-system logs job/socket-test
apiVersion: batch/v1
kind: Job
metadata:
  name: socket-test
  namespace: wamn-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: socket-test }
    spec:
      restartPolicy: Never
      containers:
        - name: socket-test
          image: wamn-gates:dev
          imagePullPolicy: IfNotPresent
          args:
            - "--log-level"
            - "warn"
            - "socket-test"
          resources:
            # No CPU limit (CFS-quota tail artifact — see bench/flowbench). The
            # gate compiles three tiny synthesized components; memory is capped.
            requests: { cpu: "1", memory: "256Mi" }
            limits: { memory: "1Gi" }
