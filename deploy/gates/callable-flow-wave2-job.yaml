# Exact-image composed gate for callable-flow Wave 2 (F0-F4).
#
# Replace ISSUE and IMAGE_ID with evidence from the exact image build and load:
#   docker build --target gates -t wamn-gates:cf-wave2-<commit> .
#   kind load docker-image wamn-gates:cf-wave2-<commit> --name wamn
#   # IMAGE_ID is the common sha256 digest after @ in every node's
#   # `crictl inspecti wamn-gates:cf-wave2-<commit>` repoDigests entry.
apiVersion: batch/v1
kind: Job
metadata:
  name: callable-flow-wave2
  namespace: wamn-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: callable-flow-wave2
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: postgres
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres.wamn-system.svc.cluster.local 5432; do sleep 1; done"]
      containers:
        - name: proof
          image: wamn-gates:cf-wave2-ISSUE
          imagePullPolicy: Never
          args:
            [
              "--log-level", "error",
              "callable-wave2",
              "--source-identity", "ISSUE",
              "--image-identity", "wamn-gates:cf-wave2-ISSUE",
              "--image-id", "IMAGE_ID",
              "--deployment-identity", "callable-flow-wave2@ISSUE",
            ]
          env:
            - name: WAMN_PG_URL
              value: postgres://wamn_app:wamn_app@postgres.wamn-system.svc.cluster.local:5432/wamn
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: password } }
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: host } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: port } }
            - name: WAMN_PG_ADMIN_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/wamn
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "768Mi"
