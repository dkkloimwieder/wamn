# Reachable control target for the runner address-ceiling negative. The
# credproof environment binds a portable flow requirement to this Service, but
# runner-connection-egress.yaml deliberately does not admit its pod address.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-escape
  namespace: wamn-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: egress-escape }
  template:
    metadata:
      labels: { app: egress-escape }
    spec:
      containers:
        - name: egress-escape
          image: wamn-gates:dev
          imagePullPolicy: IfNotPresent
          args: ["--log-level", "error", "serve-echo", "--port", "8091"]
          ports:
            - { containerPort: 8091 }
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits: { memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: egress-escape
  namespace: wamn-system
spec:
  selector: { app: egress-escape }
  ports:
    - { port: 8091, targetPort: 8091 }
