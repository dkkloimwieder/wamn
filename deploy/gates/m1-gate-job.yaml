# M1 gate (wamn-0h0g.11.10) — Checks 9 and 10 over one isolated fixture.
# Check 9 is the unchanged wamn-0h0g.11.9 forward proof: tenant commit through
# the production CDC reader and byte-stored event stream into one production-
# materializer-admitted causal run, followed by byte-identical stored redelivery
# beyond broker protection to prove storage-owned durable deduplication.
# Check 10 then commits a matching foreign-tenant insert and a matching
# tenant-unscopable RI DEFAULT delete through the same reader and materializer;
# both are acknowledged and neither reaches admission or the doorbell.
#
# A locally derived, linux/amd64-only PostgreSQL 18 restartable init container
# owns one emptyDir-backed server for this Pod. Its Dockerfile is pinned to the
# upstream OCI index and records the selected amd64 child in immutable labels.
# The Job uses one build-scoped named tag with imagePullPolicy Never; the runner
# binds that tag to an identical complete manifest/runtime/config tuple on all
# three nodes before server dry-run.
# Both scratch databases and every canonical fixture role live only in that
# server. The gate uses loopback URLs and no PostgreSQL Secret, Service, DNS
# name, PVC, or cluster RBAC. The Pod reads its generated Job name and Job UID
# from automatic Job labels. The full UID is the one run suffix for both
# disposable databases, CDC role/publication/slot, scratch schema/table,
# JetStream stream and durable, logical fixture identities, and report
# directory. Shared PostgreSQL is never contacted.
#
# Preconditions: evt-nats has JetStream enabled. PostgreSQL is self-contained.
#
# Build the gate binary and materializer with the debug-only SR-MVP recipe;
# do not use the repository Dockerfile's release stages for this gate receipt.
# Build the deterministic single-platform sidecar without provenance metadata:
#   docker build --platform=linux/amd64 --provenance=false \
#     -f deploy/gates/m1-postgres.Dockerfile \
#     -t wamn-postgres:m1-pg18-720c455e deploy/gates
# After assembling the named gate image from the debug artifacts, load both:
#   kind load docker-image wamn-gates:m1-01ca7afa-debug --name wamn
#   kind load docker-image wamn-postgres:m1-pg18-720c455e --name wamn
# Before any Job creation, the runner enumerates the exact Kubernetes node set,
# root-parses the named tag's containerd target manifest, and inspects its CRI
# runtime digest, config, completeness, and provenance labels. It atomically writes
# `target/m1-sidecar-preflight.json`. It rejects any missing node, mismatch,
# incomplete image, or tuple that disagrees with its --job contract.
# With the identical node value in `main_image_id`, render a temporary manifest
# and pass the already inspected sidecar runtime/config tuple below:
#   sed -e "s/sha256:POST_BUILD_MAIN_IMAGE_ID/${main_image_id}/" \
#     deploy/gates/m1-gate-job.yaml > target/m1-gate-job.rendered.yaml
#   tools/kubernetes-gate-run --manifest target/m1-gate-job.rendered.yaml \
#     --generated-name-prefix m1-gate- --require-final-cleanup \
#     --sidecar-preflight-record target/m1-sidecar-preflight.json \
#     --verdict-record target/m1-gate-verdict.json \
#     --job '{"name":"m1-gate-","container":"m1-gate","expectation":"positive",\
#       "exit_code":0,"image":"wamn-gates:m1-01ca7afa-debug",\
#       "claimed_image_id":"sha256:<post-build-kind-runtime-digest>",\
#       "claim_log_prefix":"M1_MAIN_IMAGE_ID=",\
#       "sidecar":"m1-postgres",\
#       "sidecar_image":"wamn-postgres:m1-pg18-720c455e",\
#       "sidecar_image_id":"sha256:<runtime-manifest-digest>",\
#       "sidecar_config_id":"sha256:<config-digest>",\
#       "sidecar_upstream_index":"sha256:ae6c78831cbc35fa3a4aaf4d763ddacf6183d6004774cc2dc28b3920410d1d1a",\
#       "sidecar_upstream_child":"sha256:cd78ca58eb75f929698e117a589488ccb2bd45107247fe02400b50ff6c418324",\
#       "log_contains":"M1 PASS — checks 9 and 10 passed"}'
apiVersion: batch/v1
kind: Job
metadata:
  generateName: m1-gate-
  namespace: wamn-system
  labels: { app: m1-gate }
  annotations:
    wamn.dev/m1-checks: "9,10"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: m1-gate }
      annotations:
        wamn.dev/m1-checks: "9,10"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 180
      serviceAccountName: event-reader
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: m1-postgres
          image: wamn-postgres:m1-pg18-720c455e
          imagePullPolicy: Never
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          command: ["/bin/bash", "-ceu"]
          args:
            - |
              if [ ! -s "$PGDATA/PG_VERSION" ]; then
                initdb --username=postgres --auth-local=trust --auth-host=reject
              fi
              cat >"$PGDATA/pg_hba.conf" <<EOF
              local all postgres trust
              host all postgres 127.0.0.1/32 trust
              host all wamn_app 127.0.0.1/32 trust
              host all all all scram-sha-256
              EOF
              chmod 600 "$PGDATA/pg_hba.conf"
              exec postgres \
                -c listen_addresses=127.0.0.1 \
                -c wal_level=logical \
                -c max_replication_slots=4 \
                -c max_wal_senders=4 \
                -c password_encryption=scram-sha-256
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - { name: m1-postgres-data, mountPath: /var/lib/postgresql/data }
          startupProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"] }
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 90
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"] }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { memory: "512Mi" }
      containers:
        - name: m1-gate
          image: wamn-gates:m1-01ca7afa-debug
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              cleanup() {
                /usr/local/bin/wamn-gates --log-level error m1-cleanup --timeout-secs 120
              }
              on_exit() {
                status=$?
                trap - EXIT HUP INT TERM
                cleanup_status=0
                cleanup || cleanup_status=$?
                if [ "$status" -ne 0 ]; then
                  exit "$status"
                fi
                exit "$cleanup_status"
              }
              forward_signal() {
                signal=$1
                code=$2
                if [ -n "${child_pid:-}" ] && kill -0 "$child_pid" 2>/dev/null; then
                  kill -"$signal" "$child_pid" 2>/dev/null || true
                  wait "$child_pid" || true
                fi
                exit "$code"
              }
              trap on_exit EXIT
              trap 'forward_signal HUP 129' HUP
              trap 'forward_signal INT 130' INT
              trap 'forward_signal TERM 143' TERM
              printf 'M1_MAIN_IMAGE_ID=%s\n' "$WAMN_GATE_MAIN_IMAGE_ID"
              /usr/local/bin/wamn-gates --log-level error m1 --timeout-secs 120 &
              child_pid=$!
              wait "$child_pid"
              child_status=$?
              child_pid=
              exit "$child_status"
          env:
            - name: WAMN_GATE_JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            - name: WAMN_GATE_JOB_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
            - name: WAMN_GATE_MAIN_IMAGE_ID
              value: sha256:POST_BUILD_MAIN_IMAGE_ID
            - name: WAMN_PG_URL
              value: postgres://wamn_app@127.0.0.1:5432/postgres?sslmode=disable
            - name: WAMN_PG_ADMIN_URL
              value: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
            - name: WAMN_SYSTEM_ADMIN_URL
              value: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
            - name: WAMN_EVT_NATS_URL
              value: nats://evt-nats.wamn-system.svc.cluster.local:4222
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { memory: "512Mi" }
      volumes:
        - name: m1-postgres-data
          emptyDir: {}
