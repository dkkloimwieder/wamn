# wamn-5wd1.55 exact-image gate. The gates image and production host image
# receive the same component-builder output; this job composes provider
# admission, exact fenced execution, bounded wait, stored recovery, conflicts,
# disabled recovery, crash seams, and dequeue against a throwaway database.
apiVersion: batch/v1
kind: Job
metadata:
  name: invocationproof
  namespace: wamn-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: invocationproof }
    spec:
      restartPolicy: Never
      containers:
        - name: invocationproof
          image: wamn-gates:dev
          imagePullPolicy: IfNotPresent
          args:
            - "--log-level"
            - "error"
            - "invocationproof"
            - "--flowrunner"
            - "/bench/flowrunner.wasm"
            - "--database-url"
            - "postgres://wamn_app:wamn_app@postgres.wamn-system.svc.cluster.local:5432/postgres"
            - "--admin-database-url"
            - "postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/postgres"
          env:
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: password } }
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: host } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: port } }
          resources:
            requests: { cpu: "1", memory: "512Mi" }
            limits: { memory: "1Gi" }
