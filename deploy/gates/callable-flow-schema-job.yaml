# Callable-flow POC schema gate (wamn-5wd1.40).
#
# Compiles the promoted F0-F4 catalog, injects a mid-DDL PostgreSQL failure,
# proves the transaction leaves zero tables, then applies a clean retry and
# exercises the receipt-line, hold, review, and decided_at constraints.
#
#   kubectl -n wamn-system apply -f deploy/gates/callable-flow-schema-job.yaml
#   kubectl -n wamn-system wait --for=condition=complete job/callable-flow-schema --timeout=180s
#   kubectl -n wamn-system logs job/callable-flow-schema
apiVersion: batch/v1
kind: Job
metadata:
  name: callable-flow-schema
  namespace: wamn-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: callable-flow-schema
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: postgres
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres.wamn-system.svc.cluster.local 5432; do sleep 1; done"]
      containers:
        - name: callable-flow-schema
          image: wamn-gates:dev
          imagePullPolicy: IfNotPresent
          args:
            [
              "--log-level", "error",
              "callable-flow-schema",
            ]
          env:
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: password } }
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: host } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: port } }
            - name: WAMN_PG_ADMIN_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/wamn
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
