# P0 environment-owned connection admission. The positive credproof and the
# real F3 runner may reach serve-echo; egress-escape is deliberately absent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-egress-connections-p0
  namespace: wamn-system
spec:
  podSelector:
    matchLabels:
      wamn.io/egress-profile: runner
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: serve-echo
      ports:
        - { protocol: TCP, port: 8091 }
