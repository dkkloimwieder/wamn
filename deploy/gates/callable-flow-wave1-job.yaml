# Exact-image composed gate for callable-flow Wave 1 (F0/F1/F3).
#
# Replace ISSUE with the exact commit used to build and load the gates image:
#   docker build --target gates -t wamn-gates:cf-wave1-<commit> .
#   kind load docker-image wamn-gates:cf-wave1-<commit> --name wamn
#   sed "s/ISSUE/<commit>/g" deploy/gates/callable-flow-wave1-job.yaml |
#     kubectl -n wamn-system apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: callable-flow-wave1
  namespace: wamn-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: callable-flow-wave1
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: postgres
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres.wamn-system.svc.cluster.local 5432; do sleep 1; done"]
      containers:
        - name: proof
          image: wamn-gates:cf-wave1-ISSUE
          imagePullPolicy: Never
          args:
            [
              "--log-level", "error",
              "callable-wave1",
              "--source-identity", "ISSUE",
              "--image-identity", "wamn-gates:cf-wave1-ISSUE",
              "--deployment-identity", "callable-flow-wave1@ISSUE",
            ]
          env:
            - name: WAMN_PG_URL
              value: postgres://wamn_app:wamn_app@postgres.wamn-system.svc.cluster.local:5432/wamn
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: password } }
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: host } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: port } }
            - name: WAMN_PG_ADMIN_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/wamn
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "768Mi"
