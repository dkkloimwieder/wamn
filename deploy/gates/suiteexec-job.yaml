# 11.2-exec in-cluster gate of record (wamn-0lfu): suiteexec drives the STORED
# test-suite EXECUTOR — load test_suites/test_cases rows from a schema, decode
# each persisted body through the private stored-test bridge, and execute each as its OWN run
# through the t92 doubles seam (fresh ephemeral schema per case, exactly one
# applied catalog release member resolved and cryptographically verified before
# ExecutionHost, deterministic capabilities + policy-enforced egress + drain,
# then evaluate the available terminal run facts). Each admitted root run atomically persists
# its exact catalog/version/artifact principal with the queue row.
#
# HERMETIC: `--seed-demo` invokes the real `wamn-ctl publish-catalog --provision
# --runstate` boundary for its THROWAWAY source schema (wamn_suiteexec, NOT
# poc_f1) and every execution schema. The immutable release contains a drivable
# NO-EGRESS request -> postgres(create sink) -> respond member and an undrivable
# request -> disposition-recommendation -> respond member pinned to the exact
# `/bench/disposition-node.wasm` digest. Legacy `flows` rows exist only for the
# scenario-table foreign keys and are poisoned after seeding, proving execution
# has no mutable projection fallback. Success, malformed, preflight-refusal, and
# assertion-failure suites run before teardown; the gate verifies every created
# root run's exact release pin. No external fixture data or live egress target.
#
# The per-case EXECUTION schemas (tk_suiteexec_<n>) are provisioned through the
# superuser (WAMN_PG_ADMIN_URL) — wamn_app is NOSUPERUSER/NOCREATEDB and cannot
# create schemas, exactly as in production — and dropped at case teardown.
#
# Co-located with postgres (the cases make real DB round trips), backoffLimit 0,
# restartPolicy Never. The gates image carries the product scenario-worker
# executable; testkitbench is only its repository fixture/process adapter.
#
#   kubectl -n wamn-system apply -f deploy/gates/suiteexec-job.yaml
#   kubectl -n wamn-system wait --for=condition=complete job/suiteexec --timeout=180s
#   kubectl -n wamn-system logs job/suiteexec
apiVersion: batch/v1
kind: Job
metadata:
  name: suiteexec
  namespace: wamn-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: suiteexec
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: postgres
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres.wamn-system.svc.cluster.local 5432; do sleep 1; done"]
      containers:
        - name: suiteexec
          image: wamn-gates:dev
          imagePullPolicy: IfNotPresent
          args:
            [
              "--log-level", "error",
              "testkitbench",
              "--scenario-worker", "/usr/local/bin/wamn-scenario-worker",
              "--seed-demo",
              "--tenant", "demo-tenant",
              "--source-schema", "wamn_suiteexec",
              "--exec-schema", "tk_suiteexec",
              "--node", "/bench/disposition-node.wasm",
              "--flowrunner", "/bench/flowrunner.wasm",
            ]
          env:
            # Runner pool: the non-superuser, non-BYPASSRLS app role (RLS-scoped).
            - name: WAMN_PG_URL
              value: postgres://wamn_app:wamn_app@postgres.wamn-system.svc.cluster.local:5432/wamn
            # Admin: superuser — provisions/drops the source + per-case exec
            # schemas.
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: password } }
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: host } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: port } }
            - name: WAMN_PG_ADMIN_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/wamn
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
