# causation-e2e (wamn-0h0g.11.9) — a tenant commit through the production CDC
# reader, byte-stored event stream, and production materializer into exactly one
# causal run/queue fact. WAMN_PG_URL, WAMN_PG_ADMIN_URL, and
# WAMN_SYSTEM_ADMIN_URL are seed/credential authorities only: the gate derives
# fixed bead-scoped project and system database URLs, creates both disposable
# databases, applies canonical DDL there, then always drops both WITH FORCE.
# The shared wamn/wamn_system schemas and rows are never mutated. The uniquely
# named CDC role and event stream are also removed and their absence verified.
#
# Preconditions: project and system admin users can CREATE/DROP DATABASE;
# project postgres has wal_level=logical; evt-nats has JetStream enabled.
#
#   docker build --target gates -t wamn-gates:dev .
#   kind load docker-image wamn-gates:dev --name wamn
#   kubectl -n wamn-system delete job causation-e2e --ignore-not-found
#   kubectl -n wamn-system apply -f deploy/gates/causation-e2e-job.yaml
#   kubectl -n wamn-system wait --for=condition=complete job/causation-e2e --timeout=240s
#   kubectl -n wamn-system logs job/causation-e2e
apiVersion: batch/v1
kind: Job
metadata:
  name: causation-e2e
  namespace: wamn-system
  labels: { app: causation-e2e }
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: causation-e2e }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: causation-e2e
          image: wamn-gates:dev
          imagePullPolicy: IfNotPresent
          args:
            [
              "--log-level", "error",
              "causation-e2e",
              "--timeout-secs", "120",
            ]
          env:
            - name: WAMN_PG_URL
              valueFrom:
                secretKeyRef: { name: wamn-runner-db, key: url }
            - name: WAMN_PG_ADMIN_URL
              valueFrom:
                secretKeyRef: { name: wamn-runner-db-admin, key: url }
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: wamn-sysdb-superuser, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: wamn-sysdb-superuser, key: password }
            - name: WAMN_SYSTEM_ADMIN_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@wamn-sysdb-rw.wamn-system.svc.cluster.local:5432/wamn_system
            - name: WAMN_EVT_NATS_URL
              value: nats://evt-nats.wamn-system.svc.cluster.local:4222
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { memory: "512Mi" }
