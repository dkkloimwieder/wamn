# [9.2] The in-cluster gate of record: prove host-enforced traceparent
# propagation over real networking on wamn:connection/http, the surface that
# carries production egress. traceproof runs the shipped injector without a
# guest, takes only the header that injector wrote, then uses that header for a
# request to serve-echo; the reflected trace id must match. Runs the wamn-gates
# image (SR1) — no external client to pull.
#
# [wamn-k9ea] RE-AIMED 2026-08-26. This gate previously proved the same property
# on wash-runtime's P2 and P3 wasi:http HostHandler surfaces. That injection was
# fork patch g2br.4, which docs/architecture/native-alignment-ledger.md Part 2
# records as Dropped at the vanilla v2.8.0 sync — WAMN's real outbound-effect
# path is wamn:connection/http, which injects the active span context itself,
# and the wasi:http egress surface has no WAMN production call site. The gate
# was re-aimed rather than retired because every surviving proof of the live
# path is in-process; this is the only cross-process traceparent witness.
#
# Prereqs: serve-echo and the OTel collector rolled out.
#
#   kubectl -n wamn-system apply -f deploy/gates/traceproof-job.yaml
#   kubectl -n wamn-system wait --for=condition=complete job/traceproof --timeout=180s
#   kubectl -n wamn-system logs job/traceproof
apiVersion: batch/v1
kind: Job
metadata:
  name: traceproof
  namespace: wamn-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: traceproof }
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z serve-echo 8091; do echo "waiting serve-echo:8091"; sleep 2; done
              until nc -z otel-collector 4317; do echo "waiting otel-collector:4317"; sleep 2; done
      containers:
        - name: traceproof
          image: wamn-gates:dev
          imagePullPolicy: IfNotPresent
          args:
            - "--log-level"
            - "info"
            - "traceproof"
            - "--upstream"
            - "http://serve-echo.wamn-system.svc.cluster.local:8091/"
          env:
            # Host spans must carry an OTel context for the W3C propagator to
            # inject; the collector is the same production path used by 9.1.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "grpc" }
            - { name: RUST_LOG, value: "error" }
          resources:
            requests: { cpu: "250m", memory: "128Mi" }
            limits: { memory: "256Mi" }
