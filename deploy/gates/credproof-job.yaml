# [5.9] The credential-vault gate of record: credproof provisions a throwaway
# canonical catalog/run plane, admits both committed fixtures through the
# production invocation transaction, and drives the exact baked flowrunner via
# ExecutionHost. The positive artifact has one active environment binding whose
# credential-set handle resolves to a call-scoped authorization header; the
# deny artifact deliberately has no binding. serve-echo witnesses delivery,
# while the database scan proves containment.
#
#   kubectl -n wamn-system apply -f deploy/gates/credproof-job.yaml
#   kubectl -n wamn-system wait --for=condition=complete job/credproof --timeout=180s
#   kubectl -n wamn-system logs job/credproof
apiVersion: batch/v1
kind: Job
metadata:
  name: credproof
  namespace: wamn-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: credproof }
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - >-
              until nc -z postgres 5432; do echo waiting for postgres; sleep 1; done;
              until nc -z serve-echo 8091; do echo waiting for serve-echo; sleep 1; done
      containers:
        - name: credproof
          image: wamn-gates:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: WAMN_PG_URL
              valueFrom:
                secretKeyRef:
                  name: wamn-runner-db
                  key: url
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: password } }
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: host } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: port } }
          args:
            - "--log-level"
            - "error"
            - "credproof"
            - "--flowrunner"
            - "/bench/flowrunner.wasm"
            - "--admin-database-url"
            - "postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/postgres"
            - "--echo-url"
            - "http://serve-echo:8091"
            - "--timeout-secs"
            - "60"
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
