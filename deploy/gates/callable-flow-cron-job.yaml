# Rev18 cron attachment → centralized admission process-boundary proof.
apiVersion: batch/v1
kind: Job
metadata:
  name: callable-flow-cron
  namespace: wamn-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: callable-flow-cron }
    spec:
      restartPolicy: Never
      initContainers:
        - name: reconcile-run-plane
          image: wamn-gates:dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/wamn-ctl"]
          args: ["reconcile-run-plane", "--schema", "wamn_run"]
          env:
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: password } }
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: host } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: port } }
            - name: WAMN_PG_ADMIN_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/wamn
      containers:
        - name: proof
          image: wamn-gates:dev
          imagePullPolicy: IfNotPresent
          args: ["--log-level", "error", "callable-cron"]
          env:
            - name: WAMN_PG_URL
              value: postgres://wamn_app:wamn_app@postgres.wamn-system.svc.cluster.local:5432/wamn
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: password } }
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: host } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: port } }
            - name: WAMN_PG_ADMIN_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/wamn
          resources:
            requests: { cpu: "250m", memory: "128Mi" }
            limits: { memory: "512Mi" }
