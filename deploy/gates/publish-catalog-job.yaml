# Provision a project schema and publish its catalog snapshot through the
# production ctl boundary. The bootstrap journey absorbs this input; it connects
# as the Postgres superuser and applies the additive catalog floor.
#
# The retained schema proof catalog is mounted as bootstrap input:
#   kubectl -n wamn-system create configmap bootstrap-catalog \
#     --from-file=catalog.json=crates/schema/model/tests/fixtures/poc-receiving.catalog.json
#   kubectl -n wamn-system apply -f deploy/gates/publish-catalog-job.yaml
#   kubectl -n wamn-system wait --for=condition=complete job/publish-catalog --timeout=120s
#   kubectl -n wamn-system logs job/publish-catalog
apiVersion: batch/v1
kind: Job
metadata:
  name: publish-catalog
  namespace: wamn-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: publish-catalog }
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: postgres }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: publish-catalog
          image: wamn-ctl:dev
          imagePullPolicy: IfNotPresent
          args:
            - "publish-catalog"
            - "--catalog"
            - "/fixtures/catalog.json"
            - "--tenant"
            - "tenant-a"
            - "--schema"
            - "api_proof"
            - "--provision"
          env:
            # Superuser: provisions the schema/floor + writes the RLS-scoped snapshot.
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: password } }
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: host } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: port } }
            - name: WAMN_PG_ADMIN_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/wamn
          volumeMounts:
            - name: fixtures
              mountPath: /fixtures
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { memory: "512Mi" }
      volumes:
        - name: fixtures
          configMap:
            name: bootstrap-catalog
