# wamn-ctc8.8 management authoring surface — the authenticated HTTP boundary in
# front of the canonical authoring commands. The worker exposes only its
# authenticated `serve` subcommand.
#
#   kubectl -n wamn-system apply -f deploy/platform/scenario-worker.yaml
#   kubectl -n wamn-system rollout status deploy/scenario-worker --timeout=120s
#
# PER-PROJECT INSTANTIATION: --org / --project / --environment / --tenant and
# the authoring Secret name below are per-(org, project, env) config. One
# surface serves exactly one (org, project, environment) triple: a token
# whose principal holds no role in THAT project is refused, and a request naming
# any other project or environment is refused identically. All four scope
# arguments are REQUIRED with no default (wamn-0h0g.8.18) — omitting any one of
# them makes the process refuse at startup rather than bind to a scope nobody
# chose.
#
# THREE CREDENTIALS, THREE PLANES (R8b — all are Secret REFERENCES, never inline):
#   WAMN_SYSTEM_URL      the T1 system database, read-only for identity: it
#                        verifies personal access tokens and reads
#                        identity.project_roles. This is control-plane tooling
#                        reading first-party identity by ctc8.6 design, not a
#                        data-plane request path.
#
#                        A scoped A/B LOGIN generation of `wamn_identity_reader`
#                        (wamn-0h0g.12.67), granted SELECT on exactly
#                        identity.pats, identity.principals and
#                        identity.project_roles. It was `wamn-system-db`, which
#                        authenticates as `wamn_system` — the AUTHORIZATION owner
#                        of the registry, provisioning and identity schemas. That
#                        credential is not merely wide: identity.* carries NO row
#                        level security, so anyone who could read that Secret
#                        could INSERT a token_hash/token_prefix pair bound to any
#                        principal and present the matching PAT to this surface,
#                        or INSERT an identity.project_roles row and self-grant a
#                        role in any org or project. This surface's whole
#                        authorization model is rows in a table that credential
#                        owned. It is refused before any I/O on the same
#                        predicates as the two below
#                        (crates/control/provision parse_system_reader_url), so a
#                        Secret carrying the owner crash-loops instead of serving.
#
#   THE IDENTITY-READER SECRET IS NOT MINTED YET, exactly as the admission
#   Secret below is not: `wamn-identity-reader-<org>--<project>--<env>` is the
#   rendering of `workload_secret_name(WorkloadRoleFamily::IdentityReader, …)`
#   and nothing in ctl emits it for this environment today, so a fresh
#   environment's pod pends with CreateContainerConfigError until it does. That
#   fail-closed window is deliberate and is strictly narrower than the exposure
#   it replaces — do NOT hand-create the Secret to get past it, and do NOT point
#   this reference back at `wamn-system-db`.
#   WAMN_CONTROL_AUTHORING_PG_URL
#                        the SOLE authoring and report connection
#                        (wamn-0h0g.8.18): a scoped A/B LOGIN generation of
#                        `wamn_control_author` on the CONTROL database. There is
#                        no project-URL fallback, no dual read, no dual write.
#                        The surface REFUSES before any I/O unless the value
#                        parses as a postgres URL, names a host, carries no
#                        query or fragment, names exactly one database, and
#                        authenticates as the control-author generation role
#                        derived from THIS (org, project, environment) and that
#                        database name — so a project-database URL or a
#                        mis-scoped Secret crash-loops instead of serving
#                        (crates/control/provision parse_control_authoring_url).
#   WAMN_MANAGEMENT_ADMISSION_PG_URL
#                        the project-environment ADMISSION connection
#                        (wamn-0h0g.8.5.3): a scoped A/B LOGIN generation of
#                        `wamn_management_admitter` on THIS environment's own
#                        PROJECT database. It is a separate plane from the
#                        authoring connection above, not a fallback for it and
#                        not reachable from it — authoring writes the control
#                        ledger, admission writes project run state, and a
#                        transaction cannot span two databases. It is refused
#                        before any I/O on exactly the same predicates
#                        (crates/control/provision parse_management_admission_url),
#                        so a URL naming the control database, or carrying the
#                        shared `wamn_app` role, crash-loops instead of serving.
#
# THE ADMISSION SECRET IS NOT MINTED FOR THIS ENVIRONMENT YET, exactly as the
# identity-reader Secret above is not. `wamn-ctl provision-project-env
# --prepare-management-admitter-generation <a|b>
# --emit-management-admitter-secret PATH` renders
# `wamn-mgmt-admitter-<org>--<project>--<env>`; until it has been run here, a
# fresh environment's pod pends with CreateContainerConfigError
# on the absent Secret. That fail-closed window is deliberate: do NOT hand-create
# the Secret to get past it — a hand-written credential is exactly the drift the
# derived name exists to prevent. The name below is the rendering of
# `management_admitter_secret_name(org, project, env)`
# (crates/control/provision/src/name.rs), which that renderer consumes, so
# the two agree by derivation rather than by two copied literals.
#
# WHO USES IT: the `gate` authoring command, which reads the project database
# through it (services/scenario-worker/src/management.rs `gate` ->
# store::admission::run_gate); `serve` also proves the credential is in scope at
# startup. Moving the production management path off the shared `wamn_app` role
# onto this family is wamn-0h0g.22.10. Landing the plumbing first makes that
# cutover a traffic change rather than a plumbing change.
#
# NETWORK POSTURE: wamn-system ships egress policies only (runner-netpol.yaml,
# there is no ingress policy, so this listener adds no
# ingress exception and widens nothing. It is deliberately NOT labelled
# `wamn.io/egress-profile: runner` — adopting the runner's egress ceiling for a
# management workload is an owner posture decision, not this bead's.
#
# ONE REPLICA, NO LEADER: the surface holds one pooled author connection and
# serializes commands behind it. Horizontal scale-out needs a connection-pool
# decision first; a second replica would double the author sessions with no
# coordination benefit. Rolling to a new pod is safe — every command is a single
# request and the ledger is append-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-worker
  namespace: wamn-system
  labels: { app: scenario-worker, wamn.org: acme, wamn.project: receiving, wamn.env: dev }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: scenario-worker }
  template:
    metadata:
      labels: { app: scenario-worker, wamn.org: acme, wamn.project: receiving, wamn.env: dev }
    spec:
      # The surface never talks to the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: scenario-worker
          image: wamn-scenario-worker:dev
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --org=acme
            - --project=receiving
            - --environment=dev
            - --tenant=receiving
            - --source-schema=wamn_run
          env:
            - name: WAMN_MANAGEMENT_BIND
              value: "0.0.0.0:8088"
            - name: WAMN_SYSTEM_URL
              valueFrom:
                secretKeyRef:
                  name: wamn-identity-reader-acme--receiving--dev
                  key: url
            - name: WAMN_CONTROL_AUTHORING_PG_URL
              valueFrom:
                secretKeyRef:
                  name: wamn-authoring-acme--receiving--dev
                  key: url
            - name: WAMN_MANAGEMENT_ADMISSION_PG_URL
              valueFrom:
                secretKeyRef:
                  name: wamn-mgmt-admitter-acme--receiving--dev
                  key: url
          ports:
            - name: management
              containerPort: 8088
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: scenario-worker
  namespace: wamn-system
  labels: { app: scenario-worker }
spec:
  selector: { app: scenario-worker }
  ports:
    - name: management
      port: 8088
      targetPort: management
