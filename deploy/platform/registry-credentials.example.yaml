# Registry credentials for one environment namespace. This file is a template:
# replace every __TOKEN__ through the deployment secret manager; never commit
# rendered credentials.
#
# Development registry preparation (one account may be used for both client
# Secrets locally; production MUST issue separately scoped pull-only and
# push-only robot identities):
#
#   docker run --rm --entrypoint htpasswd httpd:2-alpine \
#     -Bbn "$PULL_USER" "$PULL_PASSWORD" > /tmp/wamn-registry-htpasswd
#   docker run --rm --entrypoint htpasswd httpd:2-alpine \
#     -Bbn "$PUSH_USER" "$PUSH_PASSWORD" >> /tmp/wamn-registry-htpasswd
#   kubectl -n wamn-system create secret generic wamn-registry-server-auth \
#     --from-file=htpasswd=/tmp/wamn-registry-htpasswd
#   kubectl -n wamn-system create secret docker-registry wamn-registry-pull \
#     --docker-server=registry.wamn-system.svc.cluster.local:5000 \
#     --docker-username="$PULL_USER" --docker-password="$PULL_PASSWORD"
#   kubectl -n wamn-system create secret docker-registry wamn-registry-push \
#     --docker-server=registry.wamn-system.svc.cluster.local:5000 \
#     --docker-username="$PUSH_USER" --docker-password="$PUSH_PASSWORD"
#
# The checked-in host tier mounts only `wamn-registry-pull`. A ctl publish Job
# mounts only `wamn-registry-push`. A local publisher using a port-forward needs
# a Docker config whose exact auths key is `localhost:5000`; credentials never
# fall back across registry authorities.
---
apiVersion: v1
kind: Secret
metadata:
  name: wamn-registry-server-auth
  namespace: wamn-system
type: Opaque
stringData:
  htpasswd: |-
    __PULL_HTPASSWD_BCRYPT_LINE__
    __PUSH_HTPASSWD_BCRYPT_LINE__
---
apiVersion: v1
kind: Secret
metadata:
  name: wamn-registry-pull
  namespace: wamn-system
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |-
    {"auths":{"registry.wamn-system.svc.cluster.local:5000":{"username":"__PULL_USERNAME__","password":"__PULL_PASSWORD__","auth":"__PULL_AUTH_BASE64__"}}}
---
apiVersion: v1
kind: Secret
metadata:
  name: wamn-registry-push
  namespace: wamn-system
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |-
    {"auths":{"registry.wamn-system.svc.cluster.local:5000":{"username":"__PUSH_USERNAME__","password":"__PUSH_PASSWORD__","auth":"__PUSH_AUTH_BASE64__"}}}
