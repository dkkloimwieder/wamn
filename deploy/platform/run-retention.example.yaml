# EXAMPLE per-project-env RUN-HISTORY retention CronJob (9.6, wamn-srb).
# Periodically runs the SHIPPED `wamn-ctl-ops prune-run-history` verb on one
# project-env's run-plane schema, so terminal run history older than the
# retention window is pruned on a cadence — no new long-lived service, no queue.
#
# WHY (platform-plan risk #5): accumulated run history is a storage-cost driver,
# so the hot `runs` store must be bounded. This verb DELETEs the named tenant's
# runs in a TERMINAL state (completed / failed / infrastructure-failure) older
# than `--retention-days`; the run's `run_queue` row — the ONE cascade out of
# `runs` — goes with it through its `ON DELETE CASCADE`. It is idempotent and
# safe to repeat.
#
# ROLE (wamn-0h0g.12.69, and it is NOT wamn_app any more): pruning runs as a
# scoped `wamn_run_retention` credential GENERATION whose entire cluster-wide
# authority is `DELETE` plus a three-column `SELECT` on `wamn_run.runs`. It
# needs no superuser, no queue privilege, and no `app.tenant` claim — the tenant
# reaches the statement as a bound parameter, and the verb REFUSES unless the
# connected generation's own name proves it was minted for that tenant in that
# database. A CronJob pointed at the wrong Secret therefore FAILS LOUDLY instead
# of reporting `pruned 0 terminal run(s)` and exiting 0.
#
# TWO INDEPENDENT LAYERS, and neither replaces the other: this role bounds WHO
# may delete; the `runs_terminal_delete_only` trigger in
# deploy/sql/run-state.sql bounds WHAT may be deleted (wamn-0h0g.12.128). A
# non-terminal run is refused by the trigger even under this role.
#
# Deploy ONE CronJob per project-env, substituting the schema, the tenant, and
# the retention Secret (deploy/platform/run-retention-db.example.yaml).
#
# v0 LIMITATION: retention is age-based only.
#
#   kubectl -n wamn-system apply -f deploy/platform/run-retention.example.yaml
#   kubectl -n wamn-system get cronjob run-retention-poc-f1
#   # force a tick without waiting for the schedule:
#   kubectl -n wamn-system create job --from=cronjob/run-retention-poc-f1 run-retention-manual
#   kubectl -n wamn-system logs job/run-retention-manual
#   # preview first (no delete): add "--dry-run" to args below.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: run-retention-poc-f1
  namespace: wamn-system
  labels: { app: run-retention, project-env: poc-f1 }
spec:
  # Nightly at 03:30 (owner-tunable). Retention is coarse; a daily cadence keeps
  # the hot store bounded without churn.
  schedule: "30 3 * * *"
  # Never overlap: a slow prune must finish before the next tick — the delete is
  # idempotent, but a second concurrent pass is pointless churn.
  concurrencyPolicy: Forbid
  # A tick missed while the controller was down still runs if it is <10 min late.
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels: { app: run-retention, project-env: poc-f1 }
        spec:
          restartPolicy: Never
          # This Job never talks to the Kubernetes API — don't mount the default
          # ServiceAccount token as idle attack surface.
          automountServiceAccountToken: false
          containers:
            - name: prune
              image: wamn-ctl:dev
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/wamn-ctl-ops"]
              args:
                [
                  "--log-level", "error",
                  "prune-run-history",
                  "--schema", "poc_f1",
                  "--tenant", "poc-f1",
                  "--retention-days", "30",
                ]
              env:
                # Retention-generation connection — a per-(tenant, database)
                # LOGIN with no ALTER, no ownership, no queue privilege and no
                # run-payload read. The demo project envs live in the fixture
                # pod's `wamn` database.
                #
                # A Secret REFERENCE, never inline plaintext (R8b — actual
                # credential material lives in K8s Secrets; see
                # wamn-sysdb.yaml:8-11). The Secret is per-project-env like this
                # CronJob, so a copy for another project-env substitutes the
                # Secret alongside the schema and tenant. Defined in
                # deploy/platform/run-retention-db.example.yaml — APPLY IT
                # FIRST, or the Job Pod never starts.
                - name: WAMN_PG_URL
                  valueFrom:
                    secretKeyRef:
                      name: wamn-run-retention-poc-f1
                      key: url
              resources:
                requests: { cpu: "100m", memory: "128Mi" }
                limits: { memory: "256Mi" }
