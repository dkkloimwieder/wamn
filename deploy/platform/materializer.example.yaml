# wamn-l5i9.17 CDC materializer (D19 v3 §5) — EXAMPLE WorkloadDeployment for
# ONE project-env × tenant. Per-env config (stream/org/project/env + the
# tenant claim) makes this an example the provisioning runbook
# instantiates, not an apply-as-is manifest; the demo values below match the
# matbench fixture triple.
#
#   # after: provision-project-env + enable-cdc-project-env + the event reader
#   # is publishing that env's EVT_ stream, and materializer.wasm is pushed to
#   # the in-cluster registry (using the registry push workflow):
#   kubectl -n wamn-system apply -f <instantiated copy of this file>
#
# SERVICE-FIRST (E11/D21 + E12): this is a wasmCloud SERVICE workload —
# `spec.service`, a wasi:cli/run command component the host runs in its
# restart loop — NOT a hand-rolled Deployment. The washlet host provides all
# imports as plugins; `hostInterfaces` is the host-plugin ALLOWLIST
# (bind_plugins binds only what is declared here).
#
# IDENTITY (host-injected, non-spoofable): `wamn.tenant` scopes the fully
# qualified `catalog.packages` and `catalog.event_registrations` reads and also
# drives the doorbell subject; `wamn.project` selects the per-project pool;
# `wamn.postgres.authority` selects the closed event-materializer credential
# class. The WAMN_MAT_* environment is guest-side SUBSCRIPTION config only
# (stream name + subject segments + the tenant label checked against the
# credential-scoped catalog row) — RLS holds regardless of what the env claims.
#
# THE DOORBELL SEGMENT IS AN EXECUTION TARGET, NOT A TENANT —
# `wamn.doorbell.<execution-target-id>` — and THIS WORKLOAD CARRIES NO KEY THAT
# STATES ONE. The host derives it with `mvp_execution_target_id(wamn.tenant)`
# in `crates/platform/runtime/src/plugins/wamn_jetstream.rs`, the MVP
# tenant-to-target adapter. The explicit target that
# `deploy/platform/dispatcher-projects.example.yaml` and
# `deploy/platform/waker.yaml` now render therefore cannot be rendered here:
# the guest config shape has to gain a key first, which is a plugin change and
# not a manifest one. Until then this file is compatible only through the
# adapter — the residual the open placement epic wamn-0h0g.5 owns, and the one
# placement row wamn-0h0g.10.5 could not discharge in the manifests alone. The
# retirement trigger is recorded at the plugin (wamn-0h0g.10.11): the first
# component that must ring a target which is not its own tenant.
#
# ONE TENANT PER WORKLOAD (v1): registrations and claims are tenant-scoped, and
# the doorbell is scoped to the target the adapter derives from that tenant, so
# a multi-tenant project-env runs one materializer workload per tenant.
# Multi-registration fan-out within the tenant is one workload
# (a durable consumer per registration).
#
# EXACTLY-ONCE: run_id = <flow>:evt:<stream_seq> (zero-padded) + ON CONFLICT
# DO NOTHING on both the write-ahead and the enqueue — replicas > 1 is SAFE
# (duplicates collapse; the matbench redelivery phase proves it) but 1 is the
# v1 shape: JetStream redelivery, not replica count, is the availability story.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: materializer-demo
  # Must be one of `operator.watchNamespaces` (deploy/infra/values-wamn.yaml),
  # or the operator never sees this object at all.
  namespace: wamn-system
spec:
  replicas: 1
  template:
    spec:
      # [wamn-0h0g.15.15] The host group this schedules onto — the label the
      # host reports from `--host-group` (deploy/platform/values-host-default.yaml).
      hostSelector:
        hostgroup: default
      # The environment whose hosts may run this workload, matched against
      # `Host.Environment` (the host Pod's namespace). Under the operator's
      # `allowSharedHosts: false` lock this is only honoured when it equals this
      # object's own namespace; any other value is refused with a
      # `CrossEnvironmentSchedulingDenied` Warning Event and a
      # `HostSelection=False` condition.
      environment: wamn-system
      hostInterfaces:
        # The host's hostInterfaces are the ALLOWLIST for host plugins. The
        # materializer imports PostgreSQL, JetStream, and the production
        # router-delivery bridge; all three must be listed or the component
        # fails to instantiate.
        - namespace: wamn
          package: postgres
          version: "0.1.0"
          interfaces: [types, client]
        - namespace: wamn
          package: jetstream
          version: "0.1.0"
          interfaces: [types, consumer, doorbell]
        - namespace: wamn
          package: router-delivery
          version: "0.1.0"
          interfaces: [delivery]
      service:
        image: registry.wamn-system.svc.cluster.local:5000/wamn/materializer:dev
        # Mutable :dev tag — always re-pull so a re-pushed component is picked
        # up on the next workload start.
        imagePullPolicy: Always
        # The host restarts a failed run up to this many times; transient
        # errors are handled INSIDE the guest loop (nack + retry), so a
        # restart here means repeated hard failure (bad config, trap).
        maxRestarts: 5
        localResources:
          allowedIpNameLookups: []
          config:
            wamn.tenant: t1
            wamn.project: default
            wamn.environment: menv
            wamn.postgres.authority: event-materializer
          environment:
            config:
              WAMN_MAT_STREAM: EVT_morg_menv
              WAMN_MAT_ORG: morg
              WAMN_MAT_PROJECT: mproj
              WAMN_MAT_ENV: menv
              WAMN_MAT_TENANT: t1
              # Retry is bounded; the final failed attempt is published to the
              # host-derived per-registration DLQ before the source is termed.
              WAMN_MAT_MAX_DELIVER: "5"
