{{- with .Values.operations }}
{{- $operation := . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}-operations
  namespace: {{ $.Release.Namespace }}
data:
  cluster: {{ .cluster | quote }}
---
# Each CDC process reads only its project's replication credential and database CA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .capture }}
  namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .capture }}
  namespace: {{ $.Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .capture | quote }}, {{ printf "%s-ca" .cluster | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .capture }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .capture }}
subjects:
  - kind: ServiceAccount
    name: {{ .capture }}
    namespace: {{ $.Release.Namespace }}
{{- range $privileged := list false true }}
{{- $name := printf "%s-%s" $operation.name (ternary "sql" "code" $privileged) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete]
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
  - apiGroups: [runtime.wasmcloud.dev]
    resources: [workloaddeployments]
    verbs: [get, list, watch, create, update, patch, delete]
  {{- if $privileged }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [databases]
    resourceNames: [{{ $operation.database | quote }}]
    verbs: [get, list, watch, patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
