{{- with .Values.materializer }}
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: {{ .hostGroup }}
      environment: {{ $.Release.Namespace }}
      hostInterfaces:
        - namespace: wamn
          package: postgres
          version: "0.4.0"
          interfaces: [types, client]
        - namespace: wamn
          package: jetstream
          version: "0.1.0"
          interfaces: [types, registration]
        - namespace: wasmcloud
          package: nats
          version: "0.1.0"
          name: events
          interfaces: [types, jetstream]
        - namespace: wamn
          package: flow-http-routing
          version: "0.1.0"
          interfaces: [routing]
        - namespace: wamn
          package: router-delivery
          version: "0.4.0"
          interfaces: [delivery]
      service:
        image: {{ .image | quote }}
        imagePullPolicy: Always
        maxRestarts: 5
        localResources:
          allowedIpNameLookups: []
          config:
            wamn.project_env_key: {{ .projectEnvKey | quote }}
            wamn.project: {{ .project | quote }}
            wamn.environment: {{ .environment | quote }}
            wamn.postgres.authority: event-materializer
          environment:
            config:
              WAMN_MAT_STREAM: {{ .stream | quote }}
              WAMN_MAT_ORG: {{ .org | quote }}
              WAMN_MAT_PROJECT: {{ .project | quote }}
              WAMN_MAT_ENV: {{ .environment | quote }}
              WAMN_MAT_PROJECT_ENV_KEY: {{ .projectEnvKey | quote }}
              WAMN_MAT_FETCH_MS: {{ .fetchMs | quote }}
              WAMN_MAT_SWEEP_MS: {{ .sweepMs | quote }}
              WAMN_MAT_MAX_DELIVER: "5"
{{- end }}
