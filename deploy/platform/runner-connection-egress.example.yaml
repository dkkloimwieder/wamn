# Example environment-owned extension to runner-netpol.yaml.
#
# Standard Kubernetes NetworkPolicy is address/port based, not FQDN based.
# Resolve the environment's approved external connection authorities through
# its controlled resolver, render the narrow resulting CIDRs and ports here,
# and update this policy when those approved addresses rotate. The trusted HTTP
# adapter independently pins one resolved address and retains the configured
# hostname for Host/TLS verification. Policies are additive, so this extension
# cannot remove the platform floor and an omitted destination remains denied.
#
# Render it into the runner's OWN namespace (one environment = one namespace).
# An ipBlock destination is namespace-independent, but if an entry ever names an
# in-cluster peer, pair its podSelector with a namespaceSelector inside the SAME
# `to:` item: a bare podSelector silently means "same namespace as the runner",
# and two separate items admit every pod in the namespace (runner-netpol.yaml).
#
# TEST-NET-2 is documentation-only. Replace it before applying this example.
# Automated per-project policy rendering/provisioning is tracked by `wamn-ou1`;
# until that lands, this environment-owned manifest is hand-maintained.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-egress-connections-example
  namespace: wamn-system
spec:
  podSelector:
    matchLabels:
      wamn.io/egress-profile: runner
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 198.51.100.0/24
      ports:
        - { protocol: TCP, port: 443 }
