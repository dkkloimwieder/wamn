# The status and credential access of the control host
# (docs/plan/platform-deploy.md section 11.4, owner ruling 2026-10-13,
# wamn-esnu9). Applied once per cluster by the platform install, into the
# release namespace (`hosts` on GKE, `wamn-system` on kind):
#
#   kubectl -n <release namespace> apply -f deploy/platform/control-status-rbac.yaml
#
# No object states a namespace. The subject's namespace defaults to the
# RoleBinding's namespace. The control host group runs as the one platform
# service account `wamn-host` in the release namespace (docs/operations/gcp.md
# section 3.23, wamn-okr8y). The control group mounts a projected token
# (deploy/gcp/values-host.yaml). Environment releases use separate ServiceAccounts.
#
# get, list and watch on pods, deployments and workloaddeployments in the
# release namespace. Credential writes grant create, get and update on Secrets.
# `crates/execution/host/src/environment_status.rs` tests these rules.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wamn-control-status
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch]
- apiGroups: [runtime.wasmcloud.dev]
  resources: [workloaddeployments]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [create, get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wamn-control-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wamn-control-status
subjects:
- kind: ServiceAccount
  name: wamn-host
