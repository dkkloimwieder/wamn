# The read-only access of the control host's `environment.status`
# (docs/plan/platform-deploy.md section 11.4, owner ruling 2026-10-13,
# wamn-esnu9). Applied once per cluster by the platform install:
#
#   kubectl -n hosts apply -f deploy/platform/control-status-rbac.yaml
#
# The control host group runs in the `wamn-host` runtime-operator release in
# `hosts`, as that release's ServiceAccount
# `wamn-host-runtime-operator-runtime`. The chart sets
# automountServiceAccountToken false, so only the control group, which mounts a
# projected token (deploy/gcp/values-host.yaml), can use this grant.
#
# get, list and watch on pods, deployments and workloaddeployments in `hosts`,
# and nothing else: no Secret, no write, no other namespace.
# `crates/execution/host/src/environment_status.rs` tests these rules.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wamn-control-status
  namespace: hosts
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch]
- apiGroups: [runtime.wasmcloud.dev]
  resources: [workloaddeployments]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wamn-control-status
  namespace: hosts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wamn-control-status
subjects:
- kind: ServiceAccount
  name: wamn-host-runtime-operator-runtime
  namespace: hosts
