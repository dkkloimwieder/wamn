{{- if .Values.routeHost }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ (default .Release.Name .Values.name) }}
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
  {{- if .Values.applications }}
  annotations:
    {{- include "release.annotations" . | nindent 4 }}
  {{- end }}
data:
  release.json: {{ dict "host" .Values.routeHost "digest" .Values.release.manifestDigest "clients" .Values.webClients "webs" .Values.webDigests "platformUi" .Values.platformUi "org" .Values.org "project" .Values.project | toJson | quote }}
{{- end }}

{{- if .Values.routeHost }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ (default .Release.Name .Values.name) }}-route
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
  labels:
    wamn.route: "true"
  {{- if .Values.applications }}
  annotations:
    {{- include "release.annotations" . | nindent 4 }}
  {{- end }}
data:
  route.json: {{ dict "host" .Values.routeHost "release" (default .Release.Name .Values.name) "api" (printf "http://%s-http.%s.svc.cluster.local" (default .Release.Name .Values.name) (default .Release.Namespace .Values.namespace)) "files" (ternary (printf "http://%s-files.%s.svc.cluster.local" (default .Release.Name .Values.name) (default .Release.Namespace .Values.namespace)) "" (not (empty .Values.applications))) | toJson | quote }}
{{- end }}
