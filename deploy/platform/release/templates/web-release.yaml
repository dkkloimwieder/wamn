{{- if .Values.routeHost }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
data:
  release.json: {{ dict "host" .Values.routeHost "digest" .Values.release.manifestDigest "clients" .Values.webClients "webs" .Values.webDigests "platformVersion" (ternary .Chart.AppVersion "" .Values.platformUi) | toJson | quote }}
{{- end }}
