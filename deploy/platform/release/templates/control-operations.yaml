{{- if .Values.org }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: c-{{ .Values.org }}-status
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wamn-control-status
subjects:
- kind: ServiceAccount
  name: wamn-control-{{ .Values.org }}
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: c-{{ .Values.org }}-operations
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
rules:
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get]
- apiGroups: [""]
  resources: [pods]
  verbs: [list]
- apiGroups: [""]
  resources: [pods/log, configmaps]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: c-{{ .Values.org }}-operations
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: c-{{ .Values.org }}-operations
subjects:
- kind: ServiceAccount
  name: wamn-control-{{ .Values.org }}
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
{{- end }}
