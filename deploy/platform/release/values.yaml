# Defaults for application workloads and the published platform image set.

platform:
  host:
    image: ""
  # The role component images of the platform image set: `<repository>@sha256:<hex>`.
  roles:
    http:
      image: ""
      maxConcurrency: 1
  ctl:
    image: ""
  identity:
    image: ""
  edge:
    image: ""

# Install values. `wamn_control::release_chart::values` writes them.
release:
  # `sha256:<hex>` of the release manifest.
  manifestDigest: ""
  artifactBase: ""
# `org/project/env`.
environment: ""
routeHost: ""
# Exactly one application name to its package membership.
applications: {}
# Host to client package id; env apply resolves the package from its declaration.
webClients: {}
# Host to pinned web artifact digest.
webDigests: {}
# The control release pins the platform UI artifact by manifest digest.
platformUi: ""
# Organization whose platform UI configuration the edge serves.
org: ""
# The application's HTTP role: `{name: http, entry: ..., config: {}}`.
roles: []
# `{actor}`: who applied. Helm keeps it with the revision.
audit: {}

# Shared environment host selected by application workloads.
hostGroup: ""
