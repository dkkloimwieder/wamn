# 5.8 shared queue dispatcher — the always-on, read-only reconciliation loop
# that emits best-effort wake hints for every project it serves. Row events are
# the D19 v3 event plane's — CDC reader → JetStream → materializer, l5i9.19.
# Runs the wamn-dispatcher binary (its own SR9 image target — no runtime linked).
#
#   kubectl -n wamn-system apply -f deploy/platform/dispatcher-projects.example.yaml  # once
#   kubectl -n wamn-system apply -f deploy/platform/dispatcher.yaml
#   kubectl -n wamn-system rollout status deploy/dispatcher --timeout=120s
#   kubectl -n wamn-system logs -l app=dispatcher --tail=20
#
# The wamn-dispatch-projects Secret is DELIBERATELY NOT in this file: it is
# per-environment config (real entries land with hosting/2.3 provisioning),
# and bundling it here would clobber a customized Secret back to the example
# values on every re-apply. deploy/platform/dispatcher-projects.example.yaml carries a
# demo-project example of the shape.
#
# TWO REPLICAS, NO LEADER: replicas may publish duplicate hints from the same
# durable queue rows. Hints are repeatable and the executor's direct claim is
# the state-transition arbiter, so reconciliation needs no leader election.
# The retired dispatchbench executable is not a current proof source.
#
# CRASH SAFETY + SHUTDOWN: a sweep only reads durable queue state and publishes
# repeatable hints. A killed pod leaves no dispatcher-owned database mutation;
# the surviving or restarted replica re-hints due work. The dispatcher also
# handles SIGTERM explicitly (PID 1 gets no default signal disposition) and
# exits cleanly in milliseconds — a rollout never waits out the grace period.
#
# STARTUP + ROLLOUTS: the initial dial of every project is fatal on failure
# (the pod restarts until its projects' DBs are reachable — the wait-deps init
# container keeps that quiet). Because there is no readiness endpoint, the
# rollout is guarded by maxUnavailable: 0 + minReadySeconds: a new pod with a
# bad projects Secret crashes within its dial timeout and never counts as
# available, so a bad rollout stalls with the old replicas still running
# instead of replacing them. NATS is optional (no doorbell = reconciliation
# sweeps still guarantee pickup), so the init container waits for it only
# BOUNDED — an absent NATS delays startup by at most ~30s instead of wedging
# it.
#
# DATABASE PRINCIPAL (wamn-0h0g.12.66, cut over to credential generations by
# wamn-0h0g.22.24): the dispatcher authenticates as a per-database
# `wamn_dispatch_reader_<40-hex>_<a|b>` GENERATION which inherits USAGE on the
# run-plane schema and SELECT on `run_queue` and `effect_attempts`, and holds
# CONNECT on its own database and no other. That is its entire database
# authority. It previously used the shared `wamn_app` credential, which also
# carries INSERT/UPDATE/DELETE on the queue and on every `catalog` relation, and
# then the stable `wamn_dispatch_reader` LOGIN — cluster-global, and therefore a
# session on every environment on the cluster once generations inherit it.
#
# ROLLOUT ORDER IS MANDATORY, and it is a FOUR-STEP sequence per project
# database, not one:
#   1. apply the role SQL to the target cluster's superuser (creates the stable
#      NOLOGIN ACL role — a grant carrier, not a credential);
#   2. apply the privilege SQL — the `ALTER DATABASE … OWNER TO` statement FIRST,
#      then the CONNECT revokes. An owner change rewrites the outgoing owner's
#      ACL entry and carries away whatever merged into it, so a statement issued
#      before the owner statement is silently undone;
#   3. apply the read-surface grants INSIDE each project database, after its
#      run-plane schema exists;
#   4. prepare the dispatch-reader generation for that database and emit its
#      Secret. THIS is the step that mints a credential; nothing before it can
#      log in.
# Only then update the wamn-dispatch-projects Secret and roll this Deployment.
# Rolling first is not silent: the initial dial is fatal, and maxUnavailable: 0
# with minReadySeconds: 30 means the new pod never becomes available and the old
# replicas keep sweeping — the rollout stalls rather than taking the dispatcher
# down. Every step re-applies as a no-op, so a stalled rollout is repaired by
# completing the sequence and retrying.
#
# CREDENTIAL SCOPE (residual risk, tracked as a follow-up bead): the doorbell
# publishes over the operator chart's mTLS NATS using the SAME
# wasmcloud-runtime-tls cert the host groups use, whose CN maps to an
# allow-all-subjects NATS user. The dispatcher only ever PUBLISHES on
# wamn.doorbell.<tenant>; a publish-only NATS identity (own cert + scoped
# verify_and_map user in the chart config) is the right long-term shape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: wamn-system
  labels: { app: dispatcher }
spec:
  replicas: 2
  selector:
    matchLabels: { app: dispatcher }
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # A crash-looping new pod (bad Secret, unreachable project DB) must stay up
  # this long before it replaces a healthy replica. The fatal initial dial
  # fails within its 10s connect timeout, well inside this window.
  minReadySeconds: 30
  template:
    metadata:
      labels: { app: dispatcher }
    spec:
      # The dispatcher never talks to the Kubernetes API — don't hand each
      # replica the default ServiceAccount token as idle attack surface.
      automountServiceAccountToken: false
      # Prefer spreading the HA pair across nodes (soft: a one-node cluster
      # still schedules both).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: dispatcher }
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            # Postgres is a hard dependency (initial dial is fatal); NATS is
            # best-effort (the dispatcher runs hint-less without it), so its
            # wait is bounded rather than a startup wedge.
            - >-
              until nc -z postgres 5432; do echo waiting for postgres; sleep 1; done;
              i=0; until nc -z nats 4222 || [ $i -ge 30 ]; do i=$((i+1)); echo waiting for nats; sleep 1; done
      volumes:
        # The operator NATS uses mTLS (verify_and_map). Reuse the runtime cert
        # the host groups connect with (CN maps to the wasmcloud-runtime NATS
        # user) so the doorbell subject is permitted — the runtime doorbell
        # pattern. See the credential-scope note above.
        - name: runtime-cert
          secret:
            secretName: wasmcloud-runtime-tls
            defaultMode: 420
        - name: projects
          secret:
            secretName: wamn-dispatch-projects
            defaultMode: 420
      containers:
        - name: dispatcher
          image: wamn-dispatcher:dev
          imagePullPolicy: IfNotPresent
          env:
            # [9.8] wamn.run_queue.depth gauge. The dispatcher links no runtime,
            # so it builds its OWN OTEL_*-gated meter provider (main.rs); these
            # point it at the collector's OTLP/gRPC ingest and pace its periodic
            # reader at 1s (the 60s default would starve a bounded gate). Absent
            # OTEL_* the provider is never built (the gauge stays a no-op).
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.wamn-system.svc:4317" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "grpc" }
            - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "1000" }
          volumeMounts:
            - name: runtime-cert
              mountPath: /runtime-cert
              readOnly: true
            - name: projects
              mountPath: /etc/wamn
              readOnly: true
          args:
            - "--log-level"
            - "info"
            - "--projects-file"
            - "/etc/wamn/projects.json"
            - "--nats-url"
            - "nats://nats.wamn-system.svc.cluster.local:4222"
            - "--nats-tls-ca"
            - "/runtime-cert/ca.crt"
            - "--nats-tls-cert"
            - "/runtime-cert/tls.crt"
            - "--nats-tls-key"
            - "/runtime-cert/tls.key"
          resources:
            # No CPU limit on purpose (the S2 CFS lesson): a quota would stall
            # the sweep loop with scheduler throttles. Requests are modest —
            # this is an adaptive polling loop, not a bench; it idles at the
            # max interval when projects are quiet.
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { memory: "256Mi" }
---
# Voluntary disruptions (node drain) keep at least one replica sweeping.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dispatcher
  namespace: wamn-system
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: dispatcher }
