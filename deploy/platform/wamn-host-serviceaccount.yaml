# The one ServiceAccount of every release chart host (owner ruling 2026-10-13,
# wamn-okr8y). The platform install creates it once in the release namespace;
# `env apply` creates no account and touches no IAM. Isolation between
# environments stays hostSelector (docs/plan/platform-deploy.md R6).
#
#   kubectl -n <release namespace> apply -f deploy/platform/wamn-host-serviceaccount.yaml
#
# It carries no annotation. On GKE the namespace `hosts` holds the Google
# grants (docs/operations/gcp.md owner input 4).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wamn-host
