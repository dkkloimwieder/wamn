# EXAMPLE per-project-env run-plane schema reconcile Job (E4/R14-migration,
# wamn-1wdq). One-shot run of the SHIPPED `wamn-ctl reconcile-run-plane` verb:
# the durable migration path that brings ONE project-env's run-plane schema to
# the deploy/sql schema of record — created from older revisions, restored from
# pre-teardown snapshots, or wiped by an ephemeral-fixture restart.
#
# WHAT IT COVERS (idempotent; a schema at the record is a no-op):
#   - missing retained record columns (for example E4 stream_seq)
#   - a stale claimable-index definition (recreated WITH stream_seq)
#   - wholly-missing retained tables (run_queue, runs/node_runs —
#     from-zero included; the flows registry is no longer retained or
#     reconciled — wamn-0h0g.12.102 (e45ca35b) retired it)
#   - the locked partition-plane cutover: drained legacy lease state is removed,
#     while nonempty dead-letter history refuses with archive/reprovision guidance
#   - exact record CHECK constraints, the run-state helper functions, and the
#     event-lineage trigger (incompatible existing rows fail the Job; no row is
#     rewritten or deleted)
#   - the pre-l5i9.19 outbox-era teardown (outbox/evt_shadow tables, the
#     wamn_outbox_event trigger/function, legacy registration `state` keys)
#   - the per-database `catalog` metadata schema when absent
# It never drops a retained column or table. Floor/entity tables and flow/seed
# CONTENT are out of scope (publish-catalog / f1-provision own those).
#
# PER-PROJECT-ENV (the `.example` convention): the verb reconciles ONE schema
# (`--schema` + a superuser URL to that project's DB), so run ONE Job per
# project-env. Before applying, the operator MUST replace the five selected values
# below: the system-registry admin URL and the exact org, project, env, and tenant. They
# deliberately have no demo defaults: the reconciler must never project policy
# for a scope nobody selected. The database URL below must independently name
# the exact registry-derived, instance-suffixed target:
#
#   kubectl -n wamn-system apply -f deploy/platform/run-plane-reconcile.example.yaml
#   kubectl -n wamn-system logs -f job/run-plane-reconcile-runner-demo
#   # re-run (Jobs are immutable): delete it first
#   kubectl -n wamn-system delete job run-plane-reconcile-runner-demo
#
# Pass `--dry-run` in args to print the plan without applying (strictly
# read-only). Against a CNPG target, swap the Secret for the cluster's
# `<cluster>-superuser` (same key shape) and the database for the env's DB.
apiVersion: batch/v1
kind: Job
metadata:
  name: run-plane-reconcile-runner-demo
  namespace: wamn-system
  labels: { app: run-plane-reconcile, project-env: runner-demo }
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: run-plane-reconcile, project-env: runner-demo }
    spec:
      restartPolicy: Never
      # Never talks to the Kubernetes API — no ServiceAccount token.
      automountServiceAccountToken: false
      containers:
        - name: reconcile
          image: wamn-ctl:dev
          imagePullPolicy: IfNotPresent
          args:
            [
              "--log-level", "error",
              "reconcile-run-plane",
              "--schema", "wamn_runner_demo",
              "--org", "",
              "--project", "",
              "--env", "",
              "--tenant", "",
            ]
          env:
            # REQUIRED: replace this empty value with an operator-owned
            # secretKeyRef for the system-registry administrative URL. The URL
            # is not guessed or stored in this example.
            - name: WAMN_SYSTEM_ADMIN_URL
              value: ""
            # Superuser URL — CREATE/ALTER/DROP need table ownership, so
            # `wamn_app` cannot run the reconcile. Sourced from the
            # `postgres-fixture-superuser` Secret (secretKeyRef, defined in
            # deploy/platform/postgres.yaml), NOT inline plaintext; project
            # envs live in their exact suffixed databases. k8s
            # expands $(VAR) in a later env value against the earlier
            # secretKeyRef vars, which must precede WAMN_PG_ADMIN_URL.
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: password } }
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: host } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: postgres-fixture-superuser, key: port } }
            - name: WAMN_PG_ADMIN_URL
              # REQUIRED: replace all four identity components with the exact
              # registry-derived physical database target.
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/wamn-db-replace-org--replace-project--replace-env--00000000
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { memory: "256Mi" }
