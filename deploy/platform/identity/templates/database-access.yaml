apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ (default .Release.Name .Values.name) }}
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ (default .Release.Name .Values.name) }}-database
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames:
      - {{ .Values.databaseSecret | quote }}
      - wamn-pg-ca
      {{- range $target := .Values.sessionTargetSecrets }}
      {{- if or (ne $target.connection.credentials.namespace (default $.Release.Namespace $.Values.namespace)) (ne $target.connection.server_ca.namespace (default $.Release.Namespace $.Values.namespace)) }}
      {{- fail "Session credentials and CA must share the identity namespace." }}
      {{- end }}
      - {{ $target.connection.credentials.name | quote }}
      - {{ $target.connection.server_ca.name | quote }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ (default .Release.Name .Values.name) }}-database
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ (default .Release.Name .Values.name) }}-database
subjects:
  - kind: ServiceAccount
    name: {{ (default .Release.Name .Values.name) }}
    namespace: {{ (default .Release.Namespace .Values.namespace) }}
