apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-database
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames:
      - {{ .Values.databaseSecret | quote }}
      - wamn-pg-ca
      {{- range $target := .Values.sessionTargetSecrets }}
      {{- if or (ne $target.connection.credentials.namespace $.Release.Namespace) (ne $target.connection.server_ca.namespace $.Release.Namespace) }}
      {{- fail "Session credentials and CA must share the identity namespace." }}
      {{- end }}
      - {{ $target.connection.credentials.name | quote }}
      - {{ $target.connection.server_ca.name | quote }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-database
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-database
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
