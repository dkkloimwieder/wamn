{{- $issuer := required "Set issuer to the configured HTTPS identity authority URL." .Values.issuer -}}
{{- $databaseSecret := required "Set databaseSecret to the prepared identity issuer Secret name." .Values.databaseSecret -}}
{{- $tlsSecret := required "Set tlsSecret to the existing serving certificate Secret name." .Values.tlsSecret -}}
{{- if not (hasPrefix "https://" $issuer) -}}
{{- fail "issuer must use HTTPS." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: wamn-identity
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wamn-identity
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wamn-identity
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: identity
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            {{- range $index, $secret := .Values.sessionTargetSecrets }}
            - --session-target
            - {{ printf "/var/run/wamn-identity/targets/%d/target.json" $index | quote }}
            {{- end }}
          env:
            - name: WAMN_IDENTITY_BIND
              value: "0.0.0.0:8443"
            - name: WAMN_IDENTITY_ISSUER
              value: {{ $issuer | quote }}
            - name: WAMN_IDENTITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $databaseSecret | quote }}
                  key: url
                  optional: false
            - name: WAMN_IDENTITY_TLS_CERT
              value: /var/run/wamn-identity/tls/tls.crt
            - name: WAMN_IDENTITY_TLS_KEY
              value: /var/run/wamn-identity/tls/tls.key
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - name: serving-tls
              mountPath: /var/run/wamn-identity/tls
              readOnly: true
            {{- range $index, $secret := .Values.sessionTargetSecrets }}
            - name: {{ printf "session-target-%d" $index }}
              mountPath: {{ printf "/var/run/wamn-identity/targets/%d" $index | quote }}
              readOnly: true
            {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: serving-tls
          secret:
            secretName: {{ $tlsSecret | quote }}
            optional: false
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- range $index, $secret := .Values.sessionTargetSecrets }}
        - name: {{ printf "session-target-%d" $index }}
          secret:
            secretName: {{ required "Each sessionTargetSecrets entry must name a prepared Secret." $secret | quote }}
            optional: false
            defaultMode: 0400
            items:
              - key: target.json
                path: target.json
        {{- end }}
