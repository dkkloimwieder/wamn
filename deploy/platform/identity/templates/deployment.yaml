{{- $issuer := required "Set issuer to the configured HTTPS identity authority URL." .Values.issuer -}}
{{- $databaseSecret := required "Set databaseSecret to the identity connection ConfigMap name." .Values.databaseSecret -}}
{{- $tlsSecret := required "Set tlsSecret to the existing serving certificate Secret name." .Values.tlsSecret -}}
{{- if not (hasPrefix "https://" $issuer) -}}
{{- fail "issuer must use HTTPS." -}}
{{- end -}}
{{- if and .Values.resendFrom (not .Values.resendSecret) -}}
{{- fail "Set resendSecret when resendFrom is enabled." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: wamn-identity
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wamn-identity
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wamn-identity
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: true
      containers:
        - name: identity
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --key-rotation-seconds
            - {{ .Values.keyRotationSeconds | quote }}
            {{- if .Values.localMail }}
            - --local-mail
            - {{ .Values.localMail | quote }}
            {{- end }}
            {{- range $index, $secret := .Values.sessionTargetSecrets }}
            - --session-target
            - {{ printf "/var/run/wamn-identity/targets/%d/target.json" $index | quote }}
            {{- end }}
          env:
            - name: WAMN_IDENTITY_BIND
              value: "0.0.0.0:8443"
            - name: WAMN_IDENTITY_ISSUER
              value: {{ $issuer | quote }}
            - name: WAMN_IDENTITY_DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ printf "%s-configuration" $databaseSecret | quote }}
                  key: connection.json
                  optional: false
            {{- if .Values.resendSecret }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.resendSecret | quote }}
                  key: api-key
                  optional: false
            - name: RESEND_FROM
              value: {{ required "Set resendFrom when resendSecret is enabled." .Values.resendFrom | quote }}
            {{- if .Values.inviteUrl }}
            - name: WAMN_IDENTITY_INVITE_URL
              value: {{ .Values.inviteUrl | quote }}
            {{- end }}
            {{- end }}
            - name: WAMN_IDENTITY_TLS_CERT
              value: /var/run/wamn-identity/tls/tls.crt
            - name: WAMN_IDENTITY_TLS_KEY
              value: /var/run/wamn-identity/tls/tls.key
            {{- if .Values.operatorCaSecret }}
            - name: WAMN_IDENTITY_OPERATOR_CA
              value: /var/run/wamn-identity/operator/ca.crt
            {{- end }}
            {{- if .Values.authNats.url }}
            - name: WAMN_NATS_URL
              value: {{ .Values.authNats.url | quote }}
            - name: WAMN_NATS_TLS_CA
              value: /var/run/wamn-identity/nats/ca.crt
            - name: WAMN_NATS_TLS_CERT
              value: /var/run/wamn-identity/nats/tls.crt
            - name: WAMN_NATS_TLS_KEY
              value: /var/run/wamn-identity/nats/tls.key
            {{- end }}
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            {{- if .Values.localMail }}
            - name: local-mail
              mountPath: {{ dir .Values.localMail | quote }}
            {{- end }}
            - name: serving-tls
              mountPath: /var/run/wamn-identity/tls
              readOnly: true
            {{- if .Values.operatorCaSecret }}
            - name: operator-ca
              mountPath: /var/run/wamn-identity/operator
              readOnly: true
            {{- end }}
            {{- if .Values.authNats.url }}
            - name: auth-nats
              mountPath: /var/run/wamn-identity/nats
              readOnly: true
            {{- end }}
            {{- range $index, $secret := .Values.sessionTargetSecrets }}
            - name: {{ printf "session-target-%d" $index }}
              mountPath: {{ printf "/var/run/wamn-identity/targets/%d" $index | quote }}
              readOnly: true
            {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        {{- if .Values.localMail }}
        - name: local-mail
          emptyDir: {}
        {{- end }}
        - name: serving-tls
          secret:
            secretName: {{ $tlsSecret | quote }}
            optional: false
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- if .Values.operatorCaSecret }}
        - name: operator-ca
          secret:
            secretName: {{ .Values.operatorCaSecret | quote }}
            optional: false
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if .Values.authNats.url }}
        - name: auth-nats
          secret:
            secretName: {{ required "Set authNats.tlsSecret when authNats.url is set." .Values.authNats.tlsSecret | quote }}
            optional: false
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- range $index, $secret := .Values.sessionTargetSecrets }}
        - name: {{ printf "session-target-%d" $index }}
          configMap:
            name: {{ required "Each sessionTargetSecrets entry must name a connection ConfigMap." $secret | quote }}
            optional: false
            defaultMode: 0400
            items:
              - key: session-target.json
                path: target.json
        {{- end }}
