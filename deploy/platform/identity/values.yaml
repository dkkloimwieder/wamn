image:
  repository: wamn-identity
  tag: dev
  pullPolicy: IfNotPresent

# Set the configured HTTPS issuer and existing Secret names before installation.
# The Secrets must exist in the release namespace.
issuer: ""
databaseSecret: ""
tlsSecret: ""

# Dedicated operator CA Secret with ca.crt. Empty refuses POST /pats.
# Restart the service after a CA change to close existing TLS connections.
operatorCaSecret: ""

# Each Secret contains one provisioner-generated target.json document.
# Empty keeps POST /session disabled. Restart after credential rotation.
sessionTargetSecrets: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
