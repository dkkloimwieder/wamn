# EXAMPLE default-project DB Secret for the HOST TIER
# (deploy/platform/values-host-default.yaml, which references it as
# `WAMN_PG_URL` via secretKeyRef). DELIBERATELY a separate manifest — the
# dispatcher-projects/runner-db/runner-credentials precedent: it is
# per-environment config, so `helm upgrade` of the host release never clobbers a
# customized Secret back to this demo value.
#
# `url` is the default tenant's scoped App-generation connection string. The
# wamn:postgres plugin's from_env() default pool connects as that LOGIN for
# guest SQL; it inherits grants from the passwordless NOLOGIN `wamn_app` role.
#
# NOT the executor's `wamn-executor-db` on purpose, even though the demo values
# point at the same fixture database: that Secret is per-PROJECT config owned by
# deploy/platform/executor.yaml's lifecycle, while this one is per-ENVIRONMENT
# config owned by the host Helm release. Sharing one Secret would make an edit
# for the executor's project silently repoint every host in the group. This
# clause named `wamn-runner-db` and `deploy/platform/runner.yaml` until
# wamn-0h0g.10.5's BoM pass; `ea71c1c4` deleted both, and the executor inherited
# the role. It inherited no `.example` carrier either, and for a while
# `wamn-executor-db` was the one Secret this tier mounted that no file here
# declared (wamn-0h0g.10.5 reported it). `wamn-0h0g.10.14` closed that:
# `executor-db.example.yaml` declares it and its executor-platform sibling. The
# deleted file's `?sslmode=disable` did NOT come back — no carrier in this tier
# spells an sslmode, this one included.
#
# SOURCE: run `wamn-ctl provision-project-env` with the normal org/project/env
# and admin arguments plus `--tenant <tenant>`,
# `--prepare-guest-generation <a|b>`, and `--emit-guest-secret <path>`, then copy
# the emitted `url` into this stable operator-owned Secret. The demo role below
# is the exact generation for tenant `demo-tenant` in database `wamn`; substitute
# its prepared password.
# Rotation uses the other A/B generation, followed by the native Helm/Kubernetes
# rollout in deploy/README.md; never restore LOGIN or a password on `wamn_app`.
#
# ORDER: apply this BEFORE the host release. A secretKeyRef the kubelet cannot
# resolve leaves the host Pods in CreateContainerConfigError, never Running.
#
#   kubectl -n wamn-system apply -f deploy/platform/host-db.example.yaml
apiVersion: v1
kind: Secret
metadata:
  name: wamn-host-db
  namespace: wamn-system
type: Opaque
stringData:
  url: "postgres://wamn_app_3b8aca90f34f304c6a228d363655a9820c43e4c6_a:REPLACE-WITH-THE-PREPARED-PASSWORD@postgres.wamn-system.svc.cluster.local:5432/wamn"
