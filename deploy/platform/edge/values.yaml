# The edge of docs/plan/web-deployment.md. In kind it serves every path. On
# Google Cloud (neg set) a load balancer sends /api/ and /password/ to
# it and serves every other path from a Cloud CDN backend bucket.
image:
  repository: nginx
  # nginx:1.27-alpine. A digest selects exact bytes, and a tag does not.
  digest: sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
  pullPolicy: IfNotPresent

# The applications the edge serves, one server each. host is the public host,
# which the release of the application publishes as its --route-host, so the
# edge passes the Host header to the router unchanged. api is the route
# ingress of its host group, plain HTTP; the edge removes /api before it
# forwards. bucketPath is the path that `wamn web upload` wrote, readable
# without credentials: <bucket>/<prefix>/<package>/<release digest hex>.
applications: []
#  - host: receiving.example.com
#    api: http://flow-http.hosts.svc.cluster.local
#    bucketPath: web/clients/wamn_receiving/<release digest hex>

# The serving certificate. With issuer set, the chart requests it from that
# cert-manager ClusterIssuer into tlsSecret. Without it, tlsSecret must exist.
tlsSecret: ""
issuer: ""

# The identity service, HTTPS. The edge checks its certificate against ca.crt
# in identityCaConfigMap, for the DNS name in the identity URL.
identity: ""
identityCaConfigMap: ""

# endpoint is the object store origin that the edge reads for every
# application's bucketPath, which Google Cloud does not use. Each object carries
# its own Cache-Control, which the edge and the CDN pass on.
bucket:
  endpoint: ""

# Google Cloud: annotate the Service so that GKE makes a network endpoint group
# for the load balancer. The load balancer then serves the bucket, so
# bucket.endpoint stays empty. docs/operations/gcp.md creates the load balancer
# with gcloud.
neg: false

service:
  type: ClusterIP
  # Set with type NodePort to choose the node port.
  nodePort: null

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi
