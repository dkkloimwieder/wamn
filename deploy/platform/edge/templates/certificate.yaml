{{- if .Values.issuer }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: wamn-edge
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  secretName: {{ required "Set tlsSecret to the serving certificate Secret name." .Values.tlsSecret | quote }}
  dnsNames:
    - {{ required "Set host to the public host name." .Values.host | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.issuer | quote }}
{{- end }}
