{{- if .Values.issuer }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: wamn-edge
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  secretName: {{ required "Set tlsSecret to the serving certificate Secret name." .Values.tlsSecret | quote }}
  dnsNames:
    {{- range required "Set applications to the list of applications the edge serves." .Values.applications }}
    - {{ required "Set host of each application to its public host name." .host | quote }}
    {{- end }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.issuer | quote }}
{{- end }}
