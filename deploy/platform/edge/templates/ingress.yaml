{{- if not .Values.neg }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ (default .Release.Name .Values.name) }}
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
spec:
  tls:
    - secretName: {{ required "Set tlsSecret to the ingress serving certificate." .Values.tlsSecret | quote }}
  defaultBackend:
    service:
      name: {{ (default .Release.Name .Values.name) }}
      port:
        name: http
{{- end }}
