{{- $identity := required "Set identity to the identity service HTTPS URL." .Values.identity -}}
{{- if not (hasPrefix "https://" $identity) -}}
{{- fail "identity must use HTTPS." -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ (default .Release.Name .Values.name) }}
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
data:
  web.json: {{ dict "listen" "0.0.0.0:8080" "bucket" .Values.web.bucket "identity" $identity "identity_ca" "/etc/wamn-edge/identity-ca/ca.crt" "trusted_proxy_hops" .Values.trustedProxyHops | toJson | quote }}
