{{- $identity := required "Set identity to the identity service URL." .Values.identity -}}
{{- if not (hasPrefix "https://" $identity) -}}
{{- fail "identity must use HTTPS." -}}
{{- end -}}
{{- $identityName := trimPrefix "https://" $identity | splitList ":" | first -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: wamn-edge
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    events {}
    http {
      client_body_temp_path /tmp/client-body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server_tokens off;
      access_log /dev/stdout;
      error_log /dev/stderr;
      # CoreDNS and GKE expose cluster DNS through this Service.
      # https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/
      resolver kube-dns.kube-system.svc.cluster.local;
      server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/wamn-edge/tls/tls.crt;
        ssl_certificate_key /etc/wamn-edge/tls/tls.key;
        location /password/ {
          proxy_pass {{ trimSuffix "/" $identity }};
          proxy_http_version 1.1;
          proxy_ssl_server_name on;
          proxy_ssl_name {{ $identityName }};
          proxy_ssl_verify on;
          proxy_ssl_trusted_certificate /etc/wamn-edge/identity-ca/ca.crt;
        }
        location / {
          proxy_pass http://127.0.0.1:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Connection "";
          proxy_request_buffering off;
          client_max_body_size 0;
        }
      }
    }
  web.json: {{ dict "listen" "0.0.0.0:8080" "bucket" .Values.web.bucket | toJson | quote }}
