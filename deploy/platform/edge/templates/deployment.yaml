{{- $identityCa := required "Set identityCaConfigMap to the ConfigMap with the identity ca.crt." .Values.identityCaConfigMap -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ (default .Release.Name .Values.name) }}
  namespace: {{ (default .Release.Namespace .Values.namespace) }}
  labels:
    app.kubernetes.io/name: wamn-edge
    app.kubernetes.io/instance: {{ (default .Release.Name .Values.name) }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wamn-edge
      app.kubernetes.io/instance: {{ (default .Release.Name .Values.name) }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wamn-edge
        app.kubernetes.io/instance: {{ (default .Release.Name .Values.name) }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ (default .Release.Name .Values.name) }}
      containers:
        - name: web
          image: {{ required "Set web.image to the selected Rust web front image." .Values.web.image | quote }}
          args: ["--config", "/etc/wamn-edge/web.json"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/wamn-edge/web.json
              subPath: web.json
              readOnly: true
            - name: identity-ca
              mountPath: /etc/wamn-edge/identity-ca
              readOnly: true
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ (default .Release.Name .Values.name) }}
        - name: identity-ca
          configMap:
            name: {{ $identityCa | quote }}
            items:
              - key: ca.crt
                path: ca.crt
