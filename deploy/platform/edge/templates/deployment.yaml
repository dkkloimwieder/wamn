{{- $tlsSecret := required "Set tlsSecret to the serving certificate Secret name." .Values.tlsSecret -}}
{{- $identityCa := required "Set identityCaConfigMap to the ConfigMap with the identity ca.crt." .Values.identityCaConfigMap -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: wamn-edge
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wamn-edge
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wamn-edge
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: edge
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: serving-tls
              mountPath: /etc/wamn-edge/tls
              readOnly: true
            - name: identity-ca
              mountPath: /etc/wamn-edge/identity-ca
              readOnly: true
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}
        - name: serving-tls
          secret:
            secretName: {{ $tlsSecret | quote }}
            optional: false
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: identity-ca
          configMap:
            name: {{ $identityCa | quote }}
            items:
              - key: ca.crt
                path: ca.crt
