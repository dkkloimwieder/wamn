{{- if or .Values.control.enabled .Values.edge.enabled }}
{{- $certificate := lookup "v1" "Secret" .Values.org "identity-tls" }}
{{- with $certificate }}
{{- $ca := index .data "ca.crt" | b64dec }}
{{- range $namespace := list $.Values.org "hosts" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-ca
  namespace: {{ $namespace }}
data:
  ca.crt: {{ $ca | quote }}
{{- end }}
{{- end }}
{{- end }}
