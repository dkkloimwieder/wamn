apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: wamn-edge
spec:
{{- if .Values.acme }}
  acme: {{ .Values.acme | toJson }}
{{- else }}
  selfSigned: {}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wamn-edge-tls
  namespace: hosts
spec:
  secretName: wamn-edge-tls
  dnsNames: {{ .Values.edgeDnsNames | toJson }}
  issuerRef:
    kind: ClusterIssuer
    name: wamn-edge
