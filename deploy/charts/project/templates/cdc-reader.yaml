{{- with .Values.cdcReader }}
{{- $operations := required "operations is required for the CDC reader" $.Values.operations }}
{{- $database := required "cdcReader.database is required for the CDC reader" .database }}
{{- $login := required "Set cdcReader.database.credentials.name" $database.credentials.name }}
{{- $ca := required "Set cdcReader.database.server_ca.name" $database.server_ca.name }}
{{- $publication := required "publication is required for the CDC reader" $.Values.publication }}
{{- $settings := dict "org" $publication.org "project" $publication.project "env" $publication.env "database" $database "cdc_name" $publication.name "nats_url" (required "cdcReader.natsUrl is required" .natsUrl) | toJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}
  namespace: {{ include "project.namespace" $ | quote }}
data:
  settings.json: {{ $settings | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ include "project.namespace" $ | quote }}
  annotations:
    wamn.environment: {{ .coordinate | quote }}
spec:
  replicas: {{ ternary 0 1 (.pause | default false) }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wamn-cdc-reader
      app.kubernetes.io/instance: {{ .key | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wamn-cdc-reader
        app.kubernetes.io/instance: {{ .key | quote }}
      annotations:
        wamn.dev/cdc-configuration: {{ $settings | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ required "operations.capture is required for the CDC reader" $operations.capture | quote }}
      {{- with .registrySecret }}
      imagePullSecrets: [{name: {{ . | quote }}}]
      {{- end }}
      containers:
        - name: reader
          image: {{ .image | quote }}
          command: [/usr/local/bin/wamn-cdc-reader]
          args: [--settings, /etc/wamn/cdc/settings.json]
          volumeMounts:
            - {name: cdc, mountPath: /etc/wamn/cdc, readOnly: true}
            - {name: database, mountPath: /etc/wamn/db, readOnly: true}
            - {name: nats, mountPath: /etc/wamn/nats, readOnly: true}
      volumes:
        - name: cdc
          configMap: {name: {{ .name | quote }}}
        - name: database
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ $login | quote }}
                  items:
                    - {key: username, path: {{ printf "%s/username" $login | quote }}}
                    - {key: password, path: {{ printf "%s/password" $login | quote }}}
              - secret:
                  name: {{ $ca | quote }}
                  items:
                    - {key: ca.crt, path: {{ printf "%s/ca.crt" $login | quote }}}
        - name: nats
          secret: {secretName: {{ .natsSecret | quote }}}
{{- end }}
