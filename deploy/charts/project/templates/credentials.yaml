{{- with .Values.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name | quote }}
  namespace: {{ include "project.namespace" $ | quote }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .name | quote }}
  namespace: {{ include "project.namespace" $ | quote }}
rules:
  # Control patches individual credential keys, including on connection deactivation.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .name | quote }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name | quote }}
  namespace: {{ include "project.namespace" $ | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .name | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ .controlAccount | quote }}
    namespace: {{ include "project.namespace" $ | quote }}
---
# Control reads its platform login certificate and the server CA copy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-login" .name | quote }}
  namespace: {{ include "project.namespace" $ | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .platformLogin | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ .serverCa | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-login" .name | quote }}
  namespace: {{ include "project.namespace" $ | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-login" .name | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ .controlAccount | quote }}
    namespace: {{ include "project.namespace" $ | quote }}
{{- end }}
