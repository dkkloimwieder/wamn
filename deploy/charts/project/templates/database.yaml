{{- if not .Values.recovery }}
{{- with .Values.database }}
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .name }}
  namespace: {{ include "project.namespace" $ | quote }}
spec:
  name: {{ .name }}
  owner: {{ required "database.owner is required" .owner }}
  cluster: {name: {{ .cluster }}}
  databaseReclaimPolicy: retain
  {{- with .extensions }}
  extensions: {{ . | toJson }}
  {{- end }}
{{- end }}
{{- end }}
