{{- range .Values.loginSecrets }}
{{- $old := lookup "v1" "Secret" $.Release.Namespace .name }}
{{- if $old }}
{{- if or (ne $old.type "kubernetes.io/basic-auth") (ne (get $old.data "username") (.username | b64enc)) (not (get $old.data "password")) }}
{{- fail (printf "Invalid basic-auth Secret %s" .name) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
type: kubernetes.io/basic-auth
data:
  username: {{ .username | b64enc | quote }}
  password: {{ if $old }}{{ $old.data.password | quote }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
{{- end }}
