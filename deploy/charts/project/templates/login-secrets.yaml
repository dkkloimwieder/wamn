{{- if not .Values.recovery }}
{{- with .Values.cluster }}
{{- range .roles }}
{{- $name := .passwordSecret.name }}
{{- $username := .name | b64enc }}
{{- $old := lookup "v1" "Secret" (include "project.namespace" $) $name }}
{{- if $old }}
{{- if or (ne $old.type "kubernetes.io/basic-auth") (ne (get $old.data "username") $username) (not (get $old.data "password")) }}
{{- fail (printf "Invalid basic-auth Secret %s" $name) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ | quote }}
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
data:
  username: {{ $username | quote }}
  password: {{ if $old }}{{ $old.data.password | quote }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
{{- end }}
{{- end }}
{{- end }}
