{{- with .Values.operations }}
{{- $operation := . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}-operations
  namespace: {{ $.Release.Namespace }}
data:
  cluster: {{ .cluster | quote }}
  environment.yaml: |-
    {{- required "A project operation needs the applied environment document." $.Values.environmentDocument | nindent 4 }}
---
# Each CDC process reads only its project's replication credential and database CA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .capture }}
  namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .capture }}
  namespace: {{ $.Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .capture | quote }}, {{ printf "%s-ca" .cluster | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .capture }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .capture }}
subjects:
  - kind: ServiceAccount
    name: {{ .capture }}
    namespace: {{ $.Release.Namespace }}
{{- $name := printf "%s-operation" $operation.name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
rules:
  - apiGroups: [""]
    # Helm release records remain in the org namespace until 9.3.
    resources: [secrets]
    verbs: [get, list, create, update, delete]
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    # Helm's watcher observes NetworkPolicies without a name selector.
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    resourceNames:
      {{- range (include "project.networkPolicyNames" $ | fromJson) }}
      - {{ . | quote }}
      {{- end }}
      {{- range .applicationReleases }}
      - {{ printf "%s-allow-public-integration-ports" . | quote }}
      {{- end }}
    verbs: [get, create, patch, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
  - apiGroups: [runtime.wasmcloud.dev]
    resources: [workloaddeployments]
    verbs: [get, list, watch, create, update, patch, delete]
  {{- if or $.Values.credentials $.Values.loginSecrets }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- with $.Values.credentials }}
      - {{ .name | quote }}
      {{- end }}
      {{- range $.Values.loginSecrets }}
      - {{ .name | quote }}
      {{- end }}
    verbs: [patch]
  {{- end }}
  - apiGroups: [postgresql.cnpg.io]
    resources: [databases]
    resourceNames: [{{ $operation.database | quote }}]
    verbs: [get, list, watch, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [publications]
    resourceNames: [{{ $operation.database | quote }}]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [{{ $name | quote }}, {{ $operation.capture | quote }}]
    verbs: [get, list, watch, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    resourceNames:
      - {{ $name | quote }}
      - {{ $operation.capture | quote }}
      {{- with $.Values.credentials }}
      - {{ .name | quote }}
      {{- end }}
    verbs: [get, list, watch, patch]
  {{- with $.Values.brokerCertificates }}
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    resourceNames:
    {{- range . }}
      - {{ .name | quote }}
    {{- end }}
    verbs: [get, list, watch, patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
