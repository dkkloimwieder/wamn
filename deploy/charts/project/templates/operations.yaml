{{- with .Values.operations }}
{{- $operation := . }}
{{- $namespace := include "project.namespace" $ | quote }}
{{- $name := printf "%s-operation" $operation.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .capture }}
  namespace: {{ $namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ required "Set operations.phaseConfigMap." $operation.phaseConfigMap }}
  namespace: {{ $namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ required "Set operations.loginSecrets." $operation.loginSecrets | toJson }}
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ required "Set operations.systemCa." $operation.systemCa | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $operation.phaseConfigMap | quote }}]
    verbs: [get, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [publications]
    resourceNames: [{{ required "Set operations.publication." $operation.publication | quote }}]
    verbs: [get]
  # Kubernetes assigns the Pod name and control assigns a new Job name on each run.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get]
  {{- with $operation.workloads }}
  # The Helm watcher lists by resource kind and the operator generates ReplicaSet names.
  - apiGroups: [runtime.wasmcloud.dev]
    resources: [workloaddeployments]
    verbs: [create, list, watch]
  - apiGroups: [runtime.wasmcloud.dev]
    resources: [workloaddeployments]
    resourceNames: {{ . | toJson }}
    verbs: [get, patch, delete]
  - apiGroups: [runtime.wasmcloud.dev]
    resources: [workloadreplicasets]
    verbs: [get]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [create, list, watch]
  - apiGroups: [""]
    resources: [services]
    resourceNames: {{ . | toJson }}
    verbs: [get, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: {{ $operation.appConfigMaps | toJson }}
    verbs: [get, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    resourceNames: {{ $operation.appNetworkPolicies | toJson }}
    verbs: [get, patch, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wamn-helm-releases
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
{{- end }}
