{{- with .Values.operations }}
{{- $operation := . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .capture }}
  namespace: {{ include "project.namespace" $ | quote }}
{{- $name := printf "%s-operation" $operation.name }}
{{- if not $operation.diffSecrets }}
{{- fail "Set operations.diffSecrets to the database Secret names for schema diff." }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ $operation.diffSecrets | toJson }}
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: {{ required "Set operations.diffConfigMaps to the public root ConfigMap names for schema diff." $operation.diffConfigMaps | toJson }}
    verbs: [get]
  {{- with $operation.diffWorkloads }}
  - apiGroups: [runtime.wasmcloud.dev]
    resources: [workloaddeployments]
    resourceNames: {{ . | toJson }}
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "project.namespace" $ | quote }}
{{- end }}
