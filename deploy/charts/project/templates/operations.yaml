{{- with .Values.operations }}
{{- $operation := . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}-operations
  namespace: {{ include "project.namespace" $ | quote }}
data:
  cluster: {{ .cluster | quote }}
  environment.yaml: |-
    {{- required "A project operation needs the applied environment document." $.Values.environmentDocument | nindent 4 }}
---
# Each CDC process reads only its project's replication credential and database CA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .capture }}
  namespace: {{ include "project.namespace" $ | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .capture }}
  namespace: {{ include "project.namespace" $ | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .captureSecret | quote }}, {{ printf "%s-ca" .cluster | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .capture }}
  namespace: {{ include "project.namespace" $ | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .capture }}
subjects:
  - kind: ServiceAccount
    name: {{ .capture }}
    namespace: {{ include "project.namespace" $ | quote }}
{{- $name := printf "%s-operation" $operation.name }}
{{- if not $operation.diffSecrets }}
{{- fail "Set operations.diffSecrets to the database Secret names for schema diff." }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ $operation.diffSecrets | toJson }}
    verbs: [get]
  {{- with $operation.diffWorkloads }}
  - apiGroups: [runtime.wasmcloud.dev]
    resources: [workloaddeployments]
    resourceNames: {{ . | toJson }}
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "project.namespace" $ | quote }}
{{- end }}
