{{- $database := .Values.database -}}
{{- $databaseSecret := required "Set database.credentials.name to the identity login Secret." $database.credentials.name -}}
{{- $databaseCa := required "Set database.server_ca.name to the database CA Secret." $database.server_ca.name -}}
{{- $tlsSecret := required "Set tlsSecret to the existing serving certificate Secret name." .Values.tlsSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ (default .Release.Name .Values.name) }}
  namespace: {{ (required "Set namespace." .Values.namespace) | quote }}
  labels:
    app.kubernetes.io/name: wamn-identity
    app.kubernetes.io/instance: {{ (default .Release.Name .Values.name) }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wamn-identity
      app.kubernetes.io/instance: {{ (default .Release.Name .Values.name) }}
  template:
    metadata:
      annotations:
        checksum/settings: {{ include (print $.Template.BasePath "/settings.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: wamn-identity
        app.kubernetes.io/instance: {{ (default .Release.Name .Values.name) }}
    spec:
      serviceAccountName: {{ (default .Release.Name .Values.name) }}
      automountServiceAccountToken: false
      containers:
        - name: identity
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve, --settings, /etc/wamn/identity/settings.json]
          {{- if .Values.authNats.url }}
          env:
            - name: WAMN_NATS_URL
              value: {{ .Values.authNats.url | quote }}
            - name: WAMN_NATS_TLS_CA
              value: /var/run/wamn-identity/nats/ca.crt
            - name: WAMN_NATS_TLS_CERT
              value: /var/run/wamn-identity/nats/tls.crt
            - name: WAMN_NATS_TLS_KEY
              value: /var/run/wamn-identity/nats/tls.key
            {{- end }}
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /readyz
              port: https
          volumeMounts:
            - {name: settings, mountPath: /etc/wamn/identity, readOnly: true}
            {{- if .Values.resendSecret }}
            - {name: resend, mountPath: /var/run/wamn-identity/resend, readOnly: true}
            {{- end }}
            - {name: database, mountPath: /etc/wamn/db, readOnly: true}
            {{- if eq .Values.oauthEncryption.provider "local" }}
            - name: oauth-key
              mountPath: /etc/wamn/oauth
              readOnly: true
            {{- end }}
            {{- if .Values.localMail }}
            - name: local-mail
              mountPath: {{ dir .Values.localMail | quote }}
            {{- end }}
            - name: serving-tls
              mountPath: /var/run/wamn-identity/tls
              readOnly: true
            {{- if .Values.operatorCaSecret }}
            - name: operator-ca
              mountPath: /var/run/wamn-identity/operator
              readOnly: true
            {{- end }}
            {{- if .Values.authNats.url }}
            - name: auth-nats
              mountPath: /var/run/wamn-identity/nats
              readOnly: true
            {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: settings
          configMap:
            name: {{ printf "%s-settings" (default .Release.Name .Values.name) | quote }}
        {{- if .Values.resendSecret }}
        - name: resend
          secret:
            secretName: {{ .Values.resendSecret | quote }}
            defaultMode: 0400
            items:
              - {key: api-key, path: api-key}
        {{- end }}
        - name: database
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ $databaseSecret | quote }}
                  items:
                    - {key: username, path: {{ printf "%s/username" $databaseSecret | quote }}}
                    - {key: password, path: {{ printf "%s/password" $databaseSecret | quote }}}
              - secret:
                  name: {{ $databaseCa | quote }}
                  items:
                    - {key: ca.crt, path: {{ printf "%s/ca.crt" $databaseSecret | quote }}}
        {{- if eq .Values.oauthEncryption.provider "local" }}
        - name: oauth-key
          secret:
            secretName: {{ required "Set oauthSecret to the OAuth wrapping-key Secret." .Values.oauthSecret | quote }}
            optional: false
            defaultMode: 0400
            items:
              - key: key
                path: key
        {{- end }}
        {{- if .Values.localMail }}
        - name: local-mail
          emptyDir: {}
        {{- end }}
        - name: serving-tls
          secret:
            secretName: {{ $tlsSecret | quote }}
            optional: false
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- if .Values.operatorCaSecret }}
        - name: operator-ca
          secret:
            secretName: {{ .Values.operatorCaSecret | quote }}
            optional: false
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if .Values.authNats.url }}
        - name: auth-nats
          secret:
            secretName: {{ required "Set authNats.tlsSecret when authNats.url is set." .Values.authNats.tlsSecret | quote }}
            optional: false
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
