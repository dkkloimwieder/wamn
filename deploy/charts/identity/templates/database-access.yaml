apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ (default .Release.Name .Values.name) }}
  namespace: {{ (required "Set namespace." .Values.namespace) | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ (default .Release.Name .Values.name) }}-database
  namespace: {{ (required "Set namespace." .Values.namespace) | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames:
      - {{ .Values.databaseSecret | quote }}
      - wamn-pg-ca
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ (default .Release.Name .Values.name) }}-database
  namespace: {{ (required "Set namespace." .Values.namespace) | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ (default .Release.Name .Values.name) }}-database
subjects:
  - kind: ServiceAccount
    name: {{ (default .Release.Name .Values.name) }}
    namespace: {{ (required "Set namespace." .Values.namespace) | quote }}
