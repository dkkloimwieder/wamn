namespace: ""

image:
  repository: wamn-identity
  tag: dev
  pullPolicy: IfNotPresent

# Set the configured HTTPS issuer and existing Secret names before installation.
# The Secrets must exist in the namespace named above.
issuer: ""

# Supply exactly the provider configuration and wrapping key used by OAuth hosts.
# Local: {provider: local}, plus oauthSecret containing the 32-byte key in key.
# GCP: {provider: gcp, project: <project>, region: <region>}, using pod identity.
oauthEncryption: {}
oauthSecret: ""
database:
  host: ""
  port: 5432
  database: wamn_system
  username: ""
  credentials: {namespace: "", name: ""}
  server_ca: {namespace: "", name: ""}
tlsSecret: ""

# Enable password endpoints with an existing Secret containing api-key.
# Supply the verified sender. Restart after changing the key or sender.
resendSecret: ""
resendFrom: ""
# Base URL of the web client. The invitation mail then carries one link to
# <inviteUrl>/invite#<code>, and the reset mail one link to
# <inviteUrl>/reset#<secret>. Empty keeps the code to paste into the terminal.
inviteUrl: ""

# Write local mail to this file instead of sending email. Empty disables local mail.
localMail: ""

# Dedicated client CA Secret with ca.crt. Empty disables client certificate authentication.
# Restart the service after a CA change to close existing TLS connections.
operatorCaSecret: ""

# The NATS that logouts, resets and replay revocations go to, so
# every host drops the login from its auth memory
# (docs/architecture/execution.md#auth-memory). tlsSecret holds ca.crt,
# tls.crt and tls.key of the client certificate of the user wamn-identity.
authNats:
  url: ""
  tlsSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
