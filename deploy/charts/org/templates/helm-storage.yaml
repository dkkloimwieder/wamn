{{- $org := required "Set org." .Values.org -}}
{{- $storage := printf "wamn-helm-%s" $org -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wamn-helm-releases
  namespace: {{ $storage | quote }}
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wamn-helm-releases
  namespace: {{ $storage | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wamn-helm-releases
subjects:
- kind: ServiceAccount
  name: {{ printf "wamn-operation-%s" $org | quote }}
  namespace: {{ $org | quote }}
