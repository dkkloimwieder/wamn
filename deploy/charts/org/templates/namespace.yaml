apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "Set org." .Values.org | quote }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    wamn.dev/org: "true"
    wamn.dev/org-name: {{ .Values.org | quote }}
    wamn.dev/org-workloads: "true"
    wamn.dev/identity-trust: "true"
