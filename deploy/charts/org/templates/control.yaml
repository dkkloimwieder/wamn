{{- if .Values.control.image }}
{{- $namespace := .Values.org }}
{{- $name := printf "c-%s" $namespace }}
{{- $account := printf "wamn-control-%s" $namespace }}
{{- $database := .Values.control.configuration.database }}
{{- $login := required "Set control.configuration.database.credentials.name." $database.credentials.name }}
{{- $migration := required "Set control.systemMigrationSecret." .Values.control.systemMigrationSecret }}
{{- $ca := required "Set control.configuration.database.server_ca.name." $database.server_ca.name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-configuration
  namespace: {{ $namespace | quote }}
data:
  config.json: {{ .Values.control.configuration | toJson | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account }}
  namespace: {{ $namespace | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $namespace | quote }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: wamn-control}
    spec:
      serviceAccountName: {{ $account }}
      {{- if .Values.control.registrySecret }}
      imagePullSecrets: [{name: {{ .Values.control.registrySecret }}}]
      {{- end }}
      containers:
        - name: control
          image: {{ .Values.control.image | quote }}
          args: [--config, /etc/wamn/control/config.json, platform]
          ports: [{name: http, containerPort: 80}]
          env:
            - {name: DOCKER_CONFIG, value: /credentials/registry}
            {{- if .Values.control.oauthSecret }}
            - {name: WAMN_OAUTH_KEY_FILE, value: /etc/wamn/oauth/key}
            {{- end }}
          volumeMounts:
            - {name: configuration, mountPath: /etc/wamn/control, readOnly: true}
            - {name: work, mountPath: /work}
            - {name: database, mountPath: /etc/wamn/db, readOnly: true}
            - {name: administration, mountPath: /etc/wamn/control-administration, readOnly: true}
            - {name: identity-ca, mountPath: /etc/identity-ca, readOnly: true}
            - {name: identity-control, mountPath: /etc/identity-control, readOnly: true}
            - {name: registry, mountPath: /credentials/registry, readOnly: true}
            {{- if .Values.control.oauthSecret }}
            - {name: oauth, mountPath: /etc/wamn/oauth, readOnly: true}
            {{- end }}
      volumes:
        - name: configuration
          configMap: {name: {{ $name }}-configuration}
        - {name: work, emptyDir: {}}
        - name: database
          projected:
            defaultMode: 0400
            sources:
              {{- range list $login $migration }}
              - secret:
                  name: {{ . | quote }}
                  items:
                    - {key: username, path: {{ printf "%s/username" . | quote }}}
                    - {key: password, path: {{ printf "%s/password" . | quote }}}
              {{- end }}
              - secret:
                  name: {{ $ca | quote }}
                  items:
                    {{- range list $login $migration }}
                    - {key: ca.crt, path: {{ printf "%s/ca.crt" . | quote }}}
                    {{- end }}
        - name: administration
          configMap: {name: wamn-control-administration-{{ $namespace }}}
        - {name: identity-ca, configMap: {name: identity-ca}}
        - name: identity-control
          secret: {secretName: {{ printf "control-%s" $namespace | quote }}}
        - name: registry
          {{- if .Values.control.registrySecret }}
          secret:
            secretName: {{ .Values.control.registrySecret }}
            items: [{key: .dockerconfigjson, path: config.json}]
          {{- else }}
          configMap: {name: wamn-registry-helper}
          {{- end }}
        {{- if .Values.control.oauthSecret }}
        - name: oauth
          secret: {secretName: {{ .Values.control.oauthSecret }}, defaultMode: 384} # 0600
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-http
  namespace: {{ $namespace | quote }}
spec:
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports: [{name: http, port: 80, targetPort: http}]
{{- end }}
