{{- if .Values.control.image }}
{{- $namespace := .Values.org }}
{{- $name := printf "c-%s" $namespace }}
{{- $account := printf "wamn-control-%s" $namespace }}
{{- $configuration := .Values.control.configuration }}
{{- $_ := required "Set control.configuration.identity_issuer to the platform identity issuer." $configuration.identity_issuer }}
{{- $_ := required "Set control.configuration.nats_url to the platform NATS address." $configuration.nats_url }}
{{- $settings := merge (dict "public_origin" (printf "https://%s" (include "org.controlHost" .))) $configuration | toJson }}
{{- $database := $configuration.database }}
{{- $login := required "Set control.configuration.database.credentials.name." $database.credentials.name }}
{{- $ca := required "Set control.configuration.database.server_ca.name." $database.server_ca.name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-settings
  namespace: {{ $namespace | quote }}
data:
  settings.json: {{ $settings | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account }}
  namespace: {{ $namespace | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $namespace | quote }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: wamn-control}
      annotations:
        checksum/settings: {{ $settings | sha256sum | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ $account }}
      {{- if .Values.control.registrySecret }}
      imagePullSecrets: [{name: {{ .Values.control.registrySecret }}}]
      {{- end }}
      containers:
        - name: control
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          image: {{ .Values.control.image | quote }}
          resources: {{- toYaml .Values.control.resources | nindent 12 }}
          args: [--settings, /etc/wamn/control/settings.json, platform]
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: DOCKER_CONFIG, value: /credentials/registry}
          volumeMounts:
            - {name: configuration, mountPath: /etc/wamn/control, readOnly: true}
            - {name: work, mountPath: /work}
            - {name: database, mountPath: /etc/wamn/db, readOnly: true}
            - {name: identity-ca, mountPath: /etc/identity-ca, readOnly: true}
            - {name: identity-token, mountPath: /var/run/secrets/wamn-identity, readOnly: true}
            - {name: registry, mountPath: /credentials/registry, readOnly: true}
      volumes:
        - name: configuration
          configMap: {name: {{ $name }}-settings}
        - {name: work, emptyDir: {}}
        - name: database
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ $login | quote }}
                  items:
                    - {key: username, path: {{ printf "%s/username" $login | quote }}}
                    - {key: password, path: {{ printf "%s/password" $login | quote }}}
              - configMap:
                  name: {{ $ca | quote }}
                  items:
                    - {key: ca.crt, path: {{ printf "%s/ca.crt" $login | quote }}}
        - {name: identity-ca, configMap: {name: identity-ca}}
        - name: identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: wamn-identity
                  path: token
        - name: registry
          {{- if .Values.control.registrySecret }}
          secret:
            secretName: {{ .Values.control.registrySecret }}
            items: [{key: .dockerconfigjson, path: config.json}]
          {{- else }}
          configMap: {name: wamn-registry-helper}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-http
  namespace: {{ $namespace | quote }}
spec:
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports: [{name: http, port: 80, targetPort: http}]
{{- end }}
