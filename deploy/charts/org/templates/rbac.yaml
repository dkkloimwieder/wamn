{{- $org := .Values.org -}}
{{- $control := printf "wamn-control-%s" $org -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-token-review" $control | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wamn-token-reviewer
subjects:
- kind: ServiceAccount
  name: {{ $control | quote }}
  namespace: {{ $org | quote }}
