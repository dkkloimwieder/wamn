{{- $org := .Values.org -}}
{{- $worker := printf "wamn-operation-%s" $org -}}
{{- $control := printf "wamn-control-%s" $org -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wamn-control-status
  namespace: {{ $org | quote }}
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch]
- apiGroups: [runtime.wasmcloud.dev]
  resources: [workloaddeployments]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wamn-control-status
  namespace: {{ $org | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wamn-control-status
subjects:
- kind: ServiceAccount
  name: {{ $control | quote }}
  namespace: {{ $org | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-token-review" $control | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wamn-token-reviewer
subjects:
- kind: ServiceAccount
  name: {{ $control | quote }}
  namespace: {{ $org | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $worker | quote }}
  namespace: {{ $org | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $worker | quote }}
  namespace: {{ $org | quote }}
rules:
- apiGroups: [""]
  # Namespace-wide Secret access is a stated exception inside the org (ruling D, 2026-11-19).
  # Project provisioning reads and applies payload Secrets. Cleanup deletes them by name.
  resources: [secrets]
  verbs: [get, create, patch, delete]
- apiGroups: [""]
  resources: [configmaps, services, serviceaccounts]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [pods, events, pods/log]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, replicasets, statefulsets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [roles, rolebindings]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [postgresql.cnpg.io]
  resources: [clusters, databases, publications, scheduledbackups]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [barmancloud.cnpg.io]
  resources: [objectstores]
  verbs: [get, create, update, patch, delete]
- apiGroups: [cert-manager.io]
  resources: [certificates, issuers]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [runtime.wasmcloud.dev]
  resources: [workloaddeployments]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [runtime.wasmcloud.dev]
  resources: [workloadreplicasets]
  verbs: [get]
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $worker | quote }}
  namespace: {{ $org | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $worker | quote }}
subjects:
- kind: ServiceAccount
  name: {{ $worker | quote }}
  namespace: {{ $org | quote }}
