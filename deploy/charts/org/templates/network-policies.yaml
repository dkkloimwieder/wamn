{{- $org := .Values.org -}}
{{- $control := dict "app.kubernetes.io/name" (printf "c-%s" $org) -}}
{{- $identity := dict "app.kubernetes.io/name" "wamn-identity" -}}
{{- $postgres := dict "matchExpressions" (list (dict "key" "cnpg.io/cluster" "operator" "Exists")) -}}
{{- $edge := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "hosts")) "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "wamn-edge")) -}}
{{- $platform := dict "matchLabels" (dict "kubernetes.io/metadata.name" "platform") -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: {{ $org | quote }}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: {{ $org | quote }}}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-edge-to-control, namespace: {{ $org | quote }}}
spec:
  podSelector:
    matchLabels: {{ $control | toJson }}
  policyTypes: [Ingress]
  ingress:
    - from: [{{ $edge | toJson }}]
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-control-to-identity, namespace: {{ $org | quote }}}
spec:
  podSelector:
    matchLabels: {{ $control | toJson }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {{ $platform | toJson }}
          podSelector:
            matchLabels: {{ $identity | toJson }}
      ports: [{port: 8443, protocol: TCP}]
{{- $database := .Values.control.configuration -}}
{{- with $database.database }}
{{- if .host }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-control-to-postgres, namespace: {{ $org | quote }}}
spec:
  podSelector:
    matchLabels: {{ $control | toJson }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {{ $platform | toJson }}
          podSelector:
            matchLabels: {cnpg.io/poolerName: {{ .host | splitList "." | first | quote }}}
      ports: [{port: {{ .port | int }}, protocol: TCP}]
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-control-to-nats, namespace: {{ $org | quote }}}
spec:
  podSelector:
    matchLabels: {{ $control | toJson }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {{ $platform | toJson }}
          podSelector:
            matchLabels: {app.kubernetes.io/name: nats, app.kubernetes.io/instance: wamn}
      ports: [{port: 4222, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-control-to-project-databases, namespace: {{ $org | quote }}}
spec:
  podSelector:
    matchLabels: {{ $control | toJson }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {wamn.dev/org-name: {{ $org | quote }}, wamn.dev/env: "true", wamn.dev/org-workloads: "true"}
          podSelector: {{ $postgres | toJson }}
      ports: [{port: 5432, protocol: TCP}]
{{- range $purpose, $destinations := dict "api-server" .Values.networkPolicy.apiServer "registry" .Values.networkPolicy.registry }}
{{- if $destinations }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-control-to-{{ $purpose }}, namespace: {{ $org | quote }}}
spec:
  podSelector:
    matchLabels: {{ $control | toJson }}
  policyTypes: [Egress]
  egress:
    {{- range $destinations }}
    - to: [{ipBlock: {cidr: {{ .cidr | quote }}}}]
      ports: [{port: {{ .port | int }}, protocol: TCP}]
    {{- end }}
{{- end }}
{{- end }}
