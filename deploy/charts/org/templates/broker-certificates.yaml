{{/* Lane 10.2 replaces certificate-mapped broker users with credentials. */}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wasmcloud-runtime-tls
  namespace: {{ .Values.org | quote }}
spec:
  secretName: wasmcloud-runtime-tls
  commonName: wasmcloud-runtime
  dnsNames:
    - wasmcloud-runtime
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    kind: ClusterIssuer
    name: wasmcloud-ca
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wasmcloud-data-tls
  namespace: {{ .Values.org | quote }}
spec:
  secretName: wasmcloud-data-tls
  commonName: wasmcloud-data
  dnsNames:
    - wasmcloud-data
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    kind: ClusterIssuer
    name: wasmcloud-ca
    group: cert-manager.io
