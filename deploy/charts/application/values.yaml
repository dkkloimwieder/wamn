namespace: ""

# Defaults for application workloads and the published platform image set.

platform:
  host:
    image: ""
  # The role component images of the platform image set: `<repository>@sha256:<hex>`.
  roles:
    ingress:
      image: ""
      maxConcurrency: 1
  workflow:
    image: ""
  ctl:
    image: ""
  identity:
    image: ""
  edge:
    image: ""

# Install values. `wamn_environment::environment::write::release_values` writes them.
release:
  # `sha256:<hex>` of the release manifest.
  manifestDigest: ""
# `org/project/env`.
environment: ""
# Public host derived by the release planner from the application's label.
routeHost: ""
# Exactly one application name to its package membership.
applications: {}
# Derived host to the declared client package ID.
webClients: {}
# Host to pinned web artifact digest.
webDigests: {}
# Organization whose platform UI configuration the edge serves.
org: ""
roles: []
# Application and integration sibling components pinned by OCI manifest digest.
components: []
# Platform interfaces and named NATS bindings for this workload.
hostInterfaces: []

# Shared environment host selected by application workloads.
hostGroup: ""
