{{- if .Values.routeHost }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ (default .Release.Name .Values.name) }}
  namespace: {{ include "application.namespace" . | quote }}
  {{- if .Values.applications }}
  annotations:
    {{- include "application.annotations" . | nindent 4 }}
  {{- end }}
data:
  release.json: {{ dict "host" .Values.routeHost "digest" .Values.release.manifestDigest "clients" .Values.webClients "webs" .Values.webDigests "platformUi" nil "org" .Values.org "project" .Values.project | toJson | quote }}
{{- end }}

{{- if .Values.routeHost }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ (default .Release.Name .Values.name) }}-route
  namespace: {{ include "application.namespace" . | quote }}
  labels:
    wamn.route: "true"
  {{- if .Values.applications }}
  annotations:
    {{- include "application.annotations" . | nindent 4 }}
  {{- end }}
data:
  route.json: {{ dict "host" .Values.routeHost "release" (default .Release.Name .Values.name) "api" (printf "http://%s-http.%s.svc.cluster.local" (default .Release.Name .Values.name) (include "application.namespace" .)) | toJson | quote }}
{{- end }}
