{{- range .Values.roles }}
{{- if eq .name "http" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ (default $.Release.Name $.Values.name) }}-http
  namespace: {{ include "application.namespace" $ | quote }}
  annotations:
    {{- include "application.annotations" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
{{- end }}
{{- end }}
