{{- $host := .Values.routeHost }}
{{- if $host }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ (default .Release.Name .Values.name) }}
  namespace: {{ include "app.namespace" . | quote }}
  {{- if .Values.apps }}
  annotations:
    {{- include "app.annotations" . | nindent 4 }}
  {{- end }}
data:
  release.json: {{ dict "host" $host "digest" .Values.release.manifestDigest "clients" .Values.webClients "webs" .Values.webDigests "platformUi" nil "org" .Values.org "project" .Values.project | toJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ (default .Release.Name .Values.name) }}-route
  namespace: {{ include "app.namespace" . | quote }}
  labels:
    wamn.route: "true"
  {{- if .Values.apps }}
  annotations:
    {{- include "app.annotations" . | nindent 4 }}
  {{- end }}
data:
  route.json: {{ dict "host" $host "release" (default .Release.Name .Values.name) "api" (printf "http://%s-http.%s.svc.cluster.local" (default .Release.Name .Values.name) (include "app.namespace" .)) | toJson | quote }}
{{- end }}
