{{- include "app.requireImageSet" . }}
{{- $config := required "route.config is required" .Values.route.config }}
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: {{ (default .Release.Name .Values.name) }}-http
  namespace: {{ include "app.namespace" . | quote }}
  annotations:
    {{- include "app.annotations" . | nindent 4 }}
    wamn.package-digest: {{ .Values.release.manifestDigest | quote }}
    wamn.release-revision: {{ .Release.Revision | quote }}
spec:
  replicas: 1
  template:
    annotations:
      {{- include "app.annotations" . | nindent 6 }}
      wamn.project_env_key: {{ required "route.config.wamn.project_env_key is required" (index $config "wamn.project_env_key") | quote }}
    spec:
      hostSelector:
        {{- include "app.hostSelector" . | nindent 8 }}
      environment: {{ include "app.namespace" . | quote }}
      kubernetes:
        service:
          name: {{ (default .Release.Name .Values.name) }}-http
      service:
        image: {{ .Values.platform.workflow.image | quote }}
        imagePullPolicy: Always
        maxRestarts: 3
      hostInterfaces:
        - namespace: wasi
          package: http
          version: "0.3.0"
          interfaces: [handler]
          config:
            host: {{ required "routeHost is required for the route workload" .Values.routeHost | quote }}
        - namespace: wamn
          package: ingress
          version: "0.1.0"
          interfaces: [routing]
        - namespace: wasi
          package: config
          version: "0.2.0-rc.1"
          interfaces: [store]
        - namespace: wamn
          package: operation
          version: "0.1.0"
          interfaces: [operation]
        - namespace: wamn
          package: workflow
          version: "0.1.0"
          interfaces: [run, node]
        - namespace: wasi
          package: clocks
          version: "0.3.0"
          interfaces: [monotonic-clock, system-clock]
        {{- with .Values.hostInterfaces }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      components:
        - name: ingress
          image: {{ required "platform.roles.ingress.image is required: stamp the platform image set" .Values.platform.roles.ingress.image | quote }}
          imagePullPolicy: Always
          poolSize: 0
          maxConcurrency: {{ .Values.platform.roles.ingress.maxConcurrency }}
          localResources:
            allowedIpNameLookups: []
            config:
              {{- toYaml $config | nindent 14 }}
        {{- range .Values.components }}
        - name: {{ .name | quote }}
          image: {{ .image | quote }}
          imagePullPolicy: Always
          localResources:
            {{- with .authority }}
            allowedHosts: [{{ . | quote }}]
            {{- end }}
            allowedIpNameLookups: []
            {{- with .connection }}
            config:
              wamn.integration: {{ . | quote }}
            {{- end }}
        {{- end }}
