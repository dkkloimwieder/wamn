{{- $name := include "app.httpService" . }}
{{- $namespace := include "app.namespace" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $namespace | quote }}
  annotations:
    {{- include "app.annotations" . | nindent 4 }}
    wamn.dev/web-release: {{ dict "digest" .Values.release.manifestDigest "project" (required "project is required" .Values.project) "app" (required "app is required" (keys .Values.apps | first)) "client" .Values.client | toJson | quote }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 9191
      protocol: TCP
