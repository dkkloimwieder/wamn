---
apiVersion: v1
kind: Service
metadata:
  name: {{ (default .Release.Name .Values.name) }}-http
  namespace: {{ include "app.namespace" . | quote }}
  annotations:
    {{- include "app.annotations" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 9191
      protocol: TCP
