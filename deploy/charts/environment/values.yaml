org: ""
env: ""
hostName: ""
serviceAccount: ""
image: ""
placement:
  replicas: 1
drainBoundSeconds: null
projects: {}
identityIssuer: ""
natsUrl: ""
insecureRegistry: false
registryTokenMetadata: false
ociCaPaths: []
oauthEncryption: null
environmentNats: null

global:
  tls:
    # The host sets the broker CA and credentials in its group arguments.
    enabled: false

runtime-operator:
  networkPolicy:
    enabled: false
  operator:
    enabled: false
  nats:
    enabled: false
  gateway:
    enabled: false
  runtime:
    hostGroups: []
    automountServiceAccountToken: false
    drainDelaySeconds: 5
    natsIgnoreDiscoveredServers: true
    probes:
      endpoint:
        enabled: true
        port: 8081
        startupFailureThreshold: 60
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 768Mi
    image:
      pull_policy: IfNotPresent
    serviceAccount:
      create: false
