{{- $certificates := .Values.brokerCertificates }}
{{- with .Values.brokerAdminCertificate }}
{{- $certificates = append $certificates . }}
{{- end }}
{{- range $certificates }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  namespace: {{ include "environment.namespace" $ | quote }}
spec: {{ .spec | toJson }}
{{- end }}
{{- with .Values.brokerAdminCertificate }}
{{- $secret := .spec.secretName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $secret }}
  namespace: {{ include "environment.namespace" $ | quote }}
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [{{ $secret }}]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $secret }}
  namespace: {{ include "environment.namespace" $ | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $secret }}
subjects:
- kind: ServiceAccount
  name: wamn-operation-{{ include "environment.namespace" $ }}
  namespace: {{ include "environment.namespace" $ | quote }}
{{- end }}
