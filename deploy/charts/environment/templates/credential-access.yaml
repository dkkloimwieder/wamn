{{- if .Values.projects }}
{{- $account := .Values.serviceAccount }}
{{- $secrets := list }}
{{- range .Values.projects }}
{{- $secrets = append $secrets .credentialSecret }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account }}
  namespace: {{ include "environment.namespace" $ | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $account }}
  namespace: {{ include "environment.namespace" $ | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ $secrets | toJson }}
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $account }}
  namespace: {{ include "environment.namespace" $ | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $account }}
subjects:
  - kind: ServiceAccount
    name: {{ $account }}
    namespace: {{ include "environment.namespace" $ | quote }}
{{- end }}
