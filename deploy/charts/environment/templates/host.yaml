{{- if .Values.projects }}
{{- $org := include "environment.namespace" . }}
{{- $env := required "Set env." .Values.env }}
{{- $name := required "Set hostName." .Values.hostName }}
{{- $nats := required "Set natsUrl." .Values.natsUrl }}
{{- $issuer := required "Set identityIssuer." .Values.identityIssuer }}
{{- $drain := required "Set drainBoundSeconds." .Values.drainBoundSeconds }}
{{- $settingsName := printf "%s-settings" $name }}
{{- $registry := ternary (dict "configMap" (dict "name" "wamn-registry-helper")) (dict "secret" (dict "secretName" "wamn-registry-pull" "items" (list (dict "key" ".dockerconfigjson" "path" "config.json")))) .Values.registryTokenMetadata }}
{{- $volumes := list (dict "name" "settings" "configMap" (dict "name" $settingsName)) (dict "name" "identity-ca" "configMap" (dict "name" "identity-ca")) (merge (dict "name" "registry") $registry) }}
{{- $mounts := list
    (dict "name" "settings" "mountPath" "/etc/wamn/host" "readOnly" true)
    (dict "name" "identity-ca" "mountPath" "/etc/identity-ca" "readOnly" true)
    (dict "name" "registry" "mountPath" "/etc/wamn/registry" "readOnly" true)
}}
{{- $token := dict "audience" "wamn-identity" "path" "token" "expirationSeconds" 3600 }}
{{- $volumes = append $volumes (dict "name" "identity-token" "projected" (dict "sources" (list (dict "serviceAccountToken" $token)))) }}
{{- $mounts = append $mounts (dict "name" "identity-token" "mountPath" "/var/run/secrets/wamn-identity" "readOnly" true) }}
{{- $apiSources := list
    (dict "serviceAccountToken" (dict "path" "token" "expirationSeconds" 3600))
    (dict "configMap" (dict "name" "kube-root-ca.crt" "items" (list (dict "key" "ca.crt" "path" "ca.crt"))))
    (dict "downwardAPI" (dict "items" (list (dict "fieldRef" (dict "fieldPath" "metadata.namespace") "path" "namespace"))))
}}
{{- $volumes = append $volumes (dict "name" "kube-api-access" "projected" (dict "sources" $apiSources)) }}
{{- $mounts = append $mounts (dict "name" "kube-api-access" "mountPath" "/var/run/secrets/kubernetes.io/serviceaccount" "readOnly" true) }}
{{- if eq (dig "provider" "" (.Values.oauthEncryption | default dict)) "local" }}
{{- $volumes = append $volumes (dict "name" "oauth-key" "secret" (dict "secretName" "wamn-oauth" "defaultMode" 384)) }}
{{- $mounts = append $mounts (dict "name" "oauth-key" "mountPath" "/etc/wamn/oauth" "readOnly" true) }}
{{- end }}
{{- $projects := dict }}
{{- $sources := list }}
{{- $streams := list }}
{{- range $project, $database := .Values.projects }}
{{- $_ := set $projects $project (pick $database "host" "port" "database" "logins") }}
{{- $streams = append $streams $database.stream }}
{{- $caItems := list }}
{{- range $login := $database.logins }}
{{- $items := list
    (dict "key" "tls.crt" "path" (printf "%s/tls.crt" $login))
    (dict "key" "tls.key" "path" (printf "%s/tls.key" $login))
}}
{{- $sources = append $sources (dict "secret" (dict "name" $login "items" $items)) }}
{{- $caItems = append $caItems (dict "key" "ca.crt" "path" (printf "%s/ca.crt" $login)) }}
{{- end }}
{{- $sources = append $sources (dict "secret" (dict "name" $database.serverCa "items" $caItems)) }}
{{- end }}
{{- $volumes = append $volumes (dict "name" "project-database" "projected" (dict "defaultMode" 256 "sources" $sources)) }}
{{- $mounts = append $mounts (dict "name" "project-database" "mountPath" "/etc/wamn/db" "readOnly" true) }}

{{- $broker := required "Set environmentNats." .Values.environmentNats }}
{{- $ca := "/etc/wamn/nats-ca/ca.crt" }}
{{- $volumes = append $volumes (dict "name" "nats-ca" "configMap" (dict "name" "nats-ca")) }}
{{- $mounts = append $mounts (dict "name" "nats-ca" "mountPath" (dir $ca) "readOnly" true) }}
{{- $brokerNames := dict "data" $broker.data "workflow-native" $broker.native "workflow" $broker.workflow.secret "ingress" $broker.ingress.secret }}
{{- range $kind, $secret := $brokerNames }}
{{- $volumes = append $volumes (dict "name" (printf "nats-%s" $kind) "secret" (dict "secretName" $secret "defaultMode" 256 "items" (list (dict "key" "user.creds" "path" "user.creds")))) }}
{{- $mounts = append $mounts (dict "name" (printf "nats-%s" $kind) "mountPath" (printf "/etc/wamn/nats/%s" $kind) "readOnly" true) }}
{{- end }}
{{- $natsConfig := dict "stream-allow" (join "," $streams) "subject-allow" $broker.subjects }}
{{- $bindings := dict }}
{{- range $binding := list "workflow" "ingress" }}
{{- $user := index $broker $binding }}
{{- $_ := set $bindings $binding (dict "config" (dict "servers" $nats "tls-ca" $ca "creds" (printf "/etc/wamn/nats/%s/user.creds" $binding) "inbox-prefix" $user.inbox)) }}
{{- end }}
{{- $plugins := list
    (dict "id" "wamn-postgres" "workloadConfig" "deny")
    (dict "id" "wasmcloud-nats" "workloadConfig" "deny" "config" $natsConfig "bindings" $bindings)
}}

{{- $settings := dict "org" $org "env" $env "identity_issuer" $issuer "nats_url" $nats "drain_bound_seconds" $drain "insecure_registry" .Values.insecureRegistry "oauth_encryption" .Values.oauthEncryption "projects" $projects | toJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $settingsName }}
  namespace: {{ $org | quote }}
data:
  settings.json: {{ $settings | quote }}

{{- /* Render the pinned upstream host resources with this group's generated values.
       The subchart's own render has no groups. Copy its values before applying ours. */}}
{{- $stock := index .Subcharts "runtime-operator" }}
{{- $stockValues := deepCopy $stock.Values }}
{{- $runtime := $stockValues.runtime }}
{{- $_ := set $runtime.image "registry" "" }}
{{- $image := required "Set image to the tagged, pinned host image." .Values.image }}
{{- $tag := regexFind ":[^/:@]+@sha256:[a-f0-9]{64}$" $image }}
{{- if not $tag }}
{{- fail "image must include a tag and a sha256 digest." }}
{{- end }}
{{- $placement := pick .Values.placement "replicas" "nodeSelector" "tolerations" "affinity" "topologySpreadConstraints" "resources" }}
{{- if $placement.resources }}
{{- $_ := set $placement "resources" (mergeOverwrite (deepCopy $runtime.resources) $placement.resources) }}
{{- end }}
{{- $group := merge (dict
    "name" $name
    "namespace" $org
    "image" (dict "repository" (trimSuffix $tag $image) "tag" (trimPrefix ":" $tag))
    "schedulerNatsUrl" $nats
    "dataNatsUrl" $nats
    "http" (dict "enabled" true "port" (include "environment.httpPort" . | int))
    "ociCaPaths" .Values.ociCaPaths
    "env" (list
        (dict "name" "DOCKER_CONFIG" "value" "/etc/wamn/registry")
        (dict "name" "POD_NAME" "valueFrom" (dict "fieldRef" (dict "fieldPath" "metadata.name")))
    )
    "plugins" $plugins
    "volumes" $volumes
    "volumeMounts" $mounts
    "extraArgs" (list "--settings=/etc/wamn/host/settings.json"
        "--data-nats-creds=/etc/wamn/nats/data/user.creds"
        (printf "--scheduler-nats-tls-ca=%s" $ca)
        (printf "--data-nats-tls-ca=%s" $ca)
    )
) $placement }}
{{- $_ := set $runtime "hostGroups" (list $group) }}
{{- $_ := set $runtime "terminationGracePeriodSeconds" $drain }}
{{- $_ := set $runtime.serviceAccount "name" (required "Set serviceAccount." .Values.serviceAccount) }}
{{- $_ := set $runtime "podAnnotations" (dict "checksum/host-settings" (sha256sum $settings)) }}
{{- if not .Values.registryTokenMetadata }}
{{- $_ := set $stockValues.global.image "pullSecrets" (list (dict "name" "wamn-registry-pull")) }}
{{- end }}
{{- $context := merge (dict) $stock }}
{{- $_ := set $context "Values" $stockValues }}
{{- $templates := printf "%s/charts/runtime-operator/templates/runtime" (trimSuffix "/templates" .Template.BasePath) }}
---
{{ include (printf "%s/host-plugin-config.yaml" $templates) $context }}
---
{{ include (printf "%s/deployment.yaml" $templates) $context }}
---
{{ include (printf "%s/service.yaml" $templates) $context }}
{{- end }}
