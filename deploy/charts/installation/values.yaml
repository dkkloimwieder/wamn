org: ''
registry: ''
registryEndpoint: null
global:
  natsAccountOrgs: []
runtime-operator:
  global:
    certificates:
      generate: false
  operator:
    allowSharedHosts: false
    extraArgs:
      - --nats-inbox-prefix=_INBOX_wasmcloud-operator
    watchNamespaces: []
    hostNamespaces: []
  nats:
    enabled: false
  gateway:
    enabled: false
  runtime:
    hostGroups: []
nats:
  fullnameOverride: wamn-nats
  namespaceOverride: platform
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
          storageClassName: standard
      memoryStore:
        enabled: true
        maxSize: 256MB
    merge:
      max_payload: 1048576
      accounts:
        includes:
          $tplYamlSpread: |
            {{- range .Values.global.natsAccountOrgs }}
            {{ . }}$include: ../nats-accounts-{{ . }}/accounts.conf
            {{- end }}
        PLATFORM:
          users:
          - user: wasmcloud-operator
            permissions:
              publish:
                allow: &schedulerPublish
                - runtime.host.>
                - runtime.operator.>
                - _INBOX_wasmcloud-operator.>
                - _INBOX_wasmcloud-runtime.>
              subscribe:
                allow: [runtime.host.>, runtime.operator.>, _INBOX_wasmcloud-operator.>]
          - user: wasmcloud-runtime
            permissions:
              publish:
                allow: *schedulerPublish
              subscribe:
                allow: [runtime.host.>, runtime.operator.>, _INBOX_wasmcloud-runtime.>]
          - user: wasmcloud-data
            permissions:
              publish:
                deny: ['>']
              subscribe:
                allow: [_INBOX_wasmcloud-data.>]
    nats:
      tls:
        enabled: true
        secretName: wasmcloud-nats-tls
        merge:
          verify_and_map: true
    patch:
    - op: remove
      path: /http_port
    - op: add
      path: /http
      value: 127.0.0.1:8222
  podTemplate:
    patch:
    - $tplYamlSpread: |
        {{- range .Values.global.natsAccountOrgs }}
        - op: add
          path: /spec/volumes/-
          value:
            name: nats-accounts-{{ . }}
            secret:
              secretName: wamn-nats-accounts-{{ . }}
              items:
              - key: accounts.conf
                path: accounts.conf
        {{- end }}
  container:
    patch:
    - $tplYamlSpread: |
        {{- range .Values.global.natsAccountOrgs }}
        - op: add
          path: /volumeMounts/-
          value:
            name: nats-accounts-{{ . }}
            mountPath: /etc/nats-accounts-{{ . }}
            readOnly: true
        {{- end }}
    startupProbe:
      httpGet: null
      exec:
        command:
        - wget
        - -q
        - -T
        - '2'
        - -O
        - /dev/null
        - http://127.0.0.1:8222/healthz
    readinessProbe:
      httpGet: null
      exec:
        command:
        - wget
        - -q
        - -T
        - '2'
        - -O
        - /dev/null
        - http://127.0.0.1:8222/healthz
    livenessProbe:
      httpGet: null
      exec:
        command:
        - wget
        - -q
        - -T
        - '2'
        - -O
        - /dev/null
        - http://127.0.0.1:8222/healthz
    image:
      tag: 2.12.15-alpine
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        memory: 1Gi
  natsBox:
    enabled: false
  tlsCA:
    enabled: true
    secretName: wasmcloud-nats-tls
    key: ca.crt
  reloader:
    merge:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
plugin-barman-cloud:
  fullnameOverride: barman-cloud
opentelemetry-collector:
  mode: deployment
  fullnameOverride: otel-collector
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
  command:
    name: otelcol-contrib
  config:
    exporters:
      debug: {}
    service:
      pipelines:
        traces:
          exporters:
          - debug
        metrics:
          exporters:
          - debug
        logs:
          exporters:
          - debug
identity:
  enabled: false
  name: identity
edge:
  enabled: false
  name: wamn-edge
  namespace: hosts
control:
  enabled: false
configuration: {}
platform:
  chart: ''
edgeDnsNames: []
postgres:
  image: ghcr.io/cloudnative-pg/postgresql:18.7
  backup:
    endpoint: null
    bucket: null
    secret: null
systemDatabase:
  roles: []
