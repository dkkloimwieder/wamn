apiVersion: v1
kind: ServiceAccount
metadata:
  name: wamn-edge
  namespace: hosts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wamn-edge
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wamn-edge
subjects:
  - kind: ServiceAccount
    name: wamn-edge
    namespace: hosts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wamn-edge
