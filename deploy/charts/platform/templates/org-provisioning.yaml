{{- $sql := .Values.systemSql | default dict -}}
{{- $base := "" -}}
{{- range .Values.edge.tlsDnsNames -}}
  {{- if and (not $base) (hasPrefix "*." .) -}}
    {{- $base = trimPrefix "*." . -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wamn-org-sql
  namespace: platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wamn-org-inputs
  namespace: platform
data:
  base: {{ required "Set a wildcard in edge.tlsDnsNames for org control routes." $base | quote }}
  controlImage: {{ $sql.image | default (printf "%s/wamn-control:%s" .Values.registry .Chart.Version) | quote }}
  provider: {{ .Values.provider | quote }}
  registry: {{ .Values.registry | quote }}
  postgresImage: {{ .Values.postgres.image | quote }}
  identityIssuer: {{ .Values.global.identityIssuer | quote }}
  natsUrl: {{ .Values.global.nats.schedulerUrl | quote }}
