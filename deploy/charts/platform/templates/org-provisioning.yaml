{{- $sql := .Values.systemSql | default dict -}}
{{- $system := include "wamn-platform.systemDatabase" . | fromJson -}}
{{- $poolers := include "wamn-platform.systemDatabasePoolers" . | fromJson -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wamn-org-sql
  namespace: platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wamn-org-inputs
  namespace: platform
data:
  base: {{ required "Set platformDomain for org control routes." .Values.platformDomain | quote }}
  controlImage: {{ $sql.image | default (printf "%s/wamn-control:%s" .Values.registry .Chart.Version) | quote }}
  appChart: {{ .Values.appChart | quote }}
  provider: {{ .Values.provider | quote }}
  registry: {{ .Values.registry | quote }}
  registryEgress: {{ .Values.registryEgress | toJson | quote }}
  postgresImage: {{ .Values.postgres.image | quote }}
  {{- range $family, $name := $poolers.names }}
  {{ $family }}DatabaseHost: {{ printf "%s.%s.svc.cluster.local" $name $system.namespace | quote }}
  {{- end }}
  identityIssuer: {{ .Values.global.identityIssuer | quote }}
  natsUrl: {{ .Values.global.nats.schedulerUrl | quote }}
  oauthEncryption: {{ .Values.identity.oauthEncryption | toJson | quote }}
