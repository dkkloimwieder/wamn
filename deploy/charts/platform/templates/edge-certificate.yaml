{{- if not .Values.edge.neg }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: wamn-edge
  namespace: hosts
spec:
{{- if .Values.edge.acme }}
  acme: {{ .Values.edge.acme | toJson }}
{{- else }}
  selfSigned: {}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wamn-edge-tls
  namespace: hosts
spec:
  secretName: wamn-edge-tls
  dnsNames:
  - {{ printf "*.%s" .Values.platformDomain | quote }}
  issuerRef:
    kind: Issuer
    name: wamn-edge
{{- end }}
