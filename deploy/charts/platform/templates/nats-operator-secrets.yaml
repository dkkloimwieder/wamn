{{- range list "wamn-nats-operator" "wamn-nats-runtime-operator" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ . }}
  namespace: platform
type: Opaque
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wamn-identity-nats
  namespace: platform
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [wamn-nats-operator, wamn-nats-runtime-operator]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wamn-identity-nats
  namespace: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wamn-identity-nats
subjects:
  - kind: ServiceAccount
    name: identity
    namespace: platform
