{{- if eq .Values.provider "kind" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wamn-edge
  namespace: hosts
  annotations:
    # Keep port 80 for local CLI calls and journeys.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  defaultBackend:
    service:
      name: wamn-edge
      port:
        name: http
{{- end }}
