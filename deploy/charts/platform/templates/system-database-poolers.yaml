{{- $system := include "wamn-platform.systemDatabase" . | fromJson -}}
{{- $poolers := include "wamn-platform.systemDatabasePoolers" . | fromJson -}}
{{- $values := .Values.postgres.pooler -}}
{{- $total := add $values.control.maxDbConnections $values.apply.maxDbConnections $values.applyTransaction.maxDbConnections -}}
{{- if gt $total 150 -}}
{{- fail "System Pooler caps must sum to at most 150 to leave headroom for direct connections." -}}
{{- end -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $poolers.authSecret }}
  namespace: {{ $system.namespace }}
spec:
  secretName: {{ $poolers.authSecret }}
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  commonName: {{ $poolers.authRole }}
  usages: [digital signature, client auth]
  issuerRef: {kind: Issuer, name: {{ $system.cluster }}}
{{- range $family, $name := $poolers.names }}
{{- $limits := index $values $family }}
{{- $tls := printf "%s-tls" $name }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $tls }}
  namespace: {{ $system.namespace }}
spec:
  secretName: {{ $tls }}
  dnsNames:
    - {{ $name }}
    - {{ $name }}.{{ $system.namespace }}
    - {{ $name }}.{{ $system.namespace }}.svc
    - {{ $name }}.{{ $system.namespace }}.svc.cluster.local
  usages: [digital signature, key encipherment, server auth]
  issuerRef: {kind: Issuer, name: {{ $system.cluster }}}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ $name }}
  namespace: {{ $system.namespace }}
spec:
  cluster: {name: {{ $system.cluster }}}
  type: rw
  instances: 1
  deploymentStrategy: {type: Recreate}
  template:
    spec:
      initContainers:
        - name: bootstrap-controller
          resources: {{- toYaml $values.resources | nindent 12 }}
      containers:
        - name: pgbouncer
          resources: {{- toYaml $values.resources | nindent 12 }}
  pgbouncer:
    poolMode: {{ ternary "session" "transaction" (eq $family "apply") }}
    authQuery: {{ printf "SELECT * FROM wamn_pooler.lookup_login($1, 'wamn_%s')" (ternary "control" "apply" (eq $family "control")) | quote }}
    authQuerySecret: {name: {{ $poolers.authSecret }}}
    clientTLSSecret: {name: {{ $tls }}}
    # This leaf and the database server leaf share the same issuer.
    serverCASecret: {name: {{ $tls }}}
    pg_hba:
      - hostssl {{ $system.name }} all all scram-sha-256
      - host all all all reject
    parameters:
      client_tls_sslmode: require
      server_tls_sslmode: verify-full
      max_client_conn: {{ $values.maxClientConnections | quote }}
      # The separate postgres authentication database also uses this pool size.
      default_pool_size: "20"
      max_db_connections: {{ $limits.maxDbConnections | quote }}
      # An idle backend for a different login still occupies a slot.
      server_idle_timeout: "5"
      {{- if ne $family "apply" }}
      max_prepared_statements: "200"
      {{- end }}
      query_wait_timeout: {{ $limits.queryWaitTimeout | quote }}
      # The first login for a role can also wait for a backend connection.
      client_login_timeout: {{ $limits.queryWaitTimeout | quote }}
{{- end }}
