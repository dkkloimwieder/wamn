{{- $system := include "wamn-platform.systemDatabase" . | fromJson }}
{{- $poolers := include "wamn-platform.systemDatabasePoolers" . | fromJson }}
{{- $namespace := $system.namespace }}
{{- $database := $system.name }}
{{- $roles := list
    (dict "name" "wamn_apply" "login" false "inherit" false)
    $system.migrationRole $system.identityRole }}
{{- $cluster := $system.cluster }}
{{- $caName := $system.ca }}
{{- $signingCaName := printf "%s-signing-ca" $cluster }}
{{- $serverTlsName := printf "%s-server-tls" $cluster }}
{{- $replicationTlsName := printf "%s-replication-tls" $cluster }}
{{- $ca := lookup "v1" "Secret" $namespace $signingCaName }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if $ca }}
{{- $crt = required "System database signing CA requires tls.crt" (index $ca.data "tls.crt") }}
{{- $key = required "System database signing CA requires tls.key" (index $ca.data "tls.key") }}
{{- else }}
{{- $new := genCA "WAMN system PostgreSQL" 3650 }}
{{- $crt = $new.Cert | b64enc }}
{{- $key = $new.Key | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caName }}
  namespace: {{ $namespace }}
data:
  ca.crt: {{ $crt | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $signingCaName }}
  namespace: {{ $namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | quote }}
  tls.key: {{ $key | quote }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $cluster }}
  namespace: {{ $namespace }}
spec:
  ca:
    secretName: {{ $signingCaName }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $serverTlsName }}
  namespace: {{ $namespace }}
spec:
  secretName: {{ $serverTlsName }}
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  dnsNames:
    {{- range list "rw" "ro" "r" }}
    {{- $service := printf "%s-%s" $cluster . }}
    - {{ $service }}
    - {{ $service }}.{{ $namespace }}
    - {{ $service }}.{{ $namespace }}.svc
    - {{ $service }}.{{ $namespace }}.svc.cluster.local
    {{- end }}
  ipAddresses:
    # The benchmark runner reaches the server through a local port forward.
    - 127.0.0.1
  usages: [digital signature, key encipherment, server auth]
  issuerRef:
    kind: Issuer
    name: {{ $cluster }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $replicationTlsName }}
  namespace: {{ $namespace }}
spec:
  secretName: {{ $replicationTlsName }}
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  commonName: streaming_replica
  usages: [digital signature, client auth]
  issuerRef:
    kind: Issuer
    name: {{ $cluster }}
---
{{- range list (dict "name" $system.identityTlsSecret "login" $system.identityRole.name)
                (dict "name" $system.adminTlsSecret "login" "postgres")
                (dict "name" $system.migrationTlsSecret "login" $system.migrationRole.name) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  namespace: {{ $namespace }}
spec:
  secretName: {{ .name }}
  commonName: {{ .login }}
  usages: [digital signature, client auth]
  issuerRef:
    kind: Issuer
    name: {{ $cluster }}
---
{{- end }}
{{- $groups := dict }}
{{- range $roles }}
{{- range .inRoles }}
{{- if ne . $database }}
{{- $_ := set $groups . (dict "name" . "login" false "inherit" false) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $system.cluster }}
  namespace: {{ $namespace }}
spec:
  instances: 1
  enablePDB: false
  imageName: {{ .Values.postgres.image | quote }}
  primaryUpdateStrategy: unsupervised
  # Disable the password and keep the instance manager's local peer access.
  enableSuperuserAccess: false
  certificates:
    serverCASecret: {{ $caName }}
    serverTLSSecret: {{ $serverTlsName }}
    clientCASecret: {{ $caName }}
    replicationTLSSecret: {{ $replicationTlsName }}
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
  storage:
    size: 10Gi
  managed:
    {{- $ordered := list }}
    {{- range keys $groups | sortAlpha }}
    {{- $ordered = append $ordered (index $groups .) }}
    {{- end }}
    roles: {{ concat $ordered $roles | toJson }}
  podSelectorRefs:
    {{- range $family, $name := $poolers.names }}
    - name: {{ $family }}-pooler
      selector:
        matchLabels: {cnpg.io/poolerName: {{ $name }}}
    {{- end }}
    - name: platform-sql-jobs
      selector:
        matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values: [wamn-system-sql, wamn-org-sql]
    - name: system-sql
      selector:
        matchLabels:
          app.kubernetes.io/component: wamn-system-sql
    - name: pg-minimum-client
      selector:
        matchLabels:
          app.kubernetes.io/component: pg-minimum-client
  postgresql:
    pg_hba:
      - hostssl {{ $database }} {{ $system.identityRole.name }} all cert
      {{- range $family := keys $poolers.names | sortAlpha }}
      - hostssl {{ $database }} +wamn_{{ $family }} ${podselector:{{ $family }}-pooler} scram-sha-256
      - hostssl postgres {{ $poolers.authRole }} ${podselector:{{ $family }}-pooler} cert
      {{- end }}
      - hostssl {{ $database }} postgres ${podselector:platform-sql-jobs} cert
      - hostssl postgres postgres ${podselector:system-sql} cert
      - hostssl {{ $database }} {{ $system.migrationRole.name }} ${podselector:system-sql} cert
      - hostssl wamn_pg_minimum postgres ${podselector:pg-minimum-client} cert
      - hostssl postgres,wamn_pg_minimum postgres 127.0.0.1/32 cert
      - host all +wamn_control,+wamn_apply,{{ $poolers.authRole }} all reject
      - host all postgres,{{ $system.migrationRole.name }} all reject
      - hostssl all all all scram-sha-256
    parameters:
      max_connections: {{ .Values.postgres.maxConnections | quote }}
      max_slot_wal_keep_size: "4GB"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: top
      auto_explain.log_min_duration: "-1"
  bootstrap:
    initdb:
      database: {{ $database }}
      owner: {{ $database }}
      postInitSQL:
        - {{ printf "ALTER ROLE %s NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS" (quote $database) | quote }}
