{{- $system := include "wamn-platform.systemDatabase" . | fromJson -}}
{{- $namespace := $system.namespace -}}
{{- $ca := $system.serverTls -}}
{{- $admin := $system.adminTlsSecret -}}
{{- $migration := $system.migrationTlsSecret -}}
{{- $name := printf "%s-system-sql" .Release.Name -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
data:
  database.json: {{ dict "host" $system.host "port" $system.port "database" $system.name "username" "postgres" "credentials" (dict "namespace" $namespace "name" $admin) "server_ca" (dict "namespace" $namespace "name" $ca) | toJson | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  activeDeadlineSeconds: 900
  podReplacementPolicy: Failed
  template:
    metadata:
      annotations:
        # The immutable pod template prevents a concurrent upgrade from reusing this Job.
        wamn.dev/platform-release-revision: {{ .Release.Revision | quote }}
      labels:
        app.kubernetes.io/component: wamn-system-sql
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: system-sql
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          image: {{ .Values.systemSql.image | default (printf "%s/wamn-control:%s" .Values.registry .Chart.Version) | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - provision-system
            - --database
            - /etc/wamn/system-sql/database.json
            - --platform-domain
            - {{ required "Set platformDomain to the platform email domain." .Values.platformDomain | quote }}
            - --max-projects
            - {{ .Values.global.maxProjects | quote }}
          volumeMounts:
            - {name: configuration, mountPath: /etc/wamn/system-sql, readOnly: true}
            - {name: database, mountPath: /etc/wamn/db, readOnly: true}
      volumes:
        - name: configuration
          configMap:
            name: {{ $name }}
        - name: database
          projected:
            defaultMode: 0400
            sources:
              {{- range list $admin $migration }}
              - secret:
                  name: {{ . | quote }}
                  items:
                    - {key: tls.crt, path: {{ printf "%s/tls.crt" . | quote }}}
                    - {key: tls.key, path: {{ printf "%s/tls.key" . | quote }}}
              - secret:
                  name: {{ $ca | quote }}
                  items:
                    - {key: ca.crt, path: {{ printf "%s/ca.crt" . | quote }}}
              {{- end }}
