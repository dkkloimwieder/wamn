apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: wamn-selfsigned
  namespace: platform
spec:
  selfSigned: {}
{{- $system := include "wamn-platform.systemDatabase" . | fromJson }}
{{- range list (dict "name" "wamn-identity-ca" "issuer" "wamn-identity-serving")
                (dict "name" $system.signingCa "issuer" $system.cluster) }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  namespace: platform
spec:
  isCA: true
  secretName: {{ .name }}
  commonName: {{ .name }}
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    kind: Issuer
    name: wamn-selfsigned
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .issuer }}
  namespace: platform
spec:
  ca:
    secretName: {{ .name }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wasmcloud-ca
  namespace: platform
spec:
  isCA: true
  secretName: wasmcloud-ca
  commonName: wasmcloud-ca
  duration: 43800h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: wamn-selfsigned
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: wasmcloud-ca
  namespace: platform
spec:
  ca:
    secretName: wasmcloud-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wasmcloud-nats-tls
  namespace: platform
spec:
  secretName: wasmcloud-nats-tls
  commonName: wamn-nats.platform.svc.cluster.local
  dnsNames:
    - wamn-nats.platform.svc.cluster.local
    - wamn-nats.platform.svc
    - wamn-nats.platform
    - wamn-nats
  ipAddresses:
    - 127.0.0.1
  usages:
    - server auth
    - digital signature
    - key encipherment
  issuerRef:
    kind: Issuer
    name: wasmcloud-ca
    group: cert-manager.io
