{{- $databaseSecret := "wamn-identity-db" -}}
{{- if and .Values.identity.resendFrom (not .Values.identity.resendSecret) -}}
{{- fail "Set resendSecret when resendFrom is enabled." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: platform
  labels:
    app.kubernetes.io/name: wamn-identity
    app.kubernetes.io/instance: identity
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wamn-identity
      app.kubernetes.io/instance: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wamn-identity
        app.kubernetes.io/instance: identity
    spec:
      serviceAccountName: identity
      automountServiceAccountToken: false
      containers:
        - name: identity
          image: {{ .Values.identity.image | default (printf "%s/wamn-identity:%s" .Values.registry .Chart.Version) | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --trusted-proxy-hops
            - {{ .Values.identity.trustedProxyHops | quote }}
            - --key-rotation-seconds
            - {{ .Values.identity.keyRotationSeconds | quote }}
            {{- if .Values.identity.localMail }}
            - --local-mail
            - {{ .Values.identity.localMail | quote }}
            {{- end }}
          env:
            - name: WAMN_OAUTH_ENCRYPTION
              value: {{ required "Set oauthEncryption to the same envelope configuration as OAuth hosts." .Values.identity.oauthEncryption | toJson | quote }}
            {{- if eq .Values.identity.oauthEncryption.provider "local" }}
            - name: WAMN_OAUTH_KEY_FILE
              value: /etc/wamn/oauth/key
            {{- end }}
            - name: WAMN_IDENTITY_BIND
              value: "0.0.0.0:8443"
            - name: WAMN_IDENTITY_ISSUER
              value: https://identity.platform.svc.cluster.local
            - name: WAMN_IDENTITY_DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ printf "%s-configuration" $databaseSecret | quote }}
                  key: connection.json
                  optional: false
            {{- if .Values.identity.resendSecret }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identity.resendSecret | quote }}
                  key: api-key
                  optional: false
            - name: RESEND_FROM
              value: {{ required "Set resendFrom when resendSecret is enabled." .Values.identity.resendFrom | quote }}
            {{- if .Values.identity.inviteUrl }}
            - name: WAMN_IDENTITY_INVITE_URL
              value: {{ .Values.identity.inviteUrl | quote }}
            {{- end }}
            {{- end }}
            - name: WAMN_IDENTITY_TLS_CERT
              value: /var/run/wamn-identity/tls/tls.crt
            - name: WAMN_IDENTITY_TLS_KEY
              value: /var/run/wamn-identity/tls/tls.key
            {{- if .Values.identity.authNats.url }}
            - name: WAMN_NATS_URL
              value: {{ .Values.identity.authNats.url | quote }}
            - name: WAMN_NATS_TLS_CA
              value: /var/run/wamn-identity/nats/ca.crt
            - name: WAMN_NATS_TLS_CERT
              value: /var/run/wamn-identity/nats/tls.crt
            - name: WAMN_NATS_TLS_KEY
              value: /var/run/wamn-identity/nats/tls.key
            {{- end }}
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - {name: database, mountPath: /etc/wamn/db, readOnly: true}
            {{- if eq .Values.identity.oauthEncryption.provider "local" }}
            - name: oauth-key
              mountPath: /etc/wamn/oauth
              readOnly: true
            {{- end }}
            {{- if .Values.identity.localMail }}
            - name: local-mail
              mountPath: {{ dir .Values.identity.localMail | quote }}
            {{- end }}
            - name: serving-tls
              mountPath: /var/run/wamn-identity/tls
              readOnly: true
            {{- if .Values.identity.authNats.url }}
            - name: auth-nats
              mountPath: /var/run/wamn-identity/nats
              readOnly: true
            {{- end }}
          resources:
{{ toYaml .Values.identity.resources | indent 12 }}
      volumes:
        - name: database
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ $databaseSecret | quote }}
                  items:
                    - {key: username, path: {{ printf "%s/username" $databaseSecret | quote }}}
                    - {key: password, path: {{ printf "%s/password" $databaseSecret | quote }}}
              - secret:
                  name: wamn-pg-ca
                  items:
                    - {key: ca.crt, path: {{ printf "%s/ca.crt" $databaseSecret | quote }}}
        {{- if eq .Values.identity.oauthEncryption.provider "local" }}
        - name: oauth-key
          secret:
            secretName: {{ required "Set oauthSecret to the OAuth wrapping-key Secret." .Values.identity.oauthSecret | quote }}
            optional: false
            defaultMode: 0400
            items:
              - key: key
                path: key
        {{- end }}
        {{- if .Values.identity.localMail }}
        - name: local-mail
          emptyDir: {}
        {{- end }}
        - name: serving-tls
          secret:
            secretName: identity-tls
            optional: false
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- if .Values.identity.authNats.url }}
        - name: auth-nats
          secret:
            secretName: {{ required "Set authNats.tlsSecret when authNats.url is set." .Values.identity.authNats.tlsSecret | quote }}
            optional: false
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
