apiVersion: v1
kind: Service
metadata:
  name: wamn-edge
  namespace: hosts
  labels:
    app.kubernetes.io/name: wamn-edge
    app.kubernetes.io/instance: wamn-edge
  {{- if .Values.edge.neg }}
  annotations:
    cloud.google.com/neg: '{"exposed_ports":{"80":{"name":"wamn-edge"}}}'
  {{- end }}
spec:
  type: {{ .Values.edge.service.type }}
  selector:
    app.kubernetes.io/name: wamn-edge
    app.kubernetes.io/instance: wamn-edge
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if .Values.edge.service.nodePort }}
      nodePort: {{ .Values.edge.service.nodePort }}
      {{- end }}
