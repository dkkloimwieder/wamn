provider: gcp
platformDomain: wamn.dev
registry: us-central1-docker.pkg.dev/wamn-dev/wamn
gcp:
  clusterName: wamn
  projectId: wamn-dev
  zone: us-central1-a
  buckets:
    web: wamn-dev-web
    otel: wamn-dev-otel
    state: wamn-dev-tofu-state
identity:
  oauthEncryption:
    provider: gcp
    project: wamn-dev
    region: us-central1
edge:
  neg: true
  trustedProxyHops: 2
opentelemetry-collector:
  useGOMEMLIMIT: true
  extraEnvs:
  - name: CLUSTER
    valueFrom: {configMapKeyRef: {name: wamn-collector-gcp, key: cluster}}
  - name: PROJECT
    valueFrom: {configMapKeyRef: {name: wamn-collector-gcp, key: project}}
  - name: REGION
    valueFrom: {configMapKeyRef: {name: wamn-collector-gcp, key: region}}
  - name: BUCKET
    valueFrom: {configMapKeyRef: {name: wamn-collector-gcp, key: bucket}}
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http: null
      jaeger: null
      prometheus: null
      zipkin: null
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 1500
        spike_limit_mib: 400
      resource:
        attributes:
        - key: wamn.cluster
          value: ${env:CLUSTER}
          action: upsert
      batch:
        timeout: 60s
        send_batch_size: 50000
        send_batch_max_size: 100000
    exporters:
      google_cloud_storage/traces:
        bucket:
          name: ${env:BUCKET}
          project_id: ${env:PROJECT}
          region: ${env:REGION}
          reuse_if_exists: true
          compression: gzip
          file_prefix: traces
          partition:
            prefix: traces
            format: year=%Y/month=%m/day=%d/hour=%H
        sending_queue:
          enabled: true
          storage: file_storage
          queue_size: 100
      google_cloud_storage/logs:
        bucket:
          name: ${env:BUCKET}
          project_id: ${env:PROJECT}
          region: ${env:REGION}
          reuse_if_exists: true
          compression: gzip
          file_prefix: logs
          partition:
            prefix: logs
            format: year=%Y/month=%m/day=%d/hour=%H
        sending_queue:
          enabled: true
          storage: file_storage
          queue_size: 100
      nop: {}
      debug: null
    extensions:
      file_storage:
        directory: /var/lib/otelcol/queue
        create_directory: true
    service:
      extensions:
      - file_storage
      - health_check
      pipelines:
        traces:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - resource
          - batch
          exporters:
          - google_cloud_storage/traces
        logs:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - resource
          - batch
          exporters:
          - google_cloud_storage/logs
        metrics:
          receivers:
          - otlp
          processors:
          - memory_limiter
          exporters:
          - nop
  rollout:
    strategy: Recreate
  serviceAccount:
    name: otel-collector
  securityContext:
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 500m
  extraVolumes:
  - name: queue
    persistentVolumeClaim:
      claimName: otel-collector-queue
  extraVolumeMounts:
  - name: queue
    mountPath: /var/lib/otelcol/queue
  extraManifests:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: otel-collector-queue
      namespace: platform
    spec:
      storageClassName: standard
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
