provider: kind
registry: localhost:5001
global:
  maxProjects: 32
traefik:
  enabled: true
identity:
  localMail: /var/run/wamn-identity/mail/outbox.jsonl
# journey-cluster mounts the run directory and activates these components when WAMN_RESULTS is set.
opentelemetry-collector:
  config:
    exporters:
      file/journey:
        path: /var/local/wamn-journey-results/otel.jsonl
        append: true
    processors:
      transform/journey:
        error_mode: propagate
        # Keep the value patterns aligned with tests/journeys/tests/common/failure.rs.
        # The journey harness also knows the observer password and tracks PEM blocks across lines.
        trace_statements:
          - keep_keys(resource.attributes, ["service.name", "service.instance.id", "k8s.namespace.name", "k8s.pod.name"])
          - keep_keys(scope.attributes, [])
          - keep_keys(span.attributes, ["http.request.method", "http.response.status_code", "rpc.system", "rpc.service", "rpc.method"])
          - replace_pattern(span.status.message, "(?s:\\A.*-----BEGIN.*\\z)|(?m:^[^\\r\\n]*(?:wamn_pat_|eyJ|(?i:bearer )|://[^[:space:]/?#\"'<>:@]+:[^[:space:]/?#\"'<>@]+@|(?i:[[:alnum:]_.-]*(?:password|passwd|token|secret|credential)[[:alnum:]_.-]*)[\\\\\"']*[[:blank:]]*[:=][[:blank:]]*(?:\"[[:blank:]]*[^[:space:]\"]|'[[:blank:]]*[^[:space:]']|\\\\\"[[:blank:]]*(?:[^[:space:]\"\\\\]|\\\\[^\"])|\\\\'[[:blank:]]*(?:[^[:space:]'\\\\]|\\\\[^'])|[^[:space:],;\\]}\\\\\"']|\\\\[^\"']))[^\\r\\n]*)", "[redacted]")
          - set(span.trace_state, "")
          - keep_keys(spanevent.attributes, [])
          - replace_pattern(spanevent.name, "(?s:\\A.*-----BEGIN.*\\z)|(?m:^[^\\r\\n]*(?:wamn_pat_|eyJ|(?i:bearer )|://[^[:space:]/?#\"'<>:@]+:[^[:space:]/?#\"'<>@]+@|(?i:[[:alnum:]_.-]*(?:password|passwd|token|secret|credential)[[:alnum:]_.-]*)[\\\\\"']*[[:blank:]]*[:=][[:blank:]]*(?:\"[[:blank:]]*[^[:space:]\"]|'[[:blank:]]*[^[:space:]']|\\\\\"[[:blank:]]*(?:[^[:space:]\"\\\\]|\\\\[^\"])|\\\\'[[:blank:]]*(?:[^[:space:]'\\\\]|\\\\[^'])|[^[:space:],;\\]}\\\\\"']|\\\\[^\"']))[^\\r\\n]*)", "[redacted]")
        log_statements:
          - keep_keys(resource.attributes, ["service.name", "service.instance.id", "k8s.namespace.name", "k8s.pod.name"])
          - keep_keys(scope.attributes, [])
          - keep_keys(log.attributes, [])
          - set(log.body, "[redacted]") where not IsString(log.body)
          - replace_pattern(log.body, "(?s:\\A.*-----BEGIN.*\\z)|(?m:^[^\\r\\n]*(?:wamn_pat_|eyJ|(?i:bearer )|://[^[:space:]/?#\"'<>:@]+:[^[:space:]/?#\"'<>@]+@|(?i:[[:alnum:]_.-]*(?:password|passwd|token|secret|credential)[[:alnum:]_.-]*)[\\\\\"']*[[:blank:]]*[:=][[:blank:]]*(?:\"[[:blank:]]*[^[:space:]\"]|'[[:blank:]]*[^[:space:]']|\\\\\"[[:blank:]]*(?:[^[:space:]\"\\\\]|\\\\[^\"])|\\\\'[[:blank:]]*(?:[^[:space:]'\\\\]|\\\\[^'])|[^[:space:],;\\]}\\\\\"']|\\\\[^\"']))[^\\r\\n]*)", "[redacted]")
