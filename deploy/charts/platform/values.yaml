provider: kind
platformDomain: wamn.localhost
registry: localhost:5001
registryEndpoint: null
registryEgress: []
global:
  # Each project can fill one 256 MiB stream on every broker pod.
  maxProjects: 32
  nats:
    schedulerUrl: nats://wamn-nats.platform.svc.cluster.local:4222
  identityIssuer: https://identity.platform.svc.cluster.local
runtime-operator:
  global:
    certificates:
      generate: false
    tls:
      enabled: false
  operator:
    allowSharedHosts: false
    extraArgs:
      - --nats-inbox-prefix=_INBOX_wasmcloud-operator
      - -nats-creds=/etc/wamn/nats/operator.creds
      - -nats-ca=/etc/wamn/nats/ca.crt
      - -host-namespaces=
    volumes:
      - name: nats-operator
        projected:
          sources:
            - secret:
                name: wamn-nats-runtime-operator
                items: [{key: operator.creds, path: operator.creds}]
            - secret:
                name: wasmcloud-nats-tls
                items: [{key: ca.crt, path: ca.crt}]
    volumeMounts:
      - {name: nats-operator, mountPath: /etc/wamn/nats, readOnly: true}
    watchNamespaces: []
    hostNamespaces: []
  nats:
    enabled: false
  gateway:
    enabled: false
  runtime:
    hostGroups: []
nats:
  fullnameOverride: wamn-nats
  namespaceOverride: platform
  config:
    jetstream:
      enabled: true
      fileStore:
        maxSize:
          $tplYaml: '{{ mul .Values.global.maxProjects 256 }}Mi'
        pvc:
          storageClassName: standard
          # Reserve 256 MiB per project plus 25% for metadata and filesystem overhead.
          computedSize:
            $tplYamlSpread: 'size: {{ mul .Values.global.maxProjects 320 }}Mi'
      memoryStore:
        enabled: true
        maxSize: 256MB
    resolver:
      enabled: true
      dir: /data/resolver
      merge: {type: full, allow_delete: true, interval: 2m}
      pvc:
        enabled: true
        size: 1Gi
    merge:
      max_payload: 1048576
      $include: ../wamn-nats-operator/operator.conf
    nats:
      tls:
        enabled: true
        secretName: wasmcloud-nats-tls
    patch:
    - op: remove
      path: /http_port
    - op: add
      path: /http
      value: 127.0.0.1:8222
  podTemplate:
    patch:
      - op: add
        path: /spec/volumes/-
        value: {name: operator-claims, secret: {secretName: wamn-nats-operator}}
      - op: add
        path: /spec/initContainers
        value:
          - name: wait-for-operator
            image: nats:2.12.15-alpine
            command: [sh, -ec]
            args:
              - |
                until grep -q '^operator: "ey' /etc/wamn-nats-operator/operator.conf 2>/dev/null; do sleep 1; done
            volumeMounts:
              - {name: operator-claims, mountPath: /etc/wamn-nats-operator, readOnly: true}
  container:
    patch:
      - op: add
        path: /volumeMounts/-
        value: {name: operator-claims, mountPath: /etc/wamn-nats-operator, readOnly: true}
      - op: remove
        path: /startupProbe/httpGet
      - op: remove
        path: /readinessProbe/httpGet
      - op: remove
        path: /livenessProbe/httpGet
    startupProbe:
      exec:
        command:
        - wget
        - -q
        - -T
        - '2'
        - -O
        - /dev/null
        - http://127.0.0.1:8222/healthz
    readinessProbe:
      exec:
        command:
        - wget
        - -q
        - -T
        - '2'
        - -O
        - /dev/null
        - http://127.0.0.1:8222/healthz
    livenessProbe:
      exec:
        command:
        - wget
        - -q
        - -T
        - '2'
        - -O
        - /dev/null
        - http://127.0.0.1:8222/healthz
    image:
      fullImageName: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        memory: 1Gi
  natsBox:
    enabled: false
  tlsCA:
    enabled: true
    secretName: wasmcloud-nats-tls
    key: ca.crt
  reloader:
    merge:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
plugin-barman-cloud:
  fullnameOverride: barman-cloud
opentelemetry-collector:
  mode: deployment
  fullnameOverride: otel-collector
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
  command:
    name: otelcol-contrib
  config:
    exporters:
      debug: {}
    service:
      pipelines:
        traces:
          exporters:
          - debug
        metrics:
          exporters:
          - debug
        logs:
          exporters:
          - debug
identity:
  image: ""
  oauthEncryption:
    provider: local
  oauthSecret: wamn-oauth
  resendSecret: ""
  resendFrom: ""
  inviteUrl: ""
  localMail: ""
  natsLimitsPerProject:
    connections: 64
    subscriptions: 1024
    payload: 1048576
  authNats:
    tlsSecret: wasmcloud-nats-tls
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
edge:
  image: ""
  trustedProxyHops: 1
  neg: false
  acme: null
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi
systemSql:
  image: ""
applicationChart: ""
postgres:
  image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  pooler:
    maxClientConnections: 4096
    control:
      maxUserConnections: 8
      maxDbConnections: 50
    apply:
      maxUserConnections: 16
      maxDbConnections: 100
      queryWaitTimeout: 900
