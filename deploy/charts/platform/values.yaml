provider: kind
platformDomain: wamn.localhost
registry: localhost:5001
registryEndpoint: null
registryEgress: []
# Populated by wamn platform deploy from the Kubernetes API Service and endpoints.
apiServer: []
global:
  # JetStream file store per broker pod, in bytes.
  natsFileStoreBytes: 17179869184
  nats:
    schedulerUrl: nats://wamn-nats.platform.svc.cluster.local:4222
  identityIssuer: https://identity.platform.svc.cluster.local
runtime-operator:
  networkPolicy:
    enabled: false
  global:
    certificates:
      generate: false
    tls:
      enabled: false
  operator:
    image:
      # The upstream template appends this value after a colon.
      tag: "2.12.3@sha256:f3e267e6585a6d99fd6df8b72396bf29f1436a3874aa93ef974aa1d6bc383211"
    allowSharedHosts: false
    extraArgs:
      - --nats-inbox-prefix=_INBOX_wasmcloud-operator
      - -nats-creds=/etc/wamn/nats/operator.creds
      - -nats-ca=/etc/wamn/nats/ca.crt
      - -host-namespaces=
    volumes:
      - name: nats-operator
        projected:
          sources:
            - secret:
                name: wamn-nats-runtime-operator
                items: [{key: operator.creds, path: operator.creds}]
            - secret:
                name: wasmcloud-nats-tls
                items: [{key: ca.crt, path: ca.crt}]
    volumeMounts:
      - {name: nats-operator, mountPath: /etc/wamn/nats, readOnly: true}
    watchNamespaces: []
    hostNamespaces: []
  nats:
    enabled: false
  gateway:
    enabled: false
  runtime:
    hostGroups: []
nats:
  fullnameOverride: wamn-nats
  namespaceOverride: platform
  config:
    jetstream:
      enabled: true
      fileStore:
        maxSize:
          $tplYaml: '{{ int64 .Values.global.natsFileStoreBytes | quote }}'
        pvc:
          storageClassName: standard
          # Leave 4 GiB above the default store for filesystem overhead.
          size: 20Gi
      memoryStore:
        enabled: true
        maxSize: 256MB
    resolver:
      enabled: true
      dir: /data/resolver
      merge: {type: full, allow_delete: true, interval: 2m}
      pvc:
        enabled: true
        size: 1Gi
    merge:
      max_payload: 1048576
      $include: ../wamn-nats-operator/operator.conf
    nats:
      tls:
        enabled: true
        secretName: wasmcloud-nats-tls
    patch:
    - op: remove
      path: /http_port
    - op: add
      path: /http
      value: 127.0.0.1:8222
  podTemplate:
    merge:
      spec:
        securityContext:
          # The reloader signals the NATS process with the same UID.
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
    patch:
      - op: add
        path: /spec/volumes/-
        value: {name: operator-claims, secret: {secretName: wamn-nats-operator}}
      - op: add
        path: /spec/initContainers
        value:
          - name: wait-for-operator
            image: nats:2.12.15-alpine@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6
            resources:
              requests: {cpu: 100m, memory: 256Mi}
              limits: {memory: 2Gi}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            command: [sh, -ec]
            args:
              - |
                until grep -q '^operator: "ey' /etc/wamn-nats-operator/operator.conf 2>/dev/null; do sleep 1; done
            volumeMounts:
              - {name: operator-claims, mountPath: /etc/wamn-nats-operator, readOnly: true}
  container:
    merge:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
    patch:
      - op: add
        path: /volumeMounts/-
        value: {name: operator-claims, mountPath: /etc/wamn-nats-operator, readOnly: true}
      - op: remove
        path: /startupProbe/httpGet
      - op: remove
        path: /readinessProbe/httpGet
      - op: remove
        path: /livenessProbe/httpGet
    startupProbe:
      exec:
        command:
        - wget
        - -q
        - -T
        - '2'
        - -O
        - /dev/null
        - http://127.0.0.1:8222/healthz
    readinessProbe:
      exec:
        command:
        - wget
        - -q
        - -T
        - '2'
        - -O
        - /dev/null
        - http://127.0.0.1:8222/healthz?js-server-only=true
    livenessProbe:
      exec:
        command:
        - wget
        - -q
        - -T
        - '2'
        - -O
        - /dev/null
        - http://127.0.0.1:8222/healthz?js-enabled-only=true
    image:
      fullImageName: nats:2.12.15-alpine@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        memory: 1Gi
  natsBox:
    enabled: false
  tlsCA:
    enabled: true
    secretName: wasmcloud-nats-tls
    key: ca.crt
  reloader:
    merge:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
plugin-barman-cloud:
  fullnameOverride: barman-cloud
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}
opentelemetry-collector:
  mode: deployment
  fullnameOverride: otel-collector
  # Keep the kind collector's environment unchanged when setting its memory limit.
  useGOMEMLIMIT: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
  command:
    name: otelcol-contrib
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  config:
    exporters:
      debug: {}
    service:
      pipelines:
        traces:
          exporters:
          - debug
        metrics:
          exporters:
          - debug
        logs:
          exporters:
          - debug
identity:
  image: ""
  passwordPort: 8444
  oauthEncryption:
    provider: local
  oauthSecret: wamn-oauth
  resendSecret: ""
  resendFrom: ""
  inviteUrl: ""
  localMail: ""
  authNats:
    tlsSecret: wasmcloud-nats-tls
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
edge:
  image: ""
  trustedProxyHops: 1
  neg: false
  acme: null
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi
systemSql:
  image: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}
appChart: ""
postgres:
  image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  pooler:
    maxClientConnections: 4096
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 2Gi}
    # Backend caps for wamn_system. Keep their sum within 150.
    control:
      maxDbConnections: 50
      queryWaitTimeout: 120
    apply:
      maxDbConnections: 80
      queryWaitTimeout: 900
    applyTransaction:
      maxDbConnections: 20
      queryWaitTimeout: 900
