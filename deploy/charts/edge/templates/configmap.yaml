{{- $identity := required "Set identity to the identity service HTTPS URL." .Values.identity -}}
{{- if not (hasPrefix "https://" $identity) -}}
{{- fail "identity must use HTTPS." -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ (default .Release.Name .Values.name) }}
  namespace: {{ (required "Set namespace." .Values.namespace) | quote }}
data:
  web.json: {{ dict "bucket" .Values.web.bucket "identity_issuer" $identity "trusted_proxy_hops" .Values.trustedProxyHops | toJson | quote }}
