{{- $namespace := default .Release.Namespace .Values.namespace }}
{{- $secret := lookup "v1" "Secret" $namespace "wamn-web-csrf" }}
apiVersion: v1
kind: Secret
metadata:
  name: wamn-web-csrf
  namespace: {{ $namespace }}
type: Opaque
data:
  key: {{ if $secret }}{{ required "wamn-web-csrf has no key" $secret.data.key | quote }}{{ else }}{{ randBytes 32 | quote }}{{ end }}
