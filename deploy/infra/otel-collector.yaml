# Cluster test collector template. platform::install renders the deployed
# receivers, processors, trace and log pipelines with file exporters at runtime.
# The retained Prometheus pipeline below serves the metric assertions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: wamn-system
data:
  config.yaml: |
    processors:
      batch/metrics:
        send_batch_size: 8192
        send_batch_max_size: 16384
        timeout: 200ms
    exporters:
      # [9.8] RECEIVED OTLP app metrics (wamn.*) re-exposed as Prometheus text on
      # :8889 for metricbench to scrape. add_metric_suffixes:false keeps the OTel
      # names verbatim (dots→underscores only: wamn.run.executions →
      # wamn_run_executions), so the gate greps stable names. This is distinct
      # from the collector's OWN telemetry on :8888 (otelcol_* under
      # service.telemetry.metrics).
      prometheus:
        endpoint: 0.0.0.0:8889
        add_metric_suffixes: false
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        # [9.8] host/service app metrics → Prometheus text on :8889.
        metrics:
          receivers: [otlp]
          processors: [batch/metrics]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: wamn-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: otel-collector
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - { name: CLUSTER, value: kind }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: metrics, containerPort: 8888 }
            # [9.8] received app metrics (wamn.*) as Prometheus text.
            - { name: app-metrics, containerPort: 8889 }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol }
            - { name: output, mountPath: /var/lib/otelcol }
          resources:
            # No CPU limit (CFS-quota tail artifact — the S2 lesson).
            requests: { cpu: "1", memory: "256Mi" }
            limits: { memory: "2Gi" }
        # The collector image has no shell. kubectl exec reads through this
        # existing probe image, with the output volume mounted read-only.
        - name: trace-reader
          command: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
          volumeMounts:
            - { name: output, mountPath: /var/lib/otelcol, readOnly: true }
          resources:
            requests: { cpu: 1m, memory: 8Mi }
            limits: { memory: 32Mi }
      volumes:
        - name: output
          emptyDir: {}
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: wamn-system
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: metrics, port: 8888, targetPort: 8888 }
    # [9.8] app-metrics scrape (wamn_*) for metricbench.
    - { name: app-metrics, port: 8889, targetPort: 8889 }
