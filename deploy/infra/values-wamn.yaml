# Helm values for the CLUSTER-SINGLETON runtime-operator release (S1).
#
# TWO KINDS OF RELEASE COME OUT OF THIS ONE CHART, and this file is only the
# first of them (rulings wamn-0h0g.13.49 + .13.50, bead wamn-0h0g.15.15):
#
#   1. THIS FILE — the operator and its five CRDs.
#      ONE PER CLUSTER, in `wamn-system`, installed once: the CRDs are
#      cluster-scoped, so every environment in the cluster shares this one
#      operator version. It carries NO host groups.
#   2. THE HOST TIER — the release chart (`deploy/platform/release`) with the
#      install values that environment apply renders, ONE HELM RELEASE PER
#      ENVIRONMENT. Host images and host groups are per-environment,
#      per-release values, which is why they live in the `platform/` tier
#      (long-lived, per release) and not in `infra/` (install-once).
#
# Install, in this order — the CRDs must exist before any host release or
# WorkloadDeployment is applied:
#   helm upgrade --install --create-namespace -n wamn-system wamn \
#     oci://ghcr.io/wasmcloud/charts/runtime-operator --version 2.11.0 \
#     -f deploy/infra/values-wamn.yaml
#   # then this environment's release chart through `wamn-ctl env apply`
#
# NATS AND CERTIFICATES (docs/plan/alignment.md R1-R3). The platform runs one
# NATS (deploy/infra/nats-jetstream.yaml), so this release renders none. The
# cert-manager CA (deploy/infra/nats-certificates.yaml) issues the four Secrets
# that the chart mounts, so the chart generates no certificate. Install the CA
# and the NATS before this release.
#
# [wamn-0h0g.15.15] CHART + OPERATOR VERSION PIN — PER CLUSTER (ruling
# wamn-0h0g.13.49). The chart version in the install command above is the whole
# pin, and the conformance guard parses it from there: the chart's
# release train sets `appVersion` equal to `version` on every release
# (Chart.yaml:15-26), and the operator image tag defaults to `.Chart.AppVersion`
# (templates/operator/deployment.yaml:39), so pinning the chart pins the
# operator and the two cannot drift. `operator.image.tag` is deliberately left
# unset: hard-coding it would add a second place to forget, and the published
# chart's own appVersion is by construction the tag that exists. Move this pin
# with an upstream release cutover, together with
# `workspace.dependencies.wash-runtime.tag` in the root `Cargo.toml`, and re-run
# the seam re-verification below when you do.
#
# [wamn-0h0g.15.54] CHART SEAM RECORD — reinspect on every upstream release change.
# Install commands pull the distributed OCI chart. The conformance gate also
# renders it and checks the resources below. Reinspect the source when the pin
# changes, then compare the distributed chart before deployment.
#
# The host groups use these native passthrough keys for registry credentials:
#   runtime.hostGroups[].volumes      -> {{- with .volumes }}
#   runtime.hostGroups[].volumeMounts -> {{- with .volumeMounts }}
# Both expressions remain in templates/runtime/deployment.yaml:178,457 at upstream
# bc5acfb8e15f7d6d199ca940354d82e590c2d5ff, the v2.11.0 release commit.
# The same source passes group env entries through unchanged (:266-268). Resource blocks
# replace the chart-wide block (:35) and remove defaultHeapMemory, coreInstances,
# guestMemoryMode and maxConcurrentStarts before rendering Kubernetes resources (:475).
# The four fields reach the host through their native WASH_* environment names (:239-265).
#
# Historical records at 735b5798 and 2eadd937 inspected the v2.8.0 chart through
# a fork checkout. The current dependency points directly to upstream and
# carries no fork patches. Release manifests arrive over OCI, not ConfigMaps.
#
# Reinspect the exact source:
#   git -C "$WASMCLOUD_CHECKOUT" grep -n 'with \.volumes\|with \.volumeMounts' bc5acfb8e15f7d6d199ca940354d82e590c2d5ff -- charts/runtime-operator/templates/runtime/deployment.yaml
# Distributed render and image identity requirements: wamn-0h0g.15.54.
# Live stage 4 tests remain separate and unexecuted by this source inspection.

# Deprecated HTTP gateway off, and never adopted: HTTP exposure rides
# operator-managed EndpointSlices on standard Services (chart
# values.yaml:238-243), and the gateway's NodePort would collide with workload
# Services on 30950.
gateway:
  enabled: false

nats:
  enabled: false

global:
  certificates:
    generate: false

operator:
  # The operator records INFO and higher. The platform collector receives request traces.
  extraArgs:
    - "-zap-log-level=info"
  # -- The environment namespaces whose WorkloadDeployments this operator
  # reconciles, one entry each. A non-empty list takes the operator off
  # cluster-wide RBAC entirely: the chart drops the ClusterRole and its binding
  # (templates/operator/clusterrole.yaml:1, clusterrolebinding.yaml:1) and binds
  # the same grants as per-namespace Roles instead (workload-crd-role.yaml,
  # workload-namespace-role.yaml, endpointslice-role.yaml), while the operator
  # scopes its workload informer cache to the same set
  # (runtime-operator/cmd/main.go:252-255). A WorkloadDeployment in any other
  # namespace is then not seen at all. Chart default is `[]` = watch every
  # namespace (chart values.yaml:182-183).
  watchNamespaces:
    - wamn-system
  # -- The namespaces where host Pods run, so the operator's Pod informer cache
  # and per-namespace Pod RBAC cover them (chart values.yaml:184-189, default
  # `[]`). The chart also derives this set from `runtime.hostGroups[].namespace`
  # (templates/_helpers.tpl:143-152) — but only from host groups in the SAME
  # release, and this release deliberately has none, so every environment
  # namespace has to be listed here by hand. That helper drops entries equal to
  # the release namespace, so the MVP entry below renders no `-host-namespaces`
  # flag today (host Pods in the operator's own namespace are covered by the
  # in-namespace Role at templates/operator/role.yaml); it is the line
  # environment #2 appends to.
  hostNamespaces:
    - wamn-system
  # -- THE WRONG-TARGET LOCK. This ships TRUE, and the chart's own values file
  # calls that default "permissive across tenants" (chart values.yaml:190-205):
  # with it on, a WorkloadDeployment in one namespace can schedule onto hosts in
  # another just by naming `spec.template.spec.environment`. False locks
  # scheduling to the workload's own namespace and refuses any other environment
  # with a `CrossEnvironmentSchedulingDenied` Warning Event plus a
  # `HostSelection=False` condition
  # (runtime-operator/internal/controller/runtime/workload_controller.go:144-164).
  allowSharedHosts: false

runtime:
  # -- No host groups in the operator release: the host tier is one Helm release
  # per environment (ruling wamn-0h0g.13.50), rendered by
  # deploy/platform/release. `runtime.image` — the
  # chart-wide host image, which is the carriage our `wamn-host` image actually
  # rides (chart values.yaml:380-384; `hostGroups[].image` is only an optional
  # per-group override, chart values.yaml:669-674) — moved there with them.
  #
  # Every chart template that touches host groups reaches them through `range`,
  # so an empty list renders nothing rather than failing.
  hostGroups: []
