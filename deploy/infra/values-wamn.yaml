# Helm values for the CLUSTER-SINGLETON runtime-operator release (S1).
#
# TWO KINDS OF RELEASE COME OUT OF THIS ONE CHART, and this file is only the
# first of them (rulings wamn-0h0g.13.49 + .13.50, bead wamn-0h0g.15.15):
#
#   1. THIS FILE — the operator, its five CRDs, and the control-plane NATS.
#      ONE PER CLUSTER, in `wamn-system`, installed once: the CRDs are
#      cluster-scoped, so every environment in the cluster shares this one
#      operator version. It carries NO host groups.
#   2. THE HOST TIER — `deploy/platform/values-host-default.yaml`, ONE HELM
#      RELEASE PER ENVIRONMENT. Host images and host groups are per-environment,
#      per-release values, which is why they live in the `platform/` tier
#      (long-lived, per release) and not in `infra/` (install-once).
#
# Install, in this order — the CRDs must exist before any host release or
# WorkloadDeployment is applied:
#   helm upgrade --install --create-namespace -n wamn-system wamn \
#     oci://ghcr.io/wasmcloud/charts/runtime-operator --version 2.8.0 \
#     -f deploy/infra/values-wamn.yaml
#   # then this environment's host tier — deploy/platform/values-host-default.yaml
#
# ############################################################################
# [wamn-ob2f] *** THIS RELEASE MINTS THE CLUSTER'S CA, AND IT EXPIRES AFTER
# *** 365 DAYS. NOTHING RENEWS IT. READ THIS BEFORE THAT DATE, NOT AFTER.
# ############################################################################
#
# MINT DATE: the first successful `helm install` of the command above into a
# namespace with no `wasmcloud-ca` Secret. EXPIRY: mint + 365 days.
#
#   *** wasmcloud-ca EXPIRES ON: ____________  ***
#   *** (unfilled: the kind cluster is frozen, so no cluster of record exists
#   ***  to read it off. Fill it in from the command below the first time this
#   ***  release is installed anywhere that has to stay up.)
#
# Read the real value, which is authoritative over the arithmetic:
#   kubectl -n wamn-system get secret wasmcloud-ca \
#     -o jsonpath='{.data.tls\.crt}' | base64 -d \
#     | openssl x509 -noout -subject -dates
#
# WHERE THE 365 COMES FROM, measured not repeated: the chart hard-codes it,
# `{{- $ca = genCA "wasmcloud CA" 365 }}` at
# charts/runtime-operator/templates/certificates.yaml:31, pinned rev 5c4ec4a3
# = chart 2.8.0. No value exposes it. The four leaves this release signs —
# `wasmcloud-operator-tls`, `wasmcloud-nats-tls`, `wasmcloud-runtime-tls`,
# `wasmcloud-data-tls` — are `genSignedCert … 365 $ca` at :44, :52, :60 and :81,
# so THEY EXPIRE ON THE SAME DAY as the CA that signed them, not staggered.
#
# WHY NOTHING RENEWS. The same template does lookup-then-reuse: once a Secret
# exists it re-emits the SAME cert and key bytes (`buildCustomCert` for the CA,
# the four `if $…Sec` branches for the leaves), specifically so an upgrade does
# not rotate under running pods. That is correct behaviour and it is also the
# whole problem — `helm upgrade` is a no-op on expiry, not a renewal. There is no
# other renewal path: cert-manager issues only the per-environment leaves
# (`platform/host-environment-certs.example.yaml`) and the registry's serving
# certificate (`platform/registry.yaml`), never this CA, and a cert-manager leaf
# renewed off an expired CA is just as dead.
#
# RECREATE PROCEDURE — DESTRUCTIVE, AND IT INVALIDATES EVERY CERTIFICATE ISSUED
# UNDER THE OLD CA. Deleting `wasmcloud-ca` ALONE IS WRONG: the four leaf
# lookups would still find their Secrets and re-emit the OLD leaves against a
# NEW CA, so every chain breaks and the failure looks like a config error rather
# than an expiry. Delete all five together:
#
#   kubectl -n wamn-system delete secret \
#     wasmcloud-ca wasmcloud-operator-tls wasmcloud-nats-tls \
#     wasmcloud-runtime-tls wasmcloud-data-tls
#   helm upgrade --install --create-namespace -n wamn-system wamn \
#     oci://ghcr.io/wasmcloud/charts/runtime-operator --version 2.8.0 \
#     -f deploy/infra/values-wamn.yaml          # re-mints all five
#   # every pod holding the old PEM in memory must be restarted. NATS first —
#   # nothing can register against a server still presenting the old cert:
#   kubectl -n wamn-system rollout restart deploy/nats
#   kubectl -n wamn-system rollout restart deploy/runtime-operator
#   kubectl -n wamn-system rollout restart deploy/hostgroup-default
#   kubectl -n wamn-system rollout restart deploy/executor deploy/registry
#   # redo the CA copy into `cert-manager` — the ClusterIssuer still holds a
#   # SNAPSHOT of the old CA (deploy/infra/wasmcloud-ca-issuer.yaml):
#   kubectl -n wamn-system get secret wasmcloud-ca -o json \
#     | jq 'del(.metadata) | .metadata = {name: "wasmcloud-ca", namespace: "cert-manager"}' \
#     | kubectl apply -f -
#   # force cert-manager to re-issue every leaf it signed off the old CA:
#   kubectl -n wamn-system delete secret wamn-registry-tls
#   # …and, per environment namespace beyond this one, its
#   #   wasmcloud-runtime-tls / wasmcloud-data-tls
# `nats` and `runtime-operator` are the pinned chart's own Deployment names
# (templates/nats/deployment.yaml, templates/operator/deployment.yaml); each
# host group renders as `hostgroup-<name>`, so an install with more than the
# `default` group has more to restart. The rule is "restart everything that
# mounts one of those Secrets", not this exact list. Nothing here has been run:
# the cluster is frozen.
#
# THE ALTERNATIVE, RECORDED AND REJECTED — DO NOT RE-PRESENT IT. cert-manager
# owning the ENTIRE PKI, the NATS and operator certificates included, renews
# automatically and is genuinely cleaner. It is rejected for now because it
# rewires the one configuration that currently works, and the frozen cluster
# means it could not be tested — it would land unproven until an RC on a fresh
# cluster. The ruling (2026-08-24) is STAY ADDITIVE: cert-manager keeps issuing
# only the per-environment leaves while the chart keeps its own CA, so nothing
# that currently converges gets rewired.
#
# TWO TRIPWIRES REOPEN THAT CHOICE, and either one alone is enough:
#   1. the CA approaching one year from its mint date — the date above;
#   2. any unfreeze that makes a live test possible, which removes the only
#      reason the cleaner option was rejected.
# Whoever trips one files the bead then. No bead stands open on it deliberately:
# an open item on a decision nobody can test is a reminder nobody can act on,
# and this comment is the reminder that does work.
#
# [wamn-0h0g.15.15] CHART + OPERATOR VERSION PIN — PER CLUSTER (ruling
# wamn-0h0g.13.49). The chart version in the install command above is the whole
# pin, and the conformance guard parses it from there: the chart's
# release train sets `appVersion` equal to `version` on every release
# (Chart.yaml:15-26), and the operator image tag defaults to `.Chart.AppVersion`
# (templates/operator/deployment.yaml:39), so pinning the chart pins the
# operator and the two cannot drift. `operator.image.tag` is deliberately left
# unset: hard-coding it would add a second place to forget, and the published
# chart's own appVersion is by construction the tag that exists. Move this pin
# ONLY on the fork-sync cadence, together with
# `workspace.dependencies.wash-runtime.rev` in the root `Cargo.toml`, and re-run
# the seam re-verification below when you do.
#
# [wamn-0h0g.15.54] CHART SEAM RECORD — re-verify on every fork sync.
# Nothing in this repository renders the chart; it is pulled from OCI at
# install time. These are human-verified facts about the chart carried at the
# fork rev the workspace pins, and
# tests/conformance/tests/chart_seam_governance.rs fails the moment that pin
# moves without this record moving with it.
#
# Seam: ruling 4's release-manifest-<digest> ConfigMap mounts through two
# optional per-host-group passthrough keys the chart renders but never declares
# in its own values.yaml hostGroups block —
#   runtime.hostGroups[].volumes      -> {{- with .volumes }}
#   runtime.hostGroups[].volumeMounts -> {{- with .volumeMounts }}
# in templates/runtime/deployment.yaml. Upstream e256a9f6 added them. The chart
# ships no values.schema.json, so a rename downgrades our keys to a SILENT
# no-op instead of an install error — which is why the record exists. Nothing
# sets either key yet; when ruling 4's mount lands it goes on the host-tier
# file's host group, since this release has no host group to hang it on.
#
# Pinned: vanilla rev 5c4ec4a3 = chart 2.8.0. Both expressions were re-verified
# present and unrenamed at this pin; this is a fresh check, not a carry-forward
# from the 2.7.0 record. The install above pulls chart 2.8.0, the chart the
# pinned runtime rev carries. Not yet exercised against a cluster — the kind
# cluster is frozen, so this install is proved at the RC's fresh-namespace
# convergence.
#
# Re-verify — the chart ships inside the pinned fork checkout:
#   git -C ../wasmcloud grep -n 'with \.volumes\|with \.volumeMounts' v2.8.0 -- charts/runtime-operator/templates/runtime/deployment.yaml

# Deprecated HTTP gateway off, and never adopted: HTTP exposure rides
# operator-managed EndpointSlices on standard Services (chart
# values.yaml:205-210), and the gateway's NodePort would collide with workload
# Services on 30950.
gateway:
  enabled: false

operator:
  # -- The environment namespaces whose WorkloadDeployments this operator
  # reconciles, one entry each. A non-empty list takes the operator off
  # cluster-wide RBAC entirely: the chart drops the ClusterRole and its binding
  # (templates/operator/clusterrole.yaml:1, clusterrolebinding.yaml:1) and binds
  # the same grants as per-namespace Roles instead (workload-crd-role.yaml,
  # workload-namespace-role.yaml, endpointslice-role.yaml), while the operator
  # scopes its workload informer cache to the same set
  # (runtime-operator/cmd/main.go:252-255). A WorkloadDeployment in any other
  # namespace is then not seen at all. Chart default is `[]` = watch every
  # namespace (chart values.yaml:157-158).
  watchNamespaces:
    - wamn-system
  # -- The namespaces where host Pods run, so the operator's Pod informer cache
  # and per-namespace Pod RBAC cover them (chart values.yaml:159-164, default
  # `[]`). The chart also derives this set from `runtime.hostGroups[].namespace`
  # (templates/_helpers.tpl:143-152) — but only from host groups in the SAME
  # release, and this release deliberately has none, so every environment
  # namespace has to be listed here by hand. That helper drops entries equal to
  # the release namespace, so the MVP entry below renders no `-host-namespaces`
  # flag today (host Pods in the operator's own namespace are covered by the
  # in-namespace Role at templates/operator/role.yaml); it is the line
  # environment #2 appends to.
  hostNamespaces:
    - wamn-system
  # -- THE WRONG-TARGET LOCK. This ships TRUE, and the chart's own values file
  # calls that default "permissive across tenants" (chart values.yaml:165-180):
  # with it on, a WorkloadDeployment in one namespace can schedule onto hosts in
  # another just by naming `spec.template.spec.environment`. False locks
  # scheduling to the workload's own namespace and refuses any other environment
  # with a `CrossEnvironmentSchedulingDenied` Warning Event plus a
  # `HostSelection=False` condition
  # (runtime-operator/internal/controller/runtime/workload_controller.go:144-158).
  allowSharedHosts: false

runtime:
  # -- No host groups in the operator release: the host tier is one Helm release
  # per environment (ruling wamn-0h0g.13.50), and its values live in
  # deploy/platform/values-host-<environment>.yaml. `runtime.image` — the
  # chart-wide host image, which is the carriage our `wamn-host` image actually
  # rides (chart values.yaml:285-289; `hostGroups[].image` is only an optional
  # per-group override, chart values.yaml:358-363) — moved there with them.
  #
  # Every chart template that touches host groups reaches them through `range`,
  # so an empty list renders nothing rather than failing.
  hostGroups: []
