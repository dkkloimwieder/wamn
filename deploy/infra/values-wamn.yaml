# Helm values for the runtime-operator chart with the wamn custom host image
# (S1). Install:
#   helm upgrade --install --create-namespace -n wamn-system wamn \
#     oci://ghcr.io/wasmcloud/charts/runtime-operator --version 2.5.2 \
#     -f deploy/infra/values-wamn.yaml
#
# [wamn-0h0g.15.54] CHART SEAM RECORD — re-verify on every fork sync.
# Nothing in this repository renders the chart; it is pulled from OCI at
# install time. These are human-verified facts about the chart carried at the
# fork rev the workspace pins, and
# tests/conformance/tests/chart_seam_governance.rs fails the moment that pin
# moves without this record moving with it.
#
# Seam: ruling 4's release-manifest-<digest> ConfigMap mounts through two
# optional per-host-group passthrough keys the chart renders but never declares
# in its own values.yaml hostGroups block —
#   runtime.hostGroups[].volumes      -> {{- with .volumes }}
#   runtime.hostGroups[].volumeMounts -> {{- with .volumeMounts }}
# in templates/runtime/deployment.yaml. Upstream e256a9f6 added them. The chart
# ships no values.schema.json, so a rename downgrades our keys to a SILENT
# no-op instead of an install error — which is why the record exists.
#
# Pinned: fork rev daba6029 = chart 2.7.0. Both expressions verified present
# and unrenamed there — the grep below was re-run at this pin (wamn-0h0g.15.20),
# not carried over from the previous record — and they held at 2.5.2, 2.6.0 and
# 2.6.1 before it; the 2.6.1 -> 2.7.0 bump rewrote both surrounding blocks and
# left them byte-identical.
# The install above pulls chart 2.5.2, two minors behind the pinned host. The
# seam holds at both; realigning the installed chart is a deploy-procedure
# change owned by wamn-0h0g.15.15 (which pins the chart and operator version
# and cannot be validated while the kind cluster is frozen), not a comment fix
# here. (The retired note here claimed rev 8b53285, two fork retargets stale.)
#
# Re-verify — the chart ships inside the pinned fork checkout:
#   grep -n 'with \.volumes\|with \.volumeMounts' ~/.cargo/git/checkouts/wasmcloud-*/daba602/charts/runtime-operator/templates/runtime/deployment.yaml

# Deprecated HTTP gateway off: its NodePort would collide with workload
# Services on 30950; routing is EndpointSlice-based now.
gateway:
  enabled: false

runtime:
  image:
    registry: ""              # bare local name, loaded via `kind load`
    repository: wamn-host
    tag: dev
    pull_policy: Never
  hostGroups:
    - name: default
      replicas: 3
      service:
        type: ClusterIP
      http:
        enabled: true
        port: 80
      # The default project's Postgres URL: the wamn:postgres plugin's from_env()
      # default pool connects as this non-superuser role for project-scoped
      # component SQL.
      env:
        - name: WAMN_PG_URL
          value: postgres://wamn_app:wamn_app@postgres.wamn-system.svc.cluster.local:5432/wamn
        # [l5i9.17] The data-plane (event-plane) NATS for the wamn:jetstream
        # plugin — the materializer Service workload's stream/doorbell path.
        # Absent, the plugin still links and returns connection-unavailable.
        - name: WAMN_EVT_NATS_URL
          value: nats://evt-nats.wamn-system.svc.cluster.local:4222
      # [4.1b] Allow plain-HTTP OCI pulls so the host can pull locally-built
      # component images from the in-cluster registry (deploy/platform/registry.yaml).
      extraArgs:
        - "--allow-insecure-registries"
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          # Roomy on purpose: the S1 density/cap-kill measurements must hit
          # wasmtime's 256 MiB per-component cap, not the K8s OOM killer.
          memory: "4Gi"
          cpu: "2"
