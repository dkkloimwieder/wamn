# The one NATS of the platform (docs/plan/alignment.md R1, R2, R4). The
# runtime operator, the host scheduler and data connections, the event
# streams and the auth memory all use it. It runs one server in namespace
# platform, so it has no cluster block. The event streams use one replica.
#
# TLS is required. Every client presents a certificate from the ClusterIssuer
# wasmcloud-ca (deploy/infra/nats-certificates.yaml), and the server maps its
# DNS name to a user (`verify_and_map`). Platform apply writes the users to the
# Secret wamn-nats-authorization (crates/control/environment/src/platform/broker.rs).
#
# The volume is pd-standard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wamn-nats-config
  namespace: platform
  labels:
    app.kubernetes.io/name: wamn-nats
    app.kubernetes.io/component: nats
data:
  nats.conf: |
    server_name: $POD_NAME
    listen: 0.0.0.0:4222
    # The config reloader signals this process (docs/plan/alignment.md R10).
    pid_file: /var/run/nats/nats.pid
    http: 127.0.0.1:8222
    # Preserve the default 1 MiB event ceiling explicitly for bounded native pulls.
    max_payload: 1048576
    tls {
      cert_file: /etc/nats-tls/tls.crt
      key_file: /etc/nats-tls/tls.key
      ca_file: /etc/nats-tls/ca.crt
      verify_and_map: true
    }
    # nats-server resolves an include relative to this file (finding wamn-lrf1).
    include ../nats-authorization/authorization.conf

    jetstream {
      store_dir: /data/jetstream
      # The event streams use file storage. The auth memory bucket wamn-auth
      # uses memory storage and starts empty after a restart.
      max_memory_store: 256MB
      max_file_store: 3GB
    }
---
# Headless service: the stable pod DNS name that the StatefulSet requires.
apiVersion: v1
kind: Service
metadata:
  name: wamn-nats-headless
  namespace: platform
  labels:
    app.kubernetes.io/name: wamn-nats
    app.kubernetes.io/component: nats
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: wamn-nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
---
# Client service: nats://wamn-nats.platform.svc.cluster.local:4222
apiVersion: v1
kind: Service
metadata:
  name: wamn-nats
  namespace: platform
  labels:
    app.kubernetes.io/name: wamn-nats
    app.kubernetes.io/component: nats
spec:
  selector:
    app.kubernetes.io/name: wamn-nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wamn-nats
  namespace: platform
  labels:
    app.kubernetes.io/name: wamn-nats
    app.kubernetes.io/component: nats
spec:
  serviceName: wamn-nats-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wamn-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wamn-nats
        app.kubernetes.io/component: nats
    spec:
      terminationGracePeriodSeconds: 45
      # The reloader signals the server process (docs/plan/alignment.md R10).
      shareProcessNamespace: true
      containers:
        # A changed authorization Secret reaches the server by a reload, never
        # a restart. The kubelet updates the mounted file, and the reloader
        # sends SIGHUP.
        - name: reloader
          image: natsio/nats-server-config-reloader:0.16.0
          imagePullPolicy: IfNotPresent
          command:
            - nats-server-config-reloader
            - -pid
            - /var/run/nats/nats.pid
            - -config
            - /etc/nats-config/nats.conf
            - -config
            - /etc/nats-authorization/authorization.conf
          volumeMounts:
            - name: config
              mountPath: /etc/nats-config
            - name: authorization
              mountPath: /etc/nats-authorization
              readOnly: true
            # The reloader watches every file that the configuration names,
            # the TLS files included, and exits when one is missing.
            - name: tls
              mountPath: /etc/nats-tls
              readOnly: true
            - name: pid
              mountPath: /var/run/nats
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { memory: "64Mi" }
        - name: nats
          image: nats:2.10-alpine
          imagePullPolicy: IfNotPresent
          command:
            - nats-server
            - --config
            - /etc/nats-config/nats.conf
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: client
              containerPort: 4222
          volumeMounts:
            - name: config
              mountPath: /etc/nats-config
            - name: authorization
              mountPath: /etc/nats-authorization
              readOnly: true
            - name: tls
              mountPath: /etc/nats-tls
              readOnly: true
            - name: pid
              mountPath: /var/run/nats
            - name: data
              mountPath: /data
          # Only local administration can read unauthenticated broker metadata.
          # The image supplies wget for the local health endpoint.
          readinessProbe:
            exec:
              command: [wget, -q, -T, "2", -O, /dev/null, "http://127.0.0.1:8222/healthz"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [wget, -q, -T, "2", -O, /dev/null, "http://127.0.0.1:8222/healthz"]
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 6
          resources:
            # No CPU limit on purpose (the S2 CFS lesson): a quota throttles the
            # raft/replication loops and inflates tail latency with scheduler
            # stalls rather than real work. Memory is capped.
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { memory: "1Gi" }
      volumes:
        - name: config
          configMap:
            name: wamn-nats-config
        - name: authorization
          secret:
            secretName: wamn-nats-authorization
            optional: false
            items:
              - key: authorization.conf
                path: authorization.conf
        - name: tls
          secret:
            secretName: wasmcloud-nats-tls
            optional: false
        - name: pid
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
