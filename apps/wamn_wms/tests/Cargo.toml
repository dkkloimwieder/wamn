[package]
name = "wamn-wms-tests"
description = "WMS application integration tests"
workspace = "../../.."
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[lib]
path = "lib.rs"

[dev-dependencies]
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "net", "time", "rt", "macros", "io-util", "signal"] }
uuid = { workspace = true }
wamn-catalog = { workspace = true }
wamn-execution-contract = { workspace = true }
wamn-gate-harness = { workspace = true }

tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
wamn-ctl = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-test-infrastructure = { workspace = true }

wamn-authoring-model = { workspace = true }

futures-util = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
async-nats = { workspace = true }
wamn-control-registry = { workspace = true }
wamn-cdc-reader = { workspace = true }
pg_walstream = { workspace = true }
object_store = { workspace = true }

[lints]
workspace = true
