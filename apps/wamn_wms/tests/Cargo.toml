[package]
name = "wamn-wms-tests"
description = "WMS application integration tests"
workspace = "../../.."
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[lib]
path = "lib.rs"

[dev-dependencies]
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
wamn-digest.workspace = true
wamn-identity-client = { workspace = true }
wamn-kubernetes = { workspace = true }
wamn-compiler = { workspace = true }
# The subject token of a registration entity, as the materializer consumer filters it.
wamn-event-wire = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["process", "net", "time", "rt", "macros", "io-util", "signal"] }
uuid = { workspace = true, features = ["v7"] }
wamn-catalog = { workspace = true }
wamn-integration-tests = { workspace = true }

wamn-package-control = { workspace = true, features = ["test-util"] }
wamn-release-control = { workspace = true }
wamn-environment = { workspace = true, features = ["test-util"] }
wamn-dev.workspace = true
# The publisher a run-plane reconciliation takes (Publisher).
wamn-platform-identity = { workspace = true }
wamn-identity-protocol = { workspace = true }
wamn-runtime = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-test-infrastructure = { workspace = true }
wamn-test-postgres = { workspace = true }


futures-util = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
async-nats = { workspace = true }
wamn-registry = { workspace = true }
wamn-cdc-reader = { workspace = true }
pg_walstream = { workspace = true }
object_store = { workspace = true }

[lints]
workspace = true

[[test]]
name = "wms_browser_kind"
path = "wms_browser_kind.rs"
