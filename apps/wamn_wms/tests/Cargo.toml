[package]
name = "wamn-wms-tests"
description = "WMS application integration tests"
workspace = "../../.."
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[lib]
path = "lib.rs"

[dev-dependencies]
wamn-schema-generator = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["process", "net", "time", "rt", "macros", "io-util", "signal"] }
uuid = { workspace = true }
wamn-catalog = { workspace = true }
wamn-execution-contract = { workspace = true }
wamn-gate-harness = { workspace = true }
wamn-integration-tests = { workspace = true }

tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
wamn-control = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-test-infrastructure = { workspace = true }
wamn-test-postgres = { workspace = true }

wamn-authoring-model = { workspace = true }

futures-util = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
async-nats = { workspace = true }
wamn-control-registry = { workspace = true }
wamn-cdc-reader = { workspace = true }
pg_walstream = { workspace = true }
object_store = { workspace = true }
# The operator example composes generated WMS screens through the shared driver.
async-trait = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
wamn-client = { workspace = true }
wamn-client-terminal = { workspace = true }
wamn-client-tui = { workspace = true }
wamn-generated-wms-tui = { workspace = true }

[lints]
workspace = true

[[example]]
name = "wms_move"
path = "../examples/wms_move.rs"
