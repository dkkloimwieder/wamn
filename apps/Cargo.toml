[workspace]
resolver = "2"
# Application guests live in their package homes. Shared guest code and test
# fixtures live under platform/.
#
# The `no_std` palette guests are NOT members: Cargo feature unification is
# additive-only, and members here reach `serde_json/std`, which collides with a
# guest-supplied `#[panic_handler]`. They live in the second workspace at
# `platform/no-std/`, whose manifest carries the full reason (wamn-0h0g.11.56).
members = [
    "client_acme_receiving/component",
    "wamn_receiving/component",
    "wamn_wms/component",
    "platform/ingress/http-route",
    "platform/events/materializer",
    "platform/events/registration",
    "platform/events/wire",
    "platform/execution/blob-put",
    "platform/execution/contract",
    "platform/execution/materializer",
    "platform/data/postgres-statements",
    "platform/data/postgres-sqlx",
    "client_acme_receiving/data",
    "wamn_receiving/data",
    "wamn_wms/data",
    "platform/fixtures/busyloop",
    "platform/fixtures/connection-http-standard",
    "platform/fixtures/sockprobe",
    "platform/fixtures/sqlx-command",
    "platform/fixtures/std-virtualization-probe",
]
exclude = [
    "platform/no-std",
    "wamn_receiving/ui",
    "wamn_receiving/generated/receiving-tui",
    "wamn_wms/generated/wms-tui",
    "client_acme_receiving/generated/client_acme_receiving-tui",
]

# Lint policy. IDENTICAL to the root workspace's by intent -- see the root
# `Cargo.toml` for the full rationale and the measured exemption counts. It is
# duplicated rather than inherited because Cargo has no way to share a lints
# table ACROSS workspaces, and this is a separate workspace by necessity, not by
# preference. Keep the two in step: if the root policy moves, move this too.
#
# M-LINT-OVERRIDE-EXPECT: override with `#[expect(..., reason = "...")]`, never
# `#[allow]`.
[workspace.lints.rust]
ambiguous_negative_literals = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
missing_debug_implementations = "warn"
redundant_imports = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
cargo_common_metadata = "allow"
too_many_lines = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
return_self_not_must_use = "allow"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Inherited by the four relocated guest-consumed rlibs, pinned exactly as the
# root workspace pins them so a crate resolves identically from either side.
chrono = { version = "0.4", default-features = false }
jmespath = "0.3"
schemars = "0.8"
sha2 = "0.11"
base64 = "0.22"
boon = "0.6"
serde = "1"
serde_json = "1"
sqlx-core = { version = "=0.9.0", default-features = false }
# 0.61, not 0.44, because a guest importing `wasmcloud:blobstore@0.1.0` cannot
# be built otherwise: the contract is entirely `async func` with `stream<u8>`,
# and 0.44's async ABI emits extern names like `[async method]container.name`
# that the pinned toolchain's `wasm-component-ld` rejects as not kebab-case.
# 0.61 componentizes on the same Rust toolchain (wamn-jpxo.2).
#
# The `async` feature is NOT enabled here. It is gated per-crate on the one
# guest that needs it, so the futures runtime it pulls cannot reach the sync
# guests through feature unification. `apps/platform/no-std` deliberately stays at
# 0.44: it is a separate workspace, so unification does not cross, and nothing
# there imports an async contract.
wit-bindgen = { version = "0.61", default-features = false, features = ["macros", "realloc"] }

# Guest-owned path identities are independent of the native workspace contract.
wamn-event-reg = { path = "platform/events/registration", version = "0.1.0" }
wamn-event-wire = { path = "platform/events/wire", version = "0.1.0" }
wamn-execution-contract = { path = "platform/execution/contract", version = "0.1.0" }
wamn-materializer = { path = "platform/events/materializer", version = "0.1.0" }
wamn-postgres-statements = { path = "platform/data/postgres-statements", version = "0.1.0" }
wamn-postgres-sqlx = { path = "platform/data/postgres-sqlx", version = "0.1.0" }
wamn-client-acme-receiving-data-access = { path = "client_acme_receiving/data", version = "0.1.0" }
wamn-receiving-data-access = { path = "wamn_receiving/data", version = "0.1.0" }
wamn-wms-data-access = { path = "wamn_wms/data", version = "0.1.0" }

[profile.release]
opt-level = "s"
strip = true
