[workspace]
resolver = "2"
members = [
    "guests/http-page",
    "guests/http-request",
    "guests/label-render",
    "guests/modbus",
    "guests/transform",
    "modbus_reader/component",
    "client_acme_receiving/component",
    "edge_device/component",
    "edge_samples/component",
    "platform_fixture/component",
    "rest_connector/component",
    "netsuite/component",
    "rest_consumer_fixture/component",
    "wamn_integration/component",
    "platform_fixture_overlay/component",
    "wamn_receiving/component",
    "wamn_wms/component",
    "guests/ingress",
    "guests/workflow-service",
    "guests/blob-put",
    "guests/jsonata-expression",
    "crates/guest",
    "crates/record-history",
    "fixtures/guests/connection-http-standard",
]

# Lint policy. IDENTICAL to the root workspace's by intent -- see the root
# `Cargo.toml` for the full rationale and the measured exemption counts. It is
# duplicated rather than inherited because Cargo has no way to share a lints
# table ACROSS workspaces, and this is a separate workspace by necessity, not by
# preference. Keep the two in step: if the root policy moves, move this too.
#
# M-LINT-OVERRIDE-EXPECT: override with `#[expect(..., reason = "...")]`, never
# `#[allow]`.
[workspace.lints.rust]
ambiguous_negative_literals = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
# 19 component crates, measured at 9f74f86c8, each have a crate-root expect.
# Owner ruling 2026-11-04 retains their generated FFI glue and unsafe items.
# Keep existing guest line numbers when adding lint attributes.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
missing_debug_implementations = "warn"
redundant_imports = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

# 0 at c6233b962. Spell shared ownership explicitly.
clone_on_ref_ptr = "deny"
# 0 at c6233b962. Move values instead of copying their last use.
redundant_clone = "deny"
# 0 at c6233b962. Reuse the destination allocation when replacing a clone.
assigning_clones = "deny"
# 0 at c6233b962. Make implicit copies explicit.
implicit_clone = "deny"
# 0 at c6233b962. Borrow instead of allocating an unnecessary owned value.
unnecessary_to_owned = "deny"
# 0 at c6233b962. Borrow parameters that do not need ownership.
needless_pass_by_value = "deny"
# 0 at c6233b962. Borrow large parameters instead of copying them.
large_types_passed_by_value = "deny"

must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
cargo_common_metadata = "allow"
too_many_lines = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
return_self_not_must_use = "allow"
# Rust 1.99 adds this assertion style rule; keep the root workspace policy.
assert_is_empty = "allow"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
wamn-digest = { path = "../crates/digest", version = "0.1.0" }
wamn-scalar = { path = "../crates/scalar", version = "0.1.0" }
wamn-number-pattern = { path = "../crates/number-pattern" }
wamn-jsonata = { path = "../crates/jsonata", version = "0.1.0" }
# Inherited by the four relocated guest-consumed rlibs, pinned exactly as the
# root workspace pins them so a crate resolves identically from either side.
url = "2"
chrono = { version = "0.4", default-features = false }
uuid = "1"
base64 = "0.22"
serde = "1"
serde_json = "1"
# Released bindings support the async blobstore contract on the pinned compiler.
wit-bindgen = { version = "0.62.0", default-features = false, features = ["async", "macros", "realloc"] }

# Guest-owned path identities are independent of the native workspace contract.
wamn-guest = { path = "crates/guest", version = "0.1.0" }
wamn-record-history = { path = "crates/record-history", version = "0.1.0" }

[profile.release]
opt-level = "s"
strip = true
