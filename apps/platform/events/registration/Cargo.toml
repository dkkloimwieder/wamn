[package]
name = "wamn-event-reg"
description = "Event trigger predicates shared by workflow authoring and the materializer."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The op set is the same Op the CDC envelope carries, so a registration's ops
# and the wire's `<op>` segment can never drift.
wamn-event-wire = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# Import/export-able (EventRegistration::from_json/to_json) and stored as jsonb.
serde_json = { workspace = true }
# Conditions use JMESPath (the codebase's one expression language) and compile
# at write time to reject bad syntax; the materializer owns evaluation.
jmespath = { workspace = true }

[lints]
workspace = true
