[package]
name = "sqlx-command"
version.workspace = true
edition.workspace = true
autobins = false
description = "Real-transport SQLx transaction acceptance fixture"
license = "Apache-2.0"

[dependencies]
sqlx = { version = "=0.9.0", default-features = false }
wamn-postgres-sqlx = { workspace = true }
wit-bindgen = { workspace = true, features = ["async"] }

[lib]
crate-type = ["cdylib"]
path = "src/main.rs"

[package.metadata.component]
package = "wamn:sqlx-command"

[lints]
workspace = true
