[package]
name = "wamn-execution-contract"
description = "Shared execution contract vocabulary: canonical JSON identity, the node contract, persisted port names, and the publish-gate test cases."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The canonical `timestamptz` spelling that a request is compared by.
chrono = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
# `canonical_json_bytes` sorts object keys itself, so `preserve_order` from any
# other crate of a build does not change it. Keep `float_roundtrip` so a parsed
# f64 re-serializes to the same bytes.
serde_json = { workspace = true, features = ["float_roundtrip"] }
schemars = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# The tests run with `preserve_order` on, as a build that joins jsonata-core
# does (wamn-g1jd), so they show that canonical bytes do not depend on it.
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }

[lints]
workspace = true
