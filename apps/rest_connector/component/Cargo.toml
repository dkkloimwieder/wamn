[package]
name = "rest-connector"
version.workspace = true
edition.workspace = true
description = "Scheduled integration with shared state"
license = "Apache-2.0"

[package.metadata.cargo-machete]
# The generated sync operation adapters call wamn-guest.
ignored = ["wamn-guest"]

[dependencies]
wamn-guest.workspace = true
chrono = { workspace = true, features = ["std"] }
serde_json.workspace = true
wit-bindgen = { workspace = true }

[dev-dependencies]
jsonata-core = { version = "=2.2.11", default-features = false }

[lib]
crate-type = ["cdylib"]
test = true
bench = false

[lints]
workspace = true
