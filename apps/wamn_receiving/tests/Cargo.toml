[package]
name = "wamn-receiving-tests"
description = "Receiving application integration tests"
workspace = "../../.."
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[lib]
path = "lib.rs"

[features]
# Compiles the kind cluster tests. A plain workspace run leaves them out.
cluster = []

[dev-dependencies]
base64 = { workspace = true }
serde_yaml = { workspace = true }
pg_walstream = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["std"] }
proptest = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "signal", "sync", "time", "rt", "macros"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
uuid = { workspace = true }
wamn-catalog = { workspace = true }
wamn-component-composer = { workspace = true }
wamn-execution-contract = { workspace = true }

async-nats = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wamn-control = { workspace = true }
wamn-control-provision = { workspace = true, features = ["ops"] }
wamn-control-registry = { workspace = true }
wamn-cdc-reader = { workspace = true }
wamn-event-wire = { workspace = true }
wamn-gate-harness = { workspace = true }
wamn-integration-tests = { workspace = true }
wamn-test-infrastructure = { workspace = true }
wamn-test-postgres = { workspace = true }
wamn-run-state = { workspace = true, features = ["test-util"] }
wamn-runtime = { workspace = true, features = ["test-util"] }
wamn-engine = { workspace = true }
wamn-schema-control = { workspace = true }
wash-runtime = { workspace = true, features = ["washlet"] }
wasmtime-wasi = { workspace = true }
async-trait = { workspace = true }
rustix = { workspace = true }
wamn-client = { workspace = true }
wamn-record-history = { workspace = true }
wamn-schema-generator = { workspace = true }
wamn-schema-introspection = { workspace = true }
wat = "=1.254.2"

wamn-authoring-model = { workspace = true }

[lints]
workspace = true
