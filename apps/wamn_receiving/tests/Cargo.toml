[package]
name = "wamn-receiving-tests"
description = "Receiving application integration tests"
workspace = "../../.."
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[lib]
path = "lib.rs"

[dev-dependencies]
wamn-package.workspace = true
wamn-component-policy.workspace = true
wamn-postgres.workspace = true
wamn-kubernetes.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
wamn-broker = { workspace = true }
base64 = { workspace = true }
serde_yaml = { workspace = true }
pg_walstream = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["std"] }
wamn-http-client = { workspace = true, features = ["tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "signal", "sync", "time", "rt", "macros"] }
uuid = { workspace = true, features = ["v7"] }

async-nats = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wamn-publish = { workspace = true, features = ["test-util"] }
wamn-identity = { workspace = true }
wamn-identity-protocol = { workspace = true }
wamn-provision = { workspace = true, features = ["ops"] }
wamn-registry = { workspace = true }
wamn-cdc-reader = { workspace = true }
wamn-event = { workspace = true }
wamn-test-application = { workspace = true }
wamn-test-infrastructure = { workspace = true }
wamn-run-state = { workspace = true }
wamn-engine = { workspace = true }
wash-runtime = { workspace = true, features = ["washlet"] }
wasmtime-wasi = { workspace = true }
async-trait = { workspace = true }
rustix = { workspace = true }
wamn-record-history = { workspace = true }
wamn-codegen = { workspace = true }
wamn-schema-introspection = { workspace = true }
wat = "=1.254.2"

hyper = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
