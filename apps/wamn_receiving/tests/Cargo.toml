[package]
name = "wamn-receiving-tests"
description = "Receiving application integration tests"
workspace = "../../.."
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[lib]
path = "lib.rs"

[dev-dependencies]
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
wamn-broker = { workspace = true }
wamn-digest.workspace = true
base64 = { workspace = true }
serde_yaml = { workspace = true }
pg_walstream = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["std"] }
proptest = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "signal", "sync", "time", "rt", "macros"] }
uuid = { workspace = true, features = ["v7"] }
wamn-catalog = { workspace = true }
wamn-component-composer = { workspace = true }

async-nats = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wamn-package-control = { workspace = true, features = ["test-util"] }
wamn-release-control = { workspace = true }
wamn-environment = { workspace = true, features = ["test-util"] }
wamn-dev.workspace = true
wamn-platform-identity = { workspace = true }
wamn-identity-protocol = { workspace = true }
wamn-control-provision = { workspace = true, features = ["ops"] }
wamn-registry = { workspace = true }
wamn-cdc-reader = { workspace = true }
wamn-event-wire = { workspace = true }
wamn-integration-tests = { workspace = true }
wamn-test-infrastructure = { workspace = true }
wamn-test-postgres = { workspace = true }
wamn-run-state = { workspace = true, features = ["test-util"] }
wamn-runtime = { workspace = true, features = ["test-util"] }
wamn-workflow = { workspace = true }
wamn-engine = { workspace = true }
wash-runtime = { workspace = true, features = ["washlet"] }
wasmtime-wasi = { workspace = true }
async-trait = { workspace = true }
rustix = { workspace = true }
wamn-record-history = { workspace = true }
wamn-compiler = { workspace = true }
wamn-schema-introspection = { workspace = true }
wat = "=1.254.2"


[lints]
workspace = true
