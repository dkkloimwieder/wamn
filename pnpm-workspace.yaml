# The web packages. One `pnpm install` here installs all of them against one
# lock file. The platform UI consumes wfe through workspace dependencies.
# WMS still reaches the Solid 1 shell through path aliases.
packages:
  - web/runtime
  - web/components
  - web/ui
  - web/shell
  - apps/wamn_wms/web
  - apps/wamn_receiving/web
  - apps/platform_ui
  # wfe, the UI library, is the git submodule web/wfe pinned by commit (docs/plan/platform-ui-app.md D3).
  - web/wfe/packages/components
  - web/wfe/packages/form
  - web/wfe/packages/generator

# Install scripts that pnpm may run. esbuild places its platform binary for
# Vite, and @parcel/watcher builds the file watcher of the Tailwind CLI.
allowBuilds:
  esbuild: true
  "@parcel/watcher": true

minimumReleaseAgeExclude:
  - solid-js@1.9.16 || 2.0.0-rc.16
  - "@solidjs/babel-plugin@2.0.0-rc.16"
  - "@solidjs/compiler-darwin-arm64@2.0.0-rc.16"
  - "@solidjs/compiler-darwin-x64@2.0.0-rc.16"
  - "@solidjs/compiler-linux-arm64-gnu@2.0.0-rc.16"
  - "@solidjs/compiler-linux-x64-gnu@2.0.0-rc.16"
  - "@solidjs/compiler-wasm32-wasi@2.0.0-rc.16"
  - "@solidjs/compiler-win32-x64-msvc@2.0.0-rc.16"
  - "@solidjs/compiler@2.0.0-rc.16"
  - "@solidjs/signals@2.0.0-rc.16"
  - "@solidjs/web@2.0.0-rc.16"

# Keep the Solid 2 runtime and compiler aligned with wfe v0.0.5.
overrides:
  "@solidjs/compiler": 2.0.0-rc.16
  "@solidjs/babel-plugin": 2.0.0-rc.16
  "@solidjs/signals": 2.0.0-rc.16
