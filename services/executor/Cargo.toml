[package]
name = "wamn-executor"
description = "Production serving executor for queued wiring deliveries."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wamn_executor"

[[bin]]
name = "wamn-run-worker"
path = "src/main.rs"

[dependencies]
wamn-execution-host = { workspace = true }
wamn-run-state = { workspace = true }
wamn-runtime = { workspace = true, features = ["wasm_component_model_implements"] }
wash-runtime = { workspace = true, features = ["washlet", "wasm_component_model_implements"] }
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = { workspace = true }
