[package]
name = "wamn-executor"
description = "Production serving executor for queued flow runs."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wamn_executor"

[[bin]]
name = "wamn-run-worker"
path = "src/main.rs"

[dependencies]
wamn-execution-host = { workspace = true }
wamn-runtime = { workspace = true }
wash-runtime = { workspace = true, features = ["washlet"] }
anyhow = { workspace = true }
async-nats = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
futures-util = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = { workspace = true }
wamn-scheduler = { workspace = true }
