[package]
name = "wamn-edge"
description = "One application and one device loop on a small box, with the engine and no cloud plugin."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wamn-edge"
path = "src/main.rs"
test = false

[dependencies]
sqlx = { workspace = true, features = ["sqlite"] }
wamn-digest.workspace = true
# The edge links the engine without cloud capability plugins.
wamn-engine = { workspace = true }
# Local routes verify sessions over a key file, and grants name role slugs.
wamn-identity-protocol = { workspace = true }
# The admitted component facts and the serving manifest of a release bundle.
wamn-catalog = { workspace = true }
# The `sha256:<hex>` spelling of bundle, file and schema digests.
# The project of the box's environment coordinate (R1).
wamn-registry = { workspace = true }
# The plain host, its ingress and the route guest's workload. No `oci`.
wash-runtime = { workspace = true, features = ["wasi-config"] }
# The host owns the serial port: raw mode and the baud rate, with no serial
# crate.
rustix = { workspace = true, features = ["termios"] }
# The configuration file.
toml = { workspace = true }
# The sample key and the capture time of each frame.
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["clock"] }
# The forward: HTTPS with rustls over aws-lc-rs, which wash-runtime links
# already, so the forward adds no crate (spec 4.8).
bytes = { workspace = true }
http-body-util = { workspace = true }
# The status socket serves HTTP/1 over a Unix socket.
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-rustls = { workspace = true, features = ["http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
rustls = { workspace = true, features = ["aws-lc-rs", "std"] }
rustls-native-certs = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
# RUST_LOG selects the log level.
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
wamn-test-postgres = { workspace = true }
wamn-compiler.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
# The release tests build a manifest from parts, which wamn-catalog conditions
# behind `test-util`. Never add this feature to the normal dependency.
wamn-catalog = { workspace = true, features = ["test-util"] }
# The tests write the edge_device bundle with the dev loop's bundle writer.
wamn-dev = { workspace = true }
# The route test signs sessions with a file key.
base64 = { workspace = true }
ring = { workspace = true }
# The device test writes frames into a pseudo-terminal pair.
rustix = { workspace = true, features = ["pty"] }
# The forward test serves an HTTPS platform with its own certificate authority.
rcgen = { workspace = true }
tokio-rustls = { workspace = true }

[lints]
workspace = true
