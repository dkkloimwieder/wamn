[package]
name = "wamn-edge"
description = "One application and one device loop on a small box, with the engine and no cloud plugin."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The edge links the engine and run-state and never wamn-runtime. The
# dependency test measures what these bring.
wamn-engine = { workspace = true }
wamn-run-state = { workspace = true }
# The one writer of the run-state file on the box.
wamn-run-state-sqlite = { workspace = true }
# Local routes verify sessions over a key file, and grants name role slugs.
wamn-session = { workspace = true }
# The admitted component facts and the serving manifest of a release bundle.
wamn-catalog = { workspace = true }
# The plain host, its ingress and the route guest's workload. No `oci`.
wash-runtime = { workspace = true }
# The samples table lives in the run-state file beside the intents.
rusqlite = { workspace = true }
# The host owns the serial port: raw mode and the baud rate, with no serial
# crate.
rustix = { workspace = true, features = ["termios"] }
# The configuration file.
toml = { workspace = true }
# The sample key and the capture time of each frame.
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["clock"] }
# The forward: HTTPS with rustls over aws-lc-rs, which wash-runtime links
# already, so the forward adds no crate (spec 4.8).
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true, features = ["http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
rustls = { workspace = true, features = ["aws-lc-rs", "std"] }
rustls-native-certs = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
# RUST_LOG selects the log level.
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
# The release tests build a manifest from parts, which wamn-catalog gates
# behind `test-util`. Never add this feature to the normal dependency.
wamn-catalog = { workspace = true, features = ["test-util"] }
# The route test encodes its guest from WAT and signs sessions with a file key.
wat = "=1.254.0"
base64 = { workspace = true }
ring = { workspace = true }
# The device test writes frames into a pseudo-terminal pair.
rustix = { workspace = true, features = ["pty"] }
# The forward test serves an HTTPS platform with its own certificate authority.
rcgen = { workspace = true }
tokio-rustls = { workspace = true }

[lints]
workspace = true
