[package]
name = "wamn-cdc-reader"
description = "PostgreSQL change capture with acknowledgement before slot advance."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-events.workspace = true
url.workspace = true
tempfile.workspace = true
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
wamn-broker = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time", "io-util", "net", "rt-multi-thread", "macros", "signal", "sync"] }
wamn-catalog.workspace = true
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
async-nats = { workspace = true, features = ["jetstream"] }
# The NATS TLS client needs one process provider; a build that links ring and
# aws-lc-rs cannot choose one itself.
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
bytes = { workspace = true }
chrono = { workspace = true, features = ["std"] }
futures-util = { workspace = true }
# The CDC replication session uses the pinned fork for typed keepalive events.
pg_walstream = { workspace = true }
# The event records and source identity contract.
wamn-event-wire = { workspace = true }
# Canonical PostgreSQL identifier quoting shared with the guest-safe planners.
postgres-protocol = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
wamn-registry.workspace = true
wamn-control-provision = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }
