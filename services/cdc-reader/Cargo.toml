[package]
name = "wamn-cdc-reader"
description = "wamn CDC event reader service (l5i9.10, D19 v3 §4, SR9): walsender session → envelopes → the EVT_ JetStream stream, LSN advances only on ack — its own deployment artifact, no runtime linked (E7 owns its placement/ownership model)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["time", "io-util", "net", "rt-multi-thread", "macros", "signal", "sync"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
async-nats = { workspace = true, features = ["jetstream"] }
bytes = { workspace = true }
chrono = { workspace = true, features = ["std"] }
futures-util = { workspace = true }
# The CDC walsender session (our pinned fork — F1 failover-slot syntax;
# docs/archive/events/pg-walstream-fork.md).
pg_walstream = { workspace = true }
# The draft envelope/subject/Nats-Msg-Id wire contract.
wamn-event-wire = { workspace = true }
# Canonical PostgreSQL identifier quoting shared with the guest-safe planners.
wamn-pg-core = { workspace = true }
# registry.event_readers registration lookup.
wamn-control-registry = { workspace = true }
# The scoped registry-reader credential contract (wamn-0h0g.12.116): the pure,
# pre-I/O refusal of a WAMN_SYSTEM_URL that is not this project-env's own
# read-only generation. A pure text/hashing edge — no DB, K8s, clock or tokio.
# The `event_reader_live` gate also provisions its fixture env (publication and
# slot) through the same crate's builders.
wamn-control-provision = { workspace = true }

[lints]
workspace = true
