[package]
name = "wamn-cdc-reader"
description = "PostgreSQL change capture with acknowledgement before slot advance."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-postgres.workspace = true
wamn-broker = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time", "rt-multi-thread", "macros", "signal"] }
tokio-util = { workspace = true, features = ["rt"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The NATS TLS client needs one process provider; a build that links ring and
# aws-lc-rs cannot choose one itself.
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
# The event records and source identity contract.
wamn-event = { workspace = true }
wamn-registry.workspace = true
serde.workspace = true

[lints]
workspace = true
