[package]
name = "wamn-node-host"
description = "Production HTTP service for one warm custom node component."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-node-runtime = { workspace = true }
wamn-node-invoke = { workspace = true }
wamn-runtime = { workspace = true }
