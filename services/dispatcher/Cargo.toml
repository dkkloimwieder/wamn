[package]
name = "wamn-dispatcher"
description = "wamn shared queue dispatcher: queued-work wake and bounded deadline reconciliation across all projects"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["time", "rt-multi-thread", "macros", "signal", "sync", "io-util", "io-std"] }
tokio-postgres = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The dispatcher links no runtime (SR9), so it installs its own minimal trace
# and metric providers for service spans and the run-queue-depth gauge. Both are
# OTEL_*-gated; version 0.31 matches the workspace.
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
opentelemetry_sdk = { workspace = true, features = ["metrics", "trace"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "metrics", "trace"] }
tracing-opentelemetry = { workspace = true }
# The doorbell client. Same version req as the runtime's so cargo unifies to
# one crate instance across the workspace build.
async-nats = { workspace = true }
# init_crypto: standardize the process rustls provider on aws-lc-rs (the local
# copy of the fork's wash_runtime::init_crypto — same feature shape).
rustls = { workspace = true, features = ["std", "tls12", "aws-lc-rs"] }
# Durable state transitions and adaptive scheduling cadence.
wamn-run-state = { workspace = true }
wamn-scheduler = { workspace = true }
# R16b identity-format validators — the ONE owner shared with the
# wamn:postgres plugin (wamn-host).
wamn-control-registry = { workspace = true }
