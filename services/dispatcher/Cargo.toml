[package]
name = "wamn-dispatcher"
description = "wamn shared trigger dispatcher service (5.14, SR9): cron + parked-wake across all projects — its own deployment artifact, no runtime linked (the doorbell NATS client is a local thin connect)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["time", "rt-multi-thread", "macros", "signal", "sync"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# [9.8] run-queue-depth gauge. The dispatcher is the ONE service artifact that
# links no runtime (SR9), so it builds its OWN minimal metrics provider (the
# ~12-line MetricExporter -> SdkMeterProvider mirror of the fork's
# observability.rs), OTEL_*-gated. version 0.31 matches the workspace.
opentelemetry = { workspace = true, features = ["metrics"] }
opentelemetry_sdk = { workspace = true, features = ["metrics"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "metrics"] }
# The doorbell client. Same version req as the runtime's so cargo unifies to
# one crate instance across the workspace build.
async-nats = { workspace = true }
# init_crypto: standardize the process rustls provider on aws-lc-rs (the local
# copy of the fork's wash_runtime::init_crypto — same feature shape).
rustls = { workspace = true, features = ["std", "tls12", "aws-lc-rs"] }
# The trigger registry is the flows table's graph_json — the dispatcher parses
# each active flow and registers its cron / row-event trigger.
wamn-flow = { workspace = true }
# Durable state transitions and injected-clock scheduling decisions.
wamn-run-state = { workspace = true }
wamn-scheduler = { workspace = true }
# R16b identity-format validators — the ONE owner shared with the
# wamn:postgres plugin (wamn-host).
wamn-control-registry = { workspace = true }
