[package]
name = "wamn-identity"
description = "Separate system-database-backed identity authority and public JWKS service."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = []

[dependencies]
hex = { workspace = true }
dotenvy = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json"] }
sha2 = { workspace = true }
zeroize = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
tokio-postgres = { workspace = true }
tokio-rustls = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-platform-identity = { workspace = true }
wamn-session = { workspace = true }

[dev-dependencies]
wamn-catalog = { workspace = true }
wamn-control-registry = { workspace = true }
tokio = { workspace = true, features = ["process"] }
url = { workspace = true }
wamn-pg-core = { workspace = true }
rcgen = { workspace = true }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
