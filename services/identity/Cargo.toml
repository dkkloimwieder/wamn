[package]
name = "wamn-identity"
description = "Separate system-database-backed identity authority and public JWKS service."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "time"] }
tokio-postgres = { workspace = true }
tokio-rustls = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-platform-identity = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
url = { workspace = true }
wamn-pg-core = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }

[lints]
workspace = true
