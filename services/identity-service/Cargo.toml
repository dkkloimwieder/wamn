[package]
name = "wamn-identity-service"
description = "Separate system-database-backed identity authority and public JWKS service."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wamn-identity"
path = "src/main.rs"
test = false

[features]
test-util = []

[dependencies]
wamn-envelope.workspace = true
async-nats = { workspace = true, features = ["aws-lc-rs", "nkeys"] }
wamn-identity-client.workspace = true
wamn-kubernetes.workspace = true
wamn-digest = { workspace = true, features = ["sqlx"] }
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
wamn-registry.workspace = true
hex = { workspace = true }
wamn-http-client = { workspace = true, features = ["tls12"] }
zeroize = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
wamn-provision = { workspace = true }
wamn-identity = { workspace = true }
wamn-identity-protocol = { workspace = true, features = ["sqlx"] }
url = { workspace = true }

[dev-dependencies]
kube = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy"] }
chrono = { workspace = true, features = ["std"] }
sqlx = { workspace = true, features = ["macros", "migrate"] }
wamn-provision = { workspace = true, features = ["test-util"] }
jsonwebtoken = { workspace = true }
wamn-test-infrastructure = { workspace = true }
wamn-catalog = { workspace = true }
wamn-registry = { workspace = true }
tokio = { workspace = true, features = ["process"] }
url = { workspace = true }
postgres-protocol = { workspace = true }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
