[package]
name = "wamn-ctl"
description = "wamn control-plane verbs (SR9): the one-shot provisioning / catalog / dump-restore-copy subcommands split out of wamn-host — same subcommand surface, no runtime linked (Job manifests swap only the image/binary)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
hex = { workspace = true }
ring = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
# The verbs are println!-style tools; this fmt layer exists so --log-level
# keeps its meaning (dep diagnostics to stderr), matching the pre-split
# no-OTEL behavior of wash_runtime::observability::initialize_observability.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# 4.1b publish-catalog: catalog snapshot model + the 3.2 tenant-floor DDL.
wamn-schema-model = { workspace = true }
wamn-schema-compiler = { workspace = true }
# publish-catalog --flow: parse and validate the immutable graph.
wamn-flow = { workspace = true }
# CF-DEF-ID: immutable flow registration uses the canonical artifact identity
# implemented by the catalog model; the writer never re-derives that hash.
wamn-catalog = { workspace = true }
wamn-node-manifest = { workspace = true }
wamn-standard-nodes = { workspace = true }
# 2.5 migrate-catalog: the pure migration engine — reads the current applied
# catalog, plans the one-transaction apply (DDL + lifecycle + history).
wamn-schema-control = { workspace = true }
# 2.3 provision-project: the pure CREATE DATABASE / role / GRANT CONNECT
# builders + project-id naming + credential Secret rendering.
wamn-control-provision = { workspace = true }
# wamn-q3n.6 provision-org: the control-plane registry model + registry SQL.
wamn-control-registry = { workspace = true }
# MVP management authentication: stable service principals, project roles, and
# independently issued/revoked PATs for provision-project-env.
wamn-platform-identity = { workspace = true }
# wamn-8df.5 copy-project-env: the definition pass re-compiles the copied RLS
# policy rows and applies them on the dst.
# 9.6 prune-run-history: the single-source run-state SQL builder
# (`prune_terminal_runs_sql`) the retention verb and the capturebench gate share.
wamn-run-state = { workspace = true }
wamn-scenario-catalog = { workspace = true }
# 11.8 impact-report / migrate-catalog acknowledge gate: the PURE schema-change
# impact analysis (entities → flows via registration + node config → suites →
# generated-API). This shell reads the dependency rows and calls wamn_schema_control::impact::analyze.
