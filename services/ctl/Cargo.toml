[package]
name = "wamn-ctl"
description = "wamn control-plane provisioning and catalog verbs"
default-run = "wamn-ctl"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
ops = [
    "wamn-control/ops",
    "wamn-control-provision/ops",
]

[[bin]]
name = "wamn-ctl-ops"
path = "src/bin/wamn-ctl-ops.rs"
required-features = ["ops"]

[[bin]]
name = "wamn"
path = "src/bin/wamn.rs"

[[test]]
name = "protected_relations_live"
path = "tests/protected_relations_live.rs"
required-features = ["ops"]

[[test]]
name = "prune_record_history_live"
path = "tests/prune_record_history_live.rs"
required-features = ["ops"]

[[test]]
name = "prune_run_history_live"
path = "tests/prune_run_history_live.rs"
required-features = ["ops"]

[dependencies]
anyhow = { workspace = true }
# `string`: `wamn-0h0g.22.16` derives the workload-generation flag set from the
# closed WorkloadRoleFamily vocabulary, so arg ids and long names are computed
# `String`s rather than typed-out literals.
clap = { workspace = true, features = ["derive", "env", "string"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "process", "signal", "sync", "time"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true, features = ["clock", "std"] }
url = { workspace = true }
tracing = { workspace = true }
# The verbs are println!-style tools; this fmt layer exists so --log-level
# keeps its meaning (dep diagnostics to stderr), matching the pre-split
# no-OTEL behavior of wash_runtime::observability::initialize_observability.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
futures-util = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
# `wamn web upload` writes the web client files through the workspace S3 client.
object_store = { workspace = true }
# The shared terminal driver behind `wamn dev --tui` (wamn-10yt.5.9).
wamn-client-terminal = { workspace = true }
# CF-DEF-ID: immutable flow registration uses the canonical artifact identity
# implemented by the catalog model; the writer never re-derives that hash.
wamn-catalog = { workspace = true }
wamn-schema-control = { workspace = true }
wamn-schema-generator = { workspace = true }
# The control operations that the verbs call.
wamn-control = { workspace = true }
# The pure provisioning SQL builders + identifier naming + credential Secret
# rendering.
wamn-control-provision = { workspace = true }
# wamn-q3n.6 provision-org: the control-plane registry model + registry SQL.
wamn-control-registry = { workspace = true }
# MVP management authentication: stable service principals, project roles, and
# independently issued/revoked PATs for provision-project-env.
wamn-platform-identity = { workspace = true }
wamn-runtime = { workspace = true }
# 9.6 prune-run-history: the single-source run-state SQL builder
# (`prune_terminal_runs_sql`) the retention verb uses.
wamn-run-state = { workspace = true }

[dev-dependencies]
async-nats = { workspace = true, features = ["jetstream"] }
rustix = { workspace = true }
wamn-authoring-model = { workspace = true }
wamn-execution-contract = { workspace = true }
wamn-fixture-package = { workspace = true }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
wamn-pg-core = { workspace = true }
wamn-control = { workspace = true, features = ["test-util"] }
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-control-provision = { workspace = true, features = ["test-util"] }
wamn-project-state = { workspace = true, features = ["test-util"] }
wamn-test-infrastructure = { workspace = true }
wamn-test-postgres = { workspace = true }
wit-component = { version = "=0.254.0", features = ["dummy-module"] }
wit-parser = "=0.254.0"

[lints]
workspace = true
