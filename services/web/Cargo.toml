[package]
name = "wamn-web"
description = "The platform web front, password proxy and browser configuration."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wamn-web"
path = "src/main.rs"
test = false

[dependencies]
kube = { workspace = true }
k8s-openapi = { workspace = true }
wamn-package.workspace = true
wamn-registry.workspace = true
wamn-digest.workspace = true
wamn-kubernetes.workspace = true
wamn-http-client.workspace = true
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { workspace = true, features = ["http1", "native-tokio"] }
object_store = { workspace = true, features = ["gcp"] }
ring.workspace = true
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-service.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
wamn-engine.workspace = true
wash-runtime.workspace = true

[lints]
workspace = true
