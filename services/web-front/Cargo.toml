[package]
name = "wamn-web-front"
description = "The platform web front, password proxy and browser configuration."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wamn-web-front"
path = "src/main.rs"
test = false

[dependencies]
wamn-kubernetes.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { workspace = true, features = ["http1", "native-tokio"] }
object_store = { workspace = true, features = ["gcp"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
rcgen.workspace = true
tokio-rustls.workspace = true
wamn-engine.workspace = true
wash-runtime.workspace = true

[lints]
workspace = true
