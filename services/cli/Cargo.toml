[package]
name = "wamn-cli"
description = "wamn control-plane provisioning and catalog verbs"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
# This enables support for components with multiple handler exports during admission.
ignored = ["wamn-engine"]

[[bin]]
name = "wamn"
path = "src/bin/wamn.rs"

[dependencies]
wamn-routes.workspace = true
wamn-package.workspace = true
wamn-build.workspace = true
wamn-postgres.workspace = true
wamn-authentication.workspace = true
wamn-digest.workspace = true
anyhow = { workspace = true }
# `string`: `wamn-0h0g.22.16` derives the workload-generation flag set from the
# closed WorkloadRoleFamily vocabulary, so arg ids and long names are computed
# `String`s rather than typed-out literals.
clap = { workspace = true, features = ["derive", "env", "string"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "process", "signal", "sync", "time"] }
serde_json = { workspace = true }
# The verbs are println!-style tools; this fmt layer exists so --log-level
# keeps its meaning (dep diagnostics to stderr), matching the pre-split
# no-OTEL behavior of wash_runtime::observability::initialize_observability.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
# CF-DEF-ID: immutable flow registration uses the canonical artifact identity
# implemented by the catalog model; the writer never re-derives that hash.
# `wamn build` calls the two-pass package build.
# The control operations that the verbs call.
wamn-release = { workspace = true }
wamn-engine = { workspace = true, features = ["wasm_component_model_implements"] }
wamn-environment = { workspace = true }
wamn-dev = { workspace = true }
wamn-kubernetes.workspace = true
wamn-platform-install.workspace = true
# `wamn inspect` and `wamn diff` read verified package artifacts.
wamn-oci = { workspace = true }
wamn-oci-reference.workspace = true
wamn-http-client = { workspace = true, features = ["tls12"] }
# The pure provisioning SQL builders + identifier naming + credential Secret
# rendering.
wamn-provision = { workspace = true }
# wamn-q3n.6 provision-org: the control-plane registry model + registry SQL.
wamn-registry = { workspace = true }
# MVP management authentication: stable service principals, project roles, and
# independently issued/revoked PATs for provision-project-env.
wamn-identity-protocol = { workspace = true }
wamn-role.workspace = true

async-trait.workspace = true
wamn-storage.workspace = true
wash-runtime = { workspace = true, features = ["oci"] }

[dev-dependencies]
url = { workspace = true }
wamn-oci = { workspace = true }
wamn-dev.workspace = true
wamn-test-infrastructure = { workspace = true }

[lints]
workspace = true
