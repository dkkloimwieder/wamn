[package]
name = "wamn-host"
description = "General wasmCloud washlet host service."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-runtime = { workspace = true, features = ["wasm_component_model_implements"] }
wash-runtime = { workspace = true, features = ["washlet", "wasi-config", "wasi-otel", "wasm_component_model_implements"] }
anyhow = { workspace = true }
async-nats = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing = { workspace = true }
