[package]
name = "wamn-host"
description = "General wasmCloud washlet host service."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-app.workspace = true
wamn-package.workspace = true
wamn-routes.workspace = true
wamn-workflow-graph.workspace = true
zeroize.workspace = true
chrono.workspace = true
wamn-event.workspace = true
wamn-envelope.workspace = true
wamn-key.workspace = true
boon.workspace = true
wamn-blobstore.workspace = true
wamn-connection.workspace = true
wamn-kubernetes.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
wasmtime-wasi-http.workspace = true
wamn-http.workspace = true
uuid.workspace = true
wamn-broker = { workspace = true }
mimalloc = { workspace = true }
wamn-registry = { workspace = true }
wamn-identity-client.workspace = true
wamn-identity-protocol = { workspace = true }
wamn-plugin = { workspace = true, features = ["wasm_component_model_implements"] }
wamn-postgres.workspace = true
wamn-authentication = { workspace = true }
wamn-digest.workspace = true
wamn-engine = { workspace = true }
wash-runtime = { workspace = true, features = ["washlet", "wasi-config", "wasi-logging", "wasi-otel", "wasmcloud-nats", "wasm_component_model_implements"] }
anyhow = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
humantime = { workspace = true }
async-nats = { workspace = true }
nkeys.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
# Delivery metrics and request tracing share the process observability provider.
# `trace` reads the sampler's decision from the active context (src/observability.rs).
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util", "process"] }
tracing = { workspace = true }
# `tracing` does not re-export the `Current` that a wrapping subscriber returns.
tracing-core = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
wamn-test-infrastructure = { workspace = true }
sqlx = { workspace = true, features = ["macros", "migrate"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
tracing-opentelemetry = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
