[package]
name = "wamn-host"
description = "General wasmCloud washlet host service."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
wamn-broker = { workspace = true }
wamn-digest.workspace = true
mimalloc = { workspace = true }
wamn-catalog = { workspace = true }
wamn-package-artifact = { workspace = true }
wamn-execution-host = { workspace = true }
# The walk, the wiring delivery, and the queue (docs/architecture/overview.md).
wamn-workflow = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-registry = { workspace = true }
wamn-platform-identity = { workspace = true }
wamn-identity-client = { workspace = true }
wamn-identity-protocol = { workspace = true }
wamn-runtime = { workspace = true, features = ["wasm_component_model_implements"] }
wamn-engine = { workspace = true }
wash-runtime = { workspace = true, features = ["washlet", "wasi-config", "wasi-logging", "wasi-otel", "wasmcloud-nats", "wasm_component_model_implements"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
humantime = { workspace = true }
async-nats = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
# Delivery metrics and request tracing share the process observability provider.
# `trace` reads the sampler's decision from the active context (src/observability.rs).
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util", "process"] }
tracing = { workspace = true }
# `tracing` does not re-export the `Current` that a wrapping subscriber returns.
tracing-core = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

[dev-dependencies]
wamn-runtime = { workspace = true, features = ["test-util"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
tracing-opentelemetry = { workspace = true }
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
