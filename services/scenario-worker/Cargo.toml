[package]
name = "wamn-scenario-worker"
description = "Product worker for deterministic flow scenario execution."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-authoring-model = { workspace = true }
# wamn-0h0g.8.18: the scoped control-author credential contract. Default features
# only — the pure naming and connection-input validators, no `ops` surface, no DB
# or K8s client. Both sides of the credential must derive the same generation
# name, so the contract lives in one crate rather than being restated here.
wamn-control-provision = { workspace = true }
wamn-control-registry = { workspace = true }
wamn-platform-identity = { workspace = true }
wamn-runtime = { workspace = true }
wamn-schema-control = { workspace = true }
wamn-execution-contract = { workspace = true }
# wamn-0h0g.8.5.4: the private management admission recipe, its producer key, its
# typed result, and the run status vocabulary the observation leg decodes. This
# crate is that recipe's FIRST production caller — until now the only caller was
# run-state's own live authority proof.
wamn-run-state = { workspace = true }
# wamn-0h0g.8.5.4: the pure per-case evaluator. Its module doc already names this
# service as the effectful producer that owes it `Captured`, so the dependency
# direction was settled when that crate landed.
wamn-scenario-model = { workspace = true }
wash-runtime = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "time"] }
# The live gates authenticate AS the scoped control-author generation (the tenant
# mapping resolves on `session_user`, which `SET ROLE` does not change), so they
# rewrite the admin URL's identity rather than taking a second URL input.
url = { workspace = true }
