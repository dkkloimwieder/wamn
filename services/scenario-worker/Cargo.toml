[package]
name = "wamn-scenario-worker"
description = "Product worker for deterministic flow scenario execution."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-authoring-model = { workspace = true }
wamn-catalog = { workspace = true }
wamn-control-registry = { workspace = true }
wamn-execution-host = { workspace = true }
wamn-platform-identity = { workspace = true }
wamn-runtime = { workspace = true }
wamn-scenario-runtime = { workspace = true }
wamn-scenario-model = { workspace = true }
wamn-scenario-catalog = { workspace = true }
wamn-run-state = { workspace = true }
wamn-flow = { workspace = true }
wamn-node-manifest = { workspace = true }
wamn-standard-nodes = { workspace = true }
wash-runtime = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
tracing = { workspace = true }

[dev-dependencies]
wamn-schema-control = { workspace = true }
tokio = { workspace = true, features = ["io-util", "time"] }
