[alias]
xtask = "run --package xtask --"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[build]
jobs = 4
# This file selects clang/mold, limits build jobs.
# It sets no `rustc-wrapper`, so Docker builds need no wrapper binary.
# Local Cargo uses kache through the personal ~/.cargo/config.toml.
