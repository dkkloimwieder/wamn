# The pgbench client of the GCP Postgres minimum (wamn-c8a5v.1). cargo xtask bench-pg-minimum copies
# the replay scripts in and runs pgbench through the Kubernetes Pod API. It runs on pool
# bench beside the idle Receiving host, never on pool pg: a client on the
# Postgres node slows every statement (wamn-48d4d). The CPU request fits
# beside the host's request, and pgbench can use the idle CPU above it. The
# image is the one of the Cluster, so pgbench and the server are the same
# major version.
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-minimum-client
  namespace: platform
  labels:
    app.kubernetes.io/managed-by: wamn
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: pg-minimum-client
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 26
      nodeSelector:
        role: bench-host
      tolerations:
        - key: role
          operator: Equal
          value: bench-host
          effect: NoSchedule
      containers:
        - name: pgbench
          image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
          command: ["sleep", "7200"]
          env:
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /etc/wamn/db/ca.crt}
            - {name: PGSSLCERT, value: /etc/wamn/db/tls.crt}
            - {name: PGSSLKEY, value: /etc/wamn/db/tls.key}
          startupProbe:
            exec:
              command: ["psql", "-Xw", "-d", "postgresql://postgres@wamn-pg-rw.platform.svc:5432/wamn_pg_minimum", "-c", "SELECT 1"]
            periodSeconds: 2
            failureThreshold: 60
          volumeMounts:
            - {name: database, mountPath: /etc/wamn/db, readOnly: true}
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: database
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: wamn-pg-postgres-tls
                  items:
                    - {key: tls.crt, path: tls.crt}
                    - {key: tls.key, path: tls.key}
              - secret:
                  name: wamn-pg-server-tls
                  items:
                    - {key: ca.crt, path: ca.crt}
