[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "xtask"
path = "src/main.rs"
test = false

[dependencies]
kube = { workspace = true, features = ["ws"] }
k8s-openapi = { workspace = true }
tar = { workspace = true }
wamn-package.workspace = true
wamn-routes.workspace = true
wamn-registry.workspace = true
wamn-component-policy.workspace = true
wamn-environment.workspace = true
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json"] }
wamn-build.workspace = true
anyhow.workspace = true
futures-util.workspace = true
wamn-kubernetes.workspace = true
cargo_metadata = "0.23"
csv = "1"
flate2 = "1.1.10"
base64.workspace = true
url.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
regex = "1"
tempfile.workspace = true
wamn-digest.workspace = true
wamn-codegen.workspace = true
wamn-platform-install.workspace = true
wamn-provision.workspace = true
# Admission parses components with the CLI's component model features.
wamn-engine = { workspace = true, features = ["wasm_component_model_implements"] }
wamn-oci.workspace = true
wamn-http.workspace = true
wamn-http-client = { workspace = true, features = ["tls12"] }
wash-runtime = { workspace = true, features = ["oci"] }
oci-client.workspace = true
docker_credential = "=1.4.0"
hyper.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "fs", "process", "io-util", "signal", "net"] }
uuid = { workspace = true, features = ["v7"] }
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
