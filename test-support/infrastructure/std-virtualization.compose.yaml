services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: probe
    ports:
      - "127.0.0.1:${WAMN_STD_VIRT_PG_PORT}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD=probe psql -h 127.0.0.1 -U postgres -Atqc 'select 1'
      interval: 1s
      timeout: 2s
      retries: 60
  registry:
    image: registry:2
    ports:
      - "127.0.0.1:${WAMN_STD_VIRT_REGISTRY_PORT}:5000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:5000/v2/ >/dev/null
      interval: 1s
      timeout: 2s
      retries: 60
  receiving-route-postgres:
    profiles:
      - receiving-route
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: probe
    volumes:
      - type: bind
        source: ../../deploy/sql/postgres-init.sql
        target: /docker-entrypoint-initdb.d/postgres-init.sql
        read_only: true
    ports:
      - "127.0.0.1:${WAMN_STD_VIRT_PG_PORT}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - test "$(cat /proc/1/comm)" = postgres && PGPASSWORD=probe psql -h 127.0.0.1 -U postgres -Atqc 'select 1'
      interval: 1s
      timeout: 2s
      retries: 60
  authenticated-registry:
    profiles:
      - receiving-route
    image: registry:2
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: WAMN Receiving route journey
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - type: bind
        source: ${WAMN_ROUTE_REGISTRY_HTPASSWD:-/dev/null}
        target: /auth/htpasswd
        read_only: true
    ports:
      - "127.0.0.1:${WAMN_ROUTE_REGISTRY_PORT:-5004}:5000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -S -O /dev/null http://127.0.0.1:5000/v2/ 2>&1 | grep -q '401 Unauthorized'
      interval: 1s
      timeout: 2s
      retries: 60
  receiving-dev-minio:
    profiles:
      - receiving-route
    image: chainguard/minio@sha256:aea6c163749e1caca37f907976dcf337177ddf5f558808f2aa591618fd3a6eef
    command:
      - server
      - /tmp/data
    environment:
      MINIO_ROOT_USER: ${WAMN_RECEIVING_DEV_MINIO_USER:-wamn-labels-store}
      MINIO_ROOT_PASSWORD: ${WAMN_RECEIVING_DEV_MINIO_PASSWORD:-probe-labels-store}
    ports:
      - "127.0.0.1:${WAMN_RECEIVING_DEV_MINIO_PORT:-9004}:9000"
  receiving-dev-minio-client:
    profiles:
      - receiving-route
    image: chainguard/minio-client@sha256:8dc1dceb7371c9091b17b450e4da67a492f6de3a22d716af14888a7d8597457e
    entrypoint: [/usr/bin/mc, --config-dir, /tmp/mc]
    environment:
      MC_HOST_store: http://${WAMN_RECEIVING_DEV_MINIO_USER:-wamn-labels-store}:${WAMN_RECEIVING_DEV_MINIO_PASSWORD:-probe-labels-store}@receiving-dev-minio:9000
  # tools/dev-collector renders the collector service and its deployed image.
  # Add <dev-root>/local-artifacts/otel/compose.json when starting local telemetry.
