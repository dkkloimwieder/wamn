services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: probe
    ports:
      - "127.0.0.1:${WAMN_STD_VIRT_PG_PORT}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD=probe psql -h 127.0.0.1 -U postgres -Atqc 'select 1'
      interval: 1s
      timeout: 2s
      retries: 60
  registry:
    image: registry:2
    ports:
      - "127.0.0.1:${WAMN_STD_VIRT_REGISTRY_PORT}:5000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:5000/v2/ >/dev/null
      interval: 1s
      timeout: 2s
      retries: 60
