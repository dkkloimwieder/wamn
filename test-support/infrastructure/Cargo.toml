[package]
name = "wamn-test-infrastructure"
description = "Repository-only temporary infrastructure and test adapters."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "wamn-test-postgres"
path = "postgres-run.rs"

[dependencies]
wamn-broker = { workspace = true }
wamn-digest.workspace = true
wamn-platform-identity = { workspace = true }
wamn-kubernetes = { workspace = true, features = ["test-util"] }
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
anyhow = { workspace = true }
async-nats = { workspace = true, features = ["jetstream", "server_2_10"] }
base64 = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
rustix = { workspace = true }
wamn-registry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-catalog = { workspace = true }
wamn-schema-generator = { workspace = true }
wamn-schema-control = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "process", "signal", "time"] }
url = { workspace = true }
tokio-postgres = { workspace = true }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
