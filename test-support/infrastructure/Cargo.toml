[package]
name = "wamn-test-infrastructure"
description = "Repository-only temporary infrastructure and test adapters."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[dependencies]
wamn-package.workspace = true

wamn-identity-protocol.workspace = true

rustix.workspace = true
hmac = { workspace = true }
sha2 = { workspace = true }
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json"] }
wamn-digest.workspace = true
wamn-kubernetes = { workspace = true }
anyhow = { workspace = true }
async-nats = { workspace = true, features = ["jetstream", "server_2_10"] }
base64 = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
wamn-registry = { workspace = true }
wamn-environment = { workspace = true }
wamn-platform-install = { workspace = true }
postgres-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
wamn-codegen = { workspace = true }
wamn-component-policy = { workspace = true }
oci-client = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "process", "time"] }
url = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "http-fixture"
path = "http-fixture/server.rs"
