[package]
name = "wamn-test-infrastructure"
description = "Repository-only temporary infrastructure and test adapters."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "wamn-test-postgres"
path = "postgres-run.rs"

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true, features = ["jetstream", "server_2_10"] }
base64 = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
reqwest = { workspace = true }
rustix = { workspace = true }
wamn-control-registry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-authoring-model = { workspace = true }
wamn-catalog = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "process", "signal", "time"] }
url = { workspace = true }
tokio-postgres = { workspace = true }

[lints]
workspace = true
