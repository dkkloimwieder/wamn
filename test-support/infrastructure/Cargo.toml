[package]
name = "wamn-test-infrastructure"
description = "Repository-only temporary infrastructure and proof adapters."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true, features = ["jetstream", "server_2_10"] }
hex = { workspace = true }
ring = { workspace = true }
wamn-control-registry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-authoring-model = { workspace = true }
wamn-catalog = { workspace = true }
tokio = { workspace = true, features = ["process", "time"] }
url = { workspace = true }

[lints]
workspace = true
