[package]
name = "wamn-gate-harness"
description = "Shared gate measurement/assertion vocabulary for the wamn-gates suite (SR1)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-digest.workspace = true
wamn-identity-client = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true }
url = { workspace = true }
wamn-package-control = { workspace = true, features = ["test-util"] }
wamn-release-control = { workspace = true }
wamn-environment-control = { workspace = true, features = ["test-util"] }
wamn-dev-control = { workspace = true, features = ["test-util"] }
wamn-control-provision = { workspace = true }
wamn-credential-store = { workspace = true }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["process", "rt"] }
wamn-control-registry = { workspace = true }
wamn-catalog = { workspace = true }
wamn-engine = { workspace = true }
wamn-platform-identity = { workspace = true }
wamn-test-infrastructure = { workspace = true }
# Registry image archives used by conformance fixtures.
oci-client = { workspace = true }
wamn-package-artifact = { workspace = true }
# OCI image archive output.
tar = { workspace = true }
# The full row images of the captured schemas (environment.rs).
wamn-schema-control = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
