[package]
name = "wamn-gate-harness"
description = "Shared gate measurement/assertion vocabulary for the wamn-gates suite (SR1)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true }
url = { workspace = true }
wamn-control = { workspace = true }
wamn-control-provision = { workspace = true }
# The PG fixture/seed helpers (scope_session / seed_flow_version): gates hold
# the connection, the harness holds the one copy of the fixture SQL.
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
# The session issuer of the cluster fixtures (session_issuer.rs).
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["process", "rt"] }
wamn-control-registry = { workspace = true }
wamn-platform-identity = { workspace = true }
wamn-test-infrastructure = { workspace = true }

[dev-dependencies]
async-nats = { workspace = true, features = ["jetstream"] }
tokio = { workspace = true, features = ["macros", "rt"] }
wamn-catalog = { workspace = true }
wamn-event-wire = { workspace = true }
wamn-schema-control = { workspace = true }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
