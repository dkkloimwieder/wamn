[package]
name = "wamn-test-postgres"
description = "Private PostgreSQL 18 servers, databases, and test prerequisites."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "wamn-test-postgres"
path = "postgres-run.rs"

[dependencies]
tokio = { workspace = true, features = ["macros", "rt", "process", "signal", "time"] }
rustix.workspace = true
rcgen.workspace = true
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
