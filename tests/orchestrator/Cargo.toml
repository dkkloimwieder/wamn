[package]
name = "wamn-gates"
description = "The wamn gate suite over reusable platform and domain libraries"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-runtime = { path = "../../crates/platform/runtime" }
wamn-test-infrastructure = { path = "../../test-support/infrastructure" }
wamn-proof-conformance = { path = "../conformance" }
wamn-proof-integration = { path = "../integration" }
wamn-proof-system = { path = "../system" }
wash-runtime = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
