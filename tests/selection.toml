[[preparation]]
id = "platform-ui"
outputs = {WAMN_PLATFORM_UI_DIST = "{root}/apps/platform_ui/dist"}
commands = [["pnpm", "--filter", "@wamn/platform-ui", "build"]]
packages = ["wamn-ctl"]

[[preparation]]
id = "sync-bench"
