root_features = ["wamn-control/ops", "wamn-ctl/ops"]

[[rules]]
# Bindgen reads shared WIT outside Cargo dependency edges.
inputs = ['^crates/execution/workflow/router/wit/', '^crates/platform/runtime/wit/deps/']
workspaces = ["root", "apps", "no-std"]

[[rules]]
# Host and materializer bindings read these shared interfaces.
inputs = ['^crates/execution/host/wit/deps/wamn-router-delivery-0.4/', '^apps/platform/execution/materializer/wit/deps/wasi-cli/', '^apps/platform/execution/materializer/wit/deps/wasi-clocks/']
workspaces = ["root", "apps"]

[[rules]]
# Rust tests read SQL, charts, the Dockerfile and web sources by path.
inputs = ['^deploy/', '^Dockerfile$', '^web/', '^package\.json$', '^pnpm-']
workspaces = ["root"]

[[rules]]
# Application SQL, manifests, and generated files feed sibling packages.
inputs = ['^apps/[^/]+/']
application = true

