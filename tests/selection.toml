outputs = {WAMN_SQLX_TRANSACTION_COMPONENT = "{target}/wasm32-wasip2/debug/sqlx_command.wasm"}
commands = [
  ["env", "RUSTFLAGS={guest-rustflags}", "cargo", "build", "--locked", "--offline", "--manifest-path", "apps/Cargo.toml", "--target-dir", "{target}", "--target", "wasm32-wasip2", "-p", "sqlx-command"],
]
packages = ["wamn-runtime"]

[[preparation]]
id = "workflow-guests"
outputs = {}
commands = [
  ["mkdir", "-p", "{target}/wasm32-wasip2/debug"],
  ["env", "RUSTFLAGS={guest-rustflags}", "cargo", "build", "--locked", "--offline", "--manifest-path", "apps/platform/no-std/Cargo.toml", "--target-dir", "{target}", "--target", "wasm32-wasip2", "-p", "transform"],
