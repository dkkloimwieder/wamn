# Suites record id, tier, workspace, package, target, tests, features,
# prerequisites, inputs (path regexes), execution, and resource_lock.
# A resource_lock makes its suite exclusive. Cluster needs, Docker, and external
# environment inputs without a preparation owner also require exclusive execution.
# Empty package means a tool command. Empty target means package defaults.
# Rules describe non-Cargo readers. Cargo still discovers package dependencies.
documentation = ['^docs/', '^\.beads/', '^[^/]+\.md$']

[[rules]]
# Bindgen reads shared WIT outside Cargo dependency edges.
inputs = ['^wit/(wamn-(connection|flow-http-routing|integration|node|operation-0\.1|postgres-0\.4)|wasmcloud-blobstore)/', '^crates/platform/capability-authority/wit/deps/']
workspaces = ["root", "apps"]

[[rules]]
# Host and guest bindings read these shared interfaces.
inputs = ['^wit/wasi-(cli|clocks)/']
workspaces = ["root", "apps"]

[[rules]]
# Rust tests read SQL, charts, the Dockerfile and web sources by path.
inputs = ['^deploy/', '^Dockerfile$', '^web/', '^package\.json$', '^pnpm-']
workspaces = ["root"]

[[rules]]
# Application SQL, manifests, and generated files feed sibling packages.
inputs = ['^apps/[^/]+/']
application = true

[[preparation]]
packages = ["wamn-engine"]
features = ["wasm_component_model_implements"]

[[preparation]]
packages = ["wamn-environment"]
features = ["ops"]

[[preparation]]
packages = ["wamn-execution-host"]
features = ["test-util"]

[[preparation]]
id = "nats"
outputs = {WAMN_NATIVE_C_NATS_BIN = "nats-server"}
aliases = {WAMN_HOST_LIVE_NATS_SERVER_BIN = "WAMN_NATIVE_C_NATS_BIN"}

[[preparation]]
id = "web-install"
outputs = {}
commands = [["pnpm", "install", "--offline"]]

[[preparation]]
id = "edge"
outputs = {WAMN_EDGE_DEVICE_COMPONENT = "{root}/apps/target/wamn/edge_device/components/device.wasm"}
prerequisites = ["edge-application"]

[[preparation]]
id = "edge-application"
applications = ["apps/edge_device"]

[[preparation]]
id = "jsonata"
outputs = {WAMN_JSONATA_COMPONENT = "{target}/wasm32-wasip2/debug/jsonata_expression.wasm"}
commands = [
  ["env", "RUSTFLAGS={guest-rustflags}", "cargo", "build", "--locked", "--offline", "--manifest-path", "apps/Cargo.toml", "--target-dir", "{target}", "--target", "wasm32-wasip2", "-p", "jsonata-expression"],
]

[[preparation]]
id = "fixture"
applications = ["apps/platform_fixture", "apps/platform_fixture_overlay"]

[[preparation]]
id = "fixture-components"
outputs = {WAMN_EFFECTIVE_RELEASE_BASE_COMPONENT_WASM = "{root}/apps/target/wamn/platform_fixture/components/fixture.wasm", WAMN_EFFECTIVE_RELEASE_OVERLAY_COMPONENT_WASM = "{root}/apps/target/wamn/platform_fixture_overlay/components/fixture_overlay.wasm", WAMN_GENERATED_WIDGET_UPDATE_SCHEMA = "{root}/apps/target/wamn/platform_fixture/routes/widget/update.json"}
applications = ["apps/platform_fixture", "apps/platform_fixture_overlay"]

[[preparation]]
id = "ctl"
outputs = {WAMN_CTL_BIN = "{target}/debug/wamn"}
aliases = {WAMN_RECEIVING_DEV_BIN = "WAMN_CTL_BIN", WAMN_SESSION_EXCHANGE_CTL_BIN = "WAMN_CTL_BIN"}
prerequisites = ["control-binaries"]

[[preparation]]
id = "control-binaries"
commands = [["cargo", "build", "--locked", "--offline", "-p", "wamn-ctl", "--bin", "wamn", "--bin", "wamn-ctl"]]

[[preparation]]
id = "http-route"
outputs = {WAMN_FLOW_HTTP_COMPONENT = "{target}/wasm32-wasip2/release/http_route.wasm"}
aliases = {WAMN_DEV_ENV_FLOW_HTTP_COMPONENT = "WAMN_FLOW_HTTP_COMPONENT"}
commands = [
  ["env", "RUSTFLAGS={guest-rustflags}", "cargo", "build", "--locked", "--offline", "--release", "--manifest-path", "apps/Cargo.toml", "--target-dir", "{target}", "--target", "wasm32-wasip2", "-p", "http-route"],
]

[[preparation]]
id = "blob-put"
outputs = {WAMN_BLOB_PUT_COMPONENT = "{target}/wasm32-wasip2/debug/blob_put.wasm"}
commands = [
  ["env", "RUSTFLAGS={guest-rustflags}", "cargo", "build", "--locked", "--offline", "--manifest-path", "apps/Cargo.toml", "--target-dir", "{target}", "--target", "wasm32-wasip2", "-p", "blob-put"],
]

[[preparation]]
id = "numbering-refusal"
outputs = {}
commands = [
  ["env", "RUSTFLAGS={guest-rustflags}", "cargo", "build", "--locked", "--offline", "--manifest-path", "apps/Cargo.toml", "--target-dir", "{target}", "--target", "wasm32-wasip2", "-p", "wamn-postgres-statements", "--example", "numbering_refusal"],
]

[[preparation]]
id = "sync-bench"
outputs = {WAMN_SYNC_BENCH_DIST = "{target}/sync-bench/web"}
applications = ["apps/wamn_wms"]
after_applications = true
prerequisites = ["web-install"]
commands = [
  ["pnpm", "--dir", "web/sync-bench", "run", "build", "--outDir", "{target}/sync-bench/web"],
]

[[preparation]]
id = "client-acme"
outputs = {}
applications = ["apps/wamn_receiving", "apps/client_acme_receiving"]
prerequisites = ["web-install"]

[[preparation]]
id = "receiving"
applications = ["apps/wamn_receiving"]
prerequisites = ["web-install"]

[[preparation]]
id = "wms"
applications = ["apps/wamn_wms"]
prerequisites = ["web-install"]

[[preparation]]
id = "publication-applications"
prerequisites = ["receiving", "wms"]

[[preparation]]
id = "modbus-reader"
outputs = {}
applications = ["apps/modbus_reader"]

[[preparation]]
id = "netsuite"
outputs = {}
applications = ["apps/netsuite"]

[[preparation]]
id = "rest-connector"
outputs = {}
applications = ["apps/rest_connector"]

