[[rules]]
# Bindgen reads shared WIT outside Cargo dependency edges.
inputs = ['^wit/(wamn-(connection|flow-http-routing|integration|jetstream|node|operation-0\.1|postgres-0\.4)|wasmcloud-blobstore)/', '^crates/platform/runtime/wit/deps/']
workspaces = ["root", "apps", "no-std"]

[[rules]]
# Host and materializer bindings read these shared interfaces.
inputs = ['^wit/(wamn-router-delivery-0\.4|wamn-application-dispatch)/', '^apps/platform/execution/materializer/wit/deps/wasi-cli/', '^apps/platform/execution/materializer/wit/deps/wasi-clocks/']
workspaces = ["root", "apps"]

[[rules]]
# Rust tests read SQL, charts, the Dockerfile and web sources by path.
inputs = ['^deploy/', '^Dockerfile$', '^web/', '^package\.json$', '^pnpm-']
workspaces = ["root"]

[[rules]]
# Application SQL, manifests, and generated files feed sibling packages.
inputs = ['^apps/[^/]+/']
application = true

[[preparation]]
packages = ["wamn-control"]
