commands = [
  ["env", "RUSTFLAGS={guest-rustflags}", "cargo", "build", "--locked", "--offline", "--release", "--manifest-path", "apps/Cargo.toml", "--target-dir", "{target}", "--target", "wasm32-wasip2", "-p", "http-route"],
]
packages = ["wamn-control", "wamn-integration-tests", "wamn-receiving-tests", "wamn-wms-tests"]

[[preparation]]
