[package]
name = "wamn-proof-integration"
description = "Repository integration and measurement proofs over real adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["derive", "env"] }
futures-util = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
oci-client = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["testing", "trace"] }
pg_walstream = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "process", "sync", "time", "rt", "macros"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
wamn-control-provision = { workspace = true, features = ["ops"] }
wamn-control-registry = { workspace = true }
wamn-ctl = { workspace = true }
wamn-catalog = { workspace = true }
wamn-event-reg = { workspace = true }
wamn-event-wire = { workspace = true }
wamn-execution-contract = { workspace = true }
wamn-gate-harness = { workspace = true }
wamn-test-infrastructure = { workspace = true }
wamn-run-state = { workspace = true }
wamn-execution-host = { workspace = true }
wamn-runtime = { workspace = true }
wamn-schema-compiler = { workspace = true }
wamn-schema-control = { workspace = true, features = ["ops"] }
wamn-schema-model = { workspace = true }
wash-runtime = { workspace = true, features = ["washlet"] }
wasmtime-wasi = { workspace = true }

[dev-dependencies]
wamn-run-state = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
