[package]
name = "wamn-integration-tests"
description = "Repository integration and measurement tests over real adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
wamn-broker = { workspace = true }
wamn-digest.workspace = true
base64 = { workspace = true }
hmac = { workspace = true }
ring = { workspace = true }
wamn-kubernetes = { workspace = true }
anyhow = { workspace = true }
async-nats = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["std", "clock"] }
futures-util = { workspace = true }
hex = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
libc = { workspace = true }
oci-client = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["testing", "trace"] }
reqwest = { workspace = true, features = ["rustls"] }
rcgen = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "sync", "time", "rt", "macros", "signal"] }
uuid = { workspace = true, features = ["v4", "v7"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
wamn-package-control = { workspace = true }
wamn-release-control = { workspace = true }
wamn-environment = { workspace = true, features = ["ops"] }
wamn-control-provision = { workspace = true, features = ["ops", "test-util"] }
wamn-registry = { workspace = true }
wamn-catalog = { workspace = true }
wamn-component-policy = { workspace = true }
wamn-component-composer = { workspace = true }
wamn-event-wire = { workspace = true }
wamn-package-artifact = { workspace = true }
wamn-test-infrastructure = { workspace = true }
wamn-platform-identity = { workspace = true }
wamn-identity-protocol = { workspace = true, features = ["test-util"] }
wamn-run-state = { workspace = true }
wamn-execution-host = { workspace = true }
wamn-workflow = { workspace = true }
wamn-runtime = { workspace = true, features = ["test-util"] }
wamn-engine = { workspace = true }
wamn-compiler = { workspace = true }
wash-runtime = { workspace = true, features = ["wasi-config", "wasi-logging"] }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }

[dev-dependencies]
wamn-identity-protocol = { workspace = true, features = ["test-util"] }
# `wamn_catalog::fixture_graph` is conditioned behind `test-util`.
wamn-catalog = { workspace = true, features = ["test-util"] }
# The shared runtime session fixture.
tokio-rustls = { workspace = true }
wamn-test-postgres = { workspace = true }
# `prune_record_history` is an `ops` verb; route_interface_live prunes history.
wamn-package-control = { workspace = true, features = ["test-util"] }
wamn-release-control = { workspace = true }
wamn-environment = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[bin]]
name = "http-fixture"
path = "src/bin/http-fixture/server.rs"
