[package]
name = "wamn-proof-integration"
description = "Repository integration and measurement proofs over real adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-nats = { version = "0.47", default-features = false }
async-trait = { workspace = true }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = "1"
pg_walstream = { git = "https://github.com/dkkloimwieder/pg-walstream", rev = "0b007cd627bb913d4b159c705a106b6d4152c91a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["fs", "io-util", "net", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tracing = { workspace = true }
wamn-cdc-reader = { path = "../../services/cdc-reader" }
wamn-control-provision = { path = "../../crates/control/provision" }
wamn-control-registry = { path = "../../crates/control/registry" }
wamn-ctl = { path = "../../services/ctl" }
wamn-dispatcher = { path = "../../services/dispatcher" }
wamn-event-reg = { path = "../../crates/events/registration" }
wamn-event-wire = { path = "../../crates/events/wire" }
wamn-flow = { path = "../../crates/execution/flow-model" }
wamn-scenario-catalog = { path = "../../crates/scenarios/catalog" }
wamn-gate-harness = { path = "../../test-support/harness" }
wamn-test-fixtures = { path = "../../test-support/fixtures" }
wamn-test-infrastructure = { path = "../../test-support/infrastructure" }
wamn-node-invoke = { path = "../../crates/node/invoke" }
wamn-node-runtime = { path = "../../crates/platform/node-runtime" }
wamn-run-state = { path = "../../crates/execution/run-state" }
wamn-execution-host = { path = "../../crates/execution/host" }
wamn-runner = { path = "../../crates/execution/flow-engine" }
wamn-runtime = { path = "../../crates/platform/runtime" }
wamn-scheduler = { path = "../../crates/execution/scheduler" }
wamn-schema-compiler = { path = "../../crates/schema/compiler" }
wamn-schema-model = { path = "../../crates/schema/model" }
wamn-scenario-model = { path = "../../crates/scenarios/model" }
wamn-scenario-runtime = { path = "../../crates/scenarios/runtime" }
wamn-waker = { path = "../../services/waker" }
wash-runtime = { workspace = true }
wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime", rev = "7535c0255b2b84f6ae4de6034649ba2eeda84173" }
wasmtime-wasi-http = { git = "https://github.com/bytecodealliance/wasmtime", rev = "7535c0255b2b84f6ae4de6034649ba2eeda84173" }

[dev-dependencies]
wamn-proof-conformance = { path = "../conformance" }
