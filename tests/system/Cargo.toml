[package]
name = "wamn-proof-system"
description = "Black-box repository system proofs over deployed and public surfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "rt"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
tracing = { workspace = true }
wamn-catalog = { workspace = true }
wamn-event-reg = { workspace = true }
wamn-flow = { workspace = true }
wamn-gate-harness = { workspace = true }
wamn-node-manifest = { workspace = true }
wamn-test-fixtures = { workspace = true }
wamn-run-state = { workspace = true }
wamn-schema-control = { workspace = true }
wamn-schema-compiler = { workspace = true }
wamn-schema-model = { workspace = true }

[dev-dependencies]
wamn-run-state = { workspace = true, features = ["test-util"] }
