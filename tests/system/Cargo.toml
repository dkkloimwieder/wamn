[package]
name = "wamn-proof-system"
description = "Black-box repository system proofs over deployed and public surfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
hyper = { workspace = true }
opentelemetry = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "rt"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
wamn-run-state = { workspace = true }
wamn-runtime = { workspace = true }
wash-runtime = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true }
tracing-subscriber = { workspace = true }
wamn-run-state = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
