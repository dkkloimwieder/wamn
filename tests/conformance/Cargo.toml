[package]
name = "wamn-proof-conformance"
description = "Repository conformance proofs for component, wire, schema, and artifact contracts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
hex = { workspace = true }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "rt", "macros"] }
wamn-component-policy = { workspace = true }
wamn-flow = { workspace = true }
wamn-flow-invocation = { workspace = true }
wamn-gate-harness = { workspace = true }
wamn-node-invoke = { workspace = true }
wamn-node-manifest = { workspace = true }
wamn-node-runtime = { workspace = true }
wamn-runtime = { workspace = true }
wamn-scenario-model = { workspace = true }
wash-runtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasm-encoder = { workspace = true }

[dev-dependencies]
wamn-run-state = { workspace = true, features = ["test-util"] }
