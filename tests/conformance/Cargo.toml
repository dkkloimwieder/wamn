[package]
name = "wamn-proof-conformance"
description = "Repository conformance proofs for component, wire, schema, and artifact contracts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
hex = { workspace = true }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { version = "2", features = ["full", "visit"] }
tokio = { workspace = true, features = ["net", "time", "rt", "macros"] }
url = { workspace = true }
wamn-component-policy = { workspace = true }
wamn-catalog = { workspace = true }
wamn-execution-contract = { workspace = true }
wamn-gate-harness = { workspace = true }
wamn-runtime = { workspace = true }
wash-runtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasm-encoder = { workspace = true }

[dev-dependencies]
chrono = { workspace = true, features = ["std"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "rust_decimal", "uuid"] }
uuid = "1"
wamn-execution-host = { workspace = true }
wamn-run-state = { workspace = true, features = ["test-util"] }
wat = "=1.252.0"

[lints]
workspace = true
