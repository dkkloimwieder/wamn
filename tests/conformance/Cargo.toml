[package]
name = "wamn-conformance-tests"
description = "Repository conformance tests for component, wire, schema, and artifact contracts"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "repo-policy"
path = "src/bin/repo-policy.rs"
test = false

[[bin]]
name = "wamn-benchmark-gate"
path = "src/benchmark.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
tokio = { workspace = true, features = ["net", "time", "rt", "macros"] }
url = { workspace = true }
wamn-component-policy = { workspace = true }
wamn-gate-harness = { workspace = true }
wamn-engine = { workspace = true }
wamn-run-state = { workspace = true }
wash-runtime = { workspace = true }
wasm-encoder = { workspace = true }

[dev-dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde_yaml = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "rust_decimal", "uuid"] }
wamn-execution-host = { workspace = true }
wamn-fixture-package = { workspace = true }
wamn-schema-generator = { workspace = true }
wamn-run-state = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }
wasi-virt = { workspace = true }
wasmparser = { workspace = true }
wat = "=1.254.2"
wit-parser = { workspace = true }

[lints]
workspace = true
