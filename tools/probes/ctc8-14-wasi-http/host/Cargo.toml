[package]
name = "ctc8-14-wasi-http-probe"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["trace", "testing"] }
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["registry"] }
wamn-component-policy = { path = "../../../../crates/platform/component-policy" }
wash-runtime = { git = "https://github.com/wasmCloud/wasmCloud", rev = "68ebece9c537f8bb4b5c9999f274ec68d60f35a9", default-features = false, features = ["oci"] }
wasmtime = { version = "=47.0.4", default-features = false }
wasmtime-wasi = "=47.0.4"
wasmtime-wasi-http = "=47.0.4"
