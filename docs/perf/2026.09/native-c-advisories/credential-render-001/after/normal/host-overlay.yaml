# Receiving/PAT application and release overlay for values-host-default.yaml.
# Apply both files, in this order:
#
#   helm upgrade --install -n wamn-system wamn-host \
#     oci://ghcr.io/wasmcloud/charts/runtime-operator --version 2.9.0 \
#     -f deploy/platform/values-host-default.yaml \
#     -f deploy/platform/values-host-receiving-pat.yaml
#
# Helm replaces lists rather than merging their members. `runtime.hostGroups`
# is therefore repeated as one complete effective host group: an env-only list
# here would silently discard the base profile's replicas, listener, mounts,
# CA, and resource limits.
#
# The identity-reader, ExecutorPlatform, CallableHttp, and EventMaterializer
# Secrets are production outputs of `wamn-ctl provision-project-env`. All four
# references are
# explicitly mandatory; an absent Secret leaves the host Pod unstartable. The
# ExecutorPlatform carrier is required when a serving host resolves an exact
# released wiring on demand. The route-caller bearer Secret is
# intentionally not mounted here: callers present that PAT, while the host
# verifies it against sysdb and derives the expected environment-scoped service
# subject from this trusted org/project plus the released environment.
# Human org-user membership remains owned by the identity epic and Slice v; it
# is not fabricated as deployment configuration here.
#
# Replace the zero digest with `wamn-ctl print-release-env` output before
# applying. A nonexistent digest makes startup refuse rather than serving an
# unintended release.

runtime:
  hostGroups:
    - name: default
      namespace: warehouse-eu-3
      replicas: 3
      service:
        type: ClusterIP
      http:
        enabled: true
        port: 80
      env:
        - name: WAMN_PG_URL
          valueFrom:
            secretKeyRef:
              name: probe-guest-sql
              key: url
        - { name: WAMN_PG_GUEST_POOL_MAX, value: "14" }
        - { name: WAMN_PG_PLATFORM_POOL_MAX, value: "2" }
        - { name: WAMN_HTTP_ROUTE_IN_FLIGHT_LIMIT, value: "64" }
        - { name: WAMN_WASMTIME_CACHE_DIR, value: /tmp/wamn-wasmtime-cache }
        - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.wamn-system.svc.cluster.local:4317 }
        - { name: OTEL_BSP_SCHEDULE_DELAY, value: "1" }
        - { name: OTEL_BSP_MAX_EXPORT_BATCH_SIZE, value: "1" }
        - { name: DOCKER_CONFIG, value: /etc/wamn/registry }
        - { name: WAMN_REGISTRY_AUTH_FILE, value: /etc/wamn/registry/config.json }
        - name: WAMN_COMPONENT_ARTIFACT_BASE
          value: registry.probe.invalid:5000/proofs/components
        - name: WAMN_EVT_NATS_URL
          value: nats://nats.probe.invalid:4222
        - name: WAMN_EVT_NATS_USERNAME
          valueFrom:
            secretKeyRef:
              name: wamn-event-nats
              key: username
              optional: false
        - { name: WAMN_EVT_NATS_PASSWORD_FILE, value: /etc/wamn/event-nats/password }
        - { name: WAMN_MAT_NATS_BINDING_FILE, value: /etc/wamn/materializer-nats/binding.json }
        - { name: WAMN_EVT_ORG, value: acme }
        - { name: WAMN_EVT_PROJECT, value: receiving }
        - { name: WAMN_EVT_ENV, value: dev }
        - { name: WAMN_ORG, value: acme }
        - { name: WAMN_PROJECT, value: receiving }
        - { name: WAMN_SCHEMA, value: receiving }
        - name: WAMN_SYSTEM_URL
          valueFrom:
            secretKeyRef:
              name: probe-identity-reader
              key: url
              optional: false
        - name: WAMN_EXECUTOR_PLATFORM_PG_URL
          valueFrom:
            secretKeyRef:
              name: probe-executor-platform
              key: url
              optional: false
        - name: WAMN_HTTP_ADMITTER_PG_URL
          valueFrom:
            secretKeyRef:
              name: probe-http-admitter
              key: url
              optional: false
        - name: WAMN_EVENT_MATERIALIZER_PG_URL
          valueFrom:
            secretKeyRef:
              name: probe-event-materializer
              key: url
              optional: false
      volumes:
        - name: event-nats
          secret:
            secretName: wamn-event-nats
            optional: false
            items:
              - key: password
                path: password
        - name: materializer-nats
          secret:
            secretName: wamn-materializer-nats
            optional: false
            items:
              - key: binding.json
                path: binding.json
        - name: registry-pull
          secret:
            secretName: wamn-registry-pull
            optional: false
            items:
              - key: .dockerconfigjson
                path: config.json
      volumeMounts:
        - name: event-nats
          mountPath: /etc/wamn/event-nats
          readOnly: true
        - name: materializer-nats
          mountPath: /etc/wamn/materializer-nats
          readOnly: true
        - name: registry-pull
          mountPath: /etc/wamn/registry
          readOnly: true
      ociCaPaths:
        - "/runtime-cert/ca.crt"
      extraArgs:
        - "--release-artifact-base=registry.probe.invalid:5000/proofs/releases"
        - "--release-manifest-digest=sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        - "--allow-insecure-registries"
      resources:
        requests:
          memory: "256Mi"
          # ALIGNED WITH values-host-default.yaml (wamn-0h0g.17.30). This overlay
          # was cut at 84af9ebc with the default's then-values, 250m/2; when
          # 2fff2c03 raised the default to 2/6 ("WHY 6 AND NOT 2") it edited
          # only the default, and the journey deploys THIS file. So every
          # measurement through docs/perf/2026.09/6-throughput.md ran under the
          # 2-core cap that comment says it removed: throttled in 44-68 % of
          # its CPU periods at four clients, with PostgreSQL, both pools and
          # NATS idle. The single-request experiment read the cap as inert;
          # the throughput sweep reads it as the first thing that saturates.
          # Both were true; the sweep is the one that matters.
          cpu: "2"
        limits:
          memory: "4Gi"
          cpu: "6"
        defaultHeapMemory: "256MiB"
        coreInstances: 512
        guestMemoryMode: count
        maxConcurrentStarts: 4
