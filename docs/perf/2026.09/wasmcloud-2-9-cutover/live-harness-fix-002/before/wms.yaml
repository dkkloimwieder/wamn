# HTTP ingress. This component owns only transport adaptation: authoritative
# route/auth lookup and inline router delivery remain host capabilities. It
# imports no PostgreSQL, graph, or run-queue interface.
#
# Push the locked build artifact before applying:
#   wash push localhost:5000/wamn/http-route:dev /bench/http-route.wasm \
#     --insecure --allow-latest
#
# The host group must supply wamn:flow-http-routing@0.1.0 and
# wamn:router-delivery@0.1.0. Neither capability grants direct run-state SQL.
---
apiVersion: v1
kind: Service
metadata:
  name: flow-http
  namespace: warehouse-eu-3
  labels: { app: flow-http }
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: flow-http
  # Must be one of `operator.watchNamespaces` (deploy/infra/values-wamn.yaml),
  # or the operator never sees this object at all.
  namespace: warehouse-eu-3
spec:
  replicas: 1
  template:
    spec:
      # [wamn-0h0g.15.15] The host group this schedules onto — the label the
      # host reports from `--host-group` (deploy/platform/values-host-default.yaml).
      hostSelector:
        hostgroup: default
      # The environment whose hosts may run this workload, matched against
      # `Host.Environment` (the host Pod's namespace). Under the operator's
      # `allowSharedHosts: false` lock this is only honoured when it equals this
      # object's own namespace; any other value is refused with a
      # `CrossEnvironmentSchedulingDenied` Warning Event and a
      # `HostSelection=False` condition. Naming it rather than leaving it unset
      # makes the target legible and gives the RC one string to flip to prove
      # the refusal.
      environment: warehouse-eu-3
      # HTTP exposure: the operator manages EndpointSlices for this Service
      # (above) — the deprecated runtime-gateway is never adopted.
      kubernetes:
        service:
          name: flow-http
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [incoming-handler]
          config:
            host: probe.route.invalid
        - namespace: wamn
          package: flow-http-routing
          version: "0.1.0"
          interfaces: [routing]
        - namespace: wamn
          package: router-delivery
          version: "0.1.0"
          interfaces: [delivery]
      components:
        - name: flow-http
          image: registry.probe.invalid:5000/proofs/flow-http@sha256:abc123
          imagePullPolicy: Always
          localResources:
            allowedIpNameLookups: []
            config:
              wamn.tenant: "wms-route-auth"
              wamn.catalog: "wms-catalog"
              wamn.environment: "dev"
              wamn.project: "wms"
              wamn.schema: "wms"
