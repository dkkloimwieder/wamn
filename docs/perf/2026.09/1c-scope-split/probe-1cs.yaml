apiVersion: v1
kind: Pod
metadata: { name: warm-probe, namespace: wamn-receiving-journey }
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: wamn-host:receiving-a6ca3a0eadfb-3173852-debug
      imagePullPolicy: Never
      env:
        - name: PAT
          valueFrom: { secretKeyRef: { name: wamn-pat-route-caller-acme--receiving--dev, key: token } }
      command: ["/bin/sh","-c","sleep 3600"]
