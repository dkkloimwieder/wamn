apiVersion: apps/v1
kind: Deployment
metadata:
  name: c4-files-minio
spec:
  replicas: 1
  selector:
    matchLabels: {app: c4-files-minio}
  template:
    metadata:
      labels: {app: c4-files-minio}
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: minio
          image: chainguard/minio@sha256:aea6c163749e1caca37f907976dcf337177ddf5f558808f2aa591618fd3a6eef
          imagePullPolicy: IfNotPresent
          args: [server, /data]
          env:
            - {name: MINIO_ROOT_USER, value: file-fixture}
            - {name: MINIO_ROOT_PASSWORD, value: file-fixture-only}
            - {name: MINIO_DOMAIN, value: localhost}
            - {name: MINIO_SCANNER_SPEED, value: fastest}
          ports: [{containerPort: 9000}]
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: c4-files-minio
spec:
  selector: {app: c4-files-minio}
  ports: [{port: 9000, targetPort: 9000}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: c4-files-minio-policy
data:
  files-a.json: |
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::files-a"]},{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::files-a/generation-one/files/public/*"]}]}
  files-b.json: |
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::files-b"]},{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::files-b/generation-two/files/public/*"]}]}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: c4-files-minio-prepare
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - &mc
          name: buckets
          image: chainguard/minio-client@sha256:8dc1dceb7371c9091b17b450e4da67a492f6de3a22d716af14888a7d8597457e
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/mc, --config-dir, /tmp/mc]
          env:
            - {name: MC_HOST_files, value: "http://file-fixture:file-fixture-only@c4-files-minio:9000"}
          volumeMounts: [{name: policy, mountPath: /policy, readOnly: true}]
          args: [mb, --ignore-existing, files/files-a, files/files-b]
        - <<: *mc
          name: public-a
          args: [anonymous, set-json, /policy/files-a.json, files/files-a]
        - <<: *mc
          name: public-b
          args: [anonymous, set-json, /policy/files-b.json, files/files-b]
        - <<: *mc
          name: staging-a
          args: [ilm, rule, add, --expire-days, "1", --prefix, generation-one/files/_wamn_files/staging/, files/files-a]
      containers:
        - <<: *mc
          name: staging-b
          args: [ilm, rule, add, --expire-days, "1", --prefix, generation-two/files/_wamn_files/staging/, files/files-b]
      volumes:
        - name: policy
          configMap: {name: c4-files-minio-policy}
