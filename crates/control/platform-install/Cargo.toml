[package]
name = "wamn-platform-install"
description = "Helm installation and platform bootstrap."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
test-util = []
ops = ["wamn-control-provision/ops"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
hex.workspace = true
ring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
sqlx = { workspace = true, features = ["migrate", "postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time", "net"] }
tracing.workspace = true
url.workspace = true
oci-client.workspace = true
tempfile.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
wamn-broker.workspace = true
wamn-digest.workspace = true
wamn-kubernetes.workspace = true
wamn-postgres.workspace = true
wamn-registry.workspace = true
wamn-control-provision.workspace = true
wamn-platform-identity.workspace = true
wamn-identity-client.workspace = true
wamn-identity-protocol.workspace = true
wamn-package-artifact.workspace = true
wamn-release-control.workspace = true
wamn-compiler.workspace = true
wamn-catalog.workspace = true
postgres-protocol.workspace = true

[dev-dependencies]
wamn-test-postgres.workspace = true
wamn-control-provision = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
rcgen.workspace = true
tokio-rustls.workspace = true

[lints]
workspace = true
