[package]
name = "wamn-package-control"
description = "Package control operations."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
test-util = ["dep:wamn-fixture-package", "dep:wamn-test-infrastructure", "wamn-package-artifact/test-util"]

[dependencies]
pg_query = "=6.2.1"
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["migrate", "postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
wamn-build.workspace = true
wamn-broker = { workspace = true }
wamn-digest.workspace = true
wit-component = { workspace = true }
wit-parser = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
oci-client = { workspace = true }
wamn-component-policy.workspace = true
object_store = { workspace = true, features = ["gcp"] }
reqwest = { workspace = true, features = ["rustls"] }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }
wamn-catalog = { workspace = true }
wamn-component-composer = { workspace = true }
wasmparser = { workspace = true }
wamn-package-artifact = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-registry = { workspace = true }
postgres-protocol = { workspace = true }
wamn-platform-identity = { workspace = true }
wamn-record-history = { workspace = true }
wamn-runtime = { workspace = true }
wamn-engine = { workspace = true }
wamn-compiler = { workspace = true }
wamn-schema-introspection = { workspace = true }
wamn-fixture-package = { workspace = true, optional = true }
wamn-test-infrastructure = { workspace = true, optional = true }

[dev-dependencies]
wamn-package-artifact = { workspace = true, features = ["test-util"] }
wamn-runtime = { workspace = true, features = ["test-util"] }
wamn-fixture-package = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-control-provision = { workspace = true, features = ["test-util"] }
wamn-platform-identity = { workspace = true, features = ["test-util"] }
wamn-test-infrastructure = { workspace = true }
wamn-test-postgres = { workspace = true }
wit-component = { workspace = true, features = ["dummy-module"] }
futures-util = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
