[package]
name = "wamn-control-provision"
description = "Database role declarations and provisioning SQL."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
ops = []
# The system test database minimum (`test_database`). It starts a private
# PostgreSQL server for the test process, so no production build enables it.
test-util = ["dep:wamn-test-postgres"]

[dependencies]
anyhow.workspace = true
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["migrate", "macros", "postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }

wamn-compiler = { workspace = true }
wamn-digest.workspace = true
wamn-event-wire = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# The per-project-env credential Secrets render as JSON (kubectl apply accepts
# JSON manifests). No schemars — this is a provisioning tool, not a published
# contract.
serde_json = { workspace = true }
# The materializer workload renders from its YAML template.
serde_yaml = { workspace = true }

# wamn-q3n.6 provision-org: the org Cluster-PAIR renderer takes the registry's
# Org / Tier / Side vocabulary and derives cluster names via `cluster_name`, so
# the rendered clusters and the org's registry.orgs row name the same clusters.
# A lean pure→pure edge (wamn-registry deps serde + serde_json only).
wamn-registry = { workspace = true }
postgres-protocol = { workspace = true }
wamn-catalog = { workspace = true }
# The `sha256:<hex>` spelling of bundle, file and schema digests.
# The platform principal rows take their component list, names, and derived
# ids from the platform model.
wamn-identity-protocol = { workspace = true }
wamn-run-state = { workspace = true, features = ["project-key"] }
# The audit retention role name is a record history platform fixture name.
wamn-record-history = { workspace = true }

# Targeted login identities use a domain-separated digest.
hex = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
wamn-test-postgres = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wamn-control-provision = { workspace = true, features = ["test-util"] }
wamn-fixture-package = { workspace = true }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
