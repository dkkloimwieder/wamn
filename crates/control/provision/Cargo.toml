[package]
name = "wamn-control-provision"
description = "wamn project provisioning (2.3): PURE Postgres SQL builders + identifier naming + per-project-env credential Secret rendering for standing up a per-project-env database (D6: CloudNativePG). No DB / K8s client / clock — the `provision-org` and `provision-project-env` subcommands (wamn-ctl) supply the effects. Cross-project isolation = per-project-env DATABASE + per-generation CONNECT (PUBLIC and the stable `wamn_app` role revoked), with RLS confining within (the 2.2 model)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
ops = []
# The system test database floor (`test_database`). It starts a private
# PostgreSQL server for the test process, so no production build enables it.
test-util = ["dep:wamn-test-postgres"]

[[test]]
name = "copy_snapshot"
path = "tests/copy_snapshot.rs"
required-features = ["ops"]

[[test]]
name = "ops_storage"
path = "tests/ops_storage.rs"
required-features = ["ops"]

[dependencies]
# Native broker configuration types. Network effects stay in wamn-ctl.
async-nats = { workspace = true, features = ["jetstream", "server_2_10"] }
wamn-event-wire = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# The per-project-env credential Secrets render as JSON (kubectl apply accepts
# JSON manifests). No schemars — this is a provisioning tool, not a published
# contract.
serde_json = { workspace = true }

# wamn-q3n.6 provision-org: the org Cluster-PAIR renderer takes the registry's
# Org / Tier / Side vocabulary and derives cluster names via `cluster_name`, so
# the rendered clusters and the org's registry.orgs row name the same clusters.
# A lean pure→pure edge (wamn-control-registry deps serde + serde_json only).
wamn-control-registry = { workspace = true }
wamn-pg-core = { workspace = true }
# The platform principal rows take their component list, names, and derived
# ids from the app_system model.
wamn-project-state = { workspace = true }
wamn-run-state = { workspace = true, features = ["tenant-key"] }
# Operation-grant reconciliation consumes the same deny-unknown-fields package
# manifest as generation. It derives grants from that public parsed shape; it
# does not carry a second manifest grammar.
wamn-schema-generator = { workspace = true }
# The audit retention role name is a record history platform fixture name.
wamn-record-history = { workspace = true }

# wamn-0h0g.8.18 control_author: the scoped A/B generation role name is a
# domain-separated digest of (org, project, environment, database), and the
# fail-closed connection-input check parses that URL without opening it. Pure
# text and pure hashing — still no DB / K8s / tokio / clock dependency.
hex = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
wamn-test-postgres = { workspace = true, optional = true }

# No database or Kubernetes effects. The builders return text, JSON, and native
# broker configuration values. The `provision-project-env` driver (wamn-ctl) holds
# the tokio_postgres connection; the optional live-apply gate (tests/provision.rs)
# shells out to `psql` — so there is no database dependency even in dev, the same
# pattern as wamn-run-state. PostgreSQL quoting comes from the guest-safe
# wamn-pg-core leaf.

[dev-dependencies]
wamn-catalog = { workspace = true }
# wamn-0h0g.8.21: `catalog.deployment_attestations` is CONTROL-plane only, so its
# live test belongs to this crate's portable-store gate, while the Rust binding
# for `catalog.register_deployment_attestation` belongs to the pure SQL owner.
# A DEV edge only — nothing in this crate's production surface reaches it.
# This test edge adds no database effects to the production builders.
wamn-schema-control = { workspace = true }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
