[package]
name = "wamn-control"
description = "Control operations that the wamn-ctl CLI, the dev loop, and test support call."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The operational verbs that ship in the separate `wamn-ctl-ops` binary.
ops = ["dep:wamn-event-wire", "wamn-control-provision/ops"]

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true, features = ["jetstream"] }
chrono = { workspace = true, features = ["clock"] }
hex = { workspace = true }
oci-client = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
ring = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
tracing = { workspace = true }
url = { workspace = true }
wamn-catalog = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-control-registry = { workspace = true }
wamn-event-reg = { workspace = true }
# The retained delivery advisory wire type the `ops` event-advisories verb decodes.
wamn-event-wire = { workspace = true, optional = true }
wamn-execution-contract = { workspace = true }
wamn-pg-core = { workspace = true }
wamn-platform-identity = { workspace = true }
wamn-record-history = { workspace = true }
wamn-run-state = { workspace = true }
# push_component is the sole production caller of byte admission and shares
# the immutable OCI media/reference contract with the runtime pull side.
wamn-runtime = { workspace = true }
wamn-schema-control = { workspace = true }
wamn-schema-generator = { workspace = true }
wamn-schema-introspection = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
tokio-rustls = { workspace = true }
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-control-provision = { workspace = true, features = ["test-util"] }
wamn-project-state = { workspace = true, features = ["test-util"] }
wamn-test-infrastructure = { workspace = true }
wamn-test-postgres = { workspace = true }
wit-component = { version = "=0.252.0", features = ["dummy-module"] }
wit-parser = "=0.252.0"

[lints]
workspace = true
