[package]
name = "wamn-plugin"
description = "PostgreSQL host service and authorized transaction transport."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
wasm_component_model_implements = ["wash-runtime/wasm_component_model_implements", "wamn-engine/wasm_component_model_implements"]

[dependencies]
chrono = { workspace = true, features = ["std"] }
postgres-protocol.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "chrono", "uuid", "json", "bigdecimal"] }
wamn-postgres.workspace = true
wamn-scalar.workspace = true
wamn-workflow-graph.workspace = true
wamn-app.workspace = true
wamn-package.workspace = true
wamn-number-pattern.workspace = true
serde = { workspace = true, features = ["derive"] }
wamn-authentication = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
boon.workspace = true
bytes.workspace = true
futures-util = { workspace = true }
http-body-util.workspace = true
hyper.workspace = true
url.workspace = true
wasmtime-wasi-http.workspace = true
wamn-blobstore.workspace = true
http.workspace = true
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "fs", "net", "io-util", "rt", "macros", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
wamn-authority = { workspace = true }
wamn-connection = { workspace = true }
wamn-connection-type.workspace = true
wamn-digest = { workspace = true }
wamn-engine = { workspace = true }
wamn-event = { workspace = true }
wamn-identity-protocol.workspace = true
wamn-registry = { workspace = true }
wamn-routes.workspace = true
wamn-role.workspace = true
wash-runtime = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
