[package]
name = "wamn-oci"
description = "Registry component artifacts for the execution engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "docker-credential-wamn"
path = "src/bin/docker-credential-wamn.rs"
test = false

[features]
sqlx = ["dep:sqlx"]
test-util = ["wamn-engine/test-util", "wamn-catalog/test-util", "tokio/io-util", "tokio/net", "tokio/rt"]

[dependencies]
wamn-digest = { workspace = true }
async-trait = { workspace = true }
oci-client = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "fs", "net", "io-util", "rt", "macros", "sync"] }
wamn-catalog = { workspace = true }
wamn-engine = { workspace = true }
sqlx = { workspace = true, optional = true, features = ["postgres"] }
wamn-registry = { workspace = true }
wamn-kubernetes = { workspace = true }
tower-service = { workspace = true }
http-auth = { version = "0.1.10", default-features = false }
base64 = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { workspace = true, features = ["http1", "http2", "tls12"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

[dev-dependencies]
wash-runtime = { workspace = true, features = ["oci"] }
wasmtime = { workspace = true }
base64 = { workspace = true }
docker_credential = "=1.4.0"
tokio = { workspace = true, features = ["test-util", "macros", "net", "io-util", "rt"] }
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-engine = { workspace = true, features = ["test-util"] }
wat = "=1.254.2"
hyper = { workspace = true, features = ["server"] }

[lints]
workspace = true
