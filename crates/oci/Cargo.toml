[package]
name = "wamn-oci"
description = "Registry component artifacts for the execution engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "docker-credential-wamn"
path = "src/bin/docker-credential-wamn.rs"
test = false

[dependencies]
wamn-oci-reference.workspace = true
wamn-gcp-metadata.workspace = true
wamn-package.workspace = true
wamn-digest = { workspace = true }
oci-client = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "fs", "net", "io-util", "rt", "macros", "sync"] }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

http.workspace = true
wamn-connection-type.workspace = true
wamn-registry.workspace = true
wasmparser.workspace = true

[dev-dependencies]
wamn-build.workspace = true
wit-component = { workspace = true, features = ["dummy-module"] }
wit-parser.workspace = true
wash-runtime = { workspace = true, features = ["oci"] }
wasmtime = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "net", "io-util", "rt"] }
wamn-engine = { workspace = true }
wat = "=1.254.2"
wamn-test-infrastructure = { workspace = true }

[lints]
workspace = true
