[package]
name = "wamn-oci"
description = "Registry component artifacts for the execution engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "docker-credential-wamn"
path = "src/bin/docker-credential-wamn.rs"
test = false

[features]
sqlx = ["dep:sqlx"]
test-util = ["tokio/io-util", "tokio/net", "tokio/rt"]

[dependencies]
wamn-oci-reference.workspace = true
wamn-package.workspace = true
wamn-digest = { workspace = true }
async-trait = { workspace = true }
oci-client = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "fs", "net", "io-util", "rt", "macros", "sync"] }
sqlx = { workspace = true, optional = true, features = ["postgres"] }
wamn-http-client = { workspace = true, features = ["tls12"] }
http-auth = { version = "0.1.10", default-features = false }
base64 = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
hyper = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

[dev-dependencies]
wash-runtime = { workspace = true, features = ["oci"] }
wasmtime = { workspace = true }
base64 = { workspace = true }
docker_credential = "=1.4.0"
tokio = { workspace = true, features = ["test-util", "macros", "net", "io-util", "rt"] }
wamn-engine = { workspace = true, features = ["test-util"] }
wat = "=1.254.2"
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }

[lints]
workspace = true
