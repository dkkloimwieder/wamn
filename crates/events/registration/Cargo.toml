[package]
name = "wamn-event-reg"
description = "wamn event registration model (EVT-REG, D19 v3 §5): a subscribing flow's declaration — entity id, ops, and condition — that the materializer consumes. Rename-proof by entity-id keying. Stored as jsonb in catalog.event_registrations."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# A registration resolves against the canonical catalog (3.1) — by entity ID,
# the rename-proof key (EVT-OIDMAP) — and reuses its Issue/Severity validation
# shape.
wamn-schema-model = { workspace = true }
# The op set is the same Op the CDC envelope carries, so a registration's ops
# and the wire's `<op>` segment can never drift.
wamn-event-wire = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# Import/export-able (EventRegistration::from_json/to_json) and stored as jsonb.
serde_json = { workspace = true }
# Conditions use JMESPath (the codebase's one expression language) and compile
# at write time to reject bad syntax; the materializer owns evaluation.
jmespath = { workspace = true }
