[package]
name = "wamn-schema-compiler"
description = "wamn DDL compiler (3.2): catalog / catalog-diff -> migration plan -> Postgres DDL. Default emission is additive-only; destructive emission is operations-only."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Destructive SQL emission is an internal operations capability. Default
# consumers may classify a plan but can emit only additive SQL.
ops = []

[[test]]
name = "ddl"
path = "tests/ddl.rs"
required-features = ["ops"]

[dependencies]
# The compiler consumes the canonical catalog model (3.1) and its diff.
wamn-schema-model = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
uuid = { version = "1", default-features = false, features = ["v5"] }
wamn-pg-core = { workspace = true }

# No DB dependency: this crate EMITS SQL, it does not execute it (the live apply
# path is the migration engine 2.5 / hosting). The apply-verification test shells
# out to `psql` against a throwaway Postgres, gated on WAMN_DDL_PG_URL.

[dev-dependencies]
# TESTS ONLY, and a deliberate dev-only cycle (cargo permits it): the DDL this
# crate emits calls `wamn_authority.tenant_key`, so every live gate that APPLIES
# generated DDL needs that function installed first. Building the statement from
# the ONE builder that provisioning uses is the only way to install it without a
# second definition of a security-critical function.
wamn-control-provision = { workspace = true }

[lints]
workspace = true
