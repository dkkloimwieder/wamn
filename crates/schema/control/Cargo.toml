[package]
name = "wamn-schema-control"
description = "Schema lifecycle, migration, and impact control: a pure forward-only executor that emits one-transaction plans for an effect-shell driver."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
sqlx = { workspace = true, features = ["migrate", "postgres"] }
wamn-digest.workspace = true
pg_query = "=6.2.1"
wamn-catalog = { workspace = true }
wamn-record-history = { workspace = true }
postgres-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
