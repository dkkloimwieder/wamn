[package]
name = "wamn-schema-model"
description = "Canonical wamn metadata catalog schema (3.1): entity/field/relation/index/constraint model, validation, import/export, version diff. Neutral primitives; opinionated models live in modules (D14)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The published JSON Schema contract (docs/archive/contracts/catalog-model.schema.json) is
# GENERATED from these types (single source of truth); a drift test keeps them
# in lockstep. Same setup as crates/execution/flow-model (5.1).
schemars = { workspace = true }

[dev-dependencies]
# tests validate each fixture catalog against the generated JSON Schema, tying
# the language-neutral contract to the Rust types. boon is a pure-Rust validator
# with no network/reqwest dependency (same choice as wamn-execution-contract).
boon = { workspace = true }
