[package]
name = "wamn-schema-introspection"
description = "PostgreSQL catalog introspection and normalized migration-derived schema IR."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
wamn-scalar.workspace = true
wamn-catalog = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
wamn-record-history = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true, features = ["macros", "migrate"] }
url = { workspace = true }
wamn-fixture-package = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
