[package]
name = "wamn-compiler"
description = "Deterministic package-owned application artifacts derived from migration catalog IR."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-postgres.workspace = true
tempfile.workspace = true
postgres-protocol = { workspace = true }
wamn-scalar.workspace = true
wamn-digest.workspace = true
wamn-identity-protocol.workspace = true
anyhow.workspace = true
pg_query = "=6.2.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
# `Executor::describe` is behind `sqlx-core/offline`, which only `macros` turns on.
sqlx = { workspace = true, features = ["migrate", "macros", "postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
url.workspace = true
wamn-schema-introspection = { workspace = true }
wamn-catalog = { workspace = true }
wamn-record-history = { workspace = true }
wamn-number-pattern = { workspace = true }

wit-parser = { workspace = true }

[dev-dependencies]
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
syn = { workspace = true, features = ["full"] }
boon.workspace = true

wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-fixture-package = { workspace = true }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
