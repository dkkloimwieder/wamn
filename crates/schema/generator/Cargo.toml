[package]
name = "wamn-schema-generator"
description = "Deterministic package-owned application artifacts derived from migration catalog IR."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-scalar.workspace = true
wamn-digest.workspace = true
wamn-schema-control.workspace = true
anyhow.workspace = true
base64.workspace = true
pg_query = "=6.2.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
# `Executor::describe` is behind `sqlx-core/offline`, which only `macros` turns on.
sqlx = { workspace = true, features = ["macros", "postgres", "runtime-tokio"] }
syn = { workspace = true, features = ["full", "visit"] }
tokio = { workspace = true, features = ["macros", "process", "rt"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
url.workspace = true
wamn-schema-introspection = { workspace = true }
wamn-catalog = { workspace = true }
wamn-record-history = { workspace = true }
wamn-number-pattern = { workspace = true }

wit-parser = { workspace = true }

[build-dependencies]
wamn-digest.workspace = true

[dev-dependencies]
wamn-component-composer = { workspace = true }
wat = "=1.254.2"
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-fixture-package = { workspace = true }
proptest.workspace = true
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
