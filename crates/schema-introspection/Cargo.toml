[package]
name = "wamn-schema-introspection"
description = "PostgreSQL catalog introspection and normalized migration-derived schema IR."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-package.workspace = true
fallible-iterator = "0.2"
postgres-protocol.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
wamn-scalar.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
wamn-record-history = { workspace = true }

[dev-dependencies]
wamn-postgres.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wamn-test-infrastructure = { workspace = true }

[lints]
workspace = true
