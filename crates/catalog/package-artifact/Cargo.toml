[package]
name = "wamn-package-artifact"
description = "Reads package artifacts and their component descriptors"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = ["tokio/io-util", "tokio/net", "tokio/rt"]

[dependencies]
wamn-digest.workspace = true
anyhow = { workspace = true }
oci-client = { workspace = true }
# Inspect errors from the upstream OCI transport.
reqwest = { workspace = true, features = ["rustls"] }
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { workspace = true, features = ["http1", "http2", "tls12"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
tracing = { workspace = true }
wamn-catalog = { workspace = true }

[dev-dependencies]
hyper = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt", "test-util"] }

[lints]
workspace = true
