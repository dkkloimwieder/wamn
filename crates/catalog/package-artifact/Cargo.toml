[package]
name = "wamn-package-artifact"
description = "Reads package artifacts and their component descriptors"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = ["tokio/io-util", "tokio/net", "tokio/rt"]

[dependencies]
anyhow = { workspace = true }
hex = { workspace = true }
oci-client = { workspace = true }
# The metadata server token of the registry credential.
reqwest = { workspace = true, features = ["rustls"] }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
wamn-catalog = { workspace = true }
wamn-execution-contract = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt", "test-util"] }

[lints]
workspace = true
