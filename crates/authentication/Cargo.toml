[package]
name = "wamn-authentication"
description = "Protected route authentication and issuer verification."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = ["wamn-engine/test-util", "wamn-catalog/test-util", "wamn-authority/test-util", "wamn-connection/test-util"]

[dependencies]
wamn-digest.workspace = true
anyhow = { workspace = true }
async-trait = { workspace = true }
hmac = { workspace = true }
jsonwebtoken.workspace = true
moka = { workspace = true, features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
wamn-authority = { workspace = true }
wamn-catalog = { workspace = true }
wamn-connection = { workspace = true }
wamn-engine = { workspace = true }
wamn-identity-protocol = { workspace = true, features = ["sqlx"] }
wamn-registry = { workspace = true }

[lints]
workspace = true
