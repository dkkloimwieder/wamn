[package]
name = "wamn-authentication"
description = "Protected route authentication and issuer verification."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-application.workspace = true
wamn-package.workspace = true
wamn-connection-type.workspace = true
wamn-digest.workspace = true
anyhow = { workspace = true }
async-trait = { workspace = true }
hmac = { workspace = true }
jsonwebtoken.workspace = true
moka = { workspace = true, features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
wamn-authority = { workspace = true }
wamn-connection = { workspace = true }
wamn-envelope.workspace = true
wamn-postgres.workspace = true
wamn-identity-protocol.workspace = true
wamn-registry = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
tokio-rustls = { workspace = true }

[lints]
workspace = true
