[package]
name = "wamn-flow"
description = "Canonical wamn flow-graph schema (5.1): types, validation, import/export, version diff. A flow is data, not code."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-schema-model = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
# The published JSON Schema contract (docs/archive/contracts/flow-schema.schema.json) is GENERATED
# from these types (single source of truth); a drift test keeps them in lockstep.
schemars = { workspace = true }
# tests validate each fixture flow against the generated JSON Schema, tying the
# language-neutral contract to the Rust types. boon is a pure-Rust validator
# with no network/reqwest dependency. Request-entry input contracts also use it
# to compile JSON Schema draft 2020-12 during structural validation.
boon = { workspace = true }

[dev-dependencies]
# Flow fixtures exercise the same JMESPath grammar as standard-node expression
# fields; production flow parsing no longer evaluates an ordering expression.
jmespath = { workspace = true }
