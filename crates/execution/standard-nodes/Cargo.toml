[package]
name = "wamn-standard-nodes"
description = "Built-in standard nodes over the pure flow-model node contract."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The canonical pure execution and publication contract for standard nodes.
wamn-flow = { workspace = true }
# Reuse the transport-neutral response row shaper for `postgres-query`.
wamn-entity-access = { workspace = true }
wamn-pg-core = { workspace = true }
serde_json = { workspace = true }
# Off-the-shelf expression engine for transform/conditional: JMESPath is a
# frozen public SPEC (we maintain no language), JSON -> JSON, side-effect free,
# and has NO arithmetic — so it cannot manufacture floats out of the exact-
# decimal strings catalog data travels as.
jmespath = { workspace = true }
