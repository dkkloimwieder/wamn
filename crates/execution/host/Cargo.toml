[package]
name = "wamn-execution-host"
description = "Shared production router driver."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-catalog = { workspace = true }
wamn-control-registry = { workspace = true }
wamn-event-wire = { workspace = true }
wamn-router = { workspace = true }
wamn-runtime = { workspace = true, features = ["wasm_component_model_implements"] }
wash-runtime = { workspace = true }
wasmtime-wasi = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
tracing-opentelemetry = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
serde_json = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
