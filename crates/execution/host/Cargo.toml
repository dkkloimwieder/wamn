[package]
name = "wamn-execution-host"
description = "The route path: the operation host, the delivery bridge, and release readiness."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-credential-store = { workspace = true }
wamn-catalog = { workspace = true }
wamn-control-registry = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-schema-generator = { workspace = true }
wamn-event-wire = { workspace = true }
wamn-execution-contract = { workspace = true }
wamn-platform-identity = { workspace = true }
wamn-identity-client = { workspace = true }
wamn-project-state = { workspace = true }
wamn-run-state = { workspace = true }
wamn-runtime = { workspace = true, features = ["wasm_component_model_implements"] }
wamn-engine = { workspace = true }
wash-runtime = { workspace = true }
futures-util = { workspace = true }
anyhow = { workspace = true }
boon = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
tracing-opentelemetry = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio-postgres = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
wasmtime-wasi-http = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
object_store = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde_yaml = { workspace = true }
# `wamn_catalog::fixture_graph` is gated behind `test-util`.
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-control = { workspace = true }
wamn-schema-control = { workspace = true }
wamn-test-infrastructure = { workspace = true }
wamn-runtime = { workspace = true, features = ["test-util"] }
wamn-session = { workspace = true }
wamn-control-provision = { workspace = true, features = ["test-util"] }
wamn-fixture-package = { workspace = true }
wamn-component-composer = { workspace = true }
wasmparser = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }
tokio-rustls = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
wat = "=1.254.2"
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
