[package]
name = "wamn-workflow"
description = "The environment workflow router and durable run queue. Every node calls invoke_operation."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-registry.workspace = true
jmespath.workspace = true
wamn-platform-install.workspace = true
postgres-protocol.workspace = true
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
wamn-broker = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
wamn-catalog = { workspace = true }
wamn-event-wire = { workspace = true }
# The route path, the operation host, and the delivery bridge. This crate sits
# above it, and it never depends on this crate.
wamn-execution-host = { workspace = true }
wamn-identity-protocol = { workspace = true }
wamn-run-state = { workspace = true }
wamn-capability-authority = { workspace = true }
wamn-connections = { workspace = true }
wamn-postgres-capability = { workspace = true }
wamn-http-capability = { workspace = true }
wamn-events-capability = { workspace = true }
wamn-engine = { workspace = true }
wash-runtime = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
tracing-opentelemetry = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The workflow contract parks, releases, and lists runs in the run plane.

[dev-dependencies]
sqlx = { workspace = true, features = ["macros", "migrate"] }
wamn-blobstore.workspace = true
uuid.workspace = true
wash-runtime = { workspace = true, features = ["wasi-logging"] }
wamn-digest.workspace = true
wamn-compiler.workspace = true
wamn-platform-identity = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# `wamn_catalog::fixture_graph` is conditioned behind `test-util`.
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-environment = { workspace = true }
wamn-test-infrastructure = { workspace = true }
wamn-capability-authority = { workspace = true, features = ["test-util"] }
wamn-connections = { workspace = true, features = ["test-util"] }
wamn-postgres-capability = { workspace = true, features = ["test-util"] }
wamn-http-capability = { workspace = true, features = ["test-util"] }
wamn-events-capability = { workspace = true, features = ["test-util"] }
wamn-control-provision = { workspace = true, features = ["test-util"] }
url = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
wat = "=1.254.2"
# The lowering tests encode a node component from WIT in-process.
wit-component = { workspace = true, features = ["dummy-module"] }
wit-parser = { workspace = true }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
