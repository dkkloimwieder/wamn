[package]
name = "wamn-run-state"
description = "The durable execution-state contract. Its default graph is pure and guest-safe."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The framed scope digest alone.
# The shipped runtime needs exactly this much to check that a resolved guest
# credential belongs to the tenant it is about to serve (wamn-0h0g.22.6.7).
tenant-key = [
    "dep:hex",
    "dep:sha2",
]
test-util = []

[dependencies]
# Canonical JSON hashing and node-error taxonomy.
# Capture policy itself is run-state-owned and no longer comes from `Flow`.
wamn-execution-contract = { workspace = true }
# Composed run and queue statements carry their positional-parameter arity.
wamn-pg-core = { workspace = true }
# Persisted decision payloads are opaque JSON. No schemars: these are internal
# store facts, not published package contracts.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The storage traits are taken as trait objects. A macro crate: no runtime.
async-trait = { workspace = true }
hex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
wamn-catalog = { workspace = true }
wamn-control-provision = { workspace = true }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
