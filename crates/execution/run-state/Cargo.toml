[package]
name = "wamn-run-state"
description = "Run admission, leases, settlement and history pruning."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "chrono"] }
chrono.workspace = true
wamn-event-wire.workspace = true
postgres-protocol.workspace = true

[dev-dependencies]
sqlx = { workspace = true, features = ["macros", "migrate", "tls-rustls"] }
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
wamn-identity-protocol.workspace = true
wamn-postgres.workspace = true
wamn-catalog = { workspace = true }
wamn-control-provision = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
