[package]
name = "wamn-run-state"
description = "The durable execution-state contract. Its default graph is pure and guest-safe; the optional native feature owns the private effect-writer Postgres adapter."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
effect-writer-credential = [
    "dep:chrono",
    "dep:hex",
    "dep:sha2",
    "dep:url",
]
native = [
    "dep:deadpool-postgres",
    "dep:tokio-postgres",
    "effect-writer-credential",
]
test-util = []

[dependencies]
# Run-state decisions map the pure engine's execution taxonomy to persisted
# RunStatus/FailKind/NodeError literals.
wamn-runner = { workspace = true }
# Canonical JSON hashing and node-error taxonomy.
# Capture policy itself is run-state-owned and no longer comes from `Flow`.
wamn-flow = { workspace = true }
# Claim-time resolution exact-byte reads the immutable execution-plan wire.
wamn-catalog = { workspace = true }
# Composed run and queue statements carry their positional-parameter arity.
wamn-pg-core = { workspace = true }
# Persisted decision payloads are opaque JSON. No schemars: these are internal
# store facts, not published contracts (like wamn-schema-compiler / wamn-api).
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["std"], optional = true }
hex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
url = { workspace = true, optional = true }
deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
