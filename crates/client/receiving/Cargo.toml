[package]
name = "wamn-receiving-tui"
description = "The Receiving operator terminal: purchase order list and receipt entry over published routes."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wamn-receiving"
path = "src/main.rs"

[dependencies]
# The APPLICATION half of the ratatui 0.30 split, for the frame and layout
# types the screens compose. The backend is entered by the shared driver,
# wamn-client-terminal, and never by this crate's own code.
ratatui = { workspace = true }
serde_json = { workspace = true }
wamn-client = { workspace = true }
wamn-client-terminal = { workspace = true }
wamn-client-tui = { workspace = true }
# BINARY-ONLY from here down. The library half stays free of transport, clock
# and terminal, which is what keeps its assertions below the terminal layer.
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
crossterm = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
# Named by the EMITTED bindings the binary compiles in, not by code written
# here: `numeric` is `rust_decimal::Decimal` and `uuid` is `uuid::Uuid`.
rust_decimal = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }

[lints]
workspace = true
