[package]
name = "wamn-receiving-tui"
description = "The Receiving operator terminal: purchase order list and receipt entry over published routes."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The APPLICATION half of the ratatui 0.30 split, for the frame and layout
# types the screens compose. The backend is unused until this crate takes a
# binary and the terminal driver moves here (wamn-10yt.5.9).
ratatui = { workspace = true }
serde_json = { workspace = true }
wamn-client = { workspace = true }
wamn-client-tui = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait = { workspace = true }

[lints]
workspace = true
