[package]
name = "wamn-client"
description = "Transport for published WAMN routes: base URL, credentials, route construction, and operation-driven envelope semantics."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-scalar.workspace = true
wamn-digest.workspace = true
zeroize = { workspace = true }
boon = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
async-trait = { workspace = true }
rust_decimal = { workspace = true }

[lints]
workspace = true
