[package]
name = "wamn-client-terminal"
description = "The terminal driver: raw mode, the alternate screen, an event stream, and restoration on drop or panic."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The BACKEND half of the ratatui 0.30 split, which is what a driver is: the
# widget half lives in wamn-client-tui and never enters a terminal.
ratatui = { workspace = true }
crossterm = { workspace = true }
wamn-client = { workspace = true }
wamn-client-tui = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "signal"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["clock", "std"] }

[lints]
workspace = true
