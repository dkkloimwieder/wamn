[package]
name = "wamn-node-guest"
version.workspace = true
edition.workspace = true
license.workspace = true

# The wasm-guest scaffolding for CUSTOM nodes (5.4): wraps `wit-bindgen` over
# the frozen `wamn:node` 0.1 contract so a legacy SDK-authored custom node
# exports `wamn:node/handler` with one macro invocation. Deliberately a
# SEPARATE crate from `wamn-node-sdk`: the purity lint pins the SDK's dependency
# set to exactly {serde_json}, and the bindgen machinery must not leak into it.

[dependencies]
wamn-node-sdk = { workspace = true }
# The capability-bearing adapter serves the retained standard-node contract.
wamn-flow = { workspace = true, optional = true }
wit-bindgen = "0.44"
serde_json = { workspace = true }

[features]
# The capability-bearing shell facade (caps.rs): CapsCtx + the WIT<->flow-model
# contract mirrors over wamn:postgres + outbound wasi:http. OFF by default so
# the zero-import custom-node scaffolding stays physically incapable of I/O.
caps = ["dep:wamn-flow"]
# Concrete bounded adapters over the frozen wamn:node/payloads P2 import.
payloads = []
