[package]
name = "wamn-build"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[dependencies]
wamn-package.workspace = true
wamn-dev.workspace = true
tempfile.workspace = true
syn = { workspace = true, features = ["full"] }
quote.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
anyhow.workspace = true
cargo_metadata = "0.23"
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["process"] }
wamn-codegen.workspace = true
wamn-digest.workspace = true
wac-graph.workspace = true
wamn-component-policy.workspace = true
wasmparser.workspace = true
wasm-encoder = { workspace = true, features = ["wasmparser"] }
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "time"] }
[dev-dependencies]
wat = "=1.254.2"
[lints]
workspace = true
