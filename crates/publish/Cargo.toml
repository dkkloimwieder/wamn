[package]
name = "wamn-publish"
description = "Package artifact publication and edge release assembly."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
wamn-package.workspace = true
wamn-connection-type.workspace = true
wamn-oci-reference.workspace = true
wamn-component-policy.workspace = true
wamn-routes.workspace = true
wamn-edge-document.workspace = true
wash-runtime = { workspace = true, features = ["washlet"] }
chrono = { workspace = true, features = ["clock"] }
sqlx = { workspace = true, features = ["migrate", "postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
wamn-build.workspace = true
wamn-digest = { workspace = true, features = ["sqlx"] }
wit-component = { workspace = true }
wit-parser = { workspace = true }
anyhow = { workspace = true }
oci-client = { workspace = true }
object_store = { workspace = true, features = ["gcp"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }
wasmparser = { workspace = true }
wamn-oci = { workspace = true }
wamn-registry = { workspace = true }
wamn-record-history = { workspace = true }
wamn-engine = { workspace = true }
wamn-codegen = { workspace = true }
hyper = { workspace = true }

[dev-dependencies]
wamn-fixture-package = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
wamn-test-infrastructure = { workspace = true }
wit-component = { workspace = true, features = ["dummy-module"] }
futures-util = { workspace = true }

[lints]
workspace = true
