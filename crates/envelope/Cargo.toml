[package]
name = "wamn-envelope"
description = "Envelope encryption and pod identity shared by identity and OAuth consumers."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
hex.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
object_store = { workspace = true, features = ["gcp"] }
ring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
wamn-oci.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }
wamn-oci = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
