[package]
name = "wamn-http"
description = "Bound HTTP host service and OAuth token exchanges."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-application.workspace = true
wamn-connection-type.workspace = true
async-trait.workspace = true
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["std"] }
hex = { workspace = true }
hmac = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
jsonwebtoken = { workspace = true }
oauth2 = { workspace = true }
object_store = { workspace = true, features = ["gcp"] }
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
ring = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["time", "fs", "net", "io-util", "rt", "macros", "sync"] }
tokio-rustls = { workspace = true }
tower-service = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
wamn-authority = { workspace = true }
wamn-connection = { workspace = true }
wamn-engine = { workspace = true }
wamn-identity-protocol.workspace = true
wamn-http-client = { workspace = true, features = ["tls12"] }
wash-runtime = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
hyper = { workspace = true, features = ["server"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
wamn-operation = { workspace = true }
wamn-postgres.workspace = true
wat = "=1.254.2"

[lints]
workspace = true
