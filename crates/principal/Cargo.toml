[package]
name = "wamn-principal"
description = "Principal identifiers and reserved platform principals."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
sqlx = ["dep:sqlx"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["postgres", "uuid", "derive"], optional = true }
uuid = { workspace = true, features = ["v5", "serde"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
