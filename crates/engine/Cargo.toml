[package]
name = "wamn-engine"
description = "The native Wasmtime and wash-runtime engine, with no network-service plugin."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
wasm_component_model_implements = ["wash-runtime/wasm_component_model_implements"]

[dependencies]
wamn-application.workspace = true
wamn-package.workspace = true
wamn-routes.workspace = true
wamn-registry.workspace = true
wamn-digest.workspace = true
wash-runtime.workspace = true
wasmtime = { workspace = true }
wamn-component-policy = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
# Invocation tracing.
opentelemetry = { workspace = true, features = ["trace"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
wasmparser = { workspace = true }
# The expected-host router answers in native wasi:http types. hyper supplies
# the request types only, with no client or server feature.
hyper = { workspace = true }
wasmtime-wasi-http = { workspace = true }
wasmtime-wasi.workspace = true

wamn-release.workspace = true

[build-dependencies]
wit-component = { workspace = true, features = ["dummy-module"] }
wit-parser.workspace = true

[dev-dependencies]
url = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "test-util"] }
# The engine tests encode their guests from WAT in-process. Same exact pins as
# wamn-oci.
wat = "=1.254.2"
wit-component = { workspace = true, features = ["dummy-module"] }
wit-parser = { workspace = true }

[lints]
workspace = true
