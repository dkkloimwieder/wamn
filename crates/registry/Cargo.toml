[package]
name = "wamn-registry"
description = "Registry coordinates, names, and system database SQL."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
wamn-package = { workspace = true, features = ["sqlx"] }
wamn-identity-protocol.workspace = true
wamn-digest.workspace = true
hex.workspace = true
sha2.workspace = true
serde_json.workspace = true
uuid.workspace = true
sqlx = { workspace = true, features = ["postgres", "json", "uuid"] }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
