[package]
name = "wamn-registry"
description = "Registry coordinates, names, and system database SQL."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = []

[dependencies]
wamn-catalog.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
wamn-digest = { workspace = true, features = ["sqlx"] }
hex.workspace = true
serde_json.workspace = true
uuid.workspace = true
sqlx = { workspace = true, features = ["postgres", "json", "uuid"] }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
