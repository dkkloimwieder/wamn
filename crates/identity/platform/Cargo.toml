[package]
name = "wamn-platform-identity"
description = "First-party platform identity core backed by the T1 system database."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
# The publication of auth changes on the scheduler NATS (src/auth_changes.rs).
async-nats = { workspace = true, features = ["jetstream", "kv"] }
futures-util = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
tracing = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-postgres = { workspace = true }
# The token profile and its verification.
wamn-session = { workspace = true }
# The application role names of a project database.
wamn-project-state = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
# The live tests apply the system schema composition and bind platform principals.
wamn-control-provision = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }
# The tenant+app_system floor of the application writers in tests/auth_drops_live.rs.
wamn-project-state = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
