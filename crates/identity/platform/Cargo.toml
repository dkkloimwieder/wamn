[package]
name = "wamn-platform-identity"
description = "First-party platform identity core backed by the T1 system database."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-control-registry = { workspace = true }
wamn-broker = { workspace = true }
wamn-kubernetes = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
# The token profile and its verification.
wamn-session = { workspace = true }
wamn-execution-contract = { workspace = true }
# The application role names of a project database.
wamn-project-state = { workspace = true }
wamn-catalog = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
wamn-test-infrastructure = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
# The live tests apply the system schema composition and bind platform principals.
wamn-control-provision = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }
# The tenant+platform floor of the application writers in tests/auth_drops_live.rs.
wamn-project-state = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
