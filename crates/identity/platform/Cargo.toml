[package]
name = "wamn-platform-identity"
description = "First-party platform identity core backed by the T1 system database."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = ["dep:wamn-test-postgres", "wamn-catalog/test-util"]

[dependencies]
wamn-registry = { workspace = true }
wamn-broker = { workspace = true }
wamn-kubernetes = { workspace = true }
wamn-test-postgres = { workspace = true, optional = true }
jsonwebtoken = { workspace = true }
wamn-digest.workspace = true
uuid = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
# The token profile and its verification.
wamn-identity-protocol = { workspace = true }
# The application role names of a project database.
wamn-catalog = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
jsonwebtoken = { workspace = true }
chrono = { workspace = true }
wamn-runtime = { workspace = true }
wamn-identity-protocol = { workspace = true, features = ["test-util"] }
async-trait = { workspace = true }
wamn-test-infrastructure = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
# The live tests apply the system schema composition and bind platform principals.
wamn-control-provision = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }
# The project+platform base grants of the application writers in tests/auth_drops_live.rs.
wamn-platform-identity = { path = ".", features = ["test-util"] }

[lints]
workspace = true
