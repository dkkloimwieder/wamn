[package]
name = "wamn-project-state"
description = "The per-project system schema v1 (wamn-as5 / plan 2.4): the auth/RBAC/config table manifest — users, roles, permissions, configurations, api_keys — the single source for the schema name and CHECK literals, drift-guarded against deploy/sql/app-schema.sql."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The tenant+app_system test database floor (`test_database`). It starts a
# private PostgreSQL server for the test process, so no production build enables it.
test-util = ["dep:wamn-catalog", "dep:wamn-test-postgres"]

[dependencies]
uuid = { workspace = true, features = ["v5"] }
wamn-catalog = { workspace = true, optional = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true, optional = true }

[dev-dependencies]
wamn-control-provision = { workspace = true }
# The row image test compares wamn_history.row_image with the one platform
# timestamptz canonicalizer, which lives in the runtime.
chrono = { workspace = true }
wamn-runtime = { workspace = true }
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
