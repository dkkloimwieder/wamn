[package]
name = "wamn-identity"
description = "First-party platform identity core backed by the T1 system database."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = ["wamn-catalog/test-util"]

[dependencies]
wamn-envelope.workspace = true
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json"] }
wamn-registry = { workspace = true }
jsonwebtoken = { workspace = true }
wamn-digest = { workspace = true, features = ["sqlx"] }
uuid = { workspace = true }
anyhow = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
data-encoding.workspace = true
nkeys.workspace = true
sha2.workspace = true
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# The token profile and its verification.
wamn-identity-protocol = { workspace = true, features = ["sqlx"] }
# The application role names of a project database.
wamn-catalog = { workspace = true }

[dev-dependencies]
wamn-kubernetes = { workspace = true }
wamn-environment = { workspace = true }
wamn-registry = { workspace = true, features = ["test-util"] }
sqlx = { workspace = true, features = ["macros", "migrate"] }
url = { workspace = true }
jsonwebtoken = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
# The live tests apply the system schema composition and bind platform principals.
wamn-provision = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }
# The project+platform base grants of the application writers in tests/auth_drops_live.rs.
wamn-identity = { path = ".", features = ["test-util"] }

[lints]
workspace = true
