[package]
name = "wamn-identity"
description = "First-party platform identity core backed by the T1 system database."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = ["dep:wamn-provision"]

[dependencies]
wamn-routes.workspace = true
wamn-provision = { workspace = true, optional = true, features = ["test-util"] }
wamn-envelope.workspace = true
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json"] }
wamn-registry = { workspace = true }
jsonwebtoken = { workspace = true }
wamn-digest = { workspace = true, features = ["sqlx"] }
uuid = { workspace = true }
anyhow = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
data-encoding.workspace = true
nkeys.workspace = true
sha2.workspace = true
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# The token profile and its verification.
wamn-identity-protocol = { workspace = true, features = ["sqlx"] }
# The application role names of a project database.

[dev-dependencies]
wamn-kubernetes = { workspace = true }
wamn-environment = { workspace = true }
sqlx = { workspace = true, features = ["macros", "migrate"] }
url = { workspace = true }
jsonwebtoken = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
# The live tests bind platform principals and create provisioned logins.
wamn-provision = { workspace = true }
# The live tests install the system and project databases with the product installers.
wamn-platform-install = { workspace = true }
wamn-test-infrastructure = { workspace = true }
postgres-protocol = { workspace = true }

[lints]
workspace = true
