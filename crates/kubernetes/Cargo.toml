[package]
name = "wamn-kubernetes"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = []

[dependencies]
url = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { workspace = true, features = ["http1", "aws-lc-rs"] }
rustls = { workspace = true, features = ["aws_lc_rs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "time", "process"] }
uuid = { workspace = true, features = ["v4"] }
wamn-control-registry = { workspace = true }

[dev-dependencies]
hyper = { workspace = true, features = ["server", "http1"] }
tokio = { workspace = true, features = ["macros", "net"] }

[lints]
workspace = true
