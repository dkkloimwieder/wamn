[package]
name = "wamn-kubernetes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tempfile.workspace = true
wamn-platform-install.workspace = true
kube = { workspace = true }
k8s-openapi = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
tower = { version = "0.5", features = ["util"] }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "time", "process", "macros", "sync"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
wamn-connection.workspace = true
wamn-digest.workspace = true
wamn-package.workspace = true
wamn-registry.workspace = true
wamn-routes.workspace = true

[dev-dependencies]
wamn-oci.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
hyper = { workspace = true, features = ["server", "http1"] }
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
