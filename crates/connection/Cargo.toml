version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-kubernetes.workspace = true
wamn-application.workspace = true
wamn-package.workspace = true
wamn-connection-type.workspace = true
wamn-envelope.workspace = true
wamn-identity-protocol.workspace = true
wamn-postgres.workspace = true
anyhow = { workspace = true }
