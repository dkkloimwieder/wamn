[package]
name = "wamn-connection"
description = "Connection facts, credentials, invocation context, leases and Wasm integration dispatch."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-package.workspace = true
wamn-connection-type.workspace = true
wamn-envelope.workspace = true
wamn-engine.workspace = true
wash-runtime.workspace = true
wasmtime.workspace = true
wamn-identity-protocol = { workspace = true, features = ["sqlx"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
moka = { workspace = true, features = ["sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
tokio = { workspace = true, features = ["time", "fs", "net", "io-util", "rt", "macros", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
wamn-authority = { workspace = true }
wamn-digest = { workspace = true, features = ["sqlx"] }
wamn-postgres.workspace = true
wamn-registry = { workspace = true }

[lints]
workspace = true
