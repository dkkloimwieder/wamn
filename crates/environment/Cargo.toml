[package]
name = "wamn-environment"
description = "Environment lifecycle and authorized control execution."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
ops = ["wamn-provision/ops"]

[dependencies]
kube = { workspace = true }
k8s-openapi = { workspace = true }
wamn-connection-type.workspace = true
wamn-authority.workspace = true
wamn-oci-reference.workspace = true
wamn-package = { workspace = true, features = ["sqlx"] }
wamn-component-policy.workspace = true
wamn-routes.workspace = true
wamn-engine.workspace = true
async-trait.workspace = true
wamn-role.workspace = true
wamn-connection = { workspace = true }
wamn-event.workspace = true
wamn-envelope.workspace = true
wamn-platform-install.workspace = true
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json"] }
wamn-broker = { workspace = true }
wamn-digest = { workspace = true, features = ["sqlx"] }
wit-parser = { workspace = true }
wamn-kubernetes = { workspace = true }
anyhow = { workspace = true }
async-nats = { workspace = true, features = ["jetstream"] }
chrono = { workspace = true, features = ["clock"] }
hex = { workspace = true }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-saphyr = "2.0.0"
schemars.workspace = true
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
wash-runtime.workspace = true
wamn-oci = { workspace = true }
wamn-provision = { workspace = true }
wamn-registry = { workspace = true }
postgres-protocol = { workspace = true }
wamn-identity = { workspace = true }
wamn-identity-client.workspace = true
nkeys.workspace = true
zeroize.workspace = true
wamn-identity-protocol = { workspace = true, features = ["sqlx"] }
wamn-run-state = { workspace = true }
wamn-codegen = { workspace = true }
wamn-publish = { workspace = true }

[dev-dependencies]
url = { workspace = true }
wash-runtime = { workspace = true, features = ["washlet", "wasi-logging"] }
object_store.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "migrate"] }
wamn-http-client = { workspace = true, features = ["tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
wamn-test-infrastructure = { workspace = true }
wamn-identity-protocol = { workspace = true }
wamn-engine = { workspace = true }

[lints]
workspace = true
