[package]
name = "wamn-environment"
description = "Environment lifecycle and authorized control execution."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
test-util = []
ops = ["wamn-provision/ops"]

[dependencies]
base64.workspace = true
wamn-role.workspace = true
wamn-connection = { workspace = true }
wamn-event.workspace = true
wamn-envelope.workspace = true
wamn-platform-install.workspace = true
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json"] }
wamn-broker = { workspace = true }
wamn-digest = { workspace = true, features = ["sqlx"] }
wit-parser = { workspace = true }
wamn-kubernetes = { workspace = true }
anyhow = { workspace = true }
async-nats = { workspace = true, features = ["jetstream"] }
chrono = { workspace = true, features = ["clock"] }
hex = { workspace = true }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-saphyr = "2.0.0"
schemars.workspace = true
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }
tracing = { workspace = true }
wamn-catalog = { workspace = true, features = ["sqlx"] }
wamn-oci = { workspace = true }
wamn-provision = { workspace = true }
wamn-registry = { workspace = true }
postgres-protocol = { workspace = true }
wamn-identity = { workspace = true }
wamn-identity-client.workspace = true
nkeys.workspace = true
zeroize.workspace = true
wamn-identity-protocol = { workspace = true, features = ["sqlx"] }
wamn-run-state = { workspace = true }
wamn-codegen = { workspace = true }
wamn-publish = { workspace = true }

[dev-dependencies]
url = { workspace = true }
wamn-schema-introspection = { workspace = true }
oci-client = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
wamn-registry = { workspace = true, features = ["test-util"] }
wash-runtime = { workspace = true, features = ["washlet", "wasi-logging"] }
wamn-build.workspace = true
object_store.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "macros", "migrate"] }
wamn-oci = { workspace = true, features = ["test-util"] }
wamn-authority = { workspace = true, features = ["test-util"] }
wamn-connection = { workspace = true, features = ["test-util"] }
wamn-operation = { workspace = true, features = ["test-util"] }
wamn-http = { workspace = true, features = ["test-util"] }
wamn-blobstore = { workspace = true, features = ["test-util"] }
wamn-fixture-package = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
uuid = { workspace = true }
tokio-rustls = { workspace = true }
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-provision = { workspace = true, features = ["test-util"] }
wamn-identity = { workspace = true, features = ["test-util"] }
wamn-test-infrastructure = { workspace = true }
wamn-test-postgres = { workspace = true }
wit-component = { workspace = true, features = ["dummy-module"] }
wat = "=1.254.2"
pg_query = "=6.2.1"
tar = { workspace = true }
wamn-identity-protocol = { workspace = true }
wamn-engine = { workspace = true }
wamn-publish = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
