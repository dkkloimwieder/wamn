[package]
name = "wamn-blobstore"
description = "Bound blob storage host service."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = ["wamn-engine/test-util", "wamn-catalog/test-util", "wamn-authority/test-util", "wamn-connection/test-util", "wamn-sql/test-util"]

[dependencies]
wamn-envelope.workspace = true
boon.workspace = true
http-body-util.workspace = true
hyper.workspace = true
wasmtime-wasi-http.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
async-trait = { workspace = true }
wamn-identity-protocol = { workspace = true, features = ["sqlx"] }
wamn-digest = { workspace = true, features = ["sqlx"] }
moka = { workspace = true, features = ["sync"] }
anyhow = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
object_store = { workspace = true, features = ["gcp"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "fs", "net", "io-util", "rt", "macros", "sync"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
wamn-authority = { workspace = true }
wamn-catalog = { workspace = true }
wamn-connection = { workspace = true }
wamn-engine = { workspace = true }
wamn-sql = { workspace = true }
wamn-registry = { workspace = true }
wash-runtime = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wamn-blobstore = { path = ".", features = ["test-util"] }
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-engine = { workspace = true, features = ["test-util"] }
wamn-oci = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
