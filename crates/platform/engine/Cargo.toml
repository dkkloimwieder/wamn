[package]
name = "wamn-engine"
description = "The native Wasmtime and wash-runtime engine, with no network-service plugin."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The route plugin's authentication entry points for integration tests.
test-util = []
wasm_component_model_implements = ["wash-runtime/wasm_component_model_implements"]

[dependencies]
wamn-digest.workspace = true
# No `oci` feature here: the registry source lives in wamn-runtime.
wash-runtime = { workspace = true }
wasmtime = { workspace = true }
wamn-catalog = { workspace = true }
wamn-component-policy = { workspace = true }
# `invoke_operation` takes the intent store trait. Run-state is pure.
# A route delivery derives its causation, and a registration source names the
# platform component that runs it. Both crates are pure.
wamn-event-wire = { workspace = true }
wamn-identity-protocol = { workspace = true }
# A route request's credential type reads the PAT prefix. The crate is pure.
anyhow = { workspace = true }
async-trait = { workspace = true }
# The `wamn.release` label value: the manifest digest as lowercase base32.
data-encoding = { workspace = true }
hex = { workspace = true }
# Invocation tracing.
opentelemetry = { workspace = true, features = ["trace"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
wasmparser = { workspace = true }
# The expected-host router answers in native wasi:http types. hyper supplies
# the request types only, with no client or server feature.
hyper = { workspace = true }
wasmtime-wasi-http = { workspace = true }
wasmtime-wasi.workspace = true

[build-dependencies]
wit-component = { workspace = true, features = ["dummy-module"] }
wit-parser.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync"] }
# The engine tests encode their guests from WAT in-process. Same exact pins as
# wamn-runtime.
wat = "=1.254.2"
wit-component = { workspace = true, features = ["dummy-module"] }
wit-parser = { workspace = true }
# The release-manifest tests build manifests from parts, which wamn-catalog
# conditions behind `test-util`. Never add this feature to the normal dependency.
wamn-catalog = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
