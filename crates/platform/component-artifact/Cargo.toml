[package]
name = "wamn-component-artifact"
description = "Registry component artifacts for the execution engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "docker-credential-wamn"
path = "src/bin/docker-credential-wamn.rs"
test = false

[features]
test-util = ["wamn-engine/test-util", "wamn-catalog/test-util"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
oci-client = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "fs", "net", "io-util", "rt", "macros", "sync"] }
url = { workspace = true }
wamn-catalog = { workspace = true }
wamn-digest = { workspace = true }
wamn-engine = { workspace = true }
wamn-package-artifact = { workspace = true }
wash-runtime = { workspace = true, features = ["oci"] }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

[dev-dependencies]
docker_credential = "=1.4.0"
tokio = { workspace = true, features = ["test-util"] }
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-engine = { workspace = true, features = ["test-util"] }
wamn-package-artifact = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }
wat = "=1.254.2"

[lints]
workspace = true
