[package]
name = "wamn-component-composer"
description = "Build-time composition of an overlay component with its bases."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wamn-component-composer"
path = "src/main.rs"
test = false

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
wac-graph.workspace = true
wamn-component-policy.workspace = true
wasmparser.workspace = true
wasm-encoder = { workspace = true, features = ["wasmparser"] }
wat = "=1.254.2"
wit-component = { workspace = true }
wit-parser = { workspace = true }

[dev-dependencies]
wit-component = { workspace = true, features = ["dummy-module"] }

[lints]
workspace = true
