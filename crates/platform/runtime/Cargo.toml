[package]
name = "wamn-runtime"
description = "Shared native wasmCloud runtime configuration and host capability adapters."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wash-runtime = { workspace = true }
wamn-component-policy = { workspace = true }
wamn-control-registry = { workspace = true }
wamn-event-wire = { workspace = true }
wamn-pg-core = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["time", "fs", "net", "io-util", "rt", "macros", "sync"] }
tracing = { workspace = true }
async-trait = { workspace = true }
async-nats = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["std"] }
deadpool-postgres = "0.14"
futures-util = { workspace = true }
hyper = { workspace = true }
opentelemetry = { workspace = true, features = ["logs", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["logs"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "logs"] }
rand_core = { workspace = true }
serde_json = { workspace = true }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime", rev = "7535c0255b2b84f6ae4de6034649ba2eeda84173" }
wasmtime-wasi-http = { git = "https://github.com/bytecodealliance/wasmtime", rev = "7535c0255b2b84f6ae4de6034649ba2eeda84173" }
