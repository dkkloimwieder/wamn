[package]
name = "wamn-runtime"
description = "Shared native wasmCloud runtime configuration and host capability adapters."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = []
wasm_component_model_implements = ["wash-runtime/wasm_component_model_implements"]

[dependencies]
boon = { workspace = true }
object_store = { workspace = true }
wash-runtime = { workspace = true }
wasmtime = { workspace = true }
wamn-component-policy = { workspace = true }
wamn-catalog = { workspace = true }
wamn-control-registry = { workspace = true }
wamn-event-wire = { workspace = true }
wamn-execution-contract = { workspace = true }
wamn-platform-identity = { workspace = true }
wamn-pg-core = { workspace = true }
# wamn-0h0g.16.15: the pointer-flip doorbell subscriber. The router crate
# declares no DB, no pooling, no runtime and no clock, so the LISTEN connection
# that rings its WiringCache cannot live there; it lives here beside the
# process-owned platform pool.
wamn-router = { workspace = true }
# `tenant-key` and NOT `effect-writer-credential`: the shipped runtime needs the
# framed scope digest to check a guest credential against the tenant it will
# serve (wamn-0h0g.22.6.7), and nothing of the effect-writer credential document.
wamn-run-state = { workspace = true, features = ["tenant-key"] }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["time", "fs", "net", "io-util", "rt", "macros", "sync"] }
tracing = { workspace = true }
async-trait = { workspace = true }
async-nats = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["std"] }
deadpool-postgres = "0.14"
futures-util = { workspace = true }
hex = { workspace = true }
hyper = { workspace = true }
url = { workspace = true }
# wamn-0h0g.12.6: `trace` carries `opentelemetry::propagation` and
# `global::get_text_map_propagator`, both `cfg(feature = "trace")`, which the
# trusted HTTP effect needs to write its span onto the outbound wire.
opentelemetry = { workspace = true, features = ["logs", "metrics", "trace"] }
# The fork's `initialize_observability` installs a `tracing-opentelemetry` layer
# but never a global tracer provider, so `global::tracer()` is a silent no-op
# here. `OpenTelemetrySpanExt::context()` is the only way to read the live span.
tracing-opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["logs"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "logs"] }
oci-client = { workspace = true }
rand_core = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }

[dev-dependencies]
wamn-run-state = { workspace = true, features = ["native", "test-util"] }
# wamn-0h0g.20.14: the live effect-authority proof bootstraps the two stable
# effect-ledger ACL roles from the REAL provisioning builder rather than a copy,
# so the proof cannot drift from the SQL production applies. Dev-only: the
# shipped runtime links no provisioner.
wamn-control-provision = { workspace = true }
# M-TEST-UTIL: the release-manifest weld's test fixtures build manifests from
# parts, which wamn-catalog gates behind `test-util`. A DEV-dependency feature
# does not reach the production graph, so this crate's own build still cannot
# assemble a manifest no canonical bytes ever carried.
#
# NEVER "fix" a missing-feature compile error by adding this feature to the
# normal wamn-catalog dependency above. That deletes the fence for every crate
# downstream of it.
wamn-catalog = { workspace = true, features = ["test-util"] }
# wamn-0h0g.15.53: the executor plugins' host functions live behind each
# plugin's private `mod bindings`, so the only way to reach them from outside
# this crate is a real guest. Encoded from WAT in-process, which keeps the
# no-trap proof hermetic — no wasm32-wasip2 build, no fixture artifact. Same
# exact pin the one existing precedent uses (crates/execution/host).
wat = "=1.252.0"
wit-component = { version = "=0.252.0", features = ["dummy-module"] }
wit-parser = "=0.252.0"
# wamn-0h0g.12.6: the outbound-injection proof needs a real span context, which
# only a `tracing-opentelemetry` layer over an SDK tracer provider produces.
opentelemetry_sdk = { workspace = true, features = ["logs", "testing"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
