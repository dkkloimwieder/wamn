[package]
name = "wamn-postgres-capability"
description = "PostgreSQL host capability and authorized transaction transport."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = ["wamn-engine/test-util", "wamn-catalog/test-util", "wamn-identity-protocol/test-util", "wamn-capability-authority/test-util", "wamn-connections/test-util", ]
wasm_component_model_implements = ["wash-runtime/wasm_component_model_implements", "wamn-engine/wasm_component_model_implements"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["std"] }
futures-util = { workspace = true }
hex = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
postgres-protocol = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
tokio = { workspace = true, features = ["time", "fs", "net", "io-util", "rt", "macros", "sync"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
wamn-broker = { workspace = true }
wamn-capability-authority = { workspace = true }
wamn-catalog = { workspace = true }
wamn-compiler = { workspace = true }
wamn-connections = { workspace = true }
wamn-digest = { workspace = true }
wamn-engine = { workspace = true }
wamn-event-wire = { workspace = true }
wamn-identity-protocol = { workspace = true }
wamn-number-pattern = { workspace = true }
wamn-package-artifact = { workspace = true }
wamn-platform-identity = { workspace = true }
wamn-postgres = { workspace = true }
wamn-registry = { workspace = true }
wamn-run-state = { workspace = true }
wamn-scalar = { workspace = true }
wash-runtime = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true, features = ["macros", "migrate"] }
wamn-http-capability = { workspace = true }

opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-control-provision = { workspace = true, features = ["test-util"] }
wamn-engine = { workspace = true, features = ["test-util"] }
wamn-package-artifact = { workspace = true, features = ["test-util"] }
wamn-platform-identity = { workspace = true, features = ["test-util"] }
wamn-postgres-capability = { path = ".", features = ["test-util"] }
wamn-test-infrastructure = { workspace = true }
wamn-test-postgres = { workspace = true }
wat = "=1.254.2"

[lints]
workspace = true
