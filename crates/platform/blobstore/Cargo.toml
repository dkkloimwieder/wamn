[package]
name = "wamn-blobstore"
description = "Bound blob storage host capability."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = ["wamn-engine/test-util", "wamn-catalog/test-util", "wamn-capability-authority/test-util", "wamn-connections/test-util", "wamn-postgres-capability/test-util"]

[dependencies]
moka = { workspace = true, features = ["sync"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
object_store = { workspace = true, features = ["gcp"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }
tokio = { workspace = true, features = ["time", "fs", "net", "io-util", "rt", "macros", "sync"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
wamn-broker = { workspace = true }
wamn-capability-authority = { workspace = true }
wamn-catalog = { workspace = true }
wamn-connections = { workspace = true }
wamn-engine = { workspace = true }
wamn-package-artifact = { workspace = true }
wamn-postgres = { workspace = true }
wamn-postgres-capability = { workspace = true }
wamn-registry = { workspace = true }
wash-runtime = { workspace = true }
wasmtime = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wamn-blobstore = { path = ".", features = ["test-util"] }
wamn-catalog = { workspace = true, features = ["test-util"] }
wamn-engine = { workspace = true, features = ["test-util"] }
wamn-package-artifact = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
