version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures-util.workspace = true
moka = { workspace = true, features = ["sync"] }
object_store = { workspace = true, features = ["gcp"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "time"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
wamn-application.workspace = true
wamn-blobstore.workspace = true
wamn-connection.workspace = true
wamn-connection-type.workspace = true
wamn-digest.workspace = true
wamn-gcp-metadata.workspace = true
wamn-registry.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util"] }
wamn-postgres.workspace = true

[lints]
workspace = true
