[package]
name = "wamn-api"
description = "Guest-safe HTTP and event-registration application adapter over entity access."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The gateway routes/columns/types come from the canonical catalog (3.1); the
# generated SQL targets the 3.2-emitted tenant floor, reusing wamn-pg-core's shared
# identifier quoting (the single source of truth for quoting — do not duplicate).
wamn-entity-access = { workspace = true }
wamn-pg-core = { workspace = true }
wamn-schema-model = { workspace = true }
# EVT-RI-ORCH (wamn-l5i9.66): the registration model + the SINGLE
# requires_replica_identity_full predicate the pending-reconcile warning keys on
# (the same detector wamn-schema-control's reconciler and the materializer's guard
# fold), so the warning can never diverge. Pure — builds for wasm32-wasip2 (the
# guest links it), so the whole migration engine (wamn-schema-control → wamn-control-registry)
# stays out of the component.
wamn-event-reg = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Live-apply gate only (registration_live.rs): a throwaway Postgres.
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
