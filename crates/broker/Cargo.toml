[package]
name = "wamn-broker"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = []

[dependencies]
wamn-package.workspace = true
anyhow = { workspace = true }
async-nats = { workspace = true, features = ["nkeys", "jetstream", "kv", "server_2_10", "server_2_11", "server_2_12"] }
base64 = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "time"] }
tracing = { workspace = true }
wamn-registry = { workspace = true }
wamn-event = { workspace = true }
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "process"] }

[lints]
workspace = true
