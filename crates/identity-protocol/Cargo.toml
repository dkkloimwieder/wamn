[package]
name = "wamn-identity-protocol"
description = "Identity types, credential formats, wire messages and public key documents, without database or HTTP clients."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
sqlx = ["dep:sqlx"]

[dependencies]
wamn-role.workspace = true

sqlx = { workspace = true, features = ["postgres", "uuid", "derive"], optional = true }

wamn-digest.workspace = true
base64 = { workspace = true }
ring = { workspace = true }
uuid = { workspace = true, features = ["v5", "serde"] }
hex = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
