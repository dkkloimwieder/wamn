[package]
name = "wamn-postgres"
description = "Verified PostgreSQL connections and component configuration."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-identity-protocol = { workspace = true, features = ["sqlx"] }
postgres-protocol.workspace = true
wamn-principal = { workspace = true, features = ["sqlx"] }
url.workspace = true
tokio = { workspace = true, features = ["fs"] }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
