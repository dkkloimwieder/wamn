[package]
name = "wamn-postgres"
description = "Verified PostgreSQL connections and component configuration."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-application.workspace = true
wamn-authentication.workspace = true
wamn-authority.workspace = true
wamn-codegen.workspace = true
wamn-component-policy.workspace = true
wamn-connection.workspace = true
wamn-connection-type.workspace = true
wamn-digest.workspace = true
wamn-envelope.workspace = true
wamn-event.workspace = true
wamn-package.workspace = true
wamn-record-history.workspace = true
wamn-schema.workspace = true
async-trait.workspace = true
fallible-iterator = "0.2"
moka = { workspace = true, features = ["sync"] }
tracing.workspace = true
wamn-registry.workspace = true
wamn-role.workspace = true
wamn-identity-protocol.workspace = true
postgres-protocol.workspace = true
wamn-principal.workspace = true
url.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
anyhow.workspace = true
jsonwebtoken.workspace = true
nkeys.workspace = true
ring.workspace = true
zeroize.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# SQLx exposes statement descriptions with the macros feature.
sqlx = { workspace = true, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json"] }

[lints]
workspace = true

[dev-dependencies]
wamn-scalar.workspace = true
futures-util.workspace = true
wamn-platform-install.workspace = true
async-nats = { workspace = true, features = ["aws-lc-rs", "nkeys"] }
base64.workspace = true
wamn-key.workspace = true
pg_query = "=6.2.1"
syn = { workspace = true, features = ["full"] }
tempfile.workspace = true
wamn-fixture-package.workspace = true
wamn-test-infrastructure.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
