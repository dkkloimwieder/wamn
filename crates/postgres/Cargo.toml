[package]
name = "wamn-postgres"
description = "Verified PostgreSQL connections and component configuration."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wamn-application.workspace = true
wamn-event.workspace = true
wamn-package.workspace = true
wamn-run-state.workspace = true
chrono = { workspace = true, features = ["std"] }
tracing.workspace = true
wamn-registry.workspace = true
wamn-role.workspace = true
wamn-identity-protocol.workspace = true
postgres-protocol.workspace = true
wamn-principal.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }

[lints]
workspace = true

[[test]]
name = "project_schema"

[dev-dependencies]
sqlx = { workspace = true, features = ["macros", "migrate"] }
wamn-provision.workspace = true
wamn-scalar.workspace = true
wamn-test-infrastructure.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
