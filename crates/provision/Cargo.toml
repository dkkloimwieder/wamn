[package]
name = "wamn-provision"
description = "Database role declarations and provisioning SQL."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
ops = []
# The system test database setup (`test_database`) installs the control store
# on a supplied test connection.
test-util = []

[dependencies]
wamn-package.workspace = true
wamn-component-policy.workspace = true
wamn-role.workspace = true
anyhow.workspace = true
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["migrate", "macros", "postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }

wamn-digest = { workspace = true, features = ["sqlx"] }
serde = { workspace = true, features = ["derive"] }
# The per-project-env credential Secrets render as JSON (kubectl apply accepts
# JSON manifests). No schemars — this is a provisioning tool, not a published
# contract.
serde_json = { workspace = true }

# wamn-q3n.6 provision-org: the org Cluster-PAIR renderer takes the registry's
# Org / Tier / Side vocabulary and derives cluster names via `cluster_name`, so
# the rendered clusters and the org's registry.orgs row name the same clusters.
# A lean pure→pure edge (wamn-registry deps serde + serde_json only).
wamn-registry = { workspace = true }
postgres-protocol = { workspace = true }
# The `sha256:<hex>` spelling of bundle, file and schema digests.
# Platform transaction identities take their component names and derived ids
# from the platform model.
wamn-identity-protocol = { workspace = true, features = ["sqlx"] }

# Targeted login identities use a domain-separated digest.
hex = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }

[dev-dependencies]
wamn-record-history = { workspace = true }
wamn-run-state = { workspace = true }
chrono.workspace = true
wamn-registry = { workspace = true, features = ["test-util"] }
pg_query = "=6.2.1"
wamn-scalar.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wamn-provision = { workspace = true, features = ["test-util"] }
wamn-test-postgres = { workspace = true }

[lints]
workspace = true
