[package]
name = "wamn-provision"
description = "Database role declarations and provisioning SQL."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
chrono = { workspace = true, features = ["std"] }
ring.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time"] }
wamn-application.workspace = true
wamn-authentication.workspace = true
wamn-component-policy.workspace = true
wamn-digest.workspace = true
wamn-environment.workspace = true
wamn-event.workspace = true
wamn-identity-protocol.workspace = true
wamn-package.workspace = true
wamn-platform-install.workspace = true
wamn-release.workspace = true
wamn-role.workspace = true
wamn-workflow-graph.workspace = true
anyhow.workspace = true
wamn-postgres.workspace = true
sqlx = { workspace = true, features = ["migrate", "macros", "postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "bigdecimal"] }

# The per-project environment credential Secrets render as JSON.
serde_json = { workspace = true }

# wamn-q3n.6 provision-org: the org Cluster-PAIR renderer takes the registry's
# Org / Tier / Side vocabulary and derives cluster names via `cluster_name`, so
# the rendered clusters and the org's registry.orgs row name the same clusters.
# A lean pure→pure edge (wamn-registry deps serde + serde_json only).
wamn-registry = { workspace = true }
postgres-protocol = { workspace = true }
# Targeted login identities use a domain-separated digest.
hex = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }

[dev-dependencies]
wamn-kubernetes.workspace = true
wamn-oci.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wamn-test-infrastructure = { workspace = true }

[lints]
workspace = true
