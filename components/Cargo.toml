[workspace]
resolver = "2"
# Product components are grouped by runtime role. Bench fixtures, reference
# samples, and POC components remain visibly outside those product tiers.
members = ["ingress/api-gateway", "execution/flowrunner", "execution/materializer", "fixtures/busyloop", "fixtures/cred-probe", "fixtures/flow-driver", "fixtures/hello", "fixtures/logspewer", "fixtures/memhog", "fixtures/pgprobe", "fixtures/sockprobe", "fixtures/trace-relay", "poc/webhook-f1", "samples/disposition-node", "samples/js-sample", "samples/node-rs", "samples/node-cred", "samples/sample-node"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "s"
strip = true
