[workspace]
resolver = "2"
# Product components are grouped by runtime role. Proof fixtures and reference
# samples remain visibly outside those product tiers.
#
# The `no_std` palette guests are NOT members: Cargo feature unification is
# additive-only, and members here reach `serde_json/std`, which collides with a
# guest-supplied `#[panic_handler]`. They live in the second workspace at
# `no-std/`, whose manifest carries the full reason (wamn-0h0g.11.56).
members = ["ingress/http-route", "execution/materializer", "data/postgres-sqlx", "data/receiving-data", "fixtures/busyloop", "fixtures/connection-http-standard", "fixtures/sockprobe", "fixtures/sqlx-command"]
exclude = ["no-std"]

# Lint policy. IDENTICAL to the root workspace's by intent -- see the root
# `Cargo.toml` for the full rationale and the measured exemption counts. It is
# duplicated rather than inherited because Cargo has no way to share a lints
# table ACROSS workspaces, and this is a separate workspace by necessity, not by
# preference. Keep the two in step: if the root policy moves, move this too.
#
# M-LINT-OVERRIDE-EXPECT: override with `#[expect(..., reason = "...")]`, never
# `#[allow]`.
[workspace.lints.rust]
ambiguous_negative_literals = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
missing_debug_implementations = "warn"
redundant_imports = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
cargo_common_metadata = "allow"
too_many_lines = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
return_self_not_must_use = "allow"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
base64 = "0.22"
boon = "0.6"
serde = "1"
serde_json = "1"
sqlx-core = { version = "=0.9.0", default-features = false }
wit-bindgen = { version = "0.44", default-features = false, features = ["macros", "realloc"] }

# Guest-owned path identities are independent of the native workspace contract.
wamn-event-reg = { path = "../crates/events/registration", version = "0.1.0" }
wamn-event-wire = { path = "../crates/events/wire", version = "0.1.0" }
wamn-materializer = { path = "../crates/events/materializer", version = "0.1.0" }
wamn-postgres-sqlx = { path = "data/postgres-sqlx", version = "0.1.0" }
wamn-run-state = { path = "../crates/execution/run-state", version = "0.1.0" }

[profile.release]
opt-level = "s"
strip = true
