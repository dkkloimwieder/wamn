[workspace]
resolver = "2"
# Product components are grouped by runtime role. Proof fixtures and reference
# samples remain visibly outside those product tiers.
#
# The `no_std` palette guests are NOT members: Cargo feature unification is
# additive-only, and members here reach `serde_json/std`, which collides with a
# guest-supplied `#[panic_handler]`. They live in the second workspace at
# `no-std/`, whose manifest carries the full reason (wamn-0h0g.11.56).
members = ["ingress/flow-http", "execution/materializer", "fixtures/busyloop", "fixtures/connection-http-standard", "fixtures/sockprobe"]
exclude = ["no-std"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
boon = "0.6"
serde = "1"
serde_json = "1"
wit-bindgen = { version = "0.44", default-features = false, features = ["macros", "realloc"] }

# Guest-owned path identities are independent of the native workspace contract.
wamn-event-reg = { path = "../crates/events/registration", version = "0.1.0" }
wamn-event-wire = { path = "../crates/events/wire", version = "0.1.0" }
wamn-materializer = { path = "../crates/events/materializer", version = "0.1.0" }
wamn-run-state = { path = "../crates/execution/run-state", version = "0.1.0" }

[profile.release]
opt-level = "s"
strip = true
