[package]
name = "label-render"
version.workspace = true
edition.workspace = true

[dependencies]
dlmalloc = { workspace = true }
label-template = { path = "../label-template" }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
wit-bindgen = { workspace = true }

[features]
std = []

[lib]
crate-type = ["cdylib"]
# No testable surface, for the same reason `transform` has none: a `no_std`
# cdylib guest's lib-test AND lib-bench units both link `test`, which pulls
# `std` and collides with the guest-supplied `#[panic_handler]` (E0152,
# duplicate lang item `panic_impl`). The rendering this guest wraps is proven
# in `label-template`, which supplies no panic handler and therefore can carry
# the golden vectors (wamn-6i30).
test = false
bench = false

[lints]
workspace = true
