[package]
name = "label-template"
version.workspace = true
edition.workspace = true
description = "Pure ZPL rendering for the closed label template set."

[dependencies]
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[lib]
# No std-mode lib build. Under `cfg(test)` this crate compiles WITH std, which
# makes its `alloc` imports redundant with the std prelude and produces
# warnings repo-lint promotes to errors. The golden vectors live in
# `tests/golden.rs`, a separate target that links the real `no_std` rlib — so
# the gate proves the shipped build, not a std-mode variant of it.
#
# `bench = false` for the same reason `transform` sets it: `test = false` alone
# leaves the bench unit, which `--all-targets` still builds and cargo still
# reports as "(lib test)" (wamn-6i30).
test = false
bench = false

[lints]
workspace = true
