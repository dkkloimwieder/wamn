[package]
name = "wamn-materializer"
description = "wamn CDC materializer decisions: pure registration matching, tenant guards, causation bounds, condition evaluation, and event-input projection."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The wire contract the decisions consume: Envelope/Op/Causation (WORKING
# DRAFT until the l5i9.30 freeze — this crate tracks it, adds no drift guards).
wamn-event-wire = { workspace = true }
# The declaration the materializer serves: EventRegistration (entity, ops, and condition).
wamn-event-reg = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Condition evaluation uses the codebase's one expression language.
jmespath = { workspace = true }

[dev-dependencies]
# Tests construct wire envelopes (commit_ts is a chrono instant on the wire
# contract); runtime code never reads a clock.
chrono = { workspace = true, features = ["std"] }

# No DB / wasm / clock dependency: every decision is a pure function of the
# delivered event + the declarations. The guest (components/execution/materializer) owns
# every effect; the matbench gate drives the same decisions live.

[lints]
workspace = true
