[package]
name = "flowrunner"
version.workspace = true
edition.workspace = true

[dependencies]
wit-bindgen = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The production runner (5.2) is the pure `wamn-runner` engine reducer over the
# canonical `wamn-flow` (5.1) graph; this component is the thin shell that drives
# it against wamn:postgres + the native standard nodes (the wamn-api pattern).
wamn-flow = { workspace = true }
wamn-catalog = { workspace = true }
wamn-runner = { workspace = true }
# One guest-safe owner for run history, queue, lease, timer, and replay state.
wamn-run-state = { workspace = true }
# The standard node library and flow-model capability facade this component
# implements over its real imports (wamn:postgres, wasi:http). The library is
# pure — node behavior, taxonomy classification, and the dispatch-time
# capability policy all live (and are tested) in the crates; this shell only
# mirrors WIT values and performs the effects.
wamn-nodes = { workspace = true }
# The SHARED capability facade (SR2): CapsCtx + the WIT<->SDK mirrors over
# wamn:postgres + outbound wasi:http live in the scaffolding crate's `caps`
# feature — this shell links them instead of copying them.
wamn-node-guest = { workspace = true, features = ["caps"] }
# 5.6 / wamn-bd5: the custom-node wire envelope and per-step grant derivation.
# The guest submits these opaque bytes through the trusted node-invocation
# capability; its host signs and POSTs them to serve-node. The SAME crate the
# serve-node host links keeps the wire shape coherent. Pure serde; the guest
# links only the envelope + grant helper (never host placement or transport).
wamn-node-invoke = { workspace = true }
wamn-node-manifest = { workspace = true }

[lib]
crate-type = ["cdylib"]
