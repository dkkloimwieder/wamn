[package]
name = "materializer"
version.workspace = true
edition.workspace = true

[dependencies]
wit-bindgen = { workspace = true }
serde_json = { workspace = true }
# The PURE per-event pipeline (decide/skip/refuse, condition eval under the
# REPLICA IDENTITY DEFAULT contract, causation budget, and run-id + input mint)
# — this shell only performs the effects.
wamn-materializer = { workspace = true }
# The declaration surfaces the sweep reads: registrations + the flow graph.
wamn-event-reg = { workspace = true }
wamn-event-wire = { workspace = true }
wamn-flow = { workspace = true }
# The write-ahead + evt-enqueue SQL builders. `default-features = false` keeps
# Guest-safe durable admission SQL; schedule evaluation is separate.
wamn-run-state = { workspace = true }

# A COMMAND component (wasi:cli/run via `main`), not a cdylib: the Service
# workload shape (E12) runs it in the host's restart loop.
