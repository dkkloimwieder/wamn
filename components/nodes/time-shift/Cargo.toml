[package]
name = "time-shift"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
wamn-node-sdk = { workspace = true }
wamn-node-guest = { workspace = true }

[lib]
crate-type = ["cdylib"]

[package.metadata.wamn-node]
node-type = "time-shift"
name = "Time Shift"
description = "Pure RFC3339 time arithmetic: adds a checked signed millisecond offset and emits canonical UTC RFC3339."
ordering = ["unordered"]
purity = "pure"
config-schema = { type = "object", required = ["base", "offset-ms"], properties = { base = { type = "string", minLength = 1 }, "offset-ms" = { type = "integer" }, format = { enum = ["iso"] }, key = { type = "string", minLength = 1 } }, additionalProperties = false }
input-schema = { type = "object" }
output-schema = { type = "object", minProperties = 1, maxProperties = 1, additionalProperties = { type = "string", format = "date-time" } }
