[package]
name = "normalize-receipt"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
serde_json = { workspace = true }
wamn-node-guest = { workspace = true }
wamn-node-sdk = { workspace = true }

[lib]
crate-type = ["cdylib"]

[package.metadata.wamn-node]
node-type = "normalize-receipt"
name = "Normalize Receipt"
description = "POC-F1 pure receipt normalization and defensive exact-decimal validation. Imports nothing."
ordering = ["unordered"]
output-ports = ["main"]
purity = "pure"
