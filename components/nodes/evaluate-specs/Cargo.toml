[package]
name = "evaluate-specs"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
serde_json = { workspace = true }
wamn-node-guest = { workspace = true }
wamn-node-sdk = { workspace = true }

[lib]
crate-type = ["cdylib"]

[package.metadata.wamn-node]
node-type = "evaluate-specs"
name = "Evaluate Receipt Specifications"
description = "POC-F1 pure exact-decimal receipt-line specification evaluation. Imports nothing."
ordering = ["unordered"]
output-ports = ["main"]
purity = "pure"
