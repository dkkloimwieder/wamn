name: Client workspace

on:
  pull_request:
    paths:
      - .github/workflows/client.yml
      - clients/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/client.yml
      - clients/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.22.1
      - run: node clients/scripts/check-dependency-policy.mjs
      - run: corepack enable
      - run: corepack install
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run client:build
      - run: pnpm run client:test
