[workspace]
resolver = "2"
members = ["services/host", "services/node-host", "services/ctl", "services/dispatcher", "services/executor", "services/scenario-worker", "services/builder", "services/cdc-reader", "services/waker", "tests/orchestrator", "tests/conformance", "tests/integration", "tests/system", "test-support/harness", "test-support/fixtures", "test-support/infrastructure", "crates/catalog/model", "crates/execution/flow-model", "crates/execution/flow-invocation", "crates/execution/flow-engine", "crates/execution/host", "crates/execution/run-state", "crates/execution/scheduler", "crates/schema/model", "crates/schema/compiler", "crates/schema/control", "crates/data/entity-access", "crates/data/api", "crates/platform/pg-core", "crates/platform/component-policy", "crates/platform/runtime", "crates/platform/node-runtime", "crates/scenarios/model", "crates/scenarios/catalog", "crates/scenarios/runtime", "crates/node/sdk", "crates/execution/standard-nodes", "crates/node/guest", "crates/node/manifest", "crates/node/invoke", "crates/control/provision", "crates/control/registry", "crates/identity/project-state", "crates/events/wire", "crates/events/registration", "crates/events/materializer", "poc/f1", "poc/dm1", "poc/cdc1"]
# Guest components are built separately for wasm32-wasip2 (see components/*).
exclude = ["components"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# wash-runtime is publish=false upstream; consumed from our fork
# (dkkloimwieder/wasmCloud). Branch wamn/2.5.2 = upstream runtime-operator
# v2.5.2 (ec012da) + the carried epoch-deadline and memory-limiter commits.
# Pin a REV, never a
# branch (immutable; the branch's existence keeps the SHA fetchable). Carried-
# commit ledger + sync runbook: docs/wash-runtime-fork.md.
# default-features off: `wasi-webgpu` pulls crates.io wasmtime alongside the
# workspace's git-pinned one (two wasmtimes = linker typecheck failures upstream
# solves with a [patch] we'd otherwise have to replicate).
wash-runtime = { git = "https://github.com/dkkloimwieder/wasmCloud", rev = "981fdc56ebc1840f08161aef5edec592538e5d4c", default-features = false }
# Native sandbox hosts and gates must share one Wasmtime type universe.
wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime", rev = "7535c0255b2b84f6ae4de6034649ba2eeda84173" }
wasmtime-wasi-http = { git = "https://github.com/bytecodealliance/wasmtime", rev = "7535c0255b2b84f6ae4de6034649ba2eeda84173" }
# pg_walstream is consumed from our fork (dkkloimwieder/pg-walstream). Branch
# wamn/0.8.0 = upstream v0.8.0 (784e644) + the carried failover-slot-syntax
# commit (S-CDC-1 finding F1: legacy `… FAILOVER` → 42601 on PG17+; the fork
# emits the parenthesized option list). Pin a REV, never a branch.
# Carried-commit ledger + sync runbook: docs/pg-walstream-fork.md.
pg_walstream = { git = "https://github.com/dkkloimwieder/pg-walstream", rev = "0b007cd627bb913d4b159c705a106b6d4152c91a" }
anyhow = "1"
async-nats = { version = "0.47", default-features = false }
boon = "0.6"
bytes = "1"
chrono = { version = "0.4", default-features = false }
clap = "4"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
jmespath = "0.3"
libc = "0.2"
opentelemetry = { version = "0.31", default-features = false }
opentelemetry-otlp = { version = "0.31", default-features = false }
opentelemetry_sdk = { version = "0.31", default-features = false }
rand_core = "0.10"
reqwest = { version = "0.13", default-features = false }
ring = "0.17"
rustls = { version = "0.23", default-features = false }
schemars = "0.8"
serde = "1"
serde_json = "1"
sha2 = "0.11"
tokio = "1"
tokio-postgres = "0.7"
tracing = "0.1"
tracing-opentelemetry = { version = "0.32", default-features = false }
tracing-subscriber = "0.3"
async-trait = "0.1"
wasm-encoder = "0.251"

# Every project crate has one canonical path + version identity (M-CRATES-IN-WORKSPACE).
wamn-api = { path = "crates/data/api", version = "0.1.0" }
