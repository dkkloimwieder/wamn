[workspace]
resolver = "2"
members = ["services/host", "services/ctl", "services/dispatcher", "services/run-worker", "services/builder", "services/cdc-reader", "services/waker", "crates/wamn-gates", "crates/wamn-gate-harness", "crates/execution/flow-model", "crates/schema/model", "crates/schema/ddl-compiler", "crates/schema/lifecycle", "crates/schema/rls-compiler", "crates/schema/seed-compiler", "crates/data/entity-access", "crates/execution/flow-engine", "crates/platform/sql", "crates/execution/run-state-store", "crates/execution/run-state-queue", "crates/scenarios/model", "crates/node/sdk", "crates/execution/standard-nodes", "crates/node/guest", "crates/node/manifest", "crates/node/invoke", "crates/control/provision", "crates/control/registry", "crates/identity/project-state", "crates/schema/migration", "crates/events/wire", "crates/events/registration", "crates/events/materializer", "crates/scenarios/catalog", "crates/schema/impact-analysis", "poc/f1", "poc/dm1", "poc/cdc1"]
# Guest components are built separately for wasm32-wasip2 (see components/*).
exclude = ["components"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# wash-runtime is publish=false upstream; consumed from our fork
# (dkkloimwieder/wasmCloud). Branch wamn/2.5.2 = upstream runtime-operator
# v2.5.2 (ec012da) + the carried epoch-deadline and memory-limiter commits.
# Pin a REV, never a
# branch (immutable; the branch's existence keeps the SHA fetchable). Carried-
# commit ledger + sync runbook: docs/wash-runtime-fork.md.
# default-features off: `wasi-webgpu` pulls crates.io wasmtime alongside the
# workspace's git-pinned one (two wasmtimes = linker typecheck failures upstream
# solves with a [patch] we'd otherwise have to replicate).
wash-runtime = { git = "https://github.com/dkkloimwieder/wasmCloud", rev = "981fdc56ebc1840f08161aef5edec592538e5d4c", default-features = false, features = ["washlet", "wasi-config", "wasi-logging", "wasi-otel"] }
# pg_walstream is consumed from our fork (dkkloimwieder/pg-walstream). Branch
# wamn/0.8.0 = upstream v0.8.0 (784e644) + the carried failover-slot-syntax
# commit (S-CDC-1 finding F1: legacy `… FAILOVER` → 42601 on PG17+; the fork
# emits the parenthesized option list). Pin a REV, never a branch.
# Carried-commit ledger + sync runbook: docs/pg-walstream-fork.md.
pg_walstream = { git = "https://github.com/dkkloimwieder/pg-walstream", rev = "0b007cd627bb913d4b159c705a106b6d4152c91a" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
async-trait = "0.1"

[profile.release]
lto = "thin"
