[workspace]
resolver = "2"
members = ["services/host", "services/ctl", "services/dispatcher", "services/executor", "services/scenario-worker", "services/cdc-reader", "services/waker", "tests/orchestrator", "tests/conformance", "tests/integration", "tests/system", "test-support/harness", "test-support/infrastructure", "test-support/simulator", "crates/client/core", "crates/client/tui", "crates/client/receiving", "crates/authoring/model", "crates/catalog/model", "crates/execution/host", "crates/execution/router", "crates/execution/run-state", "crates/execution/scheduler", "crates/schema/control", "crates/schema/generator", "crates/schema/introspection", "crates/platform/pg-core", "crates/platform/component-policy", "crates/platform/component-virtualizer", "crates/platform/runtime", "crates/scenarios/model", "crates/control/provision", "crates/control/registry", "crates/identity/platform", "crates/identity/project-state"]
default-members = [
  "crates/authoring/model",
  "crates/catalog/model",
  "crates/client/core",
  "crates/client/receiving",
  "crates/client/tui",
  "crates/execution/host",
  "crates/execution/router",
  "crates/execution/run-state",
  "crates/execution/scheduler",
  "crates/identity/platform",
  "crates/platform/component-policy",
  "crates/platform/pg-core",
  "crates/platform/runtime",
  "crates/scenarios/model",
  "services/executor",
  "services/host",
  "services/scenario-worker",
]
# Guest components are built separately for wasm32-wasip2 (see components/*).
exclude = ["components"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# M-STATIC-VERIFICATION: the compiler and clippy sets the guidelines name, held
# in ONE place per M-CARGO-WORKSPACE. Members inherit with `[lints] workspace = true`.
#
# Levels are deliberate, not aspirational: everything here is `warn` because
# `tools/repo-lint` already runs clippy with `-D warnings`, so that gate is what
# promotes these to errors. Setting `deny` here as well would only duplicate it
# and break plain `cargo build` for a developer mid-edit.
#
# M-LINT-OVERRIDE-EXPECT: override with `#[expect(..., reason = "...")]`, never
# `#[allow]` -- an `expect` that stops firing reports itself, so exemptions
# cannot silently go stale.
[workspace.lints.rust]
# DENY WHAT IS ALREADY CLEAN, warn what is not. A clean lint held at `warn` only
# asks to be re-read; held at `deny` it cannot regress. Measured clean at
# ffe54cae -- if one of these ever fires, that is new code, not old debt.
ambiguous_negative_literals = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
# Dirty today, so `warn` states the intent without breaking the build.
missing_debug_implementations = "warn"
redundant_imports = "warn"

[workspace.lints.clippy]
# `correctness` and `suspicious` are the two categories that find BUGS, and both
# measured ZERO occurrences at ffe54cae -- so they are denied rather than warned.
# This costs nothing today and is the whole point: a correctness regression stops
# the run instead of scrolling past inside a large warning set. Clippy tool lints
# are inert under plain `cargo build`, so denying them does not break an edit loop.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Dirty today; `tools/repo-lint` promotes these to errors via `-D warnings`.
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

# Opted back out, case-by-case, as M-STATIC-VERIFICATION allows. Counts are from
# the adoption measurement at ffe54cae (2316 warnings, 64 lints) and are recorded
# so the exemptions stay arguable instead of becoming folklore. These crates are
# an APPLICATION workspace -- services plus internal libraries with no external
# consumers and nothing published -- and the guidelines scope libs-ux rules to
# crates with a public API.
must_use_candidate = "allow"      # 697. #[must_use] on internal APIs nobody else calls.
missing_errors_doc = "allow"      # 254. Library-API doc contract; no external consumer.
doc_markdown = "allow"            # 237. Formats rendered rustdoc; we publish no docs.
cargo_common_metadata = "allow"   # 140. Wants description/license/repository on crates
                                  #      that are never published.
too_many_lines = "allow"          # 112. A line-count threshold would drive mechanical
                                  #      splits, not better boundaries (M-BALANCED-MODULES
                                  #      is the rule that actually governs this).
missing_panics_doc = "allow"      #  72. Library-API doc contract, as above.
multiple_crate_versions = "allow" #  46. Duplicate transitive versions we do not control;
                                  #      the wasmtime/async-nats pins are upstream-governed.
return_self_not_must_use = "allow"#   8. Library-API concern, as above.

[workspace.dependencies]
ratatui-core = { version = "0.1.2", default-features = false, features = ["std"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false, features = ["event-stream", "events"] }
# Vanilla upstream v2.8.0. Fork policy and verification evidence are recorded
# in docs/architecture/native-alignment-ledger.md; this revision carries no patch.
# default-features off keeps the excluded `wasi-webgpu` surface disabled.
# wamn and wash-runtime resolve one crates.io Wasmtime 47.0.x family from the
# shared 47.0.3 requirement; enforce that source identity in conformance.
wash-runtime = { git = "https://github.com/dkkloimwieder/wasmCloud", rev = "2a183dfb4125c4fcbebe749ebfdead6ab52cdc61", default-features = false, features = ["oci"] }
# Native sandbox hosts and gates must share one Wasmtime type universe.
wasmtime = { version = "47.0.3", default-features = false, features = ["cache"] }
wasmtime-wasi = "47.0.3"
wasmtime-wasi-http = "47.0.3"
# pg_walstream is consumed from our fork (dkkloimwieder/pg-walstream). Branch
# wamn/0.8.0 = upstream v0.8.0 (784e644) + the carried failover-slot-syntax
# commit (S-CDC-1 finding F1: legacy `… FAILOVER` → 42601 on PG17+; the fork
# emits the parenthesized option list). Pin a REV, never a branch.
# Carried-commit ledger + sync runbook: docs/archive/events/pg-walstream-fork.md.
pg_walstream = { git = "https://github.com/dkkloimwieder/pg-walstream", rev = "0b007cd627bb913d4b159c705a106b6d4152c91a" }
anyhow = "1"
async-nats = { version = "0.49.1", default-features = false }
base64 = "0.22"
boon = "0.6"
bytes = "1"
chrono = { version = "0.4", default-features = false }
clap = "4"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
url = "2"
jmespath = "0.3"
libc = "0.2"
opentelemetry = { version = "0.31", default-features = false }
opentelemetry-otlp = { version = "0.31", default-features = false }
opentelemetry_sdk = { version = "0.31", default-features = false }
# The component publisher and puller share this exact client and TLS family.
# Disable the crate's test-only default feature; wash-runtime already resolves
# the same oci-client version with rustls.
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
# The S3 client for the blobstore capability. Chosen by the phase-1c spike
# (wamn-15ny.4) and ratified: it is the ONLY candidate that resolves to a
# single rustls, and that single version is 0.23 — the workspace pin. aws-sdk-s3
# and rust-s3 each drag a second TLS stack into a host already running 0.23,
# and aws-sdk-s3 additionally pulls two crypto providers and a 19.1 MiB release
# binary against object_store's 6.9 MiB for the same five verbs.
#
# VERSION CORRECTED to 0.14.1 from the spike's 0.11.2, measured IN THIS
# WORKSPACE rather than in the spike's isolated crate: 0.11.2 pulls reqwest
# 0.12 alongside the workspace's pinned 0.13, duplicating the HTTP client;
# 0.14.1 resolves to exactly reqwest 0.13.4. Workspace totals 611 packages with
# one reqwest against 613 with two. The spike could not see this — an isolated
# crate has no existing reqwest to collide with — and the ratified REASON
# (one TLS stack, smallest footprint) is what selects 0.14.1.
# `default-features = false` keeps every other backend (gcp, azure, http) out.
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
rand_core = "0.10"
reqwest = { version = "0.13", default-features = false }
ring = "0.17"
rustls = { version = "0.23", default-features = false }
rustix = { version = "1", features = ["fs", "process"] }
schemars = "0.8"
serde = "1"
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = "1"
tokio-postgres = "0.7"
tracing = "0.1"
tracing-opentelemetry = { version = "0.32", default-features = false }
tracing-subscriber = "0.3"
async-trait = "0.1"
wasm-encoder = "0.251"
# Post-link normalization uses one immutable upstream adapter. Its embedded
# `virtual_adapter-wasip2.wasm` is sha256:28eff8a2255812b440fbad2784a5a87660321e667331c17fb9a95f29caa85632.
wasi-virt = { version = "=0.2.0", git = "https://github.com/bytecodealliance/WASI-Virt.git", rev = "448f6df8f688cee5d6995e96b1ffc31f9bf00742", default-features = false }

