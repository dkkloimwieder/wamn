[workspace]
resolver = "2"
members = ["services/host", "services/ctl", "services/dispatcher", "services/executor", "services/scenario-worker", "services/cdc-reader", "services/waker", "tests/orchestrator", "tests/conformance", "tests/integration", "tests/system", "test-support/harness", "test-support/fixtures", "test-support/infrastructure", "crates/authoring/model", "crates/catalog/model", "crates/execution/flow-model", "crates/execution/flow-invocation", "crates/execution/host", "crates/execution/router", "crates/execution/run-state", "crates/execution/scheduler", "crates/schema/model", "crates/schema/compiler", "crates/schema/control", "crates/data/entity-access", "crates/platform/pg-core", "crates/platform/component-policy", "crates/platform/runtime", "crates/scenarios/model", "crates/execution/standard-nodes", "crates/control/provision", "crates/control/registry", "crates/identity/platform", "crates/identity/project-state", "crates/events/wire", "crates/events/registration", "crates/events/materializer"]
default-members = [
  "crates/authoring/model",
  "crates/catalog/model",
  "crates/data/entity-access",
  "crates/execution/flow-invocation",
  "crates/execution/flow-model",
  "crates/execution/host",
  "crates/execution/router",
  "crates/execution/run-state",
  "crates/execution/scheduler",
  "crates/execution/standard-nodes",
  "crates/identity/platform",
  "crates/platform/component-policy",
  "crates/platform/pg-core",
  "crates/platform/runtime",
  "crates/scenarios/model",
  "crates/schema/model",
  "services/executor",
  "services/host",
  "services/scenario-worker",
]
# Guest components are built separately for wasm32-wasip2 (see components/*).
exclude = ["components"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Upstream v2.7.0 plus the policies recorded in
# docs/archive/platform/wash-runtime-fork.md. The ledger is authoritative.
# default-features off keeps the excluded `wasi-webgpu` surface disabled.
# wamn and wash-runtime resolve one crates.io Wasmtime 47.0.3 family; enforce
# that contract with tests/conformance/tests/wasmtime_source_identity.rs.
wash-runtime = { git = "https://github.com/dkkloimwieder/wasmCloud", rev = "daba602901507338e99f277e07a8e923c61dc557", default-features = false }
# Native sandbox hosts and gates must share one Wasmtime type universe.
wasmtime-wasi = "47.0.3"
wasmtime-wasi-http = "47.0.3"
# pg_walstream is consumed from our fork (dkkloimwieder/pg-walstream). Branch
# wamn/0.8.0 = upstream v0.8.0 (784e644) + the carried failover-slot-syntax
# commit (S-CDC-1 finding F1: legacy `… FAILOVER` → 42601 on PG17+; the fork
# emits the parenthesized option list). Pin a REV, never a branch.
# Carried-commit ledger + sync runbook: docs/archive/events/pg-walstream-fork.md.
pg_walstream = { git = "https://github.com/dkkloimwieder/pg-walstream", rev = "0b007cd627bb913d4b159c705a106b6d4152c91a" }
anyhow = "1"
async-nats = { version = "0.49.1", default-features = false }
boon = "0.6"
bytes = "1"
chrono = { version = "0.4", default-features = false }
clap = "4"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
url = "2"
jmespath = "0.3"
libc = "0.2"
opentelemetry = { version = "0.31", default-features = false }
opentelemetry-otlp = { version = "0.31", default-features = false }
opentelemetry_sdk = { version = "0.31", default-features = false }
rand_core = "0.10"
reqwest = { version = "0.13", default-features = false }
ring = "0.17"
rustls = { version = "0.23", default-features = false }
schemars = "0.8"
serde = "1"
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = "1"
tokio-postgres = "0.7"
tracing = "0.1"
tracing-opentelemetry = { version = "0.32", default-features = false }
tracing-subscriber = "0.3"
async-trait = "0.1"
wasm-encoder = "0.251"

# Every project crate has one canonical path + version identity (M-CRATES-IN-WORKSPACE).
wamn-authoring-model = { path = "crates/authoring/model", version = "0.1.0" }
wamn-catalog = { path = "crates/catalog/model", version = "0.1.0" }
wamn-cdc-reader = { path = "services/cdc-reader", version = "0.1.0" }
wamn-component-policy = { path = "crates/platform/component-policy", version = "0.1.0" }
wamn-control-provision = { path = "crates/control/provision", version = "0.1.0" }
wamn-control-registry = { path = "crates/control/registry", version = "0.1.0" }
wamn-ctl = { path = "services/ctl", version = "0.1.0" }
wamn-dispatcher = { path = "services/dispatcher", version = "0.1.0" }
wamn-entity-access = { path = "crates/data/entity-access", version = "0.1.0" }
wamn-event-reg = { path = "crates/events/registration", version = "0.1.0" }
wamn-event-wire = { path = "crates/events/wire", version = "0.1.0" }
wamn-execution-host = { path = "crates/execution/host", version = "0.1.0" }
wamn-executor = { path = "services/executor", version = "0.1.0" }
wamn-flow = { path = "crates/execution/flow-model", version = "0.1.0" }
wamn-flow-invocation = { path = "crates/execution/flow-invocation", version = "0.1.0" }
wamn-gate-harness = { path = "test-support/harness", version = "0.1.0" }
wamn-gates = { path = "tests/orchestrator", version = "0.1.0" }
wamn-host = { path = "services/host", version = "0.1.0" }
wamn-materializer = { path = "crates/events/materializer", version = "0.1.0" }
wamn-pg-core = { path = "crates/platform/pg-core", version = "0.1.0" }
wamn-platform-identity = { path = "crates/identity/platform", version = "0.1.0" }
wamn-project-state = { path = "crates/identity/project-state", version = "0.1.0" }
wamn-proof-conformance = { path = "tests/conformance", version = "0.1.0" }
wamn-proof-integration = { path = "tests/integration", version = "0.1.0" }
wamn-proof-system = { path = "tests/system", version = "0.1.0" }
wamn-router = { path = "crates/execution/router", version = "0.1.0" }
wamn-run-state = { path = "crates/execution/run-state", version = "0.1.0" }
wamn-runtime = { path = "crates/platform/runtime", version = "0.1.0" }
wamn-scenario-model = { path = "crates/scenarios/model", version = "0.1.0" }
wamn-scenario-worker = { path = "services/scenario-worker", version = "0.1.0" }
wamn-scheduler = { path = "crates/execution/scheduler", version = "0.1.0" }
wamn-schema-compiler = { path = "crates/schema/compiler", version = "0.1.0" }
wamn-schema-control = { path = "crates/schema/control", version = "0.1.0" }
wamn-schema-model = { path = "crates/schema/model", version = "0.1.0" }
wamn-standard-nodes = { path = "crates/execution/standard-nodes", version = "0.1.0" }
wamn-test-fixtures = { path = "test-support/fixtures", version = "0.1.0" }
wamn-test-infrastructure = { path = "test-support/infrastructure", version = "0.1.0" }
wamn-waker = { path = "services/waker", version = "0.1.0" }

[profile.release]
lto = "thin"

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 1
