apiVersion: batch/v1
kind: Job
metadata:
  name: membershipproof
  namespace: wamn-receiving-journey
spec:
  activeDeadlineSeconds: 660
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: membershipproof
          image: wamn-gates:receiving-6c3b12f851b8-774777-release
          imagePullPolicy: Never
          command: ["/usr/local/bin/wamn-gates", "membershipproof"]
          args:
            - --endpoint-url
            - http://flow-http.wamn-receiving-journey.svc.cluster.local
            - --host
            - receiving.localhost
            - --org
            - acme
            - --project
            - receiving
            - --env
            - dev
            - --tenant
            - receiving-route-auth
          env:
            - name: WAMN_SYSTEM_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: membershipproof-fixture
                  key: system-url
            - name: WAMN_PROJECT_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: membershipproof-fixture
                  key: project-url
            - name: WAMN_CTL_BIN
              value: /usr/local/bin/wamn-ctl
